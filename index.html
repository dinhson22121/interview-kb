ee(long a) { return a * 2 / 100; } }\nclass WalletFee implements FeePolicy { public long fee(long a) { return 1_000; } }\n```\n\n**Yes, sometimes violating it is the right call:**\n- **Small projects, prototypes, urgent fixes:** adding a simple `case` is easier to read than creating an interface with a single implementation. That's **YAGNI** (You Aren't Gonna Need It).\n- **When it's unclear whether more variants will appear:** abstracting too early creates the \"wrong abstraction\", which costs more than editing code.\n- **The rule of three:** only when you edit the same `switch` for the third time to add a variant do you extract an interface.\n\n**Follow OCP when:** variation is real, recurring and likely to grow, for example payment methods, fee rules, notification channels or plugins.\n\n**A middle ground in Java 21:** a `sealed interface` combined with an exhaustive `switch`. You still edit code, but **the compiler reports an error** at every place that must change when you add a new type, so nothing is missed.\n\n**A real example to tell:** *\"At DXC, [insurance premium calculation by product type]: it started as a `switch`, and when the third product arrived I extracted a strategy...\"* (replace with your own story).", "excerpt": "Nhắc lại OCP: code nên mở để mở rộng, đóng để sửa đổi. Thêm tính năng mới bằng cách thêm class mới, không phải sửa code đang chạy ổn. Có, đôi khi vi phạm là lựa chọn đúng: Dự án nhỏ, prototype, sửa gấp: thêm một nhánh ca", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-finally", "title": "Khối finally có thể làm mất exception từ try không? / Can a finally block override an exception thrown in try?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "exception", "epam"], "body": "### Tiếng Việt\n\n**Có.** Nếu trong `finally` có `return` hoặc ném exception mới, exception gốc từ `try` **bị mất hoàn toàn**, không có log hay dấu vết gì.\n\n```java\nstatic int test() {\n    try {\n        throw new IllegalStateException(\"lỗi thật\");\n    } finally {\n        return 1;          // exception \"lỗi thật\" biến mất, hàm trả về 1\n    }\n}\n```\n\nVì vậy **không bao giờ `return` trong `finally`**. Hầu hết linter và IDE đều cảnh báo việc này.\n\n**Các chi tiết hay bị hỏi tiếp:**\n\n1. **`finally` vẫn chạy khi `try` có `return`**. Nhưng giá trị trả về đã được tính trước khi `finally` chạy:\n\n```java\nstatic int value() {\n    int x = 1;\n    try { return x; }          // giá trị 1 đã được \"chốt\"\n    finally { x = 99; }        // không ảnh hưởng → hàm trả về 1\n}\n```\n\nLưu ý: nếu trả về một **object** và `finally` sửa nội dung object đó (ví dụ `list.add(...)`), người gọi sẽ thấy thay đổi, vì chỉ tham chiếu được chốt.\n\n2. **`finally` không chạy** khi gọi `System.exit()`, JVM bị kill hoặc crash, hoặc thread bị treo vô hạn trong `try`.\n\n3. **Cách đúng để đóng tài nguyên: try-with-resources (Java 7+)**\n\n```java\ntry (Connection c = ds.getConnection();\n     PreparedStatement ps = c.prepareStatement(sql)) {\n    ...\n}   // tự đóng theo thứ tự ngược lại\n```\n\nNếu cả thân `try` lẫn `close()` cùng ném lỗi, exception của `close()` được giữ lại dưới dạng **suppressed** (lấy bằng `e.getSuppressed()`), còn exception gốc không bị mất. Đây là ưu điểm lớn so với tự viết `finally { c.close(); }`.\n\n### English\n\n**Yes.** If the `finally` block contains a `return` or throws a new exception, the original exception from `try` is **completely lost**, with no log or trace.\n\n```java\nstatic int test() {\n    try {\n        throw new IllegalStateException(\"the real error\");\n    } finally {\n        return 1;          // \"the real error\" disappears, the method returns 1\n    }\n}\n```\n\nThat's why you should **never `return` inside `finally`**. Most linters and IDEs warn about it.\n\n**Details interviewers often follow up on:**\n\n1. **`finally` still runs when `try` returns**. But the return value is computed before `finally` runs:\n\n```java\nstatic int value() {\n    int x = 1;\n    try { return x; }          // the value 1 is already \"captured\"\n    finally { x = 99; }        // no effect → the method returns 1\n}\n```\n\nNote: if you return an **object** and `finally` changes that object's contents (for example `list.add(...)`), the caller will see the change, because only the reference was captured.\n\n2. **`finally` doesn't run** when `System.exit()` is called, when the JVM is killed or crashes, or when the thread hangs forever inside `try`.\n\n3. **The right way to close resources: try-with-resources (Java 7+)**\n\n```java\ntry (Connection c = ds.getConnection();\n     PreparedStatement ps = c.prepareStatement(sql)) {\n    ...\n}   // closed automatically, in reverse order\n```\n\nIf both the `try` body and `close()` throw, the exception from `close()` is kept as a **suppressed** exception (available through `e.getSuppressed()`), and the original exception isn't lost. That's a big advantage over writing `finally { c.close(); }` by hand.", "excerpt": "Có. Nếu trong finally có return hoặc ném exception mới, exception gốc từ try bị mất hoàn toàn, không có log hay dấu vết gì. Vì vậy không bao giờ return trong finally. Hầu hết linter và IDE đều cảnh báo việc này. Các chi ", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-collection-map", "title": "Vì sao Map không kế thừa Collection? HashMap và TreeMap khác nhau thế nào? / Why doesn't Map extend Collection? HashMap vs TreeMap?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "collections", "epam"], "body": "### Tiếng Việt\n\n**Vì sao Map không kế thừa Collection:** `Collection` mô tả một nhóm **phần tử đơn** với `add(E e)`. `Map` lưu **cặp key-value**, nên `add(E)` không có nghĩa: thêm cái gì, key hay value hay cặp? Thay vào đó Map cung cấp 3 **view** dạng collection:\n- `keySet()` trả về `Set<K>`\n- `values()` trả về `Collection<V>`\n- `entrySet()` trả về `Set<Map.Entry<K,V>>`\n\n**Sơ đồ collections framework:**\n\n```\nCollection\n├── List   → ArrayList, LinkedList        (có thứ tự, cho trùng)\n├── Set    → HashSet, LinkedHashSet, TreeSet (không trùng)\n└── Queue  → ArrayDeque, PriorityQueue\nMap (riêng) → HashMap, LinkedHashMap, TreeMap, ConcurrentHashMap\n```\n\n**HashMap và TreeMap:**\n\n| | HashMap | TreeMap |\n|---|---|---|\n| Cấu trúc | Mảng bucket + hash | Cây đỏ-đen |\n| Thứ tự duyệt | Không đảm bảo | **Tăng dần theo key** |\n| `get`, `put`, `remove` | O(1) trung bình | **O(log n)** |\n| Key `null` | Cho phép 1 | **Không**: ném `NullPointerException` vì phải so sánh key |\n| Yêu cầu với key | `equals` + `hashCode` | `Comparable` hoặc truyền `Comparator` |\n| API thêm | — | `firstKey`, `lastKey`, `floorKey`, `ceilingKey`, `headMap`, `subMap` |\n\n**Khi nào dùng TreeMap:** cần duyệt theo thứ tự hoặc truy vấn khoảng. Ví dụ: tìm mức giá gần nhất nhỏ hơn hoặc bằng X bằng `floorKey(x)`, hay lấy các sự kiện trong một khoảng thời gian bằng `subMap(from, to)`.\n\n**LinkedHashMap:** giữ thứ tự chèn, hoặc thứ tự truy cập nếu tạo với `accessOrder = true`. Đây là cách dựng LRU cache nhanh nhất:\n\n```java\nclass LRU<K, V> extends LinkedHashMap<K, V> {\n    private final int cap;\n    LRU(int cap) { super(16, 0.75f, true); this.cap = cap; }\n    @Override protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > cap; }\n}\n```\n\n### English\n\n**Why Map doesn't extend Collection:** `Collection` describes a group of **single elements** with `add(E e)`. A `Map` stores **key-value pairs**, so `add(E)` has no meaning: add what, the key, the value or the pair? Instead, Map provides three **collection views**:\n- `keySet()` returns a `Set<K>`\n- `values()` returns a `Collection<V>`\n- `entrySet()` returns a `Set<Map.Entry<K,V>>`\n\n**The collections framework at a glance:**\n\n```\nCollection\n├── List   → ArrayList, LinkedList        (ordered, duplicates allowed)\n├── Set    → HashSet, LinkedHashSet, TreeSet (no duplicates)\n└── Queue  → ArrayDeque, PriorityQueue\nMap (separate) → HashMap, LinkedHashMap, TreeMap, ConcurrentHashMap\n```\n\n**HashMap vs TreeMap:**\n\n| | HashMap | TreeMap |\n|---|---|---|\n| Structure | Bucket array + hashing | Red-black tree |\n| Iteration order | Not guaranteed | **Ascending by key** |\n| `get`, `put`, `remove` | O(1) average | **O(log n)** |\n| `null` key | One allowed | **No**: throws `NullPointerException` because keys must be compared |\n| Requirement on keys | `equals` + `hashCode` | `Comparable`, or pass a `Comparator` |\n| Extra API | — | `firstKey`, `lastKey`, `floorKey`, `ceilingKey`, `headMap`, `subMap` |\n\n**When to use TreeMap:** when you need sorted iteration or range queries. For example: finding the nearest price less than or equal to X with `floorKey(x)`, or getting the events in a time range with `subMap(from, to)`.\n\n**LinkedHashMap:** keeps insertion order, or access order when created with `accessOrder = true`. That's the quickest way to build an LRU cache:\n\n```java\nclass LRU<K, V> extends LinkedHashMap<K, V> {\n    private final int cap;\n    LRU(int cap) { super(16, 0.75f, true); this.cap = cap; }\n    @Override protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > cap; }\n}\n```", "excerpt": "Vì sao Map không kế thừa Collection: Collection mô tả một nhóm phần tử đơn với add(E e). Map lưu cặp key-value, nên add(E) không có nghĩa: thêm cái gì, key hay value hay cặp? Thay vào đó Map cung cấp 3 view dạng collecti", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-generics", "title": "Generics: type erasure là gì? Wildcard ? extends và ? super dùng khi nào? / Generics: what is type erasure, and when do you use ? extends vs ? super?", "cat": "java", "section": "Java core", "kind": "qa", "tags": ["java-core", "generics"], "body": "### Tiếng Việt\n\n**Generics** cho phép kiểm tra kiểu lúc compile: `List<String>` không cho thêm `Integer`, và không cần ép kiểu khi lấy ra.\n\n**Type erasure (xóa kiểu):** thông tin kiểu generic **chỉ tồn tại lúc compile**. Sau khi compile, `List<String>` và `List<Integer>` đều chỉ là `List`, và `T` bị thay bằng `Object` (hoặc bằng cận trên, ví dụ `T extends Number` thành `Number`). Java làm vậy để **tương thích ngược** với code viết trước Java 5.\n\n**Hệ quả của erasure (hay bị hỏi):**\n\n```java\nnew T();                          // ✗ không biết T là gì lúc chạy\nnew T[10];                        // ✗\nobj instanceof List<String>       // ✗ chỉ viết được: obj instanceof List<?>\nList<String>.class                // ✗\n// Hai method chỉ khác kiểu generic → trùng chữ ký sau erasure:\nvoid f(List<String> a) {}\nvoid f(List<Integer> a) {}        // ✗ lỗi \"same erasure\"\n```\n\nCách vượt qua khi cần kiểu lúc chạy: truyền `Class<T>` vào, ví dụ `objectMapper.readValue(json, User.class)`, hoặc `TypeReference<List<User>>` của Jackson.\n\n**Generics là bất biến (invariant):** `List<Integer>` **không phải** là con của `List<Number>`, dù `Integer` là con của `Number`. Nếu được phép, có thể thêm `Double` vào một list chỉ được chứa `Integer`.\n\n**Wildcard và quy tắc PECS (Producer Extends, Consumer Super):**\n\n| | `? extends T` | `? super T` |\n|---|---|---|\n| Ý nghĩa | T hoặc lớp con của T | T hoặc lớp cha của T |\n| Đọc ra | Được, nhận kiểu `T` | Chỉ nhận kiểu `Object` |\n| Ghi vào | **Không** (trừ `null`) | **Được**, ghi `T` |\n| Dùng khi | Collection là **nguồn dữ liệu** (producer) | Collection là **nơi nhận** (consumer) |\n\n```java\n// Producer: chỉ đọc số ra để cộng → extends\ndouble sum(List<? extends Number> nums) {\n    double s = 0;\n    for (Number n : nums) s += n.doubleValue();\n    return s;\n}\nsum(List.of(1, 2, 3));        // List<Integer> dùng được\nsum(List.of(1.5, 2.5));       // List<Double> dùng được\n\n// Consumer: chỉ ghi Integer vào → super\nvoid fill(List<? super Integer> out) {\n    for (int i = 0; i < 3; i++) out.add(i);\n}\nfill(new ArrayList<Number>()); // dùng được\nfill(new ArrayList<Object>()); // dùng được\n```\n\nVí dụ trong JDK: `Collections.copy(List<? super T> dest, List<? extends T> src)`. Nguồn dùng `extends`, đích dùng `super`.\n\n### English\n\n**Generics** enable type checking at compile time: a `List<String>` won't accept an `Integer`, and you don't need casts when reading elements.\n\n**Type erasure:** generic type information **exists only at compile time**. After compilation, `List<String>` and `List<Integer>` are both just `List`, and `T` is replaced with `Object` (or with its upper bound, so `T extends Number` becomes `Number`). Java did this for **backward compatibility** with code written before Java 5.\n\n**Consequences of erasure (frequently asked):**\n\n```java\nnew T();                          // ✗ T is unknown at runtime\nnew T[10];                        // ✗\nobj instanceof List<String>       // ✗ only allowed: obj instanceof List<?>\nList<String>.class                // ✗\n// Two methods that differ only in generic type → same signature after erasure:\nvoid f(List<String> a) {}\nvoid f(List<Integer> a) {}        // ✗ \"same erasure\" error\n```\n\nWorkarounds when you need the type at runtime: pass a `Class<T>`, for example `objectMapper.readValue(json, User.class)`, or use Jackson's `TypeReference<List<User>>`.\n\n**Generics are invariant:** `List<Integer>` is **not** a subtype of `List<Number>`, even though `Integer` is a subtype of `Number`. If it were, you could add a `Double` to a list that may only contain `Integer`s.\n\n**Wildcards and the PECS rule (Producer Extends, Consumer Super):**\n\n| | `? extends T` | `? super T` |\n|---|---|---|\n| Meaning | T or a subclass of T | T or a superclass of T |\n| Reading | Allowed, you get a `T` | You only get an `Object` |\n| Writing | **Not allowed** (except `null`) | **Allowed**, you can write a `T` |\n| Use when | The collection is a **source of data** (producer) | The collection is a **destination** (consumer) |\n\n```java\n// Producer: only read numbers to add them up → extends\ndouble sum(List<? extends Number> nums) {\n    double s = 0;\n    for (Number n : nums) s += n.doubleValue();\n    return s;\n}\nsum(List.of(1, 2, 3));        // a List<Integer> works\nsum(List.of(1.5, 2.5));       // a List<Double> works\n\n// Consumer: only write Integers into it → super\nvoid fill(List<? super Integer> out) {\n    for (int i = 0; i < 3; i++) out.add(i);\n}\nfill(new ArrayList<Number>()); // works\nfill(new ArrayList<Object>()); // works\n```\n\nA JDK example: `Collections.copy(List<? super T> dest, List<? extends T> src)`. The source uses `extends`, the destination uses `super`.", "excerpt": "Generics cho phép kiểm tra kiểu lúc compile: List<String không cho thêm Integer, và không cần ép kiểu khi lấy ra. Type erasure (xóa kiểu): thông tin kiểu generic chỉ tồn tại lúc compile. Sau khi compile, List<String và L", "catLabel": "Java & JVM", "tip": "", "num": null}, {"id": "java-modern-8", "title": "What newer Java features have you used?", "cat": "java-new", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"Records for immutable DTOs, sealed interfaces to model a closed set of types, pattern matching for `instanceof` and `switch`, text blocks, and `var` for local variables. In Java 21, virtual threads and sequenced collections. Records with sealed types and `switch` let the compiler check that every case is handled.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Records for immutable DTOs, sealed interfaces to model a closed set of types, pattern matching for instanceof and switch, text blocks, and var for local variables. In Java 21, virtual threads and sequenced collections. ", "catLabel": "Java & JVM"}, {"id": "jn-versions", "title": "Các phiên bản Java LTS và tính năng chính của từng bản? Nên dùng bản nào? / What are the Java LTS versions, their headline features, and which should you use?", "cat": "java-new", "section": "Tổng quan phiên bản", "kind": "qa", "tags": ["java-version", "lts"], "body": "### Tiếng Việt\n\n**Nhịp phát hành:** từ Java 10, cứ **6 tháng có một bản** (tháng 3 và tháng 9). Cứ **2 năm có một bản LTS** (hỗ trợ dài hạn). Bản không phải LTS chỉ được cập nhật khoảng 6 tháng, nên production gần như luôn chạy LTS.\n\n| Bản | Năm | Loại | Tính năng đáng nhớ |\n|---|---|---|---|\n| **8** | 2014 | LTS | Lambda, Stream API, `Optional`, `java.time`, default method |\n| **11** | 2018 | LTS | `var` (từ 10), `HttpClient` mới, `String.isBlank/strip/lines/repeat`, chạy file `.java` trực tiếp |\n| **17** | 2021 | LTS | **Records**, **sealed classes**, **text blocks**, **switch expression**, pattern matching cho `instanceof`, NPE dễ đọc |\n| **21** | 2023 | LTS | **Virtual threads**, **record patterns**, **pattern matching cho switch**, **sequenced collections**, Generational ZGC |\n| **25** | 2025 | LTS | **Scoped values**, file nguồn gọn và `void main()` không cần class, `import module`, code trước `super(...)` trong constructor, compact object headers, AOT cache cải tiến khởi động |\n| 26 | 03/2026 | Thường | HTTP/3 cho `HttpClient`, AOT object caching với mọi GC, chuẩn bị cho \"final thật sự là final\", G1 nhanh hơn |\n| 27 | 09/2026 | Thường | **G1 là GC mặc định ở mọi môi trường**, **compact object headers bật mặc định**, trao đổi khóa hậu lượng tử (post-quantum) cho TLS 1.3 |\n| 28 | 03/2027 | Thường | Dự kiến có những tính năng đầu tiên của Project Valhalla (value objects) |\n\n**Preview, incubator là gì:** tính năng **preview** đã thiết kế xong nhưng còn có thể đổi, phải bật bằng `--enable-preview`. **Incubator** là API thử nghiệm (ví dụ Vector API). Không dùng hai loại này ở production.\n\nỞ bản 27, structured concurrency, lazy constants và primitive types trong pattern **vẫn đang preview**.\n\n**Nên dùng bản nào:**\n- **Dự án mới: Java 25** (LTS mới nhất). Spring Boot 4 hỗ trợ tốt và khuyến nghị bản này.\n- **Dự án đang chạy:** tối thiểu **Java 21**. Spring Boot 3 và 4 đều yêu cầu tối thiểu Java 17.\n- **Còn ở Java 8 hoặc 11:** nâng lên, vì các bản này đã hết hoặc sắp hết hỗ trợ miễn phí, và đang bỏ lỡ virtual threads cùng những cải tiến GC lớn.\n\n**Câu trả lời mẫu khi được hỏi \"Bạn dùng Java bản nào?\":** *\"Dự án gần nhất của tôi chạy Java [17/21]. Tôi đã dùng records cho DTO, switch expression và pattern matching, và [virtual threads cho các service nặng I/O]. Nếu bắt đầu dự án mới hôm nay, tôi chọn Java 25 vì là LTS mới nhất.\"* Nói đúng bản bạn đã dùng thật.\n\n### English\n\n**Release cadence:** since Java 10 there's **a release every 6 months** (March and September). **Every 2 years one release is LTS** (long-term support). Non-LTS releases get about 6 months of updates, so production almost always runs an LTS.\n\n| Version | Year | Type | Notable features |\n|---|---|---|---|\n| **8** | 2014 | LTS | Lambdas, the Stream API, `Optional`, `java.time`, default methods |\n| **11** | 2018 | LTS | `var` (from 10), the new `HttpClient`, `String.isBlank/strip/lines/repeat`, running a `.java` file directly |\n| **17** | 2021 | LTS | **Records**, **sealed classes**, **text blocks**, **switch expressions**, pattern matching for `instanceof`, helpful NPE messages |\n| **21** | 2023 | LTS | **Virtual threads**, **record patterns**, **pattern matching for switch**, **sequenced collections**, Generational ZGC |\n| **25** | 2025 | LTS | **Scoped values**, compact source files and `void main()` without a class, `import module`, code before `super(...)` in constructors, compact object headers, an improved AOT cache for startup |\n| 26 | 03/2026 | Regular | HTTP/3 for `HttpClient`, AOT object caching with any GC, preparing to make final mean final, faster G1 |\n| 27 | 09/2026 | Regular | **G1 as the default GC in all environments**, **compact object headers on by default**, post-quantum hybrid key exchange for TLS 1.3 |\n| 28 | 03/2027 | Regular | Expected to bring the first Project Valhalla features (value objects) |\n\n**What preview and incubator mean:** a **preview** feature is fully designed but may still change, and must be enabled with `--enable-preview`. An **incubator** is an experimental API (for example the Vector API). Don't use either in production.\n\nAs of 27, structured concurrency, lazy constants and primitive types in patterns are **still in preview**.\n\n**Which version to use:**\n- **New projects: Java 25** (the latest LTS). Spring Boot 4 supports it well and recommends it.\n- **Running projects:** at least **Java 21**. Spring Boot 3 and 4 both require Java 17 at minimum.\n- **Still on Java 8 or 11:** upgrade, because free support for these has ended or is ending, and you're missing virtual threads and major GC improvements.\n\n**A model answer to \"Which Java version do you use?\":** *\"My last project ran Java [17/21]. I used records for DTOs, switch expressions and pattern matching, and [virtual threads for I/O-heavy services]. If I started a new project today, I'd pick Java 25 because it's the latest LTS.\"* Name only the versions you've really used.", "excerpt": "Nhịp phát hành: từ Java 10, cứ 6 tháng có một bản (tháng 3 và tháng 9). Cứ 2 năm có một bản LTS (hỗ trợ dài hạn). Bản không phải LTS chỉ được cập nhật khoảng 6 tháng, nên production gần như luôn chạy LTS. Preview, incuba", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-records", "title": "Record là gì? Khi nào dùng, khi nào không? / What is a record, and when should and shouldn't you use one?", "cat": "java-new", "section": "Java 14–17", "kind": "qa", "tags": ["records", "java17", "kafka"], "body": "### Tiếng Việt\n\n**Record** (chính thức từ Java 16) là class chỉ để **chứa dữ liệu bất biến**. Một dòng khai báo, compiler tự sinh: constructor đầy đủ, accessor (`name()`, không có tiền tố `get`), `equals`, `hashCode`, `toString`.\n\n```java\npublic record Money(BigDecimal amount, String currency) {\n    // Compact constructor: kiểm tra và chuẩn hóa, không cần gán field\n    public Money {\n        Objects.requireNonNull(amount);\n        if (amount.signum() < 0) throw new IllegalArgumentException(\"amount < 0\");\n        currency = currency.toUpperCase();\n    }\n    // Được thêm method và static factory\n    public Money plus(Money other) { return new Money(amount.add(other.amount), currency); }\n    public static Money vnd(long v) { return new Money(BigDecimal.valueOf(v), \"VND\"); }\n}\n```\n\n**Đặc điểm:**\n- Field là `private final`; record là `final` (không kế thừa được) nhưng **implement interface được**.\n- Không có setter; muốn đổi giá trị thì tạo bản mới (kiểu \"wither\" như `plus` ở trên).\n- **Bất biến nông (shallow):** nếu field là `List` thì list bên trong vẫn sửa được. Dùng `List.copyOf(...)` trong compact constructor.\n\n**Dùng khi:**\n- DTO request và response, sự kiện Kafka, value object (`Money`, `Email`), key ghép trong `Map`, kết quả trung gian trong stream.\n- Projection của Spring Data JPA: `List<OrderSummary> findByStatus(...)` với `OrderSummary` là record.\n- `@ConfigurationProperties` của Spring Boot (bind qua constructor).\n- Jackson hỗ trợ record từ 2.12.\n\n**Không dùng khi:**\n- **JPA entity:** entity cần constructor không tham số, field thay đổi được và proxy lazy loading (kế thừa class), mà record không đáp ứng được.\n- Object có trạng thái thay đổi theo vòng đời (ví dụ đơn hàng đi qua nhiều trạng thái).\n\n**Record hay Lombok `@Value`/`@Data`:** record là tính năng của ngôn ngữ, không cần thư viện hay annotation processor, và hoạt động với record patterns (Java 21). Lombok vẫn hữu ích cho `@Builder` hoặc class cần thay đổi được.\n\n### English\n\nA **record** (final since Java 16) is a class meant only to **hold immutable data**. One line of declaration and the compiler generates: the canonical constructor, accessors (`name()`, no `get` prefix), `equals`, `hashCode` and `toString`.\n\n```java\npublic record Money(BigDecimal amount, String currency) {\n    // Compact constructor: validate and normalize, no field assignments needed\n    public Money {\n        Objects.requireNonNull(amount);\n        if (amount.signum() < 0) throw new IllegalArgumentException(\"amount < 0\");\n        currency = currency.toUpperCase();\n    }\n    // Methods and static factories are allowed\n    public Money plus(Money other) { return new Money(amount.add(other.amount), currency); }\n    public static Money vnd(long v) { return new Money(BigDecimal.valueOf(v), \"VND\"); }\n}\n```\n\n**Characteristics:**\n- Fields are `private final`; a record is `final` (can't be extended) but **can implement interfaces**.\n- No setters; to change a value you create a new instance (\"withers\" like `plus` above).\n- **Shallow immutability:** if a field is a `List`, the list itself can still be modified. Use `List.copyOf(...)` in the compact constructor.\n\n**Use them for:**\n- Request and response DTOs, Kafka events, value objects (`Money`, `Email`), composite `Map` keys, intermediate results in streams.\n- Spring Data JPA projections: `List<OrderSummary> findByStatus(...)` with `OrderSummary` as a record.\n- Spring Boot `@ConfigurationProperties` (constructor binding).\n- Jackson supports records since 2.12.\n\n**Don't use them for:**\n- **JPA entities:** entities need a no-arg constructor, mutable fields and lazy-loading proxies (subclassing), none of which records allow.\n- Objects whose state changes over their lifecycle (for example an order moving through statuses).\n\n**Records vs Lombok `@Value`/`@Data`:** records are a language feature, need no library or annotation processor, and work with record patterns (Java 21). Lombok is still useful for `@Builder` or mutable classes.", "excerpt": "Record (chính thức từ Java 16) là class chỉ để chứa dữ liệu bất biến. Một dòng khai báo, compiler tự sinh: constructor đầy đủ, accessor (name(), không có tiền tố get), equals, hashCode, toString. Đặc điểm: Field là priva", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-sealed-pattern", "title": "Sealed class và pattern matching (instanceof, switch, record pattern) dùng thế nào? / How do sealed classes and pattern matching (instanceof, switch, record patterns) work together?", "cat": "java-new", "section": "Java 14–17", "kind": "qa", "tags": ["sealed", "pattern-matching", "java21"], "body": "### Tiếng Việt\n\n**1. Pattern matching cho `instanceof` (Java 16):** kiểm tra và ép kiểu trong một bước.\n\n```java\n// Cũ\nif (obj instanceof String) { String s = (String) obj; use(s.length()); }\n// Mới\nif (obj instanceof String s && !s.isBlank()) { use(s.length()); }\n```\n\n**2. Sealed class (Java 17):** giới hạn **chính xác những class nào được kế thừa**. Dùng để mô hình hóa một tập trạng thái hoặc kết quả **đóng**.\n\n```java\npublic sealed interface PaymentResult permits Success, Declined, Pending {}\npublic record Success(String txId, BigDecimal amount) implements PaymentResult {}\npublic record Declined(String reason)                implements PaymentResult {}\npublic record Pending(Instant retryAt)                implements PaymentResult {}\n```\n\nClass con phải là `final`, `sealed`, hoặc `non-sealed`.\n\n**3. Pattern matching cho switch và record pattern (Java 21):** switch theo kiểu, **bóc tách luôn field** của record, thêm điều kiện bằng `when`.\n\n```java\nString describe(PaymentResult r) {\n    return switch (r) {\n        case Success(var txId, var amount) when amount.compareTo(LIMIT) > 0 -> \"Large payment \" + txId;\n        case Success(var txId, var amount) -> \"Paid \" + amount + \" (\" + txId + \")\";\n        case Declined(var reason)          -> \"Declined: \" + reason;\n        case Pending p                     -> \"Retry at \" + p.retryAt();\n        // KHÔNG cần default: compiler biết đã đủ mọi trường hợp\n    };\n}\n```\n\n**Vì sao kết hợp này mạnh:**\n- **Kiểm tra đầy đủ lúc compile (exhaustiveness):** thêm `Refunded` vào `permits` thì mọi `switch` thiếu nhánh **báo lỗi compile**, thay vì lỗi lúc chạy như khi có `default`.\n- Thay thế mẫu Visitor dài dòng và chuỗi `if-else instanceof`.\n- Mô hình hóa kiểu \"tổng\" (algebraic data types): kết quả API, sự kiện domain, lệnh trong state machine.\n\n**Lưu ý thêm:**\n- `case null ->` được phép trong switch mới; không có thì switch ném NPE như trước.\n- Thứ tự `case` có ý nghĩa: case cụ thể hơn (có `when`) phải đứng trước. Đặt sai thì compile báo \"dominated\".\n- Unnamed pattern `_` (chính thức từ Java 22) cho field không dùng: `case Declined(_) -> ...`.\n- Primitive types trong pattern (`case int i`) vẫn là preview ở Java 27.\n\n### English\n\n**1. Pattern matching for `instanceof` (Java 16):** test and cast in one step.\n\n```java\n// Old\nif (obj instanceof String) { String s = (String) obj; use(s.length()); }\n// New\nif (obj instanceof String s && !s.isBlank()) { use(s.length()); }\n```\n\n**2. Sealed classes (Java 17):** restrict **exactly which classes may extend a type**. Use them to model a **closed** set of states or results.\n\n```java\npublic sealed interface PaymentResult permits Success, Declined, Pending {}\npublic record Success(String txId, BigDecimal amount) implements PaymentResult {}\npublic record Declined(String reason)                implements PaymentResult {}\npublic record Pending(Instant retryAt)                implements PaymentResult {}\n```\n\nSubclasses must be `final`, `sealed` or `non-sealed`.\n\n**3. Pattern matching for switch and record patterns (Java 21):** switch on type, **destructure the record's fields** directly, and add conditions with `when`.\n\n```java\nString describe(PaymentResult r) {\n    return switch (r) {\n        case Success(var txId, var amount) when amount.compareTo(LIMIT) > 0 -> \"Large payment \" + txId;\n        case Success(var txId, var amount) -> \"Paid \" + amount + \" (\" + txId + \")\";\n        case Declined(var reason)          -> \"Declined: \" + reason;\n        case Pending p                     -> \"Retry at \" + p.retryAt();\n        // NO default needed: the compiler knows every case is covered\n    };\n}\n```\n\n**Why the combination is powerful:**\n- **Compile-time exhaustiveness checks:** add `Refunded` to `permits` and every `switch` missing a branch **fails to compile**, instead of failing at runtime as it would with a `default`.\n- It replaces verbose Visitor patterns and `if-else instanceof` chains.\n- It models \"sum\" types (algebraic data types): API results, domain events, state-machine commands.\n\n**More details:**\n- `case null ->` is allowed in the new switch; without it the switch throws an NPE as before.\n- `case` order matters: more specific cases (with `when`) must come first. Getting it wrong is a \"dominated\" compile error.\n- The unnamed pattern `_` (final since Java 22) for unused fields: `case Declined(_) -> ...`.\n- Primitive types in patterns (`case int i`) are still in preview in Java 27.", "excerpt": "1. Pattern matching cho instanceof (Java 16): kiểm tra và ép kiểu trong một bước. 2. Sealed class (Java 17): giới hạn chính xác những class nào được kế thừa. Dùng để mô hình hóa một tập trạng thái hoặc kết quả đóng. Clas", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-small-features", "title": "Những tính năng nhỏ hay dùng từ Java 9 đến 21 là gì? / What small, everyday features arrived between Java 9 and 21?", "cat": "java-new", "section": "Java 9–21", "kind": "qa", "tags": ["java-version", "collections"], "body": "### Tiếng Việt\n\n| Tính năng | Bản | Ví dụ |\n|---|---|---|\n| Factory cho collection bất biến | 9 | `List.of(1, 2)`, `Set.of(\"a\")`, `Map.of(\"k\", 1)`. **Không cho phép `null`**, sửa sẽ ném `UnsupportedOperationException` |\n| `Optional` bổ sung | 9–11 | `ifPresentOrElse`, `or`, `stream()`, `isEmpty()`, `orElseThrow()` |\n| `var` (suy luận kiểu biến local) | 10 | `var orders = new ArrayList<Order>();`. Chỉ cho biến local; dùng khi kiểu đã rõ ở vế phải |\n| `List.copyOf`, `Collectors.toUnmodifiableList` | 10 | Bản sao bất biến |\n| `HttpClient` chuẩn | 11 | Hỗ trợ HTTP/2, async; HTTP/3 từ Java 26 |\n| `String` mới | 11–15 | `isBlank()`, `strip()` (hiểu Unicode, khác `trim()`), `lines()`, `repeat(n)`, `formatted(...)` |\n| **Switch expression** | 14 | `int days = switch (m) { case FEB -> 28; case APR, JUN -> 30; default -> 31; };` Không rơi xuống case sau (fall-through), dùng `yield` trong block |\n| **Text block** | 15 | Chuỗi nhiều dòng bằng `\"\"\"`, tiện cho SQL, JSON trong test |\n| **NPE dễ đọc** | 14 (bật mặc định 15) | `Cannot invoke \"Address.city()\" because the return value of \"User.address()\" is null` |\n| `Stream.toList()` | 16 | Ngắn hơn `collect(Collectors.toList())`, nhưng trả list **bất biến** |\n| `mapMulti`, `takeWhile`, `dropWhile`, `iterate` có điều kiện dừng | 9–16 | Tiện ích cho stream |\n| **Sequenced collections** | 21 | `list.getFirst()`, `getLast()`, `reversed()`, `addFirst`; `LinkedHashMap.firstEntry()`, `pollLastEntry()` |\n| `Math.clamp`, `StringBuilder.repeat`, `String.indexOf(ch, from, to)` | 21 | Tiện ích nhỏ |\n| **Stream gatherers** | 24 | Toán tử trung gian tự định nghĩa: `stream.gather(Gatherers.windowFixed(3))` để chia cửa sổ cố định |\n\n**Bẫy hay bị hỏi:**\n- `Stream.toList()` trả list bất biến, còn `Collectors.toList()` trả `ArrayList` sửa được. Đổi qua lại có thể làm code đang chạy bị lỗi.\n- `List.of(...)` ném NPE khi gặp `null`, kể cả `contains(null)`.\n- `var` **không** làm Java thành ngôn ngữ kiểu động: kiểu vẫn cố định lúc compile.\n\n### English\n\n| Feature | Version | Example |\n|---|---|---|\n| Immutable collection factories | 9 | `List.of(1, 2)`, `Set.of(\"a\")`, `Map.of(\"k\", 1)`. **No `null` allowed**; modifying throws `UnsupportedOperationException` |\n| `Optional` additions | 9–11 | `ifPresentOrElse`, `or`, `stream()`, `isEmpty()`, `orElseThrow()` |\n| `var` (local variable type inference) | 10 | `var orders = new ArrayList<Order>();`. Local variables only; use it when the type is obvious from the right-hand side |\n| `List.copyOf`, `Collectors.toUnmodifiableList` | 10 | Immutable copies |\n| Standard `HttpClient` | 11 | HTTP/2 and async support; HTTP/3 since Java 26 |\n| New `String` methods | 11–15 | `isBlank()`, `strip()` (Unicode-aware, unlike `trim()`), `lines()`, `repeat(n)`, `formatted(...)` |\n| **Switch expressions** | 14 | `int days = switch (m) { case FEB -> 28; case APR, JUN -> 30; default -> 31; };` No fall-through; use `yield` inside a block |\n| **Text blocks** | 15 | Multi-line strings with `\"\"\"`, handy for SQL and JSON in tests |\n| **Helpful NPEs** | 14 (on by default in 15) | `Cannot invoke \"Address.city()\" because the return value of \"User.address()\" is null` |\n| `Stream.toList()` | 16 | Shorter than `collect(Collectors.toList())`, but returns an **immutable** list |\n| `mapMulti`, `takeWhile`, `dropWhile`, `iterate` with a stop condition | 9–16 | Stream utilities |\n| **Sequenced collections** | 21 | `list.getFirst()`, `getLast()`, `reversed()`, `addFirst`; `LinkedHashMap.firstEntry()`, `pollLastEntry()` |\n| `Math.clamp`, `StringBuilder.repeat`, `String.indexOf(ch, from, to)` | 21 | Small utilities |\n| **Stream gatherers** | 24 | Custom intermediate operations: `stream.gather(Gatherers.windowFixed(3))` for fixed-size windows |\n\n**Commonly asked traps:**\n- `Stream.toList()` returns an immutable list, while `Collectors.toList()` returns a mutable `ArrayList`. Swapping one for the other can break working code.\n- `List.of(...)` throws an NPE on `null`, even for `contains(null)`.\n- `var` does **not** make Java dynamically typed: the type is still fixed at compile time.", "excerpt": "Bẫy hay bị hỏi: Stream.toList() trả list bất biến, còn Collectors.toList() trả ArrayList sửa được. Đổi qua lại có thể làm code đang chạy bị lỗi. List.of(...) ném NPE khi gặp null, kể cả contains(null). var không làm Java", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-virtual-threads", "title": "Virtual threads hoạt động thế nào? Bẫy khi dùng là gì? / How do virtual threads work, and what are the pitfalls?", "cat": "java-new", "section": "Java 21", "kind": "qa", "tags": ["virtual-threads", "concurrency", "java21", "kafka"], "body": "### Tiếng Việt\n\n*Xem thêm câu ngắn hơn: [Virtual threads là gì](#concurrency-16).*\n\n**Vấn đề cũ:** mỗi platform thread là một thread của hệ điều hành, tốn khoảng 1 MB stack và chi phí chuyển ngữ cảnh. Server thread-per-request với 200 thread thì tối đa khoảng 200 request đồng thời, dù phần lớn thời gian các thread chỉ **ngồi chờ I/O** (DB, HTTP).\n\n**Virtual thread (Java 21):** thread do **JVM quản lý**, rất nhẹ (vài trăm byte đến vài KB), có thể tạo **hàng triệu** cái. Chúng chạy trên một nhóm nhỏ **carrier thread** (ForkJoinPool, mặc định bằng số CPU). Khi virtual thread **chặn ở I/O**, JVM **gỡ nó khỏi carrier** (unmount) và cho virtual thread khác chạy. I/O xong thì gắn lại.\n\nKết quả: viết code **đồng bộ, dễ đọc**, nhưng đạt được throughput gần như code reactive.\n\n```java\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n    List<Future<Price>> fs = suppliers.stream()\n        .map(s -> executor.submit(() -> client.fetchPrice(s)))   // mỗi task một virtual thread\n        .toList();\n    // ...\n}\n// Spring Boot 3.2+: spring.threads.virtual.enabled=true\n// → Tomcat, @Async, @Scheduled, Kafka listener dùng virtual threads\n```\n\n**Hợp với:** service **nặng I/O**, nhiều request đồng thời, gọi DB và HTTP. **Không giúp gì** cho tác vụ **nặng CPU** (tính toán, nén, mã hóa), vì số CPU không đổi.\n\n**Bẫy:**\n\n| Bẫy | Giải thích | Cách xử lý |\n|---|---|---|\n| **Pinning** | Ở Java 21–23, virtual thread chặn bên trong `synchronized` sẽ **dính chặt** vào carrier, không gỡ ra được. Vài cái như vậy là hết carrier | **Java 24 (JEP 491) đã sửa** cho `synchronized`. Ở Java 21 thì đổi sang `ReentrantLock`. Native call (JNI) vẫn gây pinning. Phát hiện bằng JFR event `jdk.VirtualThreadPinned` |\n| **Không pool** virtual thread | Chúng rẻ, tạo mới cho mỗi task | Dùng `newVirtualThreadPerTaskExecutor()`, không dùng fixed pool |\n| **Tài nguyên phía sau vẫn có giới hạn** | 10.000 virtual thread cùng gọi DB, mà connection pool chỉ có 20 | Giới hạn bằng `Semaphore`, rate limit; cấu hình pool hợp lý. Virtual thread **không** làm DB mạnh hơn |\n| **`ThreadLocal`** | Hàng triệu thread, mỗi cái một bản ThreadLocal, nên tốn bộ nhớ; cache đắt tiền đặt trong ThreadLocal mất tác dụng | Dùng **Scoped values** (Java 25); tránh cache trong ThreadLocal |\n| Đo đạc | Thread dump truyền thống không còn phù hợp | `jcmd <pid> Thread.dump_to_file -format=json` |\n\n**Câu trả lời mẫu:** *\"Virtual threads cho phép giữ mô hình thread-per-request đơn giản mà vẫn phục vụ hàng chục nghìn request chờ I/O. Tôi bật bằng một property trong Spring Boot, nhưng vẫn giới hạn đồng thời ở chỗ gọi DB hoặc API ngoài, và ở Java 21 thì kiểm tra pinning do `synchronized`.\"*\n\n### English\n\n*See also the shorter question: [What are virtual threads](#concurrency-16).*\n\n**The old problem:** each platform thread is an operating-system thread, costing about 1 MB of stack plus context-switch overhead. A thread-per-request server with 200 threads handles at most about 200 concurrent requests, even though most of the time those threads are just **waiting on I/O** (DB, HTTP).\n\n**Virtual threads (Java 21):** threads **managed by the JVM**, very light (hundreds of bytes to a few KB), so you can create **millions**. They run on a small set of **carrier threads** (a ForkJoinPool, sized to the CPU count by default). When a virtual thread **blocks on I/O**, the JVM **unmounts it from the carrier** and runs another virtual thread. When the I/O completes, it's mounted again.\n\nThe result: you write **synchronous, readable** code and get throughput close to reactive code.\n\n```java\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n    List<Future<Price>> fs = suppliers.stream()\n        .map(s -> executor.submit(() -> client.fetchPrice(s)))   // one virtual thread per task\n        .toList();\n    // ...\n}\n// Spring Boot 3.2+: spring.threads.virtual.enabled=true\n// → Tomcat, @Async, @Scheduled and Kafka listeners use virtual threads\n```\n\n**Good for:** **I/O-heavy** services with many concurrent requests calling databases and HTTP APIs. **No help** for **CPU-heavy** work (computation, compression, encryption), because the number of CPUs doesn't change.\n\n**Pitfalls:**\n\n| Pitfall | Explanation | How to handle it |\n|---|---|---|\n| **Pinning** | In Java 21–23, a virtual thread blocking inside `synchronized` gets **pinned** to its carrier and can't be unmounted. A few of those and the carriers run out | **Java 24 (JEP 491) fixed this** for `synchronized`. On Java 21, switch to `ReentrantLock`. Native calls (JNI) still pin. Detect it with the JFR event `jdk.VirtualThreadPinned` |\n| **Pooling** virtual threads | They're cheap; create a new one per task | Use `newVirtualThreadPerTaskExecutor()`, not a fixed pool |\n| **Downstream resources are still limited** | 10,000 virtual threads call the DB at once, but the connection pool has 20 connections | Limit with a `Semaphore` or rate limiting, and size pools sensibly. Virtual threads **don't** make the database stronger |\n| **`ThreadLocal`** | Millions of threads, each with its own ThreadLocal copy, waste memory; expensive objects cached in ThreadLocals stop paying off | Use **scoped values** (Java 25); avoid caching in ThreadLocals |\n| Observability | Traditional thread dumps don't fit well | `jcmd <pid> Thread.dump_to_file -format=json` |\n\n**A model answer:** *\"Virtual threads let us keep the simple thread-per-request model while serving tens of thousands of requests waiting on I/O. I enable them with one property in Spring Boot, but I still limit concurrency at calls to the database or external APIs, and on Java 21 I check for pinning caused by `synchronized`.\"*", "excerpt": "Xem thêm câu ngắn hơn: Virtual threads là gì. Vấn đề cũ: mỗi platform thread là một thread của hệ điều hành, tốn khoảng 1 MB stack và chi phí chuyển ngữ cảnh. Server thread-per-request với 200 thread thì tối đa khoảng 20", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-scoped-structured", "title": "Scoped values và structured concurrency là gì? / What are scoped values and structured concurrency?", "cat": "java-new", "section": "Java 25+", "kind": "qa", "tags": ["virtual-threads", "concurrency", "java25"], "body": "### Tiếng Việt\n\nCả hai thuộc Project Loom, được thiết kế để đi cùng virtual threads.\n\n**1. Scoped values (chính thức ở Java 25, JEP 506): thay `ThreadLocal`** để truyền ngữ cảnh (user hiện tại, request id, tenant) xuống các tầng sâu mà không phải thêm tham số.\n\n```java\nprivate static final ScopedValue<User> CURRENT_USER = ScopedValue.newInstance();\n\n// Ở filter hoặc controller: gắn giá trị cho phạm vi của lời gọi\nScopedValue.where(CURRENT_USER, user).run(() -> orderService.placeOrder(cmd));\n\n// Ở tầng sâu bất kỳ trong lời gọi đó\nUser u = CURRENT_USER.get();\n```\n\n| | `ThreadLocal` | `ScopedValue` |\n|---|---|---|\n| Thay đổi | `set()` lúc nào cũng được | **Bất biến** trong phạm vi; muốn đổi thì mở phạm vi lồng mới |\n| Thời gian sống | Đến khi `remove()`. **Quên gọi** thì rò rỉ dữ liệu sang request sau khi thread được tái sử dụng trong pool | **Tự hết** khi `run()` kết thúc |\n| Chi phí với triệu thread | Cao | Thấp, chia sẻ được cho thread con |\n\n**2. Structured concurrency (vẫn preview ở Java 27):** coi một nhóm task song song là **một đơn vị**: cùng bắt đầu, cùng kết thúc, lỗi một cái thì hủy những cái còn lại.\n\n```java\n// Lấy user và đơn hàng song song; một cái lỗi thì cái kia bị hủy\ntry (var scope = StructuredTaskScope.open()) {          // API bản preview gần đây\n    Subtask<User>        user   = scope.fork(() -> userClient.get(id));\n    Subtask<List<Order>> orders = scope.fork(() -> orderClient.list(id));\n    scope.join();                                       // chờ cả hai, ném lỗi nếu một cái thất bại\n    return new Profile(user.get(), orders.get());\n}\n```\n\n**Vì sao tốt hơn `CompletableFuture` hoặc `ExecutorService` tự quản:**\n- Không có **task mồ côi**: hết khối `try` thì mọi task con chắc chắn đã xong hoặc đã bị hủy.\n- **Tự hủy khi lỗi:** user service lỗi thì không phải ngồi chờ order service vô ích.\n- Thread dump thể hiện **quan hệ cha con**, dễ debug.\n- Scoped values được **kế thừa tự động** vào các task con.\n\n**Khi phỏng vấn:** nói rõ structured concurrency **vẫn là preview** (API đã đổi qua nhiều vòng), nên production hiện dùng `CompletableFuture` hoặc virtual-thread executor, và chuyển sang khi API chính thức.\n\n### English\n\nBoth are part of Project Loom and are designed to go with virtual threads.\n\n**1. Scoped values (final in Java 25, JEP 506): a replacement for `ThreadLocal`** for passing context (current user, request id, tenant) to deep layers without adding parameters.\n\n```java\nprivate static final ScopedValue<User> CURRENT_USER = ScopedValue.newInstance();\n\n// In a filter or controller: bind the value for the scope of the call\nScopedValue.where(CURRENT_USER, user).run(() -> orderService.placeOrder(cmd));\n\n// At any depth inside that call\nUser u = CURRENT_USER.get();\n```\n\n| | `ThreadLocal` | `ScopedValue` |\n|---|---|---|\n| Mutability | `set()` any time | **Immutable** within the scope; to change it, open a new nested scope |\n| Lifetime | Until `remove()`. **Forget it** and data leaks into the next request when a pooled thread is reused | **Ends automatically** when `run()` returns |\n| Cost with millions of threads | High | Low, shareable with child threads |\n\n**2. Structured concurrency (still in preview in Java 27):** treats a group of parallel tasks as **one unit**: they start together and finish together, and if one fails the others are cancelled.\n\n```java\n// Fetch the user and their orders in parallel; if one fails, the other is cancelled\ntry (var scope = StructuredTaskScope.open()) {          // recent preview API\n    Subtask<User>        user   = scope.fork(() -> userClient.get(id));\n    Subtask<List<Order>> orders = scope.fork(() -> orderClient.list(id));\n    scope.join();                                       // waits for both, throws if one failed\n    return new Profile(user.get(), orders.get());\n}\n```\n\n**Why it beats `CompletableFuture` or a hand-managed `ExecutorService`:**\n- No **orphaned tasks**: when the `try` block ends, every subtask has definitely finished or been cancelled.\n- **Automatic cancellation on failure:** if the user service fails, you don't wait pointlessly for the order service.\n- Thread dumps show the **parent-child relationship**, which makes debugging easier.\n- Scoped values are **inherited automatically** by subtasks.\n\n**In an interview:** say clearly that structured concurrency **is still in preview** (the API has changed across several rounds), so production code today uses `CompletableFuture` or a virtual-thread executor, and you'd switch once the API is final.", "excerpt": "Cả hai thuộc Project Loom, được thiết kế để đi cùng virtual threads. 1. Scoped values (chính thức ở Java 25, JEP 506): thay ThreadLocal để truyền ngữ cảnh (user hiện tại, request id, tenant) xuống các tầng sâu mà không p", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "jn-java25", "title": "Java 25 (LTS) có gì mới đáng chú ý? / What's notable in Java 25 (LTS)?", "cat": "java-new", "section": "Java 25+", "kind": "qa", "tags": ["java25", "lts", "kubernetes"], "body": "### Tiếng Việt\n\n**Ngôn ngữ, cho code gọn hơn:**\n\n| Tính năng | JEP | Ví dụ, ý nghĩa |\n|---|---|---|\n| **Compact source files và instance main** | 512 | File chỉ cần `void main() { IO.println(\"Hi\"); }`, không cần `public class` và `static`. Tiện cho script, bài tập, công cụ nhỏ |\n| **Module import declarations** | 511 | `import module java.base;` để import mọi package public của một module bằng một dòng |\n| **Flexible constructor bodies** | 513 | Được viết code (kiểm tra tham số) **trước** `super(...)` hoặc `this(...)`, miễn là không dùng `this` |\n\n```java\nclass Employee extends Person {\n    Employee(String name, int age) {\n        if (age < 18) throw new IllegalArgumentException(\"too young\");  // trước đây phải đặt sau super()\n        super(name);\n    }\n}\n```\n\n**Thư viện và đồng thời:**\n- **Scoped values** chính thức (JEP 506). Xem [Scoped values và structured concurrency](#jn-scoped-structured).\n- **Key Derivation Function API** (JEP 510), ví dụ HKDF, phục vụ mật mã hiện đại.\n- Structured concurrency và stable values (sau đổi tên thành lazy constants) vẫn là preview.\n\n**Hiệu năng và vận hành:**\n- **Compact object headers** (JEP 519): header object giảm từ 12–16 byte xuống **8 byte**, nên **giảm heap khoảng 10–20%** với ứng dụng có nhiều object nhỏ. Ở Java 25 phải bật bằng `-XX:+UseCompactObjectHeaders`; **Java 27 bật mặc định**.\n- **AOT cache (Project Leyden)** (JEP 514, 515): chạy thử một lần để ghi lại class đã nạp và profile method, các lần sau **khởi động và đạt tốc độ tối đa nhanh hơn**. Hữu ích cho container cần scale nhanh. Từ Java 26, AOT object caching dùng được với mọi GC.\n- **Generational Shenandoah** chính thức (JEP 521).\n- **JFR:** đo thời gian CPU và theo dõi thời gian gọi method chính xác hơn.\n\n**Những thứ bị bỏ:** port x86 32-bit.\n\n**Từ 25 đến 27, những điểm đáng biết:** HTTP/3 cho `HttpClient` (26), chuẩn bị cấm đổi field `final` bằng reflection (26), G1 là GC mặc định ở mọi môi trường (27), compact object headers bật mặc định (27), TLS 1.3 có trao đổi khóa lai hậu lượng tử (27).\n\n**Khi phỏng vấn:** không cần thuộc số JEP. Nên nêu 2–3 điểm có ý nghĩa với backend: *\"Java 25 là LTS mới, scoped values thay ThreadLocal khi dùng virtual threads, compact object headers giảm bộ nhớ, và AOT cache cải thiện thời gian khởi động trong Kubernetes.\"*\n\n### English\n\n**Language, for more concise code:**\n\n| Feature | JEP | Example, meaning |\n|---|---|---|\n| **Compact source files and instance main** | 512 | A file can be just `void main() { IO.println(\"Hi\"); }`, no `public class` or `static`. Handy for scripts, exercises and small tools |\n| **Module import declarations** | 511 | `import module java.base;` imports every public package of a module in one line |\n| **Flexible constructor bodies** | 513 | You can write code (argument validation) **before** `super(...)` or `this(...)`, as long as it doesn't use `this` |\n\n```java\nclass Employee extends Person {\n    Employee(String name, int age) {\n        if (age < 18) throw new IllegalArgumentException(\"too young\");  // previously had to go after super()\n        super(name);\n    }\n}\n```\n\n**Libraries and concurrency:**\n- **Scoped values** are final (JEP 506). See [Scoped values and structured concurrency](#jn-scoped-structured).\n- The **Key Derivation Function API** (JEP 510), for example HKDF, for modern cryptography.\n- Structured concurrency and stable values (later renamed lazy constants) remain in preview.\n\n**Performance and operations:**\n- **Compact object headers** (JEP 519): object headers shrink from 12–16 bytes to **8 bytes**, **cutting heap use by about 10–20%** in applications with many small objects. In Java 25 you enable them with `-XX:+UseCompactObjectHeaders`; **Java 27 turns them on by default**.\n- **AOT cache (Project Leyden)** (JEP 514, 515): a training run records loaded classes and method profiles, so later runs **start up and reach peak speed faster**. Useful for containers that need to scale quickly. Since Java 26, AOT object caching works with any GC.\n- **Generational Shenandoah** is final (JEP 521).\n- **JFR:** more accurate CPU-time profiling and method timing.\n\n**Removed:** the 32-bit x86 port.\n\n**Worth knowing from 25 to 27:** HTTP/3 for `HttpClient` (26), groundwork to stop reflection from changing `final` fields (26), G1 as the default GC in all environments (27), compact object headers on by default (27), and post-quantum hybrid key exchange in TLS 1.3 (27).\n\n**In an interview:** you don't need the JEP numbers. Name 2–3 points that matter for backend work: *\"Java 25 is the new LTS, scoped values replace ThreadLocal when using virtual threads, compact object headers reduce memory, and the AOT cache improves startup time in Kubernetes.\"*", "excerpt": "Ngôn ngữ, cho code gọn hơn: Thư viện và đồng thời: Scoped values chính thức (JEP 506). Xem Scoped values và structured concurrency. Key Derivation Function API (JEP 510), ví dụ HKDF, phục vụ mật mã hiện đại. Structured c", "catLabel": "Java: tính năng mới", "tip": "", "num": null}, {"id": "technical-spring-database-jpa", "title": "Tổng quan: Technical: Spring, database, JPA", "cat": "spring", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Người hỏi muốn thấy bạn hiểu Spring hoạt động bên trong, không chỉ dùng annotation; phần database xoay quanh index, transaction và các bẫy của Hibernate.", "kind": "guide", "excerpt": "Người hỏi muốn thấy bạn hiểu Spring hoạt động bên trong, không chỉ dùng annotation; phần database xoay quanh index, transaction và các bẫy của Hibernate.", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "spring-1", "title": "What are IoC and dependency injection? Which injection type do you prefer?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Inversion of control means the container creates objects and wires their dependencies instead of the objects doing it themselves. I prefer constructor injection: dependencies are explicit and can be `final`, the object is never half-initialized, circular dependencies fail at startup, and unit tests need no Spring context.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Inversion of control means the container creates objects and wires their dependencies instead of the objects doing it themselves. I prefer constructor injection: dependencies are explicit and can be final, the object is", "catLabel": "Spring & JPA"}, {"id": "spring-2", "title": "Describe the bean lifecycle and scopes.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Spring reads bean definitions, instantiates the bean, injects dependencies, calls aware callbacks, runs `BeanPostProcessor`s before initialization, then `@PostConstruct` or `afterPropertiesSet`, then post-processors after initialization, which is where AOP proxies are created. On shutdown it calls `@PreDestroy`. Scopes are singleton by default, prototype, and the web scopes request and session. Injecting a prototype into a singleton gives one instance unless I use `ObjectProvider` or a scoped proxy.\"", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"Spring reads bean definitions, instantiates the bean, injects dependencies, calls aware callbacks, runs BeanPostProcessors before initialization, then @PostConstruct or afterPropertiesSet, then post-processors after ini", "catLabel": "Spring & JPA"}, {"id": "spring-3", "title": "How does @Transactional work, and when does it silently not work?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Spring wraps the bean in a proxy that opens a transaction before the method and commits or rolls back after it. It fails in three common cases: self-invocation, because a call from another method of the same class bypasses the proxy; non-public methods with the default proxy mode; and checked exceptions, which don't trigger rollback unless I set `rollbackFor`. Catching the exception inside the method also prevents rollback.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Spring wraps the bean in a proxy that opens a transaction before the method and commits or rolls back after it. It fails in three common cases: self-invocation, because a call from another method of the same class bypas", "catLabel": "Spring & JPA"}, {"id": "spring-4", "title": "Explain propagation and isolation.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Propagation defines how a method joins transactions: `REQUIRED` joins or creates one, `REQUIRES_NEW` suspends the current one and starts an independent one, for example for audit logs, and `NESTED` uses a savepoint. Isolation controls what concurrent transactions see: read committed prevents dirty reads, repeatable read also prevents non-repeatable reads, serializable prevents phantoms. MySQL InnoDB defaults to repeatable read; PostgreSQL defaults to read committed.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"Propagation defines how a method joins transactions: REQUIRED joins or creates one, REQUIRESNEW suspends the current one and starts an independent one, for example for audit logs, and NESTED uses a savepoint. Isolation ", "catLabel": "Spring & JPA"}, {"id": "spring-5", "title": "How does Spring Boot auto-configuration work?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"`@SpringBootApplication` enables auto-configuration. Boot loads the configuration classes listed in `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports` and applies each only if its conditions match, such as `@ConditionalOnClass`, `@ConditionalOnMissingBean` and `@ConditionalOnProperty`. So if I define my own `DataSource` bean, the default one backs off. I use the `--debug` conditions report to see why something was or wasn't configured.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"@SpringBootApplication enables auto-configuration. Boot loads the configuration classes listed in META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports and applies each only if its conditions ", "catLabel": "Spring & JPA"}, {"id": "spring-6", "title": "How does Spring AOP work, and what are its limits?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"It's proxy-based: a JDK dynamic proxy for interfaces, or a CGLIB subclass otherwise. Advice runs around calls that go through the proxy. So it only intercepts external calls to public methods of Spring beans, not internal calls, private methods or final classes.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"It's proxy-based: a JDK dynamic proxy for interfaces, or a CGLIB subclass otherwise. Advice runs around calls that go through the proxy. So it only intercepts external calls to public methods of Spring beans, not intern", "catLabel": "Spring & JPA"}, {"id": "spring-7", "title": "How does Spring Security process a request? How did authentication work in your last system?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "opswat"], "body": "\"A request passes through a filter chain. An authentication filter extracts credentials, such as a JWT from the `Authorization` header, validates them and stores an `Authentication` in the `SecurityContext`. Authorization is then checked by URL rules or method security such as `@PreAuthorize`. At Opswat we used forward auth: the gateway called an auth service that validated the token and added identity headers, so downstream services trusted those headers and didn't re-authenticate. The trade-off is that services must only be reachable through the gateway.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"A request passes through a filter chain. An authentication filter extracts credentials, such as a JWT from the Authorization header, validates them and stores an Authentication in the SecurityContext. Authorization is t", "catLabel": "Spring & JPA"}, {"id": "spring-8", "title": "How do you design and version a REST API?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Resource-oriented URLs with plural nouns, correct HTTP methods and status codes, pagination and filtering on collections, a consistent error format, and idempotency: `PUT` and `DELETE` are idempotent by definition, and for `POST` I accept an idempotency key. I version in the path, such as `/v1`, make only backward-compatible changes within a version, and document with OpenAPI.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Resource-oriented URLs with plural nouns, correct HTTP methods and status codes, pagination and filtering on collections, a consistent error format, and idempotency: PUT and DELETE are idempotent by definition, and for ", "catLabel": "Spring & JPA"}, {"id": "spring-9", "title": "Which design patterns have you actually used? Explain SOLID briefly.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "dxc"], "body": "\"Strategy for interchangeable business rules, for example \\[tính phí bảo hiểm theo sản phẩm ở DXC\\]; Factory to choose an implementation; Builder for complex objects; Template Method and Proxy inside Spring itself; Observer through application events. SOLID: single responsibility, open for extension but closed for modification, subtypes must be substitutable, small specific interfaces, and depend on abstractions rather than concrete classes.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"Strategy for interchangeable business rules, for example tính phí bảo hiểm theo sản phẩm ở DXC; Factory to choose an implementation; Builder for complex objects; Template Method and Proxy inside Spring itself; Observer ", "catLabel": "Spring & JPA"}, {"id": "spring-10", "title": "How do you test a Spring Boot service?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Mostly unit tests with JUnit 5 and Mockito, without a Spring context. Slice tests such as `@WebMvcTest` and `@DataJpaTest` for the web and persistence layers. A smaller number of integration tests with `@SpringBootTest` and Testcontainers, so they run against a real database and broker. I test behaviour, not implementation, and I don't chase a coverage number.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"Mostly unit tests with JUnit 5 and Mockito, without a Spring context. Slice tests such as @WebMvcTest and @DataJpaTest for the web and persistence layers. A smaller number of integration tests with @SpringBootTest and T", "catLabel": "Spring & JPA"}, {"id": "jpa-16", "title": "What is the N+1 problem and how do you fix it?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Loading N parent entities and then touching a lazy association triggers one extra query per parent. I fix it with `JOIN FETCH` or an `@EntityGraph`, with batch fetching through `@BatchSize`, or with a DTO projection when I only need a few fields. I detect it by logging SQL or asserting query counts in tests.\"", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"Loading N parent entities and then touching a lazy association triggers one extra query per parent. I fix it with JOIN FETCH or an @EntityGraph, with batch fetching through @BatchSize, or with a DTO projection when I on", "catLabel": "Spring & JPA"}, {"id": "jpa-17", "title": "Lazy vs eager loading? What is LazyInitializationException?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Lazy loads the association on first access; eager loads it with the parent. I keep everything lazy and fetch explicitly per use case, because eager loading can't be turned off per query. The exception happens when a lazy association is accessed after the session is closed. The fix is to fetch what I need inside the transaction and return DTOs, not to enable open-session-in-view.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Lazy loads the association on first access; eager loads it with the parent. I keep everything lazy and fetch explicitly per use case, because eager loading can't be turned off per query. The exception happens when a laz", "catLabel": "Spring & JPA"}, {"id": "jpa-18", "title": "Explain entity states and the first- and second-level cache.", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Entities are transient, managed, detached or removed. Managed entities are tracked by the persistence context, which is the first-level cache: it's per session, guarantees one instance per row, and flushes changes automatically through dirty checking. The second-level cache is shared across sessions, optional, and useful for read-mostly reference data; it needs an invalidation strategy.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"Entities are transient, managed, detached or removed. Managed entities are tracked by the persistence context, which is the first-level cache: it's per session, guarantees one instance per row, and flushes changes autom", "catLabel": "Spring & JPA"}, {"id": "jpa-19", "title": "How do you handle large batch inserts or updates with JPA?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Enable JDBC batching with `hibernate.jdbc.batch_size`, order inserts and updates, flush and clear the persistence context every batch to keep memory flat, and avoid `IDENTITY` generation because it disables insert batching. For very large volumes I use plain JDBC or a bulk statement.\"", "kind": "qa", "num": 19, "tip": "", "excerpt": "\"Enable JDBC batching with hibernate.jdbc.batchsize, order inserts and updates, flush and clear the persistence context every batch to keep memory flat, and avoid IDENTITY generation because it disables insert batching. ", "catLabel": "Spring & JPA"}, {"id": "sp-without-sba", "title": "Can a Spring Boot app run without @SpringBootApplication?", "cat": "spring", "section": "Spring (EPAM rapid-fire)", "kind": "qa", "tags": ["spring", "spring-boot", "epam"], "body": "\"Yes. `@SpringBootApplication` is just a convenience meta-annotation combining three annotations: `@SpringBootConfiguration` (a specialized `@Configuration`), `@EnableAutoConfiguration`, and `@ComponentScan` of the class's package and sub-packages. Putting those three on the main class, or configuring components explicitly, works the same, and `SpringApplication.run(...)` starts the app either way.\n\nA common follow-up: beans in packages outside the main class's package aren't found, because component scanning starts from that package. Fix it by moving the main class to the root package or setting `scanBasePackages`.\"", "excerpt": "\"Yes. @SpringBootApplication is just a convenience meta-annotation combining three annotations: @SpringBootConfiguration (a specialized @Configuration), @EnableAutoConfiguration, and @ComponentScan of the class's package", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sp-dispatcher", "title": "What is DispatcherServlet? Walk through the Spring MVC request flow.", "cat": "spring", "section": "Spring (EPAM rapid-fire)", "kind": "qa", "tags": ["spring", "spring-mvc", "epam"], "body": "\"`DispatcherServlet` is the **front controller**: every HTTP request enters through it. The flow:\n\n1. Servlet filters run first, including the Spring Security filter chain.\n2. `DispatcherServlet` asks the `HandlerMapping` which controller method matches the URL and HTTP method.\n3. Interceptors' `preHandle` run.\n4. A `HandlerAdapter` invokes the method, resolving arguments such as `@PathVariable`, `@RequestParam` and `@RequestBody` (via `HttpMessageConverter`s, for example Jackson for JSON) and running validation.\n5. The return value is written as the response body for `@RestController`, or resolved to a view by a `ViewResolver` for server-rendered pages.\n6. Exceptions go to `HandlerExceptionResolver`s, which is where `@ControllerAdvice` with `@ExceptionHandler` plugs in.\n\nIn Spring Boot it's auto-configured; you rarely touch it directly.\"", "excerpt": "\"DispatcherServlet is the front controller: every HTTP request enters through it. The flow: Servlet filters run first, including the Spring Security filter chain. DispatcherServlet asks the HandlerMapping which controlle", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sp-param-path", "title": "@RequestParam vs @PathVariable: can you use both in one method?", "cat": "spring", "section": "Spring (EPAM rapid-fire)", "kind": "qa", "tags": ["spring", "spring-mvc", "rest", "epam"], "body": "\"`@PathVariable` binds a segment of the URL path and identifies a resource: `/users/{id}`. `@RequestParam` binds a query string parameter, typically optional, for filtering, sorting or paging: `/users?status=active&page=2`.\n\nYes, they combine naturally:\n\n```java\n@GetMapping(\"/users/{id}/orders\")\npublic Page<OrderDto> orders(@PathVariable long id,\n                             @RequestParam(defaultValue = \"0\") int page,\n                             @RequestParam(required = false) String status) { ... }\n```\n\nREST convention: identity in the path, optional modifiers in the query. `@RequestParam` is required by default, so missing values give a 400 unless I set `required = false` or a default.\"", "excerpt": "\"@PathVariable binds a segment of the URL path and identifies a resource: /users/{id}. @RequestParam binds a query string parameter, typically optional, for filtering, sorting or paging: /users?status=active&page=2. Yes,", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sp-profiles", "title": "How do you configure different databases per environment?", "cat": "spring", "section": "Spring (EPAM rapid-fire)", "kind": "qa", "tags": ["spring", "spring-boot", "configuration", "epam", "kubernetes"], "body": "\"With **Spring profiles**. Common settings go in `application.yml`, environment-specific ones in `application-dev.yml`, `application-prod.yml` and so on, and the active profile is chosen at startup with `spring.profiles.active` or the `SPRING_PROFILES_ACTIVE` environment variable. Beans can also be limited with `@Profile(\"dev\")`.\n\nIn practice, I keep secrets such as database passwords out of these files entirely: they come from environment variables, Kubernetes Secrets, or a secret manager, and the same image runs in every environment with only configuration changing. Spring Boot's property precedence lets environment variables override file values, which is how that works without code changes.\"", "excerpt": "\"With Spring profiles. Common settings go in application.yml, environment-specific ones in application-dev.yml, application-prod.yml and so on, and the active profile is chosen at startup with spring.profiles.active or t", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sn-versions", "title": "Spring Boot 2, 3, 4 khác nhau thế nào? Nâng cấp cần chú ý gì? / How do Spring Boot 2, 3 and 4 differ, and what should you watch for when upgrading?", "cat": "spring-new", "section": "Tổng quan phiên bản", "kind": "qa", "tags": ["spring-boot", "migration"], "body": "### Tiếng Việt\n\n| | Spring Boot 2.x | Spring Boot 3.x | Spring Boot 4.x |\n|---|---|---|---|\n| Ra mắt | 2018 | 11/2022 | 11/2025 (4.1 vào 06/2026) |\n| Spring Framework | 5 | 6 | 7 |\n| Java tối thiểu | 8 | **17** | 17 (khuyến nghị **25**) |\n| Jakarta EE | `javax.*` | **`jakarta.*`** (EE 9/10) | Jakarta EE 11 (Servlet 6.1, JPA 3.2) |\n| Hibernate | 5 | 6 | 7 |\n| Jackson | 2 | 2 | **3** |\n| Điểm nhấn | | AOT và GraalVM native, Observation API (Micrometer), ProblemDetail, HTTP interface, virtual threads (3.2) | API versioning, `@Retryable`/`@ConcurrencyLimit` trong core, JSpecify null safety, chia nhỏ module auto-config, HTTP service client groups |\n\n**Nâng cấp 2 lên 3, phần tốn công nhất:**\n1. Nâng Java lên 17 trước.\n2. Đổi **`javax.*` sang `jakarta.*`** (persistence, servlet, validation). Dùng **OpenRewrite** (`rewrite-spring`) để sửa tự động.\n3. Thư viện bên thứ ba phải có bản hỗ trợ Jakarta.\n4. Spring Security 6: bỏ `WebSecurityConfigurerAdapter`, chuyển sang bean `SecurityFilterChain`.\n5. Spring Cloud Sleuth bị thay bằng **Micrometer Tracing**.\n6. Hibernate 6 đổi cách sinh SQL và một số kiểu dữ liệu, cần chạy lại test tích hợp.\n7. Nên đi qua 2.7 trước, sửa hết cảnh báo deprecation rồi mới lên 3.0.\n\n**Nâng cấp 3 lên 4, những điểm hay vướng:**\n1. **Jackson 3:** package đổi thành `tools.jackson`, một số mặc định đổi (cách xử lý ngày giờ, property không biết). Test serialization có thể lỗi mà không báo trước.\n2. **Module auto-config được chia nhỏ:** starter đổi tên rõ nghĩa hơn (ví dụ `spring-boot-starter-webmvc`), có starter riêng cho test. Có starter \"classic\" để chuyển dần.\n3. Bỏ Undertow (chưa hỗ trợ Servlet 6.1), bỏ các API đã deprecated từ 3.x.\n4. Spring Security 7, Hibernate 7, JUnit 6.\n5. Cách làm: nâng lên **3.5 mới nhất trước**, sửa cảnh báo deprecation, rồi chạy OpenRewrite recipe cho Boot 4.\n\n**Câu trả lời mẫu:** *\"Tôi đã [nâng cấp / làm việc trên] Spring Boot [3.x]. Khó nhất khi lên 3 là đổi javax sang jakarta và thư viện cũ chưa hỗ trợ; tôi dùng OpenRewrite cho phần cơ học và dựa vào test tích hợp với Testcontainers để bắt lỗi Hibernate 6.\"* Điền đúng trải nghiệm của bạn.\n\n### English\n\n| | Spring Boot 2.x | Spring Boot 3.x | Spring Boot 4.x |\n|---|---|---|---|\n| Released | 2018 | 11/2022 | 11/2025 (4.1 in 06/2026) |\n| Spring Framework | 5 | 6 | 7 |\n| Minimum Java | 8 | **17** | 17 (**25** recommended) |\n| Jakarta EE | `javax.*` | **`jakarta.*`** (EE 9/10) | Jakarta EE 11 (Servlet 6.1, JPA 3.2) |\n| Hibernate | 5 | 6 | 7 |\n| Jackson | 2 | 2 | **3** |\n| Highlights | | AOT and GraalVM native, the Observation API (Micrometer), ProblemDetail, HTTP interfaces, virtual threads (3.2) | API versioning, `@Retryable`/`@ConcurrencyLimit` in core, JSpecify null safety, modularized auto-configuration, HTTP service client groups |\n\n**Upgrading 2 to 3, the most work:**\n1. Move to Java 17 first.\n2. Rename **`javax.*` to `jakarta.*`** (persistence, servlet, validation). Use **OpenRewrite** (`rewrite-spring`) to automate it.\n3. Third-party libraries need Jakarta-compatible versions.\n4. Spring Security 6: `WebSecurityConfigurerAdapter` is gone; use `SecurityFilterChain` beans.\n5. Spring Cloud Sleuth is replaced by **Micrometer Tracing**.\n6. Hibernate 6 changes SQL generation and some types, so rerun integration tests.\n7. Go through 2.7 first, fix every deprecation warning, then move to 3.0.\n\n**Upgrading 3 to 4, common snags:**\n1. **Jackson 3:** the package becomes `tools.jackson` and some defaults change (date handling, unknown properties). Serialization tests can break without warning.\n2. **Modularized auto-configuration:** starters get clearer names (for example `spring-boot-starter-webmvc`), with dedicated test starters. \"Classic\" starters exist for a gradual migration.\n3. Undertow is dropped (no Servlet 6.1 support yet), and APIs deprecated in 3.x are removed.\n4. Spring Security 7, Hibernate 7, JUnit 6.\n5. Approach: upgrade to **the latest 3.5 first**, fix deprecation warnings, then run the OpenRewrite recipe for Boot 4.\n\n**A model answer:** *\"I [upgraded / worked on] Spring Boot [3.x]. The hardest part of moving to 3 was javax to jakarta and old libraries without support; I used OpenRewrite for the mechanical changes and relied on integration tests with Testcontainers to catch Hibernate 6 issues.\"* Fill in your real experience.", "excerpt": "Nâng cấp 2 lên 3, phần tốn công nhất: Nâng Java lên 17 trước. Đổi javax. sang jakarta. (persistence, servlet, validation). Dùng OpenRewrite (rewrite-spring) để sửa tự động. Thư viện bên thứ ba phải có bản hỗ trợ Jakarta.", "catLabel": "Spring: tính năng mới", "tip": "", "num": null}, {"id": "sn-boot3", "title": "Spring Boot 3.x có những tính năng mới nào đáng dùng? / Which Spring Boot 3.x features are worth using?", "cat": "spring-new", "section": "Spring Boot 3", "kind": "qa", "tags": ["spring-boot", "observability", "testcontainers", "kafka", "docker"], "body": "### Tiếng Việt\n\n| Tính năng | Bản | Dùng thế nào, lợi ích |\n|---|---|---|\n| **ProblemDetail (RFC 9457, trước là 7807)** | 3.0 | Format lỗi chuẩn `{type, title, status, detail, instance}`. Bật `spring.mvc.problemdetails.enabled=true` hoặc trả `ProblemDetail` từ `@ExceptionHandler` |\n| **Observability với Micrometer** | 3.0 | Observation API: một lần đo cho ra **cả metrics lẫn trace**. Micrometer Tracing thay Sleuth, xuất qua OpenTelemetry hoặc Zipkin. Trace id tự có trong log |\n| **HTTP interface** (`@HttpExchange`) | 3.0 | Khai báo interface, Spring sinh client, giống Feign nhưng có sẵn |\n| **AOT và GraalVM native image** | 3.0 | Biên dịch thành file chạy native: khởi động khoảng 0,1 giây, ít RAM. Đổi lại build lâu, reflection phải khai báo, không có JIT nên throughput lúc chạy lâu có thể thấp hơn |\n| **Testcontainers `@ServiceConnection`** | 3.1 | Container trong test tự cấu hình datasource, không cần `@DynamicPropertySource` |\n| **Docker Compose support** | 3.1 | Chạy app ở local thì tự `docker compose up` theo `compose.yaml` và tự nối kết nối |\n| **SSL bundles** | 3.1 | Cấu hình keystore và truststore một chỗ, dùng lại cho web server, RestClient, Kafka, Redis |\n| **Virtual threads** | 3.2 | `spring.threads.virtual.enabled=true` |\n| **`RestClient`, `JdbcClient`** | 3.2 | API fluent, đồng bộ, hiện đại hơn `RestTemplate` và `JdbcTemplate` |\n| **CDS** | 3.3 | Class Data Sharing để khởi động nhanh hơn mà không cần native image |\n| **Structured logging** | 3.4 | `logging.structured.format.console=ecs` (hoặc `logstash`, `gelf`) để log ra JSON, đẩy thẳng vào ELK hoặc Loki |\n| **`@MockitoBean`, `@MockitoSpyBean`** | 3.4 | Thay `@MockBean`, `@SpyBean` (đã deprecated và bị bỏ ở Boot 4) |\n\n```java\n// Testcontainers + @ServiceConnection\n@SpringBootTest\n@Testcontainers\nclass OrderRepositoryIT {\n    @Container @ServiceConnection\n    static PostgreSQLContainer<?> pg = new PostgreSQLContainer<>(\"postgres:17\");\n    // không cần cấu hình spring.datasource.* nữa\n}\n\n// ProblemDetail\n@ExceptionHandler(OrderNotFoundException.class)\nProblemDetail handle(OrderNotFoundException e) {\n    ProblemDetail pd = ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());\n    pd.setProperty(\"orderId\", e.getOrderId());\n    return pd;\n}\n```\n\n**Nên chọn 3–4 cái mình đã dùng thật để kể** khi được hỏi \"Bạn dùng tính năng mới nào của Spring Boot 3?\". Testcontainers với `@ServiceConnection`, ProblemDetail, RestClient và observability là những câu dễ ghi điểm.\n\n### English\n\n| Feature | Version | Usage, benefit |\n|---|---|---|\n| **ProblemDetail (RFC 9457, formerly 7807)** | 3.0 | A standard error format `{type, title, status, detail, instance}`. Enable `spring.mvc.problemdetails.enabled=true` or return a `ProblemDetail` from an `@ExceptionHandler` |\n| **Observability with Micrometer** | 3.0 | The Observation API: one instrumentation produces **both metrics and traces**. Micrometer Tracing replaces Sleuth, exporting via OpenTelemetry or Zipkin. Trace ids appear in logs automatically |\n| **HTTP interfaces** (`@HttpExchange`) | 3.0 | Declare an interface and Spring generates the client, like Feign but built in |\n| **AOT and GraalVM native images** | 3.0 | Compile to a native executable: about 0.1 s startup and low memory. In exchange, builds are slow, reflection must be declared, and without a JIT, long-running throughput can be lower |\n| **Testcontainers `@ServiceConnection`** | 3.1 | Containers in tests configure the datasource automatically, no `@DynamicPropertySource` needed |\n| **Docker Compose support** | 3.1 | Running the app locally runs `docker compose up` from `compose.yaml` and wires the connections automatically |\n| **SSL bundles** | 3.1 | Configure keystores and truststores in one place and reuse them for the web server, RestClient, Kafka and Redis |\n| **Virtual threads** | 3.2 | `spring.threads.virtual.enabled=true` |\n| **`RestClient`, `JdbcClient`** | 3.2 | Fluent, synchronous APIs, more modern than `RestTemplate` and `JdbcTemplate` |\n| **CDS** | 3.3 | Class Data Sharing for faster startup without a native image |\n| **Structured logging** | 3.4 | `logging.structured.format.console=ecs` (or `logstash`, `gelf`) to log JSON straight into ELK or Loki |\n| **`@MockitoBean`, `@MockitoSpyBean`** | 3.4 | Replace `@MockBean` and `@SpyBean` (deprecated, and removed in Boot 4) |\n\n```java\n// Testcontainers + @ServiceConnection\n@SpringBootTest\n@Testcontainers\nclass OrderRepositoryIT {\n
