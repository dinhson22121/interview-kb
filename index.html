@Container @ServiceConnection\n    static PostgreSQLContainer<?> pg = new PostgreSQLContainer<>(\"postgres:17\");\n    // no spring.datasource.* configuration needed anymore\n}\n\n// ProblemDetail\n@ExceptionHandler(OrderNotFoundException.class)\nProblemDetail handle(OrderNotFoundException e) {\n    ProblemDetail pd = ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());\n    pd.setProperty(\"orderId\", e.getOrderId());\n    return pd;\n}\n```\n\n**Pick 3–4 features you've really used to talk about** when asked \"Which new Spring Boot 3 features have you used?\". Testcontainers with `@ServiceConnection`, ProblemDetail, RestClient and observability are easy points to score.", "excerpt": "Nên chọn 3–4 cái mình đã dùng thật để kể khi được hỏi \"Bạn dùng tính năng mới nào của Spring Boot 3?\". Testcontainers với @ServiceConnection, ProblemDetail, RestClient và observability là những câu dễ ghi điểm. Pick 3–4 ", "catLabel": "Spring: tính năng mới", "tip": "", "num": null}, {"id": "sn-http-clients", "title": "RestTemplate, WebClient, RestClient và HTTP interface: nên dùng cái nào? / RestTemplate, WebClient, RestClient and HTTP interfaces: which should you use?", "cat": "spring-new", "section": "Spring Boot 3", "kind": "qa", "tags": ["spring-boot", "http-client"], "body": "### Tiếng Việt\n\n| Client | Kiểu | Trạng thái | Dùng khi |\n|---|---|---|---|\n| `RestTemplate` | Đồng bộ, API dạng template | **Maintenance mode**; đội Spring đã công bố lộ trình deprecate trong dòng 7.x | Code cũ, không viết mới |\n| `WebClient` | **Reactive**, không chặn (WebFlux) | Đang phát triển | Ứng dụng reactive, hoặc cần gọi song song bằng Reactor |\n| **`RestClient`** | Đồng bộ, **API fluent** giống WebClient | **Mặc định cho code mới** (từ 6.1 / Boot 3.2) | App Spring MVC thông thường, đặc biệt khi dùng virtual threads |\n| **HTTP interface** (`@HttpExchange`) | Khai báo interface, chạy trên RestClient hoặc WebClient | Có sẵn từ 6.0 | Client có nhiều endpoint, muốn code gọn như Feign |\n\n```java\n// RestClient\nRestClient client = RestClient.builder()\n    .baseUrl(\"https://payment.internal\")\n    .defaultHeader(\"X-Service\", \"order\")\n    .requestInterceptor(new TracingInterceptor())\n    .build();\n\nPaymentResponse res = client.post().uri(\"/payments\")\n    .body(new PaymentRequest(orderId, amount))\n    .retrieve()\n    .onStatus(HttpStatusCode::is4xxClientError, (req, resp) -> { throw new PaymentRejected(); })\n    .body(PaymentResponse.class);\n\n// HTTP interface\n@HttpExchange(\"/payments\")\ninterface PaymentClient {\n    @PostExchange PaymentResponse create(@RequestBody PaymentRequest req);\n    @GetExchange(\"/{id}\") PaymentResponse get(@PathVariable String id);\n}\n```\n\n**Spring Boot 4 / Framework 7: HTTP service client groups.** Khai báo `@ImportHttpServices(group = \"payment\", types = PaymentClient.class)` thì Spring tự tạo bean client, cấu hình `base-url` và timeout qua `application.yml` theo nhóm. Không cần viết `HttpServiceProxyFactory` bằng tay nữa.\n\n**OpenFeign:** Spring Cloud OpenFeign đã vào chế độ bảo trì; đội Spring khuyên chuyển sang HTTP interface.\n\n**Dù dùng client nào, đều phải cấu hình:**\n- **Timeout** (connect và read). Mặc định có thể chờ rất lâu, làm cạn thread.\n- Retry có giới hạn và chỉ cho request idempotent (Boot 4 có `@Retryable` trong core), circuit breaker (Resilience4j).\n- Connection pool, truyền trace header, log có che dữ liệu nhạy cảm.\n\n### English\n\n| Client | Style | Status | Use when |\n|---|---|---|---|\n| `RestTemplate` | Synchronous, template-style API | **Maintenance mode**; the Spring team has announced a deprecation path in the 7.x line | Legacy code, not for new code |\n| `WebClient` | **Reactive**, non-blocking (WebFlux) | Actively developed | Reactive applications, or parallel calls with Reactor |\n| **`RestClient`** | Synchronous, **fluent API** like WebClient | **The default for new code** (since 6.1 / Boot 3.2) | Regular Spring MVC apps, especially with virtual threads |\n| **HTTP interfaces** (`@HttpExchange`) | Declarative interfaces running on RestClient or WebClient | Built in since 6.0 | Clients with many endpoints, when you want Feign-like concise code |\n\n```java\n// RestClient\nRestClient client = RestClient.builder()\n    .baseUrl(\"https://payment.internal\")\n    .defaultHeader(\"X-Service\", \"order\")\n    .requestInterceptor(new TracingInterceptor())\n    .build();\n\nPaymentResponse res = client.post().uri(\"/payments\")\n    .body(new PaymentRequest(orderId, amount))\n    .retrieve()\n    .onStatus(HttpStatusCode::is4xxClientError, (req, resp) -> { throw new PaymentRejected(); })\n    .body(PaymentResponse.class);\n\n// HTTP interface\n@HttpExchange(\"/payments\")\ninterface PaymentClient {\n    @PostExchange PaymentResponse create(@RequestBody PaymentRequest req);\n    @GetExchange(\"/{id}\") PaymentResponse get(@PathVariable String id);\n}\n```\n\n**Spring Boot 4 / Framework 7: HTTP service client groups.** Declare `@ImportHttpServices(group = \"payment\", types = PaymentClient.class)` and Spring creates the client beans, with `base-url` and timeouts configured per group in `application.yml`. No more hand-written `HttpServiceProxyFactory`.\n\n**OpenFeign:** Spring Cloud OpenFeign is in maintenance mode, and the Spring team recommends moving to HTTP interfaces.\n\n**Whichever client you use, always configure:**\n- **Timeouts** (connect and read). Defaults can wait a very long time and exhaust threads.\n- Bounded retries for idempotent requests only (Boot 4 has `@Retryable` in core), and a circuit breaker (Resilience4j).\n- A connection pool, trace-header propagation, and logs that mask sensitive data.", "excerpt": "Spring Boot 4 / Framework 7: HTTP service client groups. Khai báo @ImportHttpServices(group = \"payment\", types = PaymentClient.class) thì Spring tự tạo bean client, cấu hình base-url và timeout qua application.yml theo n", "catLabel": "Spring: tính năng mới", "tip": "", "num": null}, {"id": "sn-boot4", "title": "Spring Boot 4 / Spring Framework 7 có gì mới? / What's new in Spring Boot 4 and Spring Framework 7?", "cat": "spring-new", "section": "Spring Boot 4", "kind": "qa", "tags": ["spring-boot", "spring7", "api-versioning"], "body": "### Tiếng Việt\n\nSpring Framework 7 và Spring Boot 4 ra mắt tháng 11/2025; Spring Boot 4.1 ra mắt tháng 6/2026.\n\n**1. API versioning có sẵn** (MVC và WebFlux). Trước đây phải tự làm bằng URL hoặc header.\n\n```java\n@RestController\n@RequestMapping(\"/api/orders\")\nclass OrderController {\n    @GetMapping(path = \"/{id}\", version = \"1\")   OrderV1 getV1(@PathVariable long id) { ... }\n    @GetMapping(path = \"/{id}\", version = \"2+\")  OrderV2 getV2(@PathVariable long id) { ... } // từ v2 trở lên\n}\n// application.yml: spring.mvc.apiversion.use.header: X-API-Version\n```\n\n- Hỗ trợ 4 cách đọc version: path, header, query param, media type.\n- Kiểm tra version hợp lệ, có version mặc định.\n- **Header deprecation chuẩn RFC** (`Deprecation`, `Sunset`) để báo client sắp bỏ version cũ.\n- RestClient, WebClient và HTTP interface tự gắn version khi gọi.\n\n**2. Resilience có sẵn trong core** (trước cần Spring Retry hoặc Resilience4j):\n\n```java\n@Configuration @EnableResilientMethods\nclass ResilienceConfig {}\n\n@Retryable(maxAttempts = 3, delay = 200, multiplier = 2, includes = TimeoutException.class)\npublic Rate fetchRate(String pair) { ... }\n\n@ConcurrencyLimit(10)    // tối đa 10 lời gọi đồng thời, hữu ích với virtual threads\npublic Report generate() { ... }\n```\n\nCircuit breaker vẫn cần Resilience4j.\n\n**3. Null safety với JSpecify:** toàn bộ Spring dùng `@Nullable`/`@NonNull` của `org.jspecify`. IDE và NullAway phát hiện NPE lúc compile; Kotlin hiểu đúng kiểu nullable.\n\n**4. Chia nhỏ auto-configuration:** jar `spring-boot-autoconfigure` khổng lồ được tách thành các module nhỏ theo công nghệ, nên ứng dụng nhẹ hơn, khởi động nhanh hơn và native image nhỏ hơn.\n\n**5. Các điểm khác:**\n- **Jackson 3** là mặc định.\n- `BeanRegistrar`: đăng ký bean bằng code, thân thiện với AOT.\n- `RestTestClient` để test API.\n- `JmsClient`, HTTP service client groups.\n- Jakarta EE 11, Hibernate 7, Spring Security 7 (hỗ trợ MFA tốt hơn), JUnit 6.\n\n**6. Spring Boot 4.1 (06/2026):**\n- Tự cấu hình **gRPC** server và client.\n- Annotation **`@RedisListener`**, cấu hình sẵn listener container cho Redis pub/sub.\n- Đọc phần lớn **biến môi trường OpenTelemetry** chuẩn.\n- **Chống SSRF** cho HTTP client.\n- Khởi tạo JPA **bất đồng bộ** (`spring.jpa.bootstrap`) để giảm thời gian khởi động.\n- Lấy kết nối JDBC **lazy** (chỉ lấy khi thật sự cần).\n\n**Khi phỏng vấn:** chưa dùng Boot 4 ở production thì nói thật, rồi nêu 2–3 thay đổi bạn thấy có giá trị nhất (API versioning, `@Retryable` có sẵn, Jackson 3 cần chú ý khi nâng cấp). Như vậy cho thấy bạn theo dõi hệ sinh thái.\n\n### English\n\nSpring Framework 7 and Spring Boot 4 shipped in November 2025; Spring Boot 4.1 shipped in June 2026.\n\n**1. Built-in API versioning** (MVC and WebFlux). Previously you had to roll your own with URLs or headers.\n\n```java\n@RestController\n@RequestMapping(\"/api/orders\")\nclass OrderController {\n    @GetMapping(path = \"/{id}\", version = \"1\")   OrderV1 getV1(@PathVariable long id) { ... }\n    @GetMapping(path = \"/{id}\", version = \"2+\")  OrderV2 getV2(@PathVariable long id) { ... } // v2 and above\n}\n// application.yml: spring.mvc.apiversion.use.header: X-API-Version\n```\n\n- Four ways to read the version: path, header, query parameter, media type.\n- Validation of supported versions, plus a default version.\n- **RFC-standard deprecation headers** (`Deprecation`, `Sunset`) to tell clients an old version is going away.\n- RestClient, WebClient and HTTP interfaces add the version automatically when calling.\n\n**2. Resilience built into core** (previously Spring Retry or Resilience4j):\n\n```java\n@Configuration @EnableResilientMethods\nclass ResilienceConfig {}\n\n@Retryable(maxAttempts = 3, delay = 200, multiplier = 2, includes = TimeoutException.class)\npublic Rate fetchRate(String pair) { ... }\n\n@ConcurrencyLimit(10)    // at most 10 concurrent calls, useful with virtual threads\npublic Report generate() { ... }\n```\n\nCircuit breakers still need Resilience4j.\n\n**3. Null safety with JSpecify:** all of Spring uses `@Nullable`/`@NonNull` from `org.jspecify`. IDEs and NullAway catch NPEs at compile time, and Kotlin sees the correct nullable types.\n\n**4. Modularized auto-configuration:** the huge `spring-boot-autoconfigure` jar is split into small per-technology modules, so applications are lighter, start faster and produce smaller native images.\n\n**5. Other changes:**\n- **Jackson 3** is the default.\n- `BeanRegistrar`: programmatic, AOT-friendly bean registration.\n- `RestTestClient` for testing APIs.\n- `JmsClient` and HTTP service client groups.\n- Jakarta EE 11, Hibernate 7, Spring Security 7 (better MFA support), JUnit 6.\n\n**6. Spring Boot 4.1 (06/2026):**\n- **gRPC** server and client auto-configuration.\n- A **`@RedisListener`** annotation, with a preconfigured listener container for Redis pub/sub.\n- Reads most standard **OpenTelemetry environment variables**.\n- **SSRF protection** for HTTP clients.\n- **Asynchronous** JPA bootstrap (`spring.jpa.bootstrap`) to reduce startup time.\n- **Lazy** JDBC connection fetching (acquired only when actually needed).\n\n**In an interview:** if you haven't used Boot 4 in production, say so honestly, then name 2–3 changes you find most valuable (API versioning, built-in `@Retryable`, Jackson 3 as an upgrade risk). That shows you follow the ecosystem.", "excerpt": "Spring Framework 7 và Spring Boot 4 ra mắt tháng 11/2025; Spring Boot 4.1 ra mắt tháng 6/2026. 1. API versioning có sẵn (MVC và WebFlux). Trước đây phải tự làm bằng URL hoặc header. Hỗ trợ 4 cách đọc version: path, heade", "catLabel": "Spring: tính năng mới", "tip": "", "num": null}, {"id": "sn-startup", "title": "Làm sao để ứng dụng Spring khởi động nhanh và tốn ít bộ nhớ: GraalVM native, CDS hay AOT cache? / How do you make a Spring app start fast and use less memory: GraalVM native, CDS or the AOT cache?", "cat": "spring-new", "section": "Spring Boot 3", "kind": "qa", "tags": ["spring-boot", "graalvm", "performance", "kubernetes"], "body": "### Tiếng Việt\n\n**Vì sao quan trọng:** trong Kubernetes, khởi động chậm (10–30 giây) làm autoscale chậm, deploy lâu, và tốn tiền khi phải giữ nhiều pod dự phòng. Serverless càng cần khởi động nhanh.\n\n| Cách | Khởi động | Bộ nhớ | Đánh đổi |\n|---|---|---|---|\n| JVM bình thường | Chậm (vài giây đến vài chục giây) | Cao | Không phải làm gì; JIT cho throughput tốt khi chạy lâu |\n| **CDS** (Class Data Sharing, Boot 3.3+) | Nhanh hơn khoảng 30–40% | Giảm nhẹ | Cần một lần chạy huấn luyện khi build image; dễ áp dụng |\n| **AOT cache của JDK** (Project Leyden, Java 24–25+) | Nhanh hơn nhiều so với CDS | Giảm | Cần chạy huấn luyện (`-XX:AOTCacheOutput`); vẫn là JVM đầy đủ, **không đổi code** |\n| **GraalVM native image** | **Rất nhanh** (khoảng 0,05–0,2 giây) | **Thấp nhất** | Build lâu (vài phút) và tốn RAM khi build; reflection, proxy, resource phải khai báo (Spring AOT lo phần lớn); thư viện có thể chưa hỗ trợ; không có JIT nên throughput đỉnh khi chạy lâu có thể thấp hơn; debug khó hơn |\n| Bật lazy init, giảm bean | Nhanh hơn một chút | | Lỗi cấu hình chỉ lộ ra lúc request đầu tiên |\n\n**Spring AOT** (từ Boot 3): lúc build, Spring xử lý trước cấu hình bean và sinh code Java thay cho việc quét và reflection lúc chạy. Đây là điều kiện để làm native image, và cũng giúp JVM thường khởi động nhanh hơn.\n\n```bash\n# Native image bằng buildpacks\n./mvnw -Pnative spring-boot:build-image\n# hoặc biên dịch native trực tiếp\n./mvnw -Pnative native:compile\n```\n\n**Chọn cách nào:**\n- Service chạy lâu, tải cao, ổn định: **JVM + CDS hoặc AOT cache**. Giữ JIT, áp dụng ít rủi ro.\n- Function serverless, CLI, service scale-to-zero, hoặc cần mật độ pod rất cao: **native image**.\n- Luôn **đo** bằng số liệu thực (thời gian khởi động, RSS, p99 latency), đừng chọn theo cảm tính.\n\n**Câu trả lời mẫu:** *\"Với microservice chạy lâu trên Kubernetes, tôi giữ JVM và bật CDS hoặc AOT cache để khởi động nhanh hơn mà không đổi code. Native image tôi dành cho workload scale-to-zero, vì nó đổi throughput và thời gian build lấy thời gian khởi động.\"*\n\n### English\n\n**Why it matters:** in Kubernetes, slow startup (10–30 seconds) means slow autoscaling, long deployments and the cost of keeping spare pods. Serverless needs fast startup even more.\n\n| Approach | Startup | Memory | Trade-offs |\n|---|---|---|---|\n| Plain JVM | Slow (seconds to tens of seconds) | High | Nothing to do; the JIT gives good long-running throughput |\n| **CDS** (Class Data Sharing, Boot 3.3+) | About 30–40% faster | Slightly lower | Needs one training run when building the image; easy to adopt |\n| **The JDK AOT cache** (Project Leyden, Java 24–25+) | Much faster than CDS | Lower | Needs a training run (`-XX:AOTCacheOutput`); still a full JVM, **no code changes** |\n| **GraalVM native image** | **Very fast** (about 0.05–0.2 s) | **Lowest** | Slow builds (minutes) that need lots of RAM; reflection, proxies and resources must be declared (Spring AOT handles most of it); libraries may not support it; no JIT, so peak long-running throughput can be lower; harder to debug |\n| Lazy init, fewer beans | A bit faster | | Configuration errors only surface on the first request |\n\n**Spring AOT** (since Boot 3): at build time, Spring pre-processes the bean configuration and generates Java code instead of scanning and reflecting at runtime. It's a prerequisite for native images, and it also helps regular JVMs start faster.\n\n```bash\n# Native image with buildpacks\n./mvnw -Pnative spring-boot:build-image\n# or compile natively directly\n./mvnw -Pnative native:compile\n```\n\n**Which to pick:**\n- Long-running, high-load, steady services: **JVM + CDS or the AOT cache**. You keep the JIT, with low adoption risk.\n- Serverless functions, CLIs, scale-to-zero services, or very high pod density: **native image**.\n- Always **measure** with real numbers (startup time, RSS, p99 latency) rather than going by feel.\n\n**A model answer:** *\"For long-running microservices on Kubernetes I keep the JVM and enable CDS or the AOT cache to start faster without code changes. I reserve native images for scale-to-zero workloads, because they trade throughput and build time for startup time.\"*", "excerpt": "Vì sao quan trọng: trong Kubernetes, khởi động chậm (10–30 giây) làm autoscale chậm, deploy lâu, và tốn tiền khi phải giữ nhiều pod dự phòng. Serverless càng cần khởi động nhanh. Spring AOT (từ Boot 3): lúc build, Spring", "catLabel": "Spring: tính năng mới", "tip": "", "num": null}, {"id": "go-channels", "title": "Buffered vs unbuffered channels: how do they behave?", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "concurrency", "channel"], "body": "\"An unbuffered channel is a synchronization point: a send blocks until a receiver takes the value, so both goroutines meet. A buffered channel decouples them up to its capacity: sends block only when the buffer is full, receives only when it's empty.\n\nThe rules I keep in mind:\n\n- Sending to or receiving from a **nil** channel blocks forever.\n- Sending to a **closed** channel panics; receiving from it returns the zero value immediately, with `ok == false`.\n- Only the sender should close a channel, and only once.\n- `for v := range ch` ends when the channel is closed and drained.\n\nI use unbuffered channels when I want a handoff guarantee, and a small buffer to absorb bursts. A large buffer that hides a slow consumer is a smell: it only delays back-pressure.\"\n\nTham khảo thêm: [Golang: Worker Pool with Context Cancellation](https://minhnhat97kg.github.io/docsify/content/golang-buffered-unbuffered-channel/vi.md)", "excerpt": "\"An unbuffered channel is a synchronization point: a send blocks until a receiver takes the value, so both goroutines meet. A buffered channel decouples them up to its capacity: sends block only when the buffer is full, ", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-worker-pool", "title": "Implement a worker pool that stops cleanly on cancellation.", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "concurrency", "context", "coding"], "body": "Một job channel, N worker đọc bằng `range`, `WaitGroup` để chờ, và `select` trên `ctx.Done()` để dừng sớm. Đây là bài code Go hay gặp nhất.\n\n```go\nfunc Run(ctx context.Context, jobs []Job, workers int) []Result {\n    in := make(chan Job)\n    out := make(chan Result)\n    var wg sync.WaitGroup\n\n    for i := 0; i < workers; i++ {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n            for j := range in {\n                select {\n                case out <- process(ctx, j):\n                case <-ctx.Done():\n                    return\n                }\n            }\n        }()\n    }\n\n    go func() {\n        defer close(in)\n        for _, j := range jobs {\n            select {\n            case in <- j:\n            case <-ctx.Done():\n                return\n            }\n        }\n    }()\n\n    go func() { wg.Wait(); close(out) }()\n\n    var results []Result\n    for r := range out {\n        results = append(results, r)\n    }\n    return results\n}\n```\n\n\"The producer closes `in`, so workers' `range` loops end. A separate goroutine closes `out` after all workers finish, so the collector's loop ends. Every blocking send also selects on `ctx.Done()`, so nothing leaks on cancellation. In production I'd use `errgroup.WithContext` with `SetLimit`, which does the same with less code.\"\n\nTham khảo thêm: [Golang: Worker Pool with Context Cancellation](https://minhnhat97kg.github.io/docsify/content/golang-buffered-unbuffered-channel/vi.md)", "excerpt": "Một job channel, N worker đọc bằng range, WaitGroup để chờ, và select trên ctx.Done() để dừng sớm. Đây là bài code Go hay gặp nhất. \"The producer closes in, so workers' range loops end. A separate goroutine closes out af", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-context", "title": "How does the context package work?", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "context", "concurrency"], "body": "\"A `context.Context` carries a cancellation signal, a deadline and request-scoped values down a call tree. Cancelling a parent cancels all its children, never the other way round.\n\n- `WithCancel` for manual cancellation, `WithTimeout` for a relative duration, `WithDeadline` for an absolute time. Always `defer cancel()` to release resources.\n- A child can't outlive its parent: if the child's timeout is longer than the parent's, the parent's deadline wins.\n- `context.Background()` is the root for main and tests; `context.TODO()` marks code where I haven't decided which context to pass yet. They behave the same.\n\nRules: pass it as the first parameter named `ctx`, never store it in a struct, and use values only for request metadata such as trace IDs, not for optional parameters. Database drivers and HTTP clients take the context, so a request timeout really stops the query.\"\n\nTham khảo thêm: [Golang: Context Package](https://minhnhat97kg.github.io/docsify/content/golang-context-package/vi.md)", "excerpt": "\"A context.Context carries a cancellation signal, a deadline and request-scoped values down a call tree. Cancelling a parent cancels all its children, never the other way round. WithCancel for manual cancellation, WithTi", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-defer", "title": "defer, panic and recover: what are the traps?", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "error-handling"], "body": "\"Deferred calls run in LIFO order when the function returns, which is why closing resources in reverse order of opening works naturally.\n\nTwo traps:\n\n- **Arguments are evaluated when `defer` executes**, not when the deferred call runs. `defer fmt.Println(i)` prints the value at that moment; wrap it in a closure to see the final value.\n- **Named results can be modified by a deferred closure**, which is how you turn a recovered panic into a returned error.\n\n`panic` is for programmer errors and truly unrecoverable states. `recover` only works inside a deferred function in the same goroutine. I use it at boundaries, for example HTTP middleware that turns a panic into a 500 so one bad request doesn't crash the server. It's not a substitute for `if err != nil`: errors are values in Go, and hiding them behind panics makes control flow invisible. A panic in a goroutine you started isn't caught by the caller's recover.\"\n\nTham khảo thêm: [Golang: Defer, Panic, Recover](https://minhnhat97kg.github.io/docsify/content/golang-defer-panic-recover/vi.md)", "excerpt": "\"Deferred calls run in LIFO order when the function returns, which is why closing resources in reverse order of opening works naturally. Two traps: Arguments are evaluated when defer executes, not when the deferred call ", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-goroutine-leak", "title": "What is a goroutine leak and how do you find it?", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "concurrency", "memory-leak"], "body": "\"A goroutine that blocks forever and is never collected. Goroutines aren't garbage collected while blocked, so memory and goroutine count grow until the service degrades.\n\nCommon causes: sending on a channel nobody reads, for example after the caller timed out; reading from a channel nobody closes; a missing `ctx.Done()` case in a `select`; and HTTP response bodies that are never closed.\n\nFixes: give every blocking operation a way out through `select` on `ctx.Done()`; use a buffered channel of size 1 when a single result may be abandoned; make sure the owner closes channels.\n\nDetection: watch `runtime.NumGoroutine()` or the `go_goroutines` metric, take a goroutine profile with `pprof` to see where they're blocked, and use `go.uber.org/goleak` in tests to fail when a test leaves goroutines behind.\"\n\nTham khảo thêm: [Golang: Goroutine Leak](https://minhnhat97kg.github.io/docsify/content/golang-gorountine-leak/vi.md)", "excerpt": "\"A goroutine that blocks forever and is never collected. Goroutines aren't garbage collected while blocked, so memory and goroutine count grow until the service degrades. Common causes: sending on a channel nobody reads,", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-interface-nil", "title": "How are interfaces represented, and why can a nil error be non-nil?", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "internals", "interface"], "body": "\"An interface value is two words: a type pointer (the `itab`, or just the type for the empty interface) and a data pointer. It's nil only when **both** are nil.\n\nThe classic bug: a function returns `*MyError` that is nil, but its return type is `error`. The interface now holds type `*MyError` and a nil data pointer, so `err != nil` is true and the caller treats success as failure.\n\n```go\nfunc find() error {\n    var e *MyError = nil\n    return e // non-nil interface!\n}\n```\n\nThe fix is to return a literal `nil` on success, and to declare return types as `error`, never as concrete error pointers. Same idea: `var i interface{} = (*int)(nil)` gives `i == nil` false.\"\n\nTham khảo thêm: [Golang - Interface Internals](https://minhnhat97kg.github.io/docsify/content/golang-interface/vi.md)", "excerpt": "\"An interface value is two words: a type pointer (the itab, or just the type for the empty interface) and a data pointer. It's nil only when both are nil. The classic bug: a function returns MyError that is nil, but its ", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-map", "title": "How does a Go map work, and how do you make it concurrency-safe?", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "internals", "map", "concurrency"], "body": "\"A map is a hash table of buckets, each holding up to 8 key-value pairs, with overflow buckets on collision. When the load factor gets too high it grows by doubling and evacuates entries incrementally during later writes, so no single write pays the full cost. Since Go 1.24 the runtime uses a Swiss-table design, but the behaviour you observe is the same. Iteration order is deliberately randomized.\n\nMaps are not safe for concurrent writes, and the runtime crashes with 'concurrent map writes' rather than corrupting data silently. That was a deliberate choice to keep the common single-goroutine case fast.\n\nOptions: a plain map with `sync.RWMutex`, which I use in most cases; `sync.Map`, which is optimized for keys written once and read many times, or for goroutines touching disjoint keys; or sharding the map across several mutexes for heavy contention. The Java equivalent of the first option is `Collections.synchronizedMap`, and of the last is `ConcurrentHashMap`.\"\n\nTham khảo thêm: [Golang - Map Internals & Thread Safety](https://minhnhat97kg.github.io/docsify/content/golang-map-internals-thread-safety/vi.md)", "excerpt": "\"A map is a hash table of buckets, each holding up to 8 key-value pairs, with overflow buckets on collision. When the load factor gets too high it grows by doubling and evacuates entries incrementally during later writes", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-slices", "title": "Explain slice internals and the append gotcha.", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "internals", "slice"], "body": "\"A slice is a header of three fields: a pointer to an underlying array, a length and a capacity. Slicing creates a new header over the same array, so two slices can share memory.\n\n`append` writes in place if there's capacity, otherwise it allocates a bigger array and copies. The gotcha: appending to a sub-slice that still has spare capacity overwrites elements of the original slice.\n\n```go\na := []int{1, 2, 3, 4}\nb := a[:2]\nb = append(b, 99) // a is now [1 2 99 4]\n```\n\nFixes: use a full slice expression `a[:2:2]` to cap the capacity, or `copy` into a new slice. Another trap is holding a small slice of a huge array, which keeps the whole array alive; copy what you need. When I know the final size, I preallocate with `make([]T, 0, n)` to avoid repeated growth.\"\n\nTham khảo thêm: [Golang - Slices Internals](https://minhnhat97kg.github.io/docsify/content/golang-slices/vi.md)", "excerpt": "\"A slice is a header of three fields: a pointer to an underlying array, a length and a capacity. Slicing creates a new header over the same array, so two slices can share memory. append writes in place if there's capacit", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-stack-heap", "title": "Stack vs heap in Go: what is escape analysis?", "cat": "go", "section": "Go runtime", "kind": "qa", "tags": ["go", "internals", "memory", "performance"], "body": "\"The compiler decides where each value lives. If it can prove a value doesn't outlive the function, it goes on the goroutine's stack, which is cheap to allocate and freed automatically. Otherwise it 'escapes' to the heap and the garbage collector must manage it.\n\nTypical reasons to escape: returning a pointer to a local variable, storing it in an interface, capturing it in a closure that outlives the call, or a size unknown at compile time.\n\nI check with `go build -gcflags='-m'`. In hot paths, fewer heap allocations means less GC work, so I preallocate, reuse buffers with `sync.Pool`, and avoid needless pointers. But I only optimize after a benchmark with `-benchmem` or a profile shows allocations matter. Goroutine stacks start small, around 2 KB, and grow by copying, which is why goroutines are cheap.\"\n\nTham khảo thêm: [Golang - Stack & Heap](https://minhnhat97kg.github.io/docsify/content/golang-stack-heap/vi.md)", "excerpt": "\"The compiler decides where each value lives. If it can prove a value doesn't outlive the function, it goes on the goroutine's stack, which is cheap to allocate and freed automatically. Otherwise it 'escapes' to the heap", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-gc", "title": "How does Go's garbage collector work, compared with the JVM?", "cat": "go", "section": "Go runtime", "kind": "qa", "tags": ["go", "gc", "performance", "jvm"], "body": "\"Go uses a concurrent, non-generational, non-compacting tri-color mark-and-sweep collector. Most marking runs alongside the program with a write barrier, and stop-the-world pauses are typically well under a millisecond.\n\nTuning has two main knobs: `GOGC`, default 100, which triggers a cycle when the heap grows by that percentage over the live heap; and `GOMEMLIMIT`, a soft memory cap that makes the GC work harder as the process approaches the limit, useful in containers.\n\nCompared with the JVM: Java's collectors such as G1 and ZGC are generational and can compact, which suits allocation-heavy workloads, but have many tuning options. Go trades raw throughput for low latency and simplicity, and relies on escape analysis to keep many values off the heap. In both, the best GC tuning is allocating less.\"\n\nTham khảo thêm: [Golang - Garbage Collector](https://minhnhat97kg.github.io/docsify/content/golang-gc/vi.md)", "excerpt": "\"Go uses a concurrent, non-generational, non-compacting tri-color mark-and-sweep collector. Most marking runs alongside the program with a write barrier, and stop-the-world pauses are typically well under a millisecond. ", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-sync", "title": "Mutex vs RWMutex vs atomic: when do you use each?", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "concurrency", "mutex", "atomic"], "body": "\"`sync/atomic` for a single word: counters, flags, or swapping a pointer to an immutable config. It's lock-free and fastest, but can't protect an invariant that spans several fields.\n\n`sync.Mutex` for any critical section that touches several fields or does compound read-modify-write. Keep the section short and never do I/O while holding it.\n\n`sync.RWMutex` when reads greatly outnumber writes and the read section isn't tiny; for very short sections, its extra bookkeeping can make it slower than a plain mutex.\n\nExample: a balance update that checks and then subtracts must be one critical section, or a single atomic compare-and-swap loop; two separate atomic operations still race. And the Go proverb applies: often it's cleaner to give one goroutine ownership of the state and communicate with it through channels.\"\n\nTham khảo thêm: [Golang - Mutex vs Atomic vs RWMutex](https://minhnhat97kg.github.io/docsify/content/golang-mutex-vs-atomic-vs-rwmutex/vi.md)", "excerpt": "\"sync/atomic for a single word: counters, flags, or swapping a pointer to an immutable config. It's lock-free and fastest, but can't protect an invariant that spans several fields. sync.Mutex for any critical section tha", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-race", "title": "Race condition vs data race: how do you detect and fix them?", "cat": "go", "section": "Go concurrency", "kind": "qa", "tags": ["go", "concurrency", "race-condition"], "body": "\"A **data race** is two goroutines accessing the same memory at the same time, at least one writing, without synchronization; the result is undefined. A **race condition** is a logic bug where the outcome depends on timing, even if every access is synchronized, for example check-then-act: read the balance, decide, then write.\n\nClassic example: two withdrawals both read 100, both subtract 80, and both write 20: a lost update.\n\nDetection: run tests and staging builds with `go test -race`, which instruments memory access and reports data races with stack traces. It only catches races that actually happen during the run, so tests need concurrency.\n\nFixes: protect the whole check-and-act with a mutex, use atomic compare-and-swap, or push the check into the database with a conditional `UPDATE ... WHERE balance >= amount` or a row lock, because in a multi-instance service an in-process lock isn't enough.\"\n\nTham khảo thêm: [Concurrency: Race Condition](https://minhnhat97kg.github.io/docsify/content/golang-race-condition/vi.md)", "excerpt": "\"A data race is two goroutines accessing the same memory at the same time, at least one writing, without synchronization; the result is undefined. A race condition is a logic bug where the outcome depends on timing, even", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-money", "title": "How do you handle money in code and in the database?", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "money", "fintech", "precision", "database"], "body": "\"Never use floating point: 0.1 + 0.2 isn't 0.3 in binary.\n\nTwo safe options: store integers in the smallest unit, such as cents or đồng, which is fast and exact; or use a decimal type, `shopspring/decimal` in Go or `BigDecimal` in Java, created from strings, never from floats. In PostgreSQL I use `NUMERIC(19,4)` or `BIGINT` for minor units, and I store the currency code next to the amount.\n\nRounding rules matter: I round once at the end, use the rounding mode the business specifies, often banker's rounding (half-even) to avoid systematic bias, and multiply before dividing.\n\nSplitting is the classic follow-up: dividing 100 among three people gives 33.33 three times and loses a cent. The fix is to allocate the remainder deterministically, so one person gets 33.34 and the total is exact.\"\n\nTham khảo thêm: [Golang - Money Handling & Precision](https://minhnhat97kg.github.io/docsify/content/golang-money-handling-precision/vi.md)", "excerpt": "\"Never use floating point: 0.1 + 0.2 isn't 0.3 in binary. Two safe options: store integers in the smallest unit, such as cents or đồng, which is fast and exact; or use a decimal type, shopspring/decimal in Go or BigDecim", "catLabel": "Go", "tip": "", "num": null}, {"id": "go-design", "title": "How do SOLID and interfaces look in idiomatic Go?", "cat": "go", "section": "Go language", "kind": "qa", "tags": ["go", "solid", "design", "interface"], "body": "\"Go has no classes or inheritance, so SOLID shows up through small packages and implicit interfaces.\n\n- **Accept interfaces, return structs:** the consumer defines the small interface it needs, such as `type UserStore interface { Get(ctx, id) (User, error) }`, next to where it's used. The producer returns a concrete type. This keeps interfaces small (interface segregation) and lets tests pass fakes (dependency inversion).\n- **Embedding isn't inheritance:** it's composition with method promotion. There's no polymorphism through the embedded type, and the outer type isn't a subtype of it.\n- **Single responsibility:** avoid `utils` and `common` packages; name packages for what they provide.\n- **Open/closed:** add a new payment method by implementing an interface, not by extending a `switch`.\n\nWiring happens explicitly in `main`; most Go teams avoid DI frameworks.\"\n\nTham khảo thêm: [Golang - SOLID Design Principles](https://minhnhat97kg.github.io/docsify/content/golang-solid-design-principles/vi.md)", "excerpt": "\"Go has no classes or inheritance, so SOLID shows up through small packages and implicit interfaces. Accept interfaces, return structs: the consumer defines the small interface it needs, such as type UserStore interface ", "catLabel": "Go", "tip": "", "num": null}, {"id": "database-11", "title": "How do indexes work, and when does an index not get used?", "cat": "data", "section": "Database", "tags": ["database"], "body": "\"Most are B+ trees, which keep keys sorted, so they serve equality, range and prefix lookups in O(log n). A composite index follows the leftmost-prefix rule. An index is skipped when I apply a function or implicit type conversion to the column, use a leading wildcard in `LIKE`, when selectivity is low, or when the leading column isn't in the predicate. Indexes cost write time and storage, so I add them based on real queries.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"Most are B+ trees, which keep keys sorted, so they serve equality, range and prefix lookups in O(log n). A composite index follows the leftmost-prefix rule. An index is skipped when I apply a function or implicit type c", "catLabel": "Spring & JPA"}, {"id": "database-12", "title": "What is a covering index? Clustered vs non-clustered?", "cat": "data", "section": "Database", "tags": ["database"], "body": "\"A covering index contains every column the query needs, so the engine doesn't read the table row. In InnoDB the primary key is the clustered index and the rows live in it; secondary indexes store the primary key and need a second lookup unless they cover the query.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"A covering index contains every column the query needs, so the engine doesn't read the table row. In InnoDB the primary key is the clustered index and the rows live in it; secondary indexes store the primary key and nee", "catLabel": "Spring & JPA"}, {"id": "database-13", "title": "A query is slow in production. What do you do?", "cat": "data", "section": "Database", "tags": ["database"], "body": "\"I find it in the slow query log or APM, run `EXPLAIN ANALYZE`, and look for full scans, wrong join order, filesort or temporary tables. Then I fix the cause: add or adjust an index, rewrite the query, fetch fewer columns, or paginate with keyset pagination instead of a large `OFFSET`. I verify with the plan and with production-like data volume. At \\[công ty\\] I reduced \\[query\\] from \\[X\\] to \\[Y\\].\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"I find it in the slow query log or APM, run EXPLAIN ANALYZE, and look for full scans, wrong join order, filesort or temporary tables. Then I fix the cause: add or adjust an index, rewrite the query, fetch fewer columns,", "catLabel": "Spring & JPA"}, {"id": "database-14", "title": "Optimistic vs pessimistic locking?", "cat": "data", "section": "Database", "tags": ["database"], "body": "\"Optimistic locking uses a version column: the update succeeds only if the version is unchanged, otherwise I retry or report a conflict. It suits low contention. Pessimistic locking uses `SELECT ... FOR UPDATE` to block others; it suits high contention on the same rows, such as balance updates, but needs short transactions and consistent lock order to avoid deadlocks.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"Optimistic locking uses a version column: the update succeeds only if the version is unchanged, otherwise I retry or report a conflict. It suits low contention. Pessimistic locking uses SELECT ... FOR UPDATE to block ot", "catLabel": "Spring & JPA"}, {"id": "database-15", "title": "What is ACID? When would you choose NoSQL?", "cat": "data", "section": "Database", "tags": ["database"], "body": "\"Atomicity, consistency, isolation, durability. I default to a relational database for transactional data with relationships. I'd choose a document or key-value store for flexible schemas, very high write volume or simple access by key, and Redis for caching, rate limiting and short-lived data.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"Atomicity, consistency, isolation, durability. I default to a relational database for transactional data with relationships. I'd choose a document or key-value store for flexible schemas, very high write volume or simpl", "catLabel": "Spring & JPA"}, {"id": "sql-7", "title": "Find the second highest salary.", "cat": "data", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);\n```\n\n\"It returns NULL when there is no second value. For the Nth highest I'd use `DENSE_RANK()`.\"", "kind": "qa", "num": 7, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"It returns NULL when there is no second value. For the Nth highest I'd use DENSERANK().\"", "catLabel": "Coding & DSA"}, {"id": "sql-8", "title": "Find the top 3 salaries in each department.", "cat": "data", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT department_id, name, salary\nFROM (\n    SELECT e.*,\n           DENSE_RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS rnk\n    FROM employees e\n) ranked\nWHERE rnk <= 3;\n```\n\n\"`ROW_NUMBER` gives exactly three rows per department; `RANK` leaves gaps after ties; `DENSE_RANK` doesn't.\"", "kind": "qa", "num": 8, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"ROWNUMBER gives exactly three rows per department; RANK leaves gaps after ties; DENSERANK doesn't.\"", "catLabel": "Coding & DSA"}, {"id": "sql-9", "title": "Find duplicate emails, and customers who have never placed an order.", "cat": "data", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT email, COUNT(*) AS cnt\nFROM users\nGROUP BY email\nHAVING COUNT(*) > 1;\n\nSELECT c.id, c.name\nFROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```", "kind": "qa", "num": 9, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "", "catLabel": "Coding & DSA"}, {"id": "sql-10", "title": "WHERE vs HAVING? INNER vs LEFT JOIN? UNION vs UNION ALL?", "cat": "data", "section": "SQL", "tags": ["sql"], "body": "\"`WHERE` filters rows before grouping; `HAVING` filters groups after aggregation. An inner join returns only matching rows; a left join keeps every row from the left table with NULLs where there is no match. `UNION` removes duplicates, which costs a sort or hash; `UNION ALL` keeps them and is faster.\"", "kind": "qa", "num": 10, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"WHERE filters rows before grouping; HAVING filters groups after aggregation. An inner join returns only matching rows; a left join keeps every row from the left table with NULLs where there is no match. UNION removes du", "catLabel": "Coding & DSA"}, {"id": "sql-joins", "title": "Các loại JOIN trong SQL khác nhau thế nào? / What are the types of SQL JOIN and how do they differ?", "cat": "data", "section": "SQL", "kind": "qa", "tags": ["sql", "join"], "body": "### Tiếng Việt\n\nGiả sử có bảng `customers(id, name)` và `orders(id, customer_id, amount)`.\n\n| JOIN | Trả về | Ví dụ dùng |\n|---|---|---|\n| **INNER JOIN** | Chỉ các dòng **khớp ở cả hai bảng** | Đơn hàng kèm tên khách |\n| **LEFT JOIN** | **Mọi dòng bảng trái**, bảng phải không khớp thì là `NULL` | Mọi khách hàng, kể cả chưa có đơn |\n| **RIGHT JOIN** | Ngược lại của LEFT | Hiếm dùng, thường viết lại thành LEFT |\n| **FULL OUTER JOIN** | Mọi dòng của cả hai bảng | Đối soát hai nguồn dữ liệu. **MySQL không hỗ trợ**: dùng LEFT JOIN UNION RIGHT JOIN |\n| **CROSS JOIN** | Tích Descartes: mọi tổ hợp | Sinh lịch (mọi ngày × mọi nhân viên) |\n| **SELF JOIN** | Bảng join với chính nó | Nhân viên và quản lý trong cùng bảng `employees` |\n\n```sql\n-- Khách chưa từng đặt hàng (anti-join), cách 1:\nSELECT c.* FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;\n\n-- Cách 2, thường rõ nghĩa hơn:\nSELECT c.* FROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```\n\n**Bẫy hay gặp:** điều kiện trên bảng phải đặt ở `WHERE` sẽ **biến LEFT JOIN thành INNER JOIN**:\n\n```sql\n-- SAI: khách không có đơn bị loại, vì o.amount là NULL\nSELECT c.name, o.amount FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.amount > 100;\n\n-- ĐÚNG: đưa điều kiện vào ON\nSELECT c.name, o.amount FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id AND o.amount > 100;\n```\n\n**Hiệu năng:** database chọn thuật toán join (nested loop, hash join, merge join) theo kích thước bảng và index. Cột dùng để join (`orders.customer_id`) nên có **index**. Kiểm tra bằng `EXPLAIN`.\n\n### English\n\nAssume tables `customers(id, name)` and `orders(id, customer_id, amount)`.\n\n| JOIN | Returns | Example use |\n|---|---|---|\n| **INNER JOIN** | Only rows that **match in both tables** | Orders with the customer's name |\n| **LEFT JOIN** | **Every row of the left table**, `NULL` where the right side doesn't match | Every customer, including those without orders |\n| **RIGHT JOIN** | The mirror of LEFT | Rarely used, usually rewritten as LEFT |\n| **FULL OUTER JOIN** | Every row of both tables | Reconciling two data sources. **MySQL doesn't support it**: use LEFT JOIN UNION RIGHT JOIN |\n| **CROSS JOIN** | Cartesian product: every combination | Generating a schedule (every day × every employee) |\n| **SELF JOIN** | A table joined with itself | Employees and their managers in one `employees` table |\n\n```sql\n-- Customers who never ordered (an anti-join), option 1:\nSELECT c.* FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;\n\n-- Option 2, often clearer:\nSELECT c.* FROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```\n\n**A common trap:** a condition on the right-hand table placed in `WHERE` **turns a LEFT JOIN into an INNER JOIN**:\n\n```sql\n-- WRONG: customers without orders are dropped, because o.amount is NULL\nSELECT c.name, o.amount FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.amount > 100;\n\n-- RIGHT: move the condition into ON\nSELECT c.name, o.amount FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id AND o.amount > 100;\n```\n\n**Performance:** the database picks a join algorithm (nested loop, hash join, merge join) based on table sizes and indexes. Join columns (`orders.customer_id`) should be **indexed**. Check with `EXPLAIN`.", "excerpt": "Giả sử có bảng customers(id, name) và orders(id, customerid, amount). Bẫy hay gặp: điều kiện trên bảng phải đặt ở WHERE sẽ biến LEFT JOIN thành INNER JOIN: Hiệu năng: database chọn thuật toán join (nested loop, hash join", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "sql-normalization", "title": "Chuẩn hóa dữ liệu (1NF, 2NF, 3NF) là gì? Khi nào nên phi chuẩn hóa? / What is normalization (1NF, 2NF, 3NF), and when should you denormalize?", "cat": "data", "section": "SQL", "kind": "qa", "tags": ["sql", "database-design"], "body": "### Tiếng Việt\n\n**Mục tiêu của chuẩn hóa:** mỗi thông tin chỉ lưu **một chỗ**, để tránh dư thừa và tránh dữ liệu mâu thuẫn khi cập nhật.\n\n| Dạng | Quy tắc | Vi phạm ví dụ | Sửa |\n|---|---|---|---|\n| **1NF** | Mỗi ô chứa **giá trị đơn**, không có nhóm lặp | Cột `phones = \"090..., 091...\"` | Tách bảng `customer_phones` |\n| **2NF** | 1NF, và mọi cột phụ thuộc vào **toàn bộ** khóa chính (với khóa ghép) | `order_items(order_id, product_id, product_name)`: `product_name` chỉ phụ thuộc `product_id` | Đưa `product_name` sang bảng `products` |\n| **3NF** | 2NF, và **không phụ thuộc bắc cầu** (cột không khóa phụ thuộc cột không khóa khác) | `employees(id, dept_id, dept_name)`: `dept_name` phụ thuộc `dept_id` | Tách bảng `departments` |\n| BCNF | Mọi phụ thuộc hàm đều có vế trái là khóa ứng viên | Hiếm gặp khi phỏng vấn | |\n\nThực tế hầu hết thiết kế OLTP dừng ở **3NF**.\n\n**Phi chuẩn hóa (denormalization):** cố ý lưu trùng dữ liệu để **đọc nhanh hơn**, đổi lại việc ghi phức tạp hơn.\n\nVí dụ hợp lý:\n- Lưu `total_amount` trong `orders` thay vì cộng `order_items` mỗi lần đọc.\n- Lưu **giá tại thời điểm mua** (`unit_price`) trong `order_items`. Đây thực ra là dữ liệu lịch sử, không phải trùng lặp: giá sản phẩm sau này đổi thì đơn cũ vẫn phải giữ giá cũ.\n- Bảng báo cáo hoặc read model (CQRS), materialized view, document trong NoSQL.\n\n**Cách giữ dữ liệu phi chuẩn hóa đúng:** cập nhật trong cùng transaction, dùng trigger, hoặc cập nhật bất đồng bộ qua sự kiện (chấp nhận eventual consistency).\n\n**Câu trả lời mẫu:** *\"Tôi thiết kế ở 3NF cho dữ liệu giao dịch, rồi phi chuẩn hóa có chủ đích ở chỗ đã đo được truy vấn đọc là điểm nghẽn.\"*\n\n### English\n\n**The goal of normalization:** store each fact in **one place**, to avoid redundancy and inconsistent data on updates.\n\n| Form | Rule | Violation example | Fix |\n|---|---|---|---|\n| **1NF** | Each cell holds a **single value**, no repeating groups | A column `phones = \"090..., 091...\"` | Split into a `customer_phones` table |\n| **2NF** | 1NF, and every column depends on the **whole** primary key (for composite keys) | `order_items(order_id, product_id, product_name)`: `product_name` depends only on `product_id` | Move `product_name` to a `products` table |\n| **3NF** | 2NF, and **no transitive dependencies** (a non-key column depending on another non-key column) | `employees(id, dept_id, dept_name)`: `dept_name` depends on `dept_id` | Split out a `departments` table |\n| BCNF | Every functional dependency's left side is a candidate key | Rare in interviews | |\n\nIn practice most OLTP designs stop at **3NF**.\n\n**Denormalization:** deliberately storing duplicate data to **read faster**, at the cost of more complex writes.\n\nReasonable examples:\n- Storing `total_amount` on `orders` instead of summing `order_items` on every read.\n- Storing the **price at purchase time** (`unit_price`) in `order_items`. That's really historical data, not duplication: if the product price changes later, old orders must keep the old price.\n- Reporting tables or read models (CQRS), materialized views, documents in NoSQL.\n\n**How to keep denormalized data correct:** update it in the same transaction, use triggers, or update it asynchronously through events (accepting eventual consistency).\n\n**A model answer:** *\"I design transactional data in 3NF, then denormalize deliberately where I've measured that read queries are the bottleneck.\"*", "excerpt": "Mục tiêu của chuẩn hóa: mỗi thông tin chỉ lưu một chỗ, để tránh dư thừa và tránh dữ liệu mâu thuẫn khi cập nhật. Thực tế hầu hết thiết kế OLTP dừng ở 3NF. Phi chuẩn hóa (denormalization): cố ý lưu trùng dữ liệu để đọc nh", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "sql-window", "title": "Window function là gì? Cho ví dụ ROW_NUMBER, RANK, LAG, tổng lũy kế. / What are window functions? Give examples of ROW_NUMBER, RANK, LAG and running totals.", "cat": "data", "section": "SQL", "kind": "qa", "tags": ["sql", "window-function"], "body": "### Tiếng Việt\n\n**Window function** tính toán trên một \"cửa sổ\" các dòng liên quan, nhưng **không gộp dòng** như `GROUP BY`: mỗi dòng vẫn giữ nguyên và có thêm một cột kết quả.\n\nCú pháp: `hàm() OVER (PARTITION BY ... ORDER BY ... [khung])`\n- `PARTITION BY`: chia nhóm (giống GROUP BY nhưng không gộp).\n- `ORDER BY`: thứ tự trong mỗi nhóm.\n\n**Xếp hạng, với bảng lương mẫu 100, 90, 90, 80:**\n\n| Hàm | Kết quả | Đặc điểm |\n|---|---|---|\n| `ROW_NUMBER()` | 1, 2, 3, 4 | Luôn khác nhau, bằng nhau thì thứ tự tùy ý |\n| `RANK()` | 1, 2, 2, **4** | Bằng nhau cùng hạng, **bỏ số** sau đó |\n| `DENSE_RANK()` | 1, 2, 2, **3** | Bằng nhau cùng hạng, **không bỏ số** |\n\n```sql\n-- Top 3 lương mỗi phòng ban\nSELECT * FROM (\n  SELECT e.*, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk\n  FROM employees e\n) t WHERE rnk <= 3;\n\n-- Đơn hàng mới nhất của mỗi khách (lấy đúng 1 dòng)\nSELECT * FROM (\n  SELECT o.*, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) AS rn\n  FROM orders o\n) t WHERE rn = 1;\n\n-- So với tháng trước: LAG lấy giá trị dòng trước, LEAD lấy dòng sau\nSELECT month, revenue,\n       revenue - LAG(revenue) OVER (ORDER BY month) AS change\nFROM monthly_revenue;\n\n-- Tổng lũy kế số dư theo thời gian, cho từng tài khoản\nSELECT account_id, created_at, amount,\n       SUM(amount) OVER (PARTITION BY account_id ORDER BY created_at\n                         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_balance\nFROM transactions;\n\n-- Trung bình trượt 7 ngày\nAVG(amount) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)\n```\n\n**Lưu ý:** không lọc trực tiếp kết quả window function trong `WHERE` được, vì WHERE chạy trước. Phải bọc bằng subquery hoặc CTE như ví dụ trên. MySQL hỗ trợ window function từ phiên bản 8.0.\n\n### English\n\nA **window function** computes over a \"window\" of related rows but **doesn't collapse rows** like `GROUP BY`: every row stays and gets an extra result column.\n\nSyntax: `function() OVER (PARTITION BY ... ORDER BY ... [frame])`\n- `PARTITION BY`: splits rows into groups (like GROUP BY without collapsing).\n- `ORDER BY`: the order within each group.\n\n**Ranking, with sample salaries 100, 90, 90, 80:**\n\n| Function | Result | Behaviour |\n|---|---|---|\n| `ROW_NUMBER()` | 1, 2, 3, 4 | Always distinct; ties are ordered arbitrarily |\n| `RANK()` | 1, 2, 2, **4** | Ties share a rank, **numbers are skipped** afterwards |\n| `DENSE_RANK()` | 1, 2, 2, **3** | Ties share a rank, **no gaps** |\n\n```sql\n-- Top 3 salaries per department\nSELECT * FROM (\n  SELECT e.*, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk\n  FROM employees e\n) t WHERE rnk <= 3;\n\n-- Each customer's latest order (exactly one row)\nSELECT * FROM (\n  SELECT o.*, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) AS rn\n  FROM orders o\n) t WHERE rn = 1;\n\n-- Month-over-month change: LAG reads the previous row, LEAD the next one\nSELECT month, revenue,\n       revenue - LAG(revenue) OVER (ORDER BY month) AS change\nFROM monthly_revenue;\n\n-- Running balance over time, per account\nSELECT account_id, created_at, amount,\n       SUM(amount) OVER (PARTITION BY account_id ORDER BY created_at\n                         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_balance\nFROM transactions;\n\n-- 7-day moving average\nAVG(amount) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)\n```\n\n**Note:** you can't filter on a window function's result directly in `WHERE`, because WHERE runs first. Wrap it in a subquery or CTE as above. MySQL supports window functions from version 8.0.", "excerpt": "Window function tính toán trên một \"cửa sổ\" các dòng liên quan, nhưng không gộp dòng như GROUP BY: mỗi dòng vẫn giữ nguyên và có thêm một cột kết quả. Cú pháp: hàm() OVER (PARTITION BY ... ORDER BY ... khung) PARTITION B", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "nosql-types", "title": "Có những loại NoSQL nào? Khi nào chọn SQL, khi nào chọn NoSQL? / What types of NoSQL databases are there, and when do you choose SQL vs NoSQL?", "cat": "data", "section": "NoSQL", "kind": "qa", "tags": ["nosql", "database-design"], "body": "### Tiếng Việt\n\n| Loại | Ví dụ | Mô hình dữ liệu | Hợp với |\n|---|---|---|---|\n| **Key-value** | Redis, DynamoDB | Key → giá trị | Cache, session, rate limit, truy cập theo khóa cực nhanh |\n| **Document** | MongoDB, Couchbase | Document JSON lồng nhau | Dữ liệu có cấu trúc linh hoạt: catalog sản phẩm, profile, CMS |\n| **Wide-column** | Cassandra, ScyllaDB, HBase | Partition key + nhiều cột, sắp xếp theo clustering key | Ghi cực nhiều, dữ liệu theo thời gian: log, sự kiện, IoT, tin nhắn |\n| **Graph** | Neo4j, Amazon Neptune | Node và cạnh | Quan hệ nhiều tầng: mạng xã hội, gợi ý, phát hiện gian lận |\n| **Search** | Elasticsearch, OpenSearch | Inverted index | Tìm kiếm full-text, lọc nhiều tiêu chí, log analytics |\n| **Time-series** | InfluxDB, TimescaleDB, Prometheus | Điểm dữ liệu theo thời gian | Metrics, dữ liệu cảm biến |\n\n**SQL hay NoSQL:**\n\n| Chọn **SQL** (PostgreSQL, MySQL) khi | Chọn **NoSQL** khi |\n|---|---|\n| Dữ liệu **có quan hệ**, cần JOIN | Truy cập chủ yếu theo **một khóa**, không cần JOIN |\n| Cần **ACID nhiều bảng**: tiền, đơn hàng, tồn kho | Cần **scale ghi ngang** vượt khả năng một máy |\n| Truy vấn đa dạng, chưa biết trước | **Mẫu truy vấn biết trước**, ổn định |\n| Ràng buộc dữ liệu chặt (khóa ngoại, unique) | Schema thay đổi thường xuyên |\n| Báo cáo, aggregate phức tạp | Độ trễ rất thấp ở quy mô rất lớn |\n\n**Thực tế thường kết hợp (polyglot persistence):** PostgreSQL làm nguồn sự thật, Redis làm cache, Elasticsearch để tìm kiếm, Cassandra hoặc ClickHouse cho sự kiện khối lượng lớn. Dữ liệu đồng bộ giữa chúng qua sự kiện hoặc CDC.\n\n**Lưu ý:** ranh giới đã mờ đi. PostgreSQL có JSONB và full-text search; MongoDB có transaction nhiều document từ bản 4.0. Mặc định chọn PostgreSQL, chỉ chọn NoSQL khi có lý do cụ thể.\n\n### English\n\n| Type | Examples | Data model | Fits |\n|---|---|---|---|\n| **Key-value** | Redis, DynamoDB | Key → value | Caches, sessions, rate limiting, very fast lookups by key |\n| **Document** | MongoDB, Couchbase | Nested JSON documents | Flexible structures: product catalogs, profiles, CMS |\n| **Wide-column** | Cassandra, ScyllaDB, HBase | Partition key + many columns, sorted by clustering key | Very write-heavy, time-ordered data: logs, events, IoT, messages |\n| **Graph** | Neo4j, Amazon Neptune | Nodes and edges | Multi-hop relationships: social networks, recommendations, fraud detection |\n| **Search** | Elasticsearch, OpenSearch | Inverted index | Full-text search, multi-criteria filtering, log analytics |\n| **Time-series** | InfluxDB, TimescaleDB, Prometheus | Timestamped data points | Metrics, sensor data |\n\n**SQL or NoSQL:**\n\n| Choose **SQL** (PostgreSQL, MySQL) when | Choose **NoSQL** when |\n|---|---|\n| Data is **relational** and needs JOINs | Access is mostly by **one key**, no JOINs |\n| You need **multi-table ACID**: money, orders, stock | You need to **scale writes horizontally** beyond one machine |\n| Queries are varied and not known in advance | **Query patterns are known** and stable |\n| Strict constraints (foreign keys, unique) | The schema changes often |\n| Reporting, complex aggregates | Very low latency at very large scale |\n\n**In practice they're combined (polyglot persistence):** PostgreSQL as the source of truth, Redis as a cache, Elasticsearch for search, Cassandra or ClickHouse for high-volume events. Data is synchronized between them through events or CDC.\n\n**Note:** the lines have blurred. PostgreSQL has JSONB and full-text search; MongoDB has multi-document transactions since 4.0. Default to PostgreSQL and choose NoSQL only for a concrete reason.", "excerpt": "SQL hay NoSQL: Thực tế thường kết hợp (polyglot persistence): PostgreSQL làm nguồn sự thật, Redis làm cache, Elasticsearch để tìm kiếm, Cassandra hoặc ClickHouse cho sự kiện khối lượng lớn. Dữ liệu đồng bộ giữa chúng qua", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "nosql-mongodb", "title": "Thiết kế dữ liệu trong MongoDB thế nào: embed hay reference? / How do you model data in MongoDB: embed or reference?", "cat": "data", "section": "NoSQL", "kind": "qa", "tags": ["nosql", "mongodb"], "body": "### Tiếng Việt\n\n**Nguyên tắc:** thiết kế theo **cách ứng dụng đọc dữ liệu**, không theo chuẩn hóa. Dữ liệu được đọc cùng nhau thì nên lưu cùng nhau.\n\n**Embed (lồng vào nhau) khi:**\n- Quan hệ **một-ít** (1–vài chục) và luôn đọc cùng nhau: địa chỉ của khách, các dòng trong một đơn hàng.\n- Dữ liệu con **không có ý nghĩa khi đứng riêng**.\n- Lợi ích: một lần đọc lấy đủ dữ liệu, và cập nhật **atomic trong một document**.\n\n```json\n{ \"_id\": \"order_1\", \"customerId\": \"c_9\", \"status\": \"PAID\",\n  \"items\": [ { \"sku\": \"A1\", \"qty\": 2, \"price\": 150000 },\n             { \"sku\": \"B7\", \"qty\": 1, \"price\": 90000 } ] }\n```\n\n**Reference (lưu id) khi:**\n- Quan hệ **một-rất-nhiều** hoặc không giới hạn: bình luận của một bài viết phổ biến, log của một thiết bị.\n- Dữ liệu con được dùng **ở nhiều nơi** và cập nhật độc lập (thông tin sản phẩm).\n- Document có nguy cơ vượt **giới hạn 16 MB**.\n- Truy vấn kết hợp bằng `$lookup` (chậm hơn JOIN) hoặc đọc hai lần từ ứng dụng.\n\n**Kiến thức hay bị hỏi:**\n- **Index:** single field, compound (theo quy tắc ESR: Equality, Sort, Range), multikey cho mảng, TTL index để tự xóa dữ liệu hết hạn.\n- **Transaction:** từ 4.0 có transaction nhiều document (từ 4.2 trên sharded cluster), nhưng chậm hơn; thiết kế tốt thường chỉ cần atomic trong một document.\n- **Replica set:** một primary nhận ghi, các secondary sao chép; primary chết thì bầu lại tự động. `writeConcern: majority` để không mất dữ liệu đã xác nhận.\n- **Sharding:** chọn **shard key** có độ phân tán cao và khớp với truy vấn chính; key tăng dần như timestamp làm dồn ghi vào một shard.\n\n**Khi nào không dùng MongoDB:** dữ liệu quan hệ chặt, nhiều JOIN, cần ràng buộc toàn vẹn mạnh (kế toán, sổ cái).\n\n### English\n\n**Principle:** model for **how the application reads the data**, not for normalization. Data that's read together should be stored together.\n\n**Embed when:**\n- The relationship is **one-to-few** (one to a few dozen) and always read together: a customer's addresses, the lines of an order.\n- The child data **has no meaning on its own**.\n- Benefits: one read returns everything, and updates are **atomic within one document**.\n\n```json\n{ \"_id\": \"order_1\", \"customerId\": \"c_9\", \"status\": \"PAID\",\n  \"items\": [ { \"sku\": \"A1\", \"qty\": 2, \"price\": 150000 },\n             { \"sku\": \"B7\", \"qty\": 1, \"price\": 90000 } ] }\n```\n\n**Reference (store an id) when:**\n- The relationship is **one-to-very-many** or unbounded: comments on a popular post, a device's logs.\n- The child data is **used in many places** and updated independently (product details).\n- A document risks exceeding the **16 MB limit**.\n- Combine data with `$lookup` (slower than a JOIN) or with two reads in the application.\n\n**Frequently asked details:**\n- **Indexes:** single-field, compound (following the ESR rule: Equality, Sort, Range), multikey for arrays, TTL indexes to expire data automatically.\n- **Transactions:** multi-document transactions since 4.0 (on sharded clusters since 4.2), but they're slower; a good model usually needs atomicity within one document only.\n- **Replica sets:** one primary takes writes, secondaries replicate; if the primary dies, a new one is elected automatically. Use `writeConcern: majority` so acknowledged writes aren't lost.\n- **Sharding:** pick a **shard key** with high cardinality that matches the main queries; a monotonically increasing key such as a timestamp funnels all writes to one shard.\n\n**When not to use MongoDB:** tightly relational data, lots of JOINs, strong integrity requirements (accounting, ledgers).", "excerpt": "Nguyên tắc: thiết kế theo cách ứng dụng đọc dữ liệu, không theo chuẩn hóa. Dữ liệu được đọc cùng nhau thì nên lưu cùng nhau. Embed (lồng vào nhau) khi: Quan hệ một-ít (1–vài chục) và luôn đọc cùng nhau: địa chỉ của khách", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "nosql-cassandra", "title": "Cassandra hoạt động thế nào? Thiết kế bảng ra sao? / How does Cassandra work, and how do you design its tables?", "cat": "data", "section": "NoSQL", "kind": "qa", "tags": ["nosql", "cassandra", "axon"], "body": "### Tiếng Việt\n\n*Axon liệt kê Cassandra trong yêu cầu backend ở TP.HCM, nên chủ đề này đáng ôn kỹ.*\n\n**Kiến trúc:** cụm **không có master**, mọi node ngang hàng. Dữ liệu chia theo **partition key** trên một vòng consistent hashing, mỗi partition được nhân bản ra `RF` node (thường RF = 3).\n\n**Vì sao ghi rất nhanh (LSM tree):** ghi vào **commit log** (append tuần tự) và **memtable** trong RAM là xong. Memtable đầy thì flush thành **SSTable** bất biến trên đĩa; định kỳ **compaction** gộp các SSTable. Không có đọc-trước-khi-ghi.\n\n**Tunable consistency:** chọn mức nhất quán cho từng truy vấn: `ONE`, `QUORUM`, `ALL`, `LOCAL_QUORUM`. Nếu **R + W > RF** (ví dụ đọc QUORUM và ghi QUORUM với RF = 3, tức 2 + 2 > 3) thì luôn đọc được bản ghi mới nhất.\n\n**Thiết kế bảng: query-first.** Không có JOIN, không nên query ngoài khóa, nên **mỗi truy vấn thường một bảng**, chấp nhận lưu trùng dữ liệu.\n\n```sql\n-- Truy vấn: \"lấy 50 sự kiện mới nhất của một thiết bị trong một ngày\"\nCREATE TABLE events_by_device (\n    device_id  uuid,\n    day        date,\n    event_time timestamp,\n    event_id   timeuuid,\n    payload    text,\n    PRIMARY KEY ((device_id, day), event_time, event_id)\n) WITH CLUSTERING ORDER BY (event_time DESC, event_id DESC);\n\nSELECT * FROM events_by_device WHERE device_id = ? AND day = ? LIMIT 50;\n```\n\n- **Partition key** `(device_id, day)`: quyết định dữ liệu nằm ở node nào; truy vấn **bắt buộc** có đủ partition key.\n- **Clustering columns** `event_time, event_id`: sắp xếp dữ liệu trong partition, cho phép truy vấn khoảng.\n- Thêm `day` vào partition key để **chia nhỏ (bucketing)**, tránh một partition phình quá lớn. Nên giữ partition dưới khoảng 100 MB.\n\n**Bẫy hay gặp:**\n- **Tombstone:** xóa không xóa ngay mà ghi dấu xóa; xóa nhiều làm đọc chậm. Tránh dùng Cassandra như hàng đợi (ghi rồi xóa liên tục).\n- **Hot partition:** partition key phân bố kém (ví dụ chỉ dùng `day`) dồn tải vào vài node.\n- `ALLOW FILTERING` và secondary index: tránh trong truy vấn chính vì phải quét nhiều node.\n- Transaction rất hạn chế: chỉ có **lightweight transaction** (`IF NOT EXISTS`, dùng Paxos) và chậm.\n\n**Hợp với:** ghi rất nhiều, truy vấn biết trước, cần chịu lỗi cao và chạy nhiều data center: dữ liệu thiết bị, log, tin nhắn, timeline.\n\n### English\n\n*Axon lists Cassandra in its backend requirements in Ho Chi Minh City, so this topic is worth studying properly.*\n\n**Architecture:** a **masterless** cluster where every node is a peer. Data is distributed by **partition key** on a consistent-hashing ring, and each partition is replicated to `RF` nodes (usually RF = 3).\n\n**Why writes are so fast (LSM tree):** a write goes to the **commit log** (a sequential append) and an in-memory **memtable**, and that's it. When the memtable fills, it's flushed to an immutable **SSTable** on disk; **compaction** periodically merges SSTables. There's no read-before-write.\n\n**Tunable consistency:** choose a consistency level per query: `ONE`, `QUORUM`, `ALL`, `LOCAL_QUORUM`. If **R + W > RF** (for example QUORUM reads and QUORUM writes with RF = 3, so 2 + 2 > 3), reads always see the latest write.\n\n**Table design is query-first.** There are no JOINs and you shouldn't query outside the key, so it's typically **one table per query**, accepting duplicated data.\n\n```sql\n-- Query: \"get the 50 latest events of one device on one day\"\nCREATE TABLE events_by_device (\n    device_id  uuid,\n    day        date,\n    event_time timestamp,\n    event_id   timeuuid,\n    payload    text,\n    PRIMARY KEY ((device_id, day), event_time, event_id)\n) WITH CLUSTERING ORDER BY (event_time DESC, event_id DESC);\n\nSELECT * FROM events_by_device WHERE device_id = ? AND day = ? LIMIT 50;\n```\n\n- **Partition key** `(device_id, day)`: decides which nodes hold the data; queries **must** supply the full partition key.\n- **Clustering columns** `event_time, event_id`: order data within the partition and allow range queries.\n- Adding `day` to the partition key **buckets** the data so one partition doesn't grow too large. Keep partitions under roughly 100 MB.\n\n**Common traps:**\n- **Tombstones:** deletes aren't immediate; they write a deletion marker, and many deletes slow reads down. Don't use Cassandra as a queue (constant write-then-delete).\n- **Hot partitions:** a poorly distributed partition key (for example `day` alone) concentrates load on a few nodes.\n- `ALLOW FILTERING` and secondary indexes: avoid them on main queries because they scan many nodes.\n- Transactions are very limited: only **lightweight transactions** (`IF NOT EXISTS`, using Paxos), and they're slow.\n\n**Fits:** very write-heavy workloads with known queries that need high fault tolerance and multiple data centers: device data, logs, messages, timelines.", "excerpt": "Axon liệt kê Cassandra trong yêu cầu backend ở TP.HCM, nên chủ đề này đáng ôn kỹ. Kiến trúc: cụm không có master, mọi node ngang hàng. Dữ liệu chia theo partition key trên một vòng consistent hashing, mỗi partition được ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "cache-patterns", "title": "Có những chiến lược cache nào? Cache-aside, read-through, write-through, write-behind khác nhau ra sao? / What caching strategies exist? How do cache-aside, read-through, write-through and write-behind differ?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["cache", "redis"], "body": "### Tiếng Việt\n\n| Chiến lược | Đọc | Ghi | Ưu | Nhược |\n|---|---|---|---|---|\n| **Cache-aside** (lazy loading) | App đọc cache; miss thì app đọc DB rồi **tự ghi vào cache** | App ghi DB rồi **xóa** key trong cache | Phổ biến nhất, cache chết thì app vẫn chạy, chỉ cache dữ liệu thật sự được đọc | Lần đọc đầu luôn miss; dễ lệch dữ liệu nếu xử lý sai thứ tự |\n| **Read-through** | App chỉ hỏi cache; **cache tự** nạp từ DB khi miss | (kết hợp với chiến lược ghi khác) | Code app gọn | Cần thư viện hoặc cache hỗ trợ loader |\n| **Write-through** | | App ghi vào cache, **cache ghi đồng bộ** xuống DB | Cache luôn mới | Ghi chậm hơn (ghi hai nơi); cache chứa cả dữ liệu ít đọc |\n| **Write-behind** (write-back) | | Ghi vào cache, **ghi xuống DB sau**, theo lô và bất đồng bộ | Ghi rất nhanh, gom lô giảm tải DB | **Mất dữ liệu** nếu cache chết trước khi ghi xuống DB |\n| **Refresh-ahead** | Cache **tự làm mới** key nóng trước khi hết hạn | | Không có độ trễ miss cho key nóng | Tốn tài nguyên làm mới cả key không còn ai đọc |\n\n**Cache-aside, cách viết đúng:**\n\n```java\nProduct get(long id) {\n    String key = \"product:\" + id;\n    Product p = redis.get(key);\n    if (p != null) return p;                 // hit\n    p = repository.findById(id);             // miss → đọc DB\n    redis.set(key, p, Duration.ofMinutes(10).plusSeconds(random(0, 60))); // TTL có jitter\n    return p;\n}\n\n@Transactional\nvoid update(Product p) {\n    repository.save(p);                       // 1. ghi DB trước\n    // 2. xóa cache SAU KHI commit (TransactionSynchronization hoặc @TransactionalEventListener)\n    redis.delete(\"product:\" + p.getId());\n}\n```\n\n**Vì sao xóa cache thay vì cập nhật cache khi ghi?** Hai request ghi đồng thời có thể cập nhật cache theo thứ tự ngược với DB, để lại giá trị cũ trong cache. Xóa thì lần đọc sau sẽ nạp lại giá trị đúng từ DB. Ngoài ra không tốn công tính lại giá trị không ai đọc.\n\n**Trong Spring:** `@Cacheable`, `@CachePut`, `@CacheEvict` với Caffeine (cache cục bộ) hoặc Redis. Nhớ rằng chúng cũng dựa trên proxy, nên gọi nội bộ trong cùng class sẽ không đi qua cache.\n\n### English\n\n| Strategy | Read | Write | Pros | Cons |\n|---|---|---|---|---|\n| **Cache-aside** (lazy loading) | App reads the cache; on a miss, the app reads the DB and **populates the cache itself** | App writes the DB, then **deletes** the cache key | Most common, the app still works if the cache dies, only data that's actually read gets cached | First read always misses; data can diverge if ordering is handled wrongly |\n| **Read-through** | App only asks the cache; **the cache itself** loads from the DB on a miss | (combined with some write strategy) | Simpler application code | Needs a library or cache with loader support |\n| **Write-through** | | App writes to the cache, and **the cache writes synchronously** to the DB | Cache is always fresh | Slower writes (two places); cache also holds rarely read data |\n| **Write-behind** (write-back) | | Write to the cache, **write to the DB later**, in asynchronous batches | Very fast writes, batching reduces DB load | **Data loss** if the cache dies before flushing to the DB |\n| **Refresh-ahead** | The cache **refreshes** hot keys before they expire | | No miss latency for hot keys | Wastes resources refreshing keys nobody reads anymore |\n\n**Cache-aside done right:**\n\n```java\nProduct get(long id) {\n    String key = \"product:\" + id;\n    Product p = redis.get(key);\n    if (p != null) return p;                 // hit\n    p = repository.findById(id);             // miss → read the DB\n    redis.set(key, p, Duration.ofMinutes(10).plusSeconds(random(0, 60))); // TTL with jitter\n    return p;\n}\n\n@Transactional\nvoid update(Product p) {\n    repository.save(p);                       // 1. write the DB first\n    // 2. delete the cache AFTER COMMIT (TransactionSynchronization or @TransactionalEventListener)\n    redis.delete(\"product:\" + p.getId());\n}\n```\n\n**Why delete the cache instead of updating it on writes?** Two concurrent writers can update the cache in the opposite order from the database, leaving a stale value in the cache. Deleting means the next read reloads the correct value from the DB. It also avoids computing values nobody reads.\n\n**In Spring:** `@Cacheable`, `@CachePut`, `@CacheEvict` with Caffeine (a local cache) or Redis. Remember they're proxy-based too, so internal calls within the same class bypass the cache.", "excerpt": "Cache-aside, cách viết đúng: Vì sao xóa cache thay vì cập nhật cache khi ghi? Hai request ghi đồng thời có thể cập nhật cache theo thứ tự ngược với DB, để lại giá trị cũ trong cache. Xóa thì lần đọc sau sẽ nạp lại giá tr", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "cache-problems", "title": "Cache penetration, cache breakdown (stampede) và cache avalanche là gì? Xử lý thế nào? / What are cache penetration, cache breakdown (stampede) and cache avalanche, and how do you handle them?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["cache", "redis", "performance"], "body": "### Tiếng Việt\n\n| Vấn đề | Chuyện gì xảy ra | Cách xử lý |\n|---|---|---|\n| **Penetration** (xuyên thủng) | Truy vấn key **không tồn tại cả trong DB** (ví dụ `id = -1`, bot dò id). Cache không bao giờ có, nên mọi request đều xuống DB | **Cache giá trị rỗng** với TTL ngắn (30–60 giây); **Bloom filter** chặn trước các id chắc chắn không tồn tại; validate input, rate limit |\n| **Breakdown / stampede** (một key nóng hết hạn) | Một key **cực nóng** hết hạn, hàng nghìn request cùng miss và **cùng lúc** đập xuống DB | **Mutex hoặc single-flight**: chỉ một request được nạp lại, các request khác chờ hoặc dùng giá trị cũ; **logical expiry** (không đặt TTL thật, lưu thời điểm hết hạn trong value, hết hạn thì một thread làm mới nền còn các request khác vẫn trả giá trị cũ); refresh-ahead |\n| **Avalanche** (tuyết lở) | **Nhiều key hết hạn cùng lúc** (ví dụ cùng nạp lúc khởi động với cùng TTL), hoặc **cả cụm Redis chết**: DB bị dồn tải và sập | **TTL có jitter** (10 phút cộng ngẫu nhiên 0–60 giây); Redis HA (Sentinel hoặc Cluster); **cache nhiều tầng** (Caffeine cục bộ + Redis); **circuit breaker và rate limit** để bảo vệ DB; warm-up cache trước giờ cao điểm |\n\n**Ví dụ single-flight với khóa Redis:**\n\n```java\nProduct get(long id) {\n    Product p = redis.get(key(id));\n    if (p != null) return p;\n    String lock = \"lock:\" + key(id);\n    if (redis.setIfAbsent(lock, \"1\", Duration.ofSeconds(5))) {   // chỉ một request giành được khóa\n        try {\n            p = repository.findById(id);\n            redis.set(key(id), p, ttlWithJitter());\n            return p;\n        } finally { redis.delete(lock); }\n    }\n    Thread.sleep(50);            // request khác chờ ngắn rồi đọc lại cache\n    return get(id);              // (thực tế giới hạn số lần thử)\n}\n```\n\nTrong một instance, `Caffeine` với `LoadingCache` đã tự gộp các lần nạp đồng thời cho cùng key. Khóa Redis chỉ cần khi có nhiều instance.\n\n### English\n\n| Problem | What happens | How to handle it |\n|---|---|---|\n| **Penetration** | Requests for keys that **don't exist in the database either** (e.g. `id = -1`, bots probing ids). The cache never has them, so every request hits the DB | **Cache empty results** with a short TTL (30–60 seconds); a **Bloom filter** blocks ids that definitely don't exist; validate input, rate limit |\n| **Breakdown / stampede** (one hot key expires) | An **extremely hot** key expires, and thousands of requests miss and hit the DB **at the same moment** | **A mutex or single-flight**: only one request reloads, the others wait or use the old value; **logical expiry** (no real TTL; store the expiry time inside the value, and when it passes, one thread refreshes in the background while other requests keep returning the old value); refresh-ahead |\n| **Avalanche** | **Many keys expire at once** (e.g. all loaded at startup with the same TTL), or **the whole Redis cluster goes down**: the DB is flooded and fails | **TTL with jitter** (10 minutes plus a random 0–60 seconds); Redis HA (Sentinel or Cluster); **multi-level caching** (local Caffeine + Redis); **circuit breakers and rate limits** to protect the DB; warm the cache before peak hours |\n\n**Single-flight example with a Redis lock:**\n\n```java\nProduct get(long id) {\n    Product p = redis.get(key(id));\n    if (p != null) return p;\n    String lock = \"lock:\" + key(id);\n    if (redis.setIfAbsent(lock, \"1\", Duration.ofSeconds(5))) {   // only one request wins the lock\n        try {\n            p = repository.findById(id);\n            redis.set(key(id), p, ttlWithJitter());\n            return p;\n        } finally { redis.delete(lock); }\n    }\n    Thread.sleep(50);            // other requests wait briefly, then read the cache again\n    return get(id);              // (in practice, cap the number
