lete the cache after commit, and every key has a TTL with jitter. For important data I invalidate through CDC so nothing is missed, and I don't cache values that need strong consistency, such as balances.\"*", "excerpt": "Cache và DB là hai hệ thống, nên không có nhất quán tuyệt đối nếu không có transaction chung. Mục tiêu là giữ khoảng lệch ngắn và có giới hạn. So sánh các thứ tự ghi: Khe hở còn lại của \"cập nhật DB rồi xóa cache\": reque", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "redis-structures", "title": "Redis có những kiểu dữ liệu nào? Dùng cho bài toán gì? Vì sao Redis nhanh? / What data types does Redis have, what are they used for, and why is Redis fast?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["redis", "cache", "kafka"], "body": "### Tiếng Việt\n\n| Kiểu | Lệnh tiêu biểu | Dùng cho |\n|---|---|---|\n| **String** | `SET key val EX 60 NX`, `INCR`, `GET` | Cache object (JSON), bộ đếm, **khóa phân tán** (`SET NX PX`), rate limit |\n| **Hash** | `HSET user:1 name An`, `HINCRBY` | Object nhiều field, cập nhật từng field mà không đọc ghi lại cả object |\n| **List** | `LPUSH`, `RPOP`, `BLPOP`, `LRANGE` | Hàng đợi đơn giản, N mục mới nhất (feed, log gần đây) |\n| **Set** | `SADD`, `SISMEMBER`, `SINTER` | Tập không trùng: tag, người đã like, giao hai tập (bạn chung) |\n| **Sorted Set** | `ZADD`, `ZRANGE ... REV`, `ZRANGEBYSCORE` | **Bảng xếp hạng**, hàng đợi ưu tiên hoặc theo thời gian, **sliding-window rate limit** |\n| **Bitmap** | `SETBIT`, `BITCOUNT` | Điểm danh theo ngày, người dùng hoạt động (1 bit mỗi user) |\n| **HyperLogLog** | `PFADD`, `PFCOUNT` | **Đếm số phần tử khác nhau** gần đúng với khoảng 12 KB, sai số khoảng 0,81% (lượt xem duy nhất) |\n| **Stream** | `XADD`, `XREADGROUP`, `XACK` | Log sự kiện có consumer group, thay Kafka cho tải nhỏ |\n| **Geo** | `GEOADD`, `GEOSEARCH` | Tìm điểm gần nhất (tài xế, cửa hàng) |\n\n**Vì sao Redis nhanh:**\n- Dữ liệu nằm **hoàn toàn trong RAM**.\n- Thực thi lệnh trên **một thread chính**: không tốn chi phí khóa hay chuyển ngữ cảnh, và **mỗi lệnh là atomic**. Từ Redis 6 có thêm I/O thread cho đọc ghi mạng, nhưng lệnh vẫn chạy tuần tự.\n- I/O multiplexing (epoll) phục vụ hàng chục nghìn kết nối.\n- Cấu trúc dữ liệu được tối ưu (listpack, skiplist cho sorted set).\n\n**Hệ quả của single-thread:** **một lệnh chậm chặn tất cả**. Tránh `KEYS *` (dùng `SCAN`), tránh `HGETALL` hay `SMEMBERS` trên tập rất lớn, tránh **big key** (value hàng MB) và xóa big key bằng `UNLINK` thay cho `DEL`.\n\n**Atomic nhiều bước:** dùng **Lua script** (chạy atomic, không bị chen ngang) hoặc `MULTI/EXEC`. Ví dụ trừ tồn kho chỉ khi còn hàng phải nằm trong một Lua script.\n\n### English\n\n| Type | Typical commands | Used for |\n|---|---|---|\n| **String** | `SET key val EX 60 NX`, `INCR`, `GET` | Caching objects (JSON), counters, **distributed locks** (`SET NX PX`), rate limiting |\n| **Hash** | `HSET user:1 name An`, `HINCRBY` | Multi-field objects, updating one field without rewriting the whole object |\n| **List** | `LPUSH`, `RPOP`, `BLPOP`, `LRANGE` | Simple queues, latest-N items (feeds, recent logs) |\n| **Set** | `SADD`, `SISMEMBER`, `SINTER` | Unique collections: tags, users who liked, set intersections (mutual friends) |\n| **Sorted Set** | `ZADD`, `ZRANGE ... REV`, `ZRANGEBYSCORE` | **Leaderboards**, priority or time-ordered queues, **sliding-window rate limiting** |\n| **Bitmap** | `SETBIT`, `BITCOUNT` | Daily check-ins, active users (one bit per user) |\n| **HyperLogLog** | `PFADD`, `PFCOUNT` | **Approximate distinct counts** in about 12 KB with about 0.81% error (unique views) |\n| **Stream** | `XADD`, `XREADGROUP`, `XACK` | An event log with consumer groups, replacing Kafka for small loads |\n| **Geo** | `GEOADD`, `GEOSEARCH` | Nearest-point search (drivers, stores) |\n\n**Why Redis is fast:**\n- Data lives **entirely in RAM**.\n- Commands execute on **one main thread**: no locking or context-switch overhead, and **every command is atomic**. Redis 6 added I/O threads for network reads and writes, but commands still run sequentially.\n- I/O multiplexing (epoll) serves tens of thousands of connections.\n- Data structures are optimized (listpacks, skiplists for sorted sets).\n\n**Consequence of the single thread:** **one slow command blocks everything**. Avoid `KEYS *` (use `SCAN`), avoid `HGETALL` or `SMEMBERS` on very large collections, avoid **big keys** (multi-MB values), and delete big keys with `UNLINK` instead of `DEL`.\n\n**Multi-step atomicity:** use a **Lua script** (runs atomically, nothing interleaves) or `MULTI/EXEC`. For example, decrementing stock only when items remain must happen inside one Lua script.", "excerpt": "Vì sao Redis nhanh: Dữ liệu nằm hoàn toàn trong RAM. Thực thi lệnh trên một thread chính: không tốn chi phí khóa hay chuyển ngữ cảnh, và mỗi lệnh là atomic. Từ Redis 6 có thêm I/O thread cho đọc ghi mạng, nhưng lệnh vẫn ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "redis-ha", "title": "Redis lưu dữ liệu xuống đĩa và chạy HA thế nào? Khi bộ nhớ đầy thì sao? / How does Redis persist data and run highly available, and what happens when memory is full?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["redis", "high-availability"], "body": "### Tiếng Việt\n\n**Persistence, hai cơ chế:**\n\n| | RDB (snapshot) | AOF (append-only file) |\n|---|---|---|\n| Cách làm | Định kỳ fork process, chụp toàn bộ dữ liệu ra file | Ghi **mọi lệnh ghi** vào cuối file |\n| Mất dữ liệu khi sập | Mất từ lần chụp cuối (có thể vài phút) | Với `appendfsync everysec`: mất **tối đa khoảng 1 giây** |\n| Khởi động lại | Nhanh | Chậm hơn (phải chạy lại lệnh); có AOF rewrite để thu gọn |\n| Hợp với | Backup, khôi phục nhanh | Cần ít mất dữ liệu |\n\nThực tế thường bật **cả hai** (Redis 7 dùng AOF nhiều phần, có phần nền dạng RDB). Với cache thuần thì có thể tắt persistence.\n\n**High availability:**\n- **Replication:** một master, nhiều replica, sao chép **bất đồng bộ**, nên master chết có thể mất vài lệnh ghi cuối. `WAIT` giúp giảm rủi ro nhưng không đảm bảo tuyệt đối.\n- **Sentinel:** theo dõi master; master chết thì Sentinel **tự promote** một replica và báo client địa chỉ mới. Dùng khi dữ liệu vừa trong một máy.\n- **Redis Cluster:** chia dữ liệu thành **16.384 hash slot** trên nhiều master (mỗi master có replica), scale cả đọc lẫn ghi. Lệnh nhiều key chỉ chạy được khi các key **cùng slot**: dùng **hash tag** `{user:1}:profile`, `{user:1}:cart`.\n- Dịch vụ quản lý: AWS ElastiCache hoặc MemoryDB, Azure Cache.\n\n**Khi đầy bộ nhớ (`maxmemory`), theo `maxmemory-policy`:**\n\n| Policy | Hành vi |\n|---|---|\n| `noeviction` (mặc định) | Lệnh ghi bị **báo lỗi** |\n| `allkeys-lru` | Xóa key **ít được dùng gần đây nhất** trong mọi key. **Chọn cho cache** |\n| `allkeys-lfu` | Xóa key **ít được dùng thường xuyên nhất**. Tốt khi có key nóng ổn định |\n| `volatile-lru`, `volatile-lfu`, `volatile-ttl` | Chỉ xóa trong các key **có TTL** |\n| `allkeys-random` | Xóa ngẫu nhiên |\n\nLRU và LFU của Redis là **gần đúng** (lấy mẫu một số key) để tiết kiệm bộ nhớ.\n\n**Lưu ý:** **không dùng Redis làm nguồn sự thật duy nhất cho dữ liệu quan trọng** như tiền hay đơn hàng, vì replication bất đồng bộ có thể mất dữ liệu khi failover. Nếu có dùng (ví dụ đếm tồn kho flash sale), phải có đối soát với DB.\n\n### English\n\n**Persistence, two mechanisms:**\n\n| | RDB (snapshot) | AOF (append-only file) |\n|---|---|---|\n| How | Periodically forks and dumps the whole dataset to a file | Appends **every write command** to a file |\n| Data loss on crash | Everything since the last snapshot (possibly minutes) | With `appendfsync everysec`: **at most about 1 second** |\n| Restart | Fast | Slower (commands are replayed); AOF rewrite keeps it compact |\n| Fits | Backups, fast recovery | Minimal data loss |\n\nIn practice both are often enabled (Redis 7 uses a multi-part AOF with an RDB-format base). For a pure cache, persistence can be turned off.\n\n**High availability:**\n- **Replication:** one master, several replicas, replicated **asynchronously**, so a master failure can lose the last few writes. `WAIT` reduces the risk but doesn't guarantee anything.\n- **Sentinel:** monitors the master; if it dies, Sentinel **automatically promotes** a replica and tells clients the new address. Used when the data fits on one machine.\n- **Redis Cluster:** splits data into **16,384 hash slots** across several masters (each with replicas), scaling both reads and writes. Multi-key commands only work when the keys are **in the same slot**: use **hash tags** such as `{user:1}:profile`, `{user:1}:cart`.\n- Managed services: AWS ElastiCache or MemoryDB, Azure Cache.\n\n**When memory is full (`maxmemory`), per `maxmemory-policy`:**\n\n| Policy | Behaviour |\n|---|---|\n| `noeviction` (default) | Writes **return an error** |\n| `allkeys-lru` | Evicts the **least recently used** key among all keys. **The choice for a cache** |\n| `allkeys-lfu` | Evicts the **least frequently used** key. Good when hot keys are stable |\n| `volatile-lru`, `volatile-lfu`, `volatile-ttl` | Evict only among keys **with a TTL** |\n| `allkeys-random` | Evicts at random |\n\nRedis's LRU and LFU are **approximate** (they sample keys) to save memory.\n\n**Note:** **don't use Redis as the only source of truth for important data** like money or orders, because asynchronous replication can lose data on failover. If you do (for example a flash-sale stock counter), reconcile against the database.", "excerpt": "Persistence, hai cơ chế: Thực tế thường bật cả hai (Redis 7 dùng AOF nhiều phần, có phần nền dạng RDB). Với cache thuần thì có thể tắt persistence. High availability: Replication: một master, nhiều replica, sao chép bất ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "cache-local-vs-distributed", "title": "Cache cục bộ (Caffeine) và cache phân tán (Redis) khác nhau thế nào? Khi nào dùng cả hai? / Local cache (Caffeine) vs distributed cache (Redis): how do they differ, and when do you use both?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["cache", "redis", "caffeine", "kafka"], "body": "### Tiếng Việt\n\n| | Cache cục bộ (Caffeine, Guava, `ConcurrentHashMap`) | Cache phân tán (Redis, Memcached) |\n|---|---|---|\n| Vị trí | Trong heap của **từng instance** | Server riêng, **dùng chung** cho mọi instance |\n| Tốc độ | **Nhanh nhất** (nano đến micro giây), không qua mạng, không serialize | Khoảng 0,1–1 ms, qua mạng và serialize |\n| Nhất quán giữa instance | **Mỗi instance một bản**, có thể lệch nhau | Một bản chung |\n| Dung lượng | Giới hạn bởi heap, cache lớn làm GC nặng | Lớn, scale riêng |\n| Còn sau khi restart app | Mất | Còn |\n| Hợp với | Dữ liệu nhỏ, **rất nóng, ít đổi**: cấu hình, danh mục, quyền | Dữ liệu cần dùng chung: session, giỏ hàng, rate limit, khóa, cache object lớn |\n\n**Cache hai tầng (L1 Caffeine + L2 Redis):**\n\n```\nRequest → L1 (Caffeine, TTL 30 giây) → miss → L2 (Redis, TTL 10 phút) → miss → DB\n```\n\n- Giảm mạnh số lần gọi Redis cho key cực nóng, và **chống avalanche** khi Redis gặp sự cố.\n- **Vấn đề:** dữ liệu đổi thì L1 ở các instance khác vẫn giữ bản cũ. Cách xử lý: L1 có TTL ngắn, và **broadcast invalidation** qua Redis pub/sub hoặc Kafka để mọi instance xóa key khỏi L1.\n\n**Caffeine cấu hình mẫu:**\n\n```java\nLoadingCache<Long, Product> cache = Caffeine.newBuilder()\n    .maximumSize(10_000)                       // giới hạn số phần tử (thuật toán W-TinyLFU)\n    .expireAfterWrite(Duration.ofSeconds(30))\n    .refreshAfterWrite(Duration.ofSeconds(20)) // làm mới nền, request vẫn nhận giá trị cũ\n    .recordStats()                             // đo hit rate\n    .build(id -> repository.findById(id).orElseThrow());\n```\n\n**Đo hiệu quả:** theo dõi **hit rate**, độ trễ, lượng bộ nhớ, số key bị loại. Hit rate thấp nghĩa là cache không có tác dụng: hoặc sai key, hoặc TTL quá ngắn, hoặc dữ liệu vốn không được đọc lặp lại.\n\n### English\n\n| | Local cache (Caffeine, Guava, `ConcurrentHashMap`) | Distributed cache (Redis, Memcached) |\n|---|---|---|\n| Location | In the heap of **each instance** | A separate server, **shared** by all instances |\n| Speed | **Fastest** (nano- to microseconds), no network, no serialization | About 0.1–1 ms, over the network with serialization |\n| Consistency across instances | **Each instance has its own copy**, copies can diverge | One shared copy |\n| Capacity | Limited by the heap; large caches add GC pressure | Large, scaled independently |\n| Survives app restarts | No | Yes |\n| Fits | Small, **very hot, rarely changing** data: configuration, catalogs, permissions | Data that must be shared: sessions, carts, rate limits, locks, large object caches |\n\n**Two-level cache (L1 Caffeine + L2 Redis):**\n\n```\nRequest → L1 (Caffeine, TTL 30 s) → miss → L2 (Redis, TTL 10 min) → miss → DB\n```\n\n- Greatly reduces Redis calls for extremely hot keys, and **protects against avalanches** when Redis has problems.\n- **The issue:** when data changes, L1 on other instances still holds the old copy. The fix: a short L1 TTL plus **broadcast invalidation** via Redis pub/sub or Kafka so every instance evicts the key from L1.\n\n**Sample Caffeine configuration:**\n\n```java\nLoadingCache<Long, Product> cache = Caffeine.newBuilder()\n    .maximumSize(10_000)                       // bounded size (W-TinyLFU algorithm)\n    .expireAfterWrite(Duration.ofSeconds(30))\n    .refreshAfterWrite(Duration.ofSeconds(20)) // background refresh, requests still get the old value\n    .recordStats()                             // measure hit rate\n    .build(id -> repository.findById(id).orElseThrow());\n```\n\n**Measure effectiveness:** track **hit rate**, latency, memory use and evictions. A low hit rate means the cache isn't helping: the key is wrong, the TTL is too short, or the data simply isn't read repeatedly.", "excerpt": "Cache hai tầng (L1 Caffeine + L2 Redis): Giảm mạnh số lần gọi Redis cho key cực nóng, và chống avalanche khi Redis gặp sự cố. Vấn đề: dữ liệu đổi thì L1 ở các instance khác vẫn giữ bản cũ. Cách xử lý: L1 có TTL ngắn, và ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "pg-acid-wal", "title": "How does PostgreSQL guarantee atomicity and durability after a crash?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "acid", "transaction"], "body": "\"Through the **write-ahead log**. Every change is written to the WAL and flushed to disk at commit before the data pages themselves are written. After a crash, Postgres replays the WAL from the last checkpoint: committed transactions are redone, and changes from uncommitted ones are simply never visible, because MVCC marks them by transaction ID as aborted.\n\nSo durability means 'the WAL record is on disk', and atomicity comes from all-or-nothing visibility by transaction ID. Trading durability for speed is possible with `synchronous_commit = off`, which risks losing the last few hundred milliseconds of commits but not corruption.\n\nMany NoSQL systems relax ACID across documents or partitions to gain horizontal scale and availability; that's the BASE trade-off. For money, both atomicity and durability are non-negotiable.\"\n\nTham khảo thêm: [Database: ACID Properties](https://minhnhat97kg.github.io/docsify/content/database-acid-properties/vi.md)", "excerpt": "\"Through the write-ahead log. Every change is written to the WAL and flushed to disk at commit before the data pages themselves are written. After a crash, Postgres replays the WAL from the last checkpoint: committed tra", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-mvcc", "title": "What is MVCC, and why does PostgreSQL need VACUUM?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "mvcc", "vacuum"], "body": "\"With MVCC, readers don't block writers and writers don't block readers. Each row version stores `xmin`, the transaction that created it, and `xmax`, the one that deleted it. An `UPDATE` doesn't overwrite; it writes a new version and marks the old one dead. Each transaction sees the versions valid for its snapshot.\n\nDead versions take space and slow scans: that's **bloat**. **VACUUM** marks their space reusable; `VACUUM FULL` rewrites the table and returns space to the OS but takes an exclusive lock, so I prefer `pg_repack` in production. **Autovacuum** runs this automatically; on large, busy tables I lower its scale factors so it runs more often.\n\nIt also prevents **transaction ID wraparound**: IDs are 32-bit, so old rows must be frozen, or Postgres eventually stops accepting writes. Long-running transactions block cleanup, so I monitor them. Related trivia: `COUNT(*)` is slower than you'd expect because visibility must be checked per row, and frequently updating one small column still creates whole new row versions.\"\n\nTham khảo thêm: [MVCC & Dead Tuples](https://minhnhat97kg.github.io/docsify/content/database-mvcc-dead-tuples/vi.md), [Vacuum & Autovacuum](https://minhnhat97kg.github.io/docsify/content/database-vacuum-autovacuum-garbage-collection/vi.md)", "excerpt": "\"With MVCC, readers don't block writers and writers don't block readers. Each row version stores xmin, the transaction that created it, and xmax, the one that deleted it. An UPDATE doesn't overwrite; it writes a new vers", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-isolation", "title": "Read committed vs repeatable read vs serializable in PostgreSQL?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "isolation", "transaction"], "body": "\"PostgreSQL's default is **read committed**: each statement sees data committed before it started, so two reads in one transaction can differ, and phantoms can appear.\n\n**Repeatable read** in Postgres is snapshot isolation: the whole transaction sees one snapshot, which also prevents phantoms for reads. But it allows **write skew**: two transactions each read a condition, such as 'at least one doctor on call', and update different rows, breaking the invariant together.\n\n**Serializable** adds conflict detection (SSI) and aborts one transaction with a serialization error, so the application must retry.\n\nTo avoid anomalies without serializable: lock the rows that guard the invariant with `SELECT ... FOR UPDATE`, use a conditional update, add a unique or exclusion constraint, or use advisory locks. MySQL InnoDB's repeatable read behaves differently, using gap locks, so I name the database when answering.\"\n\nTham khảo thêm: [Database - Isolation Levels](https://minhnhat97kg.github.io/docsify/content/database-isolation-level-read-committed-vs-serializable/vi.md)", "excerpt": "\"PostgreSQL's default is read committed: each statement sees data committed before it started, so two reads in one transaction can differ, and phantoms can appear. Repeatable read in Postgres is snapshot isolation: the w", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-indexes", "title": "Beyond B-tree: when do you use Hash, GIN, GiST or partial indexes?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "indexing"], "body": "\"**B-tree** is the default: equality, ranges, sorting, prefix `LIKE 'abc%'`. With `INCLUDE` columns it enables index-only scans.\n\n**Hash**: equality only, rarely worth it over B-tree.\n\n**GIN**, an inverted index: for values that contain many keys, such as JSONB containment (`@>`), arrays, and full-text search. Reads are fast; inserts are slower because one row updates many entries, which `fastupdate` mitigates.\n\n**GiST**: for geometric and range data, such as PostGIS 'nearest ATM', range overlap, and exclusion constraints.\n\n**pg_trgm** with GIN or GiST makes `LIKE '%abc%'` and fuzzy search usable.\n\n**Partial indexes** index only the rows you query, such as `WHERE status = 'PENDING'`: smaller and faster. And an index on a column with a function needs a matching expression index.\"\n\nTham khảo thêm: [Indexing: B-Tree](https://minhnhat97kg.github.io/docsify/content/database-indexing-b-tree-the-default-workhorse/vi.md), [Indexing: GIN & GiST](https://minhnhat97kg.github.io/docsify/content/database-indexing-gin-gist-advanced-indexing/vi.md)", "excerpt": "\"B-tree is the default: equality, ranges, sorting, prefix LIKE 'abc%'. With INCLUDE columns it enables index-only scans. Hash: equality only, rarely worth it over B-tree. GIN, an inverted index: for values that contain m", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-partitioning", "title": "When and how do you partition a large table?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "partitioning", "performance"], "body": "\"When a table grows to hundreds of millions of rows and most queries hit a recent slice, or old data must be dropped regularly.\n\n- **Range** partitioning by time, such as monthly for transactions or logs, is the most common.\n- **Hash** partitioning by ID spreads load evenly when there's no natural range.\n- **List** partitioning by tenant or region.\n\nBenefits: **partition pruning**, where queries with the partition key touch only relevant partitions; dropping an old partition instead of a huge `DELETE` that bloats the table; and smaller indexes per partition.\n\nPitfalls: a primary key or unique constraint must include the partition key, since Postgres has no global indexes; queries without the partition key scan every partition; and too many partitions slow planning. I automate creating future partitions with `pg_partman` or a scheduled job.\"\n\nTham khảo thêm: [Table Partitioning](https://minhnhat97kg.github.io/docsify/content/database-table-partitioning-range-hash/vi.md)", "excerpt": "\"When a table grows to hundreds of millions of rows and most queries hit a recent slice, or old data must be dropped regularly. Range partitioning by time, such as monthly for transactions or logs, is the most common. Ha", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-pooling", "title": "Why use PgBouncer if the app already has a connection pool?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "connection-pool", "performance"], "body": "\"Each Postgres connection is a separate OS process using several MB of memory, so a few hundred connections already hurt. With 50 application pods each running a HikariCP pool of 20, you'd have 1,000 connections. PgBouncer sits in between and multiplexes many client connections onto a small number of server connections.\n\nModes:\n\n- **Session pooling:** a server connection per client session; safe but saves little.\n- **Transaction pooling:** a server connection only for the duration of a transaction; the usual choice for high concurrency.\n- **Statement pooling:** rarely used.\n\nIn transaction mode, session state doesn't survive between transactions: `SET` commands, advisory locks and, historically, server-side prepared statements, causing 'prepared statement does not exist' errors. PgBouncer 1.21+ can track protocol-level prepared statements; otherwise disable them in the driver. On AWS, RDS Proxy plays the same role.\"\n\nTham khảo thêm: [Database - Connection Pool](https://minhnhat97kg.github.io/docsify/content/database-connection-pool/vi.md)", "excerpt": "\"Each Postgres connection is a separate OS process using several MB of memory, so a few hundred connections already hurt. With 50 application pods each running a HikariCP pool of 20, you'd have 1,000 connections. PgBounc", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sql-tricky", "title": "Tricky SQL questions: EXISTS vs IN, NULL, deleting 10 million rows.", "cat": "data", "section": "SQL nâng cao", "kind": "qa", "tags": ["sql", "database", "performance"], "body": "\"- **EXISTS vs IN:** modern planners often turn both into the same semi-join. The real trap is `NOT IN` with a subquery that can return NULL: it returns no rows at all. I use `NOT EXISTS`.\n- **NULL = NULL** is unknown, not true; use `IS NULL` or `IS DISTINCT FROM`. `COUNT(col)` skips NULLs; `COUNT(*)` doesn't.\n- **Alias in WHERE:** not allowed, because `WHERE` is evaluated before `SELECT`; the logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY.\n- **SARGable predicates:** `WHERE created_at >= '2026-01-01'` can use an index; `WHERE YEAR(created_at) = 2026` can't.\n- **Deleting 10 million rows:** delete in batches of a few thousand by primary key with short pauses, so locks, WAL volume and replication lag stay small; or, if most of the table goes, copy the rows to keep into a new table and swap; or drop a partition.\n- **Fast locally, slow in production:** different data volume and distribution, stale statistics, different plans, or parameter-sensitive plans. Check with `EXPLAIN (ANALYZE, BUFFERS)` on production-like data.\"\n\nTham khảo thêm: [Database - Advanced SQL Concepts](https://minhnhat97kg.github.io/docsify/content/database-advance-2/vi.md), [Database - Query Optimization](https://minhnhat97kg.github.io/docsify/content/database-optimization/vi.md)", "excerpt": "\"- EXISTS vs IN: modern planners often turn both into the same semi-join. The real trap is NOT IN with a subquery that can return NULL: it returns no rows at all. I use NOT EXISTS. NULL = NULL is unknown, not true; use I", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "db-replication-sharding", "title": "Replication and sharding: how do you choose a shard key?", "cat": "data", "section": "System design", "kind": "qa", "tags": ["database", "replication", "sharding", "system-design"], "body": "\"**Replication** copies data for availability and read scale. Leader-follower is the norm. Synchronous replication means no data loss on failover but higher write latency; asynchronous is faster but can lose the last writes and creates replica lag. Many setups use one synchronous standby plus asynchronous replicas.\n\n**Sharding** splits data horizontally across databases for write scale. The shard key decides everything:\n\n- High cardinality and even distribution, to avoid hot shards.\n- Matches the main access pattern, so most queries hit one shard: user ID or tenant ID for user-centric apps.\n- Avoid monotonically increasing keys with range sharding, since all new writes land on one shard.\n\nCosts: cross-shard queries and transactions, rebalancing, and global unique IDs (Snowflake-style IDs or UUIDv7). I shard only after indexing, caching, replicas and partitioning are exhausted.\"\n\nTham khảo thêm: [Database System Design: Scalability & Reliability](https://minhnhat97kg.github.io/docsify/content/database-system-design/vi.md)", "excerpt": "\"Replication copies data for availability and read scale. Leader-follower is the norm. Synchronous replication means no data loss on failover but higher write latency; asynchronous is faster but can lose the last writes ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "pgvector", "title": "How would you add vector search with PostgreSQL?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "ai", "vector-search"], "body": "\"The `pgvector` extension stores embeddings as a `vector(n)` column and supports distance operators: cosine `<=>`, which suits text embeddings, L2 `<->`, and inner product.\n\nTwo approximate indexes:\n\n- **HNSW:** a layered graph; better recall and speed, but slower to build and more memory. Tunable with `m` and `ef_construction` at build time and `ef_search` at query time.\n- **IVFFlat:** clusters vectors into lists; faster to build, but needs data before building and lower recall.\n\nWhy pgvector instead of a dedicated vector database: one system to run, vectors filtered and joined with relational data in one query, and transactions. A dedicated store becomes worth it at very large scale or for advanced features. Use cases: semantic search, recommendations, and anomaly detection by finding transactions similar to known fraud.\"\n\nTham khảo thêm: [Vector Search & HNSW Index](https://minhnhat97kg.github.io/docsify/content/database-vector-search-hnsw-index/vi.md)", "excerpt": "\"The pgvector extension stores embeddings as a vector(n) column and supports distance operators: cosine <=, which suits text embeddings, L2 <-, and inner product. Two approximate indexes: HNSW: a layered graph; better re", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "technical-microservices-kafka-system-design", "title": "Tổng quan: Technical: microservices, Kafka, system design", "cat": "arch", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "kind": "guide", "excerpt": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "microservices-1", "title": "Monolith vs microservices: when would you choose each?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, and split out services when there is a clear bounded context with different scaling or release needs. A distributed monolith, where services must be deployed together, is the worst of both.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, ", "catLabel": "Microservices & System Design"}, {"id": "microservices-2", "title": "Các service giao tiếp với nhau thế nào? Khi nào dùng đồng bộ (sync), khi nào bất đồng bộ (async)? / How do services communicate, and when do you use synchronous vs asynchronous communication?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "### Tiếng Việt\n\n**Đồng bộ (sync):** bên gọi gửi request rồi **chờ** response mới làm tiếp. Ví dụ REST qua HTTP, gRPC, GraphQL.\n\n**Bất đồng bộ (async):** bên gửi đẩy message hoặc sự kiện vào broker rồi **làm tiếp ngay**, không chờ người nhận xử lý xong. Ví dụ Kafka, RabbitMQ, SQS. Người nhận xử lý khi sẵn sàng.\n\n| | Đồng bộ (REST, gRPC) | Bất đồng bộ (Kafka, RabbitMQ) |\n|---|---|---|\n| Bên gọi có kết quả ngay | **Có** | Không (chỉ biết message đã được nhận vào broker) |\n| Phụ thuộc lúc chạy | Bên nhận **phải đang sống** | Bên nhận chết thì message nằm chờ trong broker |\n| Độ trễ đầu cuối | Thấp, nhưng **cộng dồn** theo chuỗi gọi | Cao hơn, có độ trễ của hàng đợi |\n| Lỗi lan truyền | Dễ **sập dây chuyền** | Được cô lập, có retry và DLQ |\n| Chịu tải đột biến | Bên nhận phải chịu ngay | Hàng đợi hấp thụ, xử lý dần |\n| Nhất quán | Dễ hiểu, gần với nhất quán mạnh | **Eventual consistency**, phải xử lý trùng lặp và sai thứ tự |\n| Debug | Dễ, theo một luồng | Khó hơn, cần trace id xuyên qua message |\n| Thêm người nhận mới | Phải sửa bên gọi | Chỉ cần subscribe thêm, bên gửi không đổi |\n\n**Khi nào dùng đồng bộ:**\n- Người dùng **cần câu trả lời ngay** để làm bước tiếp: đăng nhập, kiểm tra tồn kho trước khi đặt hàng, lấy giá, truy vấn để hiển thị.\n- **Truy vấn (query)** dữ liệu của service khác.\n- REST cho API công khai và frontend; **gRPC** cho gọi nội bộ cần nhanh (HTTP/2, protobuf nhị phân, có hợp đồng chặt, hỗ trợ streaming).\n\n**Khi nào dùng bất đồng bộ:**\n- Việc **có thể làm sau**: gửi email, thông báo, tạo báo cáo, đồng bộ sang search hoặc data warehouse.\n- **Một sự kiện, nhiều service phản ứng**: `OrderPlaced` thì Payment, Inventory, Notification, Analytics cùng xử lý.\n- Muốn **tách availability**: Notification chết thì đặt hàng vẫn chạy.\n- Việc **chạy lâu** (xử lý video, import file lớn), hoặc cần **san phẳng tải**.\n- Giao dịch nhiều bước giữa các service (saga).\n\n**Quy tắc thực tế:**\n1. **Giữ chuỗi gọi đồng bộ ngắn** (lý tưởng ≤ 2–3 bước). Gọi nối tiếp 5 service, mỗi cái 99,9% availability và 50 ms, thì chỉ còn khoảng 99,5% và ít nhất 250 ms.\n2. Mọi lời gọi đồng bộ phải có **timeout, retry có giới hạn (chỉ với thao tác idempotent), và circuit breaker**.\n3. **Lệnh (command)** cần kết quả thì gọi đồng bộ; **sự kiện (event)**, tức thông báo \"việc này đã xảy ra\", thì phát bất đồng bộ.\n4. Phát sự kiện phải tin cậy: dùng [outbox pattern](#microservices-4); consumer phải [idempotent](#microservices-5).\n5. Mô hình lai hay gặp: API nhận request đồng bộ, kiểm tra nhanh, lưu trạng thái `PENDING`, **trả 202 kèm id**, phần còn lại chạy bất đồng bộ; client hỏi lại trạng thái hoặc nhận webhook.\n\n**Câu trả lời mẫu:** *\"Tôi dùng đồng bộ khi bên gọi cần kết quả ngay, chủ yếu là truy vấn, và giữ chuỗi gọi ngắn, có timeout và circuit breaker. Mọi thứ còn lại, đặc biệt khi một sự kiện có nhiều service quan tâm, tôi phát qua Kafka bằng outbox, chấp nhận eventual consistency và làm consumer idempotent. Ở [Opswat], [ví dụ thật của bạn].\"*\n\n### English\n\n**Synchronous:** the caller sends a request and **waits** for the response before continuing. Examples: REST over HTTP, gRPC, GraphQL.\n\n**Asynchronous:** the sender pushes a message or event to a broker and **continues immediately**, without waiting for the receiver to finish processing. Examples: Kafka, RabbitMQ, SQS. The receiver processes it when ready.\n\n| | Synchronous (REST, gRPC) | Asynchronous (Kafka, RabbitMQ) |\n|---|---|---|\n| Caller gets the result immediately | **Yes** | No (it only knows the broker accepted the message) |\n| Runtime dependency | The receiver **must be up** | If the receiver is down, the message waits in the broker |\n| End-to-end latency | Low, but it **adds up** along the call chain | Higher, including queueing delay |\n| Failure propagation | Prone to **cascading failures** | Isolated, with retries and DLQs |\n| Handling spikes | The receiver must absorb them immediately | The queue absorbs them and work drains gradually |\n| Consistency | Easy to reason about, close to strong consistency | **Eventual consistency**; duplicates and reordering must be handled |\n| Debugging | Easy, one flow | Harder; trace ids must travel through messages |\n| Adding a new receiver | The caller must change | Just add a subscriber; the sender stays the same |\n\n**When to use synchronous:**\n- The user **needs the answer now** to take the next step: login, checking stock before ordering, getting a price, queries for display.\n- **Querying** another service's data.\n- REST for public APIs and frontends; **gRPC** for fast internal calls (HTTP/2, binary protobuf, strict contracts, streaming support).\n\n**When to use asynchronous:**\n- Work that **can happen later**: emails, notifications, reports, syncing to search or a data warehouse.\n- **One event, many reacting services**: on `OrderPlaced`, Payment, Inventory, Notification and Analytics all react.\n- To **decouple availability**: if Notification is down, ordering still works.\n- **Long-running** work (video processing, large file imports), or when you need **load leveling**.\n- Multi-step transactions across services (sagas).\n\n**Practical rules:**\n1. **Keep synchronous chains short** (ideally ≤ 2–3 hops). Calling 5 services in series, each at 99.9% availability and 50 ms, leaves only about 99.5% and at least 250 ms.\n2. Every synchronous call needs a **timeout, bounded retries (for idempotent operations only), and a circuit breaker**.\n3. **Commands** that need a result are synchronous; **events**, meaning notices that \"this has happened\", are published asynchronously.\n4. Publish events reliably with the [outbox pattern](#microservices-4), and make consumers [idempotent](#microservices-5).\n5. A common hybrid: the API accepts the request synchronously, validates quickly, stores a `PENDING` state, **returns 202 with an id**, and the rest runs asynchronously; the client polls the status or receives a webhook.\n\n**A model answer:** *\"I use synchronous calls when the caller needs the result right away, mostly queries, and I keep the chain short with timeouts and circuit breakers. Everything else, especially when several services care about one event, I publish through Kafka with an outbox, accepting eventual consistency and making consumers idempotent. At [Opswat], [your real example].\"*", "kind": "qa", "num": 2, "tip": "", "excerpt": "Đồng bộ (sync): bên gọi gửi request rồi chờ response mới làm tiếp. Ví dụ REST qua HTTP, gRPC, GraphQL. Bất đồng bộ (async): bên gửi đẩy message hoặc sự kiện vào broker rồi làm tiếp ngay, không chờ người nhận xử lý xong. ", "catLabel": "Microservices & System Design", "bilingual": true}, {"id": "microservices-5", "title": "How do you make an operation idempotent?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For updates I prefer absolute values or version checks over increments.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For up", "catLabel": "Microservices & System Design"}, {"id": "microservices-6", "title": "How do you make calls between services resilient?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one makes sense. In Java I use Resilience4j. Retries without timeouts or limits cause retry storms.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one mak", "catLabel": "Microservices & System Design"}, {"id": "microservices-7", "title": "What does an API gateway do? How is authentication handled across services?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "opswat"], "body": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as headers. The alternative is each service validating a JWT itself, which removes the trust assumption but duplicates logic. Between services I'd use mTLS or short-lived service tokens.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as head", "catLabel": "Microservices & System Design"}, {"id": "microservices-8", "title": "How do you observe and debug a distributed system?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99 latency, and use traces to find which hop is slow.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99", "catLabel": "Microservices & System Design"}, {"id": "microservices-9", "title": "Explain the CAP theorem in practical terms.", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product catalogue chooses availability.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product c", "catLabel": "Microservices & System Design"}, {"id": "system-design-16", "title": "Describe the architecture of your last project.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"It was an endpoint management platform. \\[Số lượng\\] services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported \\[dữ liệu gì\\] through \\[giao thức\\]; services communicated by \\[REST/gRPC/message broker\\]; data was stored in \\[database\\]. I owned \\[service/module\\]. The main challenges were \\[quy mô, độ trễ, multi-tenant...\\], which we handled by \\[giải pháp\\].\"\n\n*Ghi chú: câu này gần như chắc chắn được hỏi. Vẽ sẵn sơ đồ và tập nói trong 3 phút, kèm 2–3 quyết định thiết kế bạn bảo vệ được.*", "kind": "qa", "num": 16, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"It was an endpoint management platform. Số lượng services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported dữ liệu gì through giao thức; services communicated by REST/gRPC/message bro", "catLabel": "Microservices & System Design"}, {"id": "system-design-17", "title": "Design a URL shortener.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Requirements: create a short link, redirect fast, read-heavy. API: `POST /links` and `GET /{code}`. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a key-value lookup from code to URL. Redirects are served from a cache such as Redis in front of the database, with a CDN for popular links. I'd add rate limiting on creation, expiry, and async click analytics through a queue.\"", "kind": "qa", "num": 17, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Requirements: create a short link, redirect fast, read-heavy. API: POST /links and GET /{code}. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a k", "catLabel": "Microservices & System Design"}, {"id": "system-design-18", "title": "Design a rate limiter.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with `Retry-After`, and fails open if Redis is unavailable unless the endpoint is security-sensitive. A sliding window counter is the alternative when I need smoother limits.\"", "kind": "qa", "num": 18, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with Retry-After, and", "catLabel": "Microservices & System Design"}, {"id": "system-design-19", "title": "How do you use caching, and what can go wrong?", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock or jittered TTLs, and cache penetration for missing keys, handled by caching negative results. A CDN applies the same idea at the edge for static and cacheable responses.\"\n\n*Ghi chú: bạn chưa làm thực tế với CDN, nên nếu bị hỏi sâu hãy nói thẳng là bạn hiểu nguyên lý (edge cache, TTL, cache key, invalidation) nhưng chưa vận hành.*", "kind": "qa", "num": 19, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock ", "catLabel": "Microservices & System Design"}, {"id": "system-design-20", "title": "How do you scale a database?", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, because sharding complicates joins, transactions and rebalancing.\"", "kind": "qa", "num": 20, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, becaus", "catLabel": "Microservices & System Design"}, {"id": "sd-ride-matching", "title": "Design a ride-hailing service that matches riders with nearby drivers.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "geo", "kafka"], "body": "*Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải.*\n\n\"**Requirements.** Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds, a driver is never assigned twice, highly available.\n\n**Estimates.** Say 1 million online drivers sending a location every 4 seconds: about 250,000 location writes per second. That's the hot path, so locations don't go to a relational database.\n\n**Components.**\n\n- A *location service* receives driver updates over a persistent connection, gRPC or WebSocket. It keeps the latest position in memory or Redis, indexed by geospatial cell (geohash or H3), and partitioned by city or cell so each node handles one region.\n- A *matching service* takes a ride request, looks up drivers in the rider's cell and neighbouring cells, ranks them by ETA rather than straight-line distance, and offers the trip to the best one with a short timeout, moving to the next on decline or timeout.\n- A *trip service* owns the trip state machine (requested, matched, arriving, in progress, completed) in a durable database, and publishes events to Kafka for pricing, notifications and analytics.\n\n**Consistency.** To avoid assigning one driver to two trips, I take a short lock or do an atomic compare-and-set on the driver's status (available to reserved), for example Redis `SET NX` with a TTL, and only then send the offer.\n\n**Failure handling.** Location data is ephemeral, so losing a node only costs a few seconds until drivers report again. Trip state is durable and every state transition is idempotent, so retries from mobile clients are safe.\n\n**Scaling.** Partition by geography, because almost all queries are local. Hot cells in city centres can be split into smaller cells.\"", "excerpt": "Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải. \"Requirements. Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds,", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-wallet", "title": "Design a wallet / payment ledger that never loses or double-counts money.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "payments", "kafka"], "body": "\"**Requirements.** Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail.\n\n**Data model.** A double-entry ledger: each transaction writes at least two immutable entries, a debit and a credit, that sum to zero. The balance is derived from entries, and I keep a cached balance column updated in the same database transaction for fast reads. Amounts are stored as integers in the smallest currency unit, never floating point.\n\n**Correctness.**\n\n- *Idempotency:* every request carries an idempotency key stored with a unique constraint in the same transaction, so a retry returns the original result instead of charging twice.\n- *Concurrency:* update the balance with a conditional statement, such as `UPDATE wallet SET balance = balance - :amt WHERE id = :id AND balance >= :amt`, or with optimistic locking on a version column. This prevents overdrafts under concurrent payments.\n- *Transfers across shards:* if both wallets are in one database, use one local transaction. Across services or shards, use a saga with a pending state and compensation, never a distributed transaction.\n\n**External payment providers.** Calls are asynchronous: create a pending record, call the provider with our idempotency key, and confirm through the callback or by polling. A daily reconciliation job compares our ledger with provider reports and flags mismatches.\n\n**Events.** Use the outbox pattern to publish 'payment completed' events to Kafka, so downstream services see every committed transaction exactly once in effect.\n\n**Scale.** Shard by wallet ID. Hot merchant wallets can be split into sub-accounts that are summed for reads.\"", "excerpt": "\"Requirements. Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail. Data model. A double-entry ledger: each transaction writes at least two immutable en", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-rest", "title": "What are REST principles? Is REST always stateless?", "cat": "arch", "section": "Microservices (EPAM rapid-fire)", "kind": "qa", "tags": ["rest", "api-design", "epam"], "body": "\"REST constraints: client-server separation; **statelessness**, where every request carries everything needed to process it; cacheable responses; a uniform interface built on resources, URIs, standard HTTP methods and representations; and a layered system, so clients don't know if they talk to a proxy, gateway or the real server. Code on demand is optional.\n\nStatelessness is about **the server not keeping client session state between requests**. A REST API can still identify a user on every request with a token such as a JWT; that's stateless because the token travels with each request. Storing a server-side session tied to a cookie technically breaks the constraint and makes horizontal scaling harder, since requests then need sticky sessions or a shared session store like Redis. The business data itself, in the database, is of course state; the constraint is only about conversational state.\"", "excerpt": "\"REST constraints: client-server separation; statelessness, where every request carries everything needed to process it; cacheable responses; a uniform interface built on resources, URIs, standard HTTP methods and repres", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-cb-open", "title": "What happens if a circuit breaker stays open too long?", "cat": "arch", "section": "Microservices (EPAM rapid-fire)", "kind": "qa", "tags": ["microservices", "resilience", "circuit-breaker", "epam"], "body": "\"A circuit breaker has three states. **Closed:** calls pass and failures are counted. **Open:** calls fail fast without reaching the dependency. **Half-open:** after a wait duration, a few trial calls are allowed; success closes it, failure opens it again.\n\nIf it stays open too long, the dependency may have recovered while we keep rejecting requests, which turns a short outage into a long one for users. Causes: a wait duration that's too long, or a half-open trial that's too strict or keeps hitting a cold dependency.\n\nTuning in Resilience4j: a reasonable `waitDurationInOpenState`, a small `permittedNumberOfCallsInHalfOpenState`, a sliding window and threshold based on real traffic, and slow-call thresholds. While open, return a **fallback**, such as cached data or a degraded response, and **alert** on state changes so humans know the dependency is down.\"", "excerpt": "\"A circuit breaker has three states. Closed: calls pass and failures are counted. Open: calls fail fast without reaching the dependency. Half-open: after a wait duration, a few trial calls are allowed; success closes it,", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sync-async-code", "title": "Trong một service, xử lý đồng bộ và bất đồng bộ khác nhau thế nào? @Async, CompletableFuture, reactive, virtual threads? / Within one service, how do synchronous and asynchronous processing differ? @Async, CompletableFuture, reactive, virtual threads?", "cat": "arch", "section": "Request flow & sync/async", "kind": "qa", "tags": ["async", "concurrency", "spring", "kafka"], "body": "### Tiếng Việt\n\nCâu này hỏi về **cách code xử lý bên trong một service**, khác với giao tiếp giữa các service.\n\n**Hai khái niệm hay bị nhầm:**\n- **Blocking và non-blocking:** thread có bị **đứng chờ** I/O (DB, HTTP) hay không.\n- **Đồng bộ và bất đồng bộ:** bên gọi có **chờ kết quả** rồi mới làm tiếp hay không.\n\n| Cách | Mô hình | Ví dụ | Ưu | Nhược |\n|---|---|---|---|---|\n| **Blocking thông thường** (Spring MVC) | Mỗi request một thread, thread chờ I/O | `repo.findById()`, `restClient.get()` | Đơn giản, dễ debug, stack trace rõ | Mỗi request giữ một thread khi chờ; số thread giới hạn throughput |\n| **`@Async`** | Đẩy việc sang thread pool khác, trả về ngay | Gửi email sau khi đăng ký | Response nhanh hơn | **Mất việc nếu app chết** (chỉ nằm trong RAM); lỗi dễ bị nuốt; gọi trong cùng class thì không chạy bất đồng bộ (proxy) |\n| **`CompletableFuture`** | Chạy song song nhiều việc rồi gộp kết quả | Gọi 3 service cùng lúc | Giảm độ trễ: tổng thời gian bằng việc **lâu nhất** thay vì tổng các việc | Code khó đọc hơn; phải tự cấp executor và xử lý timeout |\n| **Reactive** (WebFlux, Reactor) | Non-blocking hoàn toàn, vài thread phục vụ rất nhiều request | `Mono`, `Flux`, `WebClient`, R2DBC | Throughput cao, có backpressure | **Khó học, khó debug**; mọi thư viện phải non-blocking (JDBC thì không); một lời gọi blocking làm hỏng cả hệ thống |\n| **Virtual threads** (Java 21+) | Code blocking bình thường, JVM tự gỡ thread khi chờ I/O | Spring MVC + `spring.threads.virtual.enabled=true` | Throughput gần reactive mà code vẫn đơn giản | Cần để ý pinning (Java 21–23), vẫn phải giới hạn tài nguyên phía sau |\n| **Message queue** | Ghi vào Kafka hoặc RabbitMQ, worker xử lý | Tạo báo cáo, thông báo | **Bền vững**: không mất việc khi app chết, có retry | Hạ tầng phức tạp hơn, eventual consistency |\n\n```java\n// Gọi song song bằng CompletableFuture, có timeout\nvar executor = Executors.newVirtualThreadPerTaskExecutor();\nCompletableFuture<User>  u = CompletableFuture.supplyAsync(() -> userClient.get(id), executor);\nCompletableFuture<List<Order>> o = CompletableFuture.supplyAsync(() -> orderClient.list(id), executor);\nProfile p = u.thenCombine(o, Profile::new)\n             .orTimeout(2, TimeUnit.SECONDS)\n             .join();            // tổng thời gian ≈ max(user, order), không phải user + order\n```\n\n**`@Async` dùng đúng cách:**\n- Cấu hình **executor riêng** có giới hạn (`ThreadPoolTaskExecutor` với queue capacity), đừng dùng mặc định.\n- Bắt lỗi bằng `AsyncUncaughtExceptionHandler`, hoặc trả về `CompletableFuture` để bên gọi xử lý.\n- Gọi từ **bean khác**, không gọi `this.method()`.\n- Việc **không được mất** (thanh toán, email quan trọng) thì dùng outbox và message queue, **không dùng `@Async`**.\n\n**Chọn cách nào:**\n- Service CRUD và nghiệp vụ thông thường: **Spring MVC + virtual threads**.\n- Cần gọi song song nhiều nguồn: `CompletableFuture` hoặc structured concurrency.\n- Streaming, rất nhiều kết nối lâu (WebSocket, SSE, gateway): **reactive** đáng để đầu tư.\n- Việc chạy nền cần bền vững: **message queue**.\n\n### English\n\nThis question is about **how code is processed inside one service**, which is different from communication between services.\n\n**Two concepts that often get mixed up:**\n- **Blocking vs non-blocking:** whether a thread **sits waiting** on I/O (DB, HTTP).\n- **Synchronous vs asynchronous:** whether the caller **waits for the result** before continuing.\n\n| Approach | Model | Example | Pros | Cons |\n|---|---|---|---|---|\n| **Plain blocking** (Spring MVC) | One thread per request; the thread waits on I/O | `repo.findById()`, `restClient.get()` | Simple, easy to debug, clear stack traces | Each request holds a thread while waiting; the thread count caps throughput |\n| **`@Async`** | Hands work to another thread pool and returns immediately | Sending an email after sign-up | Faster responses | **Work is lost if the app dies** (it lives only in memory); errors are easily swallowed; calls within the same class don't run asynchronously (proxies) |\n| **`CompletableFuture`** | Runs several tasks in parallel and combines the results | Calling 3 services at once | Lower latency: total time equals the **slowest** task instead of the sum | Harder to read; you must supply the executor and handle timeouts |\n| **Reactive** (WebFlux, Reactor) | Fully non-blocking; a few threads serve very many requests | `Mono`, `Flux`, `WebClient`, R2DBC | High throughput, built-in backpressure | **Hard to learn and debug**; every library must be non-blocking (JDBC isn't); one blocking call breaks the whole system |\n| **Virtual threads** (Java 21+) | Ordinary blocking code; the JVM unmounts threads while they wait on I/O | Spring MVC + `spring.threads.virtual.enabled=true` | Throughput close to reactive with simple code | Watch for pinning (Java 21–23); downstream resources still need limits |\n| **Message queues** | Write to Kafka or RabbitMQ; workers process it | Report generation, notifications | **Durable**: work isn't lost if the app dies, with retries | More infrastructure, eventual consistency |\n\n```java\n// Parallel calls with CompletableFuture, with a timeout\nvar executor = Executors.newVirtualThreadPerTaskExecutor();\nCompletableFuture<User>  u = CompletableFuture.supplyAsync(() -> userClient.get(id), executor);\nCompletableFuture<List<Order>> o = CompletableFuture.supplyAsync(() -> orderClient.list(id), executor);\nProfile p = u.thenCombine(o, Profile::new)\n             .orTimeout(2, TimeUnit.SECONDS)\n             .join();            // total time ≈ max(user, order), not user + order\n```\n\n**Using `@Async` correctly:**\n- Configure a **dedicated, bounded executor** (`ThreadPoolTaskExecutor` with a queue capacity); don't rely on the default.\n- Catch errors with an `AsyncUncaughtExceptionHandler`, or return a `CompletableFuture` so the caller handles them.\n- Call it from **another bean**, not via `this.method()`.\n- For work that **must not be lost** (payments, important emails), use an outbox and a message queue, **not `@Async`**.\n\n**Which to choose:**\n- Ordinary CRUD and business services: **Spring MVC + virtual threads**.\n- Calling several sources in parallel: `CompletableFuture` or structured concurrency.\n- Streaming, or very many long-lived connections (WebSocket, SSE, gateways): **reactive** is worth the investment.\n- Durable background work: **message queues**.", "excerpt": "Câu này hỏi về cách code xử lý bên trong một service, khác với giao tiếp giữa các service. Hai khái niệm hay bị nhầm: Blocking và non-blocking: thread có bị đứng chờ I/O (DB, HTTP) hay không. Đồng bộ và bất đồng bộ: bên ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "request-flow", "title": "Mô tả toàn bộ hành trình của một request từ lúc client gửi đến khi nhận response. / Walk through the full journey of a request from the client sending it to receiving the response.", "cat": "arch", "section": "Request flow & sync/async", "kind": "qa", "tags": ["request-flow", "networking", "spring", "opswat", "kafka", "kubernetes"], "body": "### Tiếng Việt\n\n**Ví dụ:** app mobile gọi `POST https://api.shop.vn/api/orders` để đặt hàng. Backend là Spring Boot trên Kubernetes (AWS), dùng PostgreSQL, Redis và Kafka.\n\n```\nClient ─► DNS ─► TCP + TLS ─► CDN/WAF ─► Load balancer (ALB) ─► Ingress / API gateway\n       ─► Kubernetes Service ─► Pod: Tomcat ─► Filter chain (Security) ─► DispatcherServlet\n       ─► Controller ─► Service (@Transactional) ─► Redis / DB / service khác ─► Outbox\n       ◄─ JSON response ◄──────────────────────────────────────────────────── (ngược lại)\n                       └─► (sau commit) Relay ─► Kafka ─► Payment, Inventory, Notification\n```\n\n**Phần 1: Mạng, trước khi đến backend**\n\n1. **DNS:** client hỏi IP của `api.shop.vn` (cache của máy, resolver, rồi Route 53). Có thể là GeoDNS trả về region gần nhất.\n2. **Kết nối TCP:** bắt tay 3 bước (SYN, SYN-ACK, ACK).\n3. **TLS handshake:** thỏa thuận mã hóa, server gửi chứng chỉ, client kiểm tra. TLS 1.3 mất 1 round trip. Các request sau **tái sử dụng kết nối** (keep-alive, HTTP/2) nên bỏ qua bước 1–3.\n4. **CDN / WAF** (CloudFront, Cloudflare): chặn tấn công (SQL injection, bot), rate limit thô. API `POST` không cache, nên được chuyển tiếp về origin.\n5. **Load balancer** (AWS ALB, L7): thường **kết thúc TLS** ở đây, chọn một node hoặc target khỏe mạnh qua health check, thêm header `X-Forwarded-For`, `X-Forwarded-Proto`.\n6. **Ingress / API gateway** (Nginx Ingress, Kong, Spring Cloud Gateway): định tuyến theo path `/api/orders` sang `order-service`; có thể **xác thực JWT** một lần, rate limit theo user, gắn `X-Request-Id`/trace id. (Ở Opswat: forward auth, auth service kiểm tra token rồi gắn header `X-User-Id` để service phía sau không phải xác thực lại.)\n7. **Kubernetes Service:** chọn một pod đang **Ready** (kube-proxy, iptables/IPVS).\n\n**Phần 2: Bên trong service Spring Boot**\n\n8. **Tomcat** nhận kết nối, lấy **một thread** từ pool (mặc định tối đa 200, hoặc một virtual thread nếu bật), parse HTTP.\n9. **Servlet filter chain:**\n   - Filter tracing/logging: đọc trace id, đưa vào MDC để mọi dòng log có trace id.\n   - **Spring Security filter chain:** `BearerTokenAuthenticationFilter` kiểm tra chữ ký và hạn của JWT, tạo `Authentication` và lưu trong `SecurityContextHolder`; kiểm tra quyền. Lỗi thì trả **401/403**, request không đi tiếp.\n   - CORS, nén...\n10. **`DispatcherServlet`:** `HandlerMapping` tìm method khớp `POST /api/orders`, chạy interceptor `preHandle`, rồi `HandlerAdapter` gọi method.\n11. **Chuyển body thành object:** `HttpMessageConverter` (Jackson) đọc JSON thành `CreateOrderRequest`; **`@Valid`** kiểm tra; sai thì `MethodArgumentNotValidException` trả **400**.\n12. **Controller** gọi **service**. Proxy `@Transactional` **mở transaction**: lấy một kết nối từ **HikariCP** (hết kết nối thì chờ, quá `connectionTimeout` thì lỗi).\n13. **Logic nghiệp vụ:**\n    - Kiểm tra **idempotency key** (header `Idempotency-Key`), trùng thì trả lại kết quả cũ.\n    - Đọc giá sản phẩm từ **Redis** (cache-aside; miss thì đọc DB).\n    - Gọi **đồng bộ** Inventory service để giữ hàng, có timeout và circuit breaker. *Không nên gọi HTTP khi đang giữ transaction DB lâu; tốt hơn là gọi trước khi mở transaction, hoặc chuyển sang saga.*\n    - **Hibernate** sinh SQL `INSERT INTO orders ...`, chạy trên PostgreSQL (ghi **WAL**, cập nhật index, MVCC).\n    - **Ghi dòng outbox** `OrderCreated` trong cùng transaction.\n14. **Commit:** Hibernate flush, PostgreSQL commit (WAL được fsync, nên dữ liệu bền vững), kết nối trả về pool.\n15. **Response:** controller trả `OrderResponse` với status **201 Created** và header `Location`; Jackson ghi thành JSON; filter ghi log access (method, path, status, thời gian). Lỗi ở bất kỳ đâu sẽ đi qua `@ControllerAdvice` và được trả theo dạng `ProblemDetail`.\n16. Thread trả về pool. Response đi ngược lại qua LB, CDN, rồi tới client.\n\n**Phần 3: Phần bất đồng bộ sau khi trả response**\n\n17. **Relay outbox** (Debezium hoặc polling) đọc `OrderCreated` rồi phát lên Kafka, key là `orderId`.\n18. **Payment, Inventory, Notification** consume sự kiện, mỗi service xử lý **idempotent**, rồi phát tiếp sự kiện của mình (`PaymentCompleted`...). Đó là saga.\n19. Client nhận trạng thái cuối qua **polling** (`GET /api/orders/{id}`), **WebSocket/SSE**, hoặc **push notification**.\n\n**Phần 4: Quan sát xuyên suốt**\n- **Trace id** đi qua header HTTP và header Kafka, nên Jaeger hoặc Tempo vẽ được toàn bộ hành trình.\n- Metrics: số request, tỷ lệ lỗi, p99 latency (Micrometer, Prometheus); log JSON có trace id (ELK, Loki).\n\n**Những câu interviewer hay hỏi tiếp:**\n\n| Câu hỏi | Ý chính để trả lời |\n|---|---|\n| \"Chỗ nào có thể chậm?\" | DNS/TLS ở lần đầu, hết connection pool, query thiếu index, gọi đồng bộ tới service chậm, GC pause |\n| \"Pod chết giữa chừng thì sao?\" | Trước commit: transaction rollback, client nhận lỗi rồi retry với cùng idempotency key. Sau commit: dữ liệu và outbox đã lưu, relay vẫn phát sự kiện |\n| \"Client retry thì có tạo trùng đơn không?\" | Không, nhờ **idempotency key** lưu cùng đơn hàng (unique constraint) |\n| \"Xác thực ở đâu?\" | Gateway kiểm tra token; service vẫn kiểm tra **quyền** trên tài nguyên (user chỉ xem được đơn của mình) |\n| \"Vì sao trả 201 mà thanh toán chưa xong?\" | Đơn ở trạng thái `PENDING_PAYMENT`; phần còn lại là bất đồng bộ (saga), client theo dõi trạng thái |\n\n### English\n\n**Example:** a mobile app calls `POST https://api.shop.vn/api/orders` to place an order. The backend is Spring Boot on Kubernetes (AWS), with PostgreSQL, Redis and Kafka.\n\n```\nClient ─► DNS ─► TCP + TLS ─► CDN/WAF ─► Load balancer (ALB) ─► Ingress / API gateway\n       ─► Kubernetes Service ─► Pod: Tomcat ─► Filter chain (Security) ─► DispatcherServlet\n       ─► Controller ─► Service (@Transactional) ─► Redis / DB / other services ─► Outbox\n       ◄─ JSON response ◄───────────────────────────────────────────────────── (way back)\n                       └─► (after commit) Relay ─► Kafka ─► Payment, Inventory, Notification\n```\n\n**Part 1: The network, before reaching the backend**\n\n1. **DNS:** the client resolves `api.shop.vn` to an IP (local cache, resolver, then Route 53). GeoDNS may return the nearest region.\n2. **TCP connection:** the three-way handshake (SYN, SYN-ACK, ACK).\n3. **TLS handshake:** cipher negotiation; the server sends its certificate and the client verifies it. TLS 1.3 takes 1 round trip. Later requests **reuse the connection** (keep-alive, HTTP/2), skipping steps 1–3.\n4. **CDN / WAF** (CloudFront, Cloudflare): blocks attacks (SQL injection, bots) and does coarse rate limiting. A `POST` API call isn't cached, so it's forwarded to the origin.\n5. **Load balancer** (AWS ALB, L7): usually **terminates TLS** here, picks a healthy node or target via health checks, and adds `X-Forwarded-For` and `X-Forwarded-Proto` headers.\n6. **Ingress / API gateway** (Nginx Ingress, Kong, Spring Cloud Gateway): routes the `/api/orders` path to `order-service`; may **validate the JWT** once, rate limit per user, and attach an `X-Request-Id`/trace id. (At Opswat: forward auth, where an auth service validates the token and sets an `X-User-Id` header so downstream services don't re-authenticate.)\n7. **Kubernetes Service:** picks a pod that is **Ready** (kube-proxy, iptables/IPVS).\n\n**Part 2: Inside the Spring Boot service**\n\n8. **Tomcat** accepts the connection, takes **one thread** from its pool (200 max by default, or a virtual thread if enabled), and parses the HTTP.\n9. **Servlet filter chain:**\n   - Tracing/logging filters: read the trace id and put it in the MDC so every log line carries it.\n   - **Spring Security's filter chain:** `BearerTokenAuthenticationFilter` checks the JWT's signature and expiry, builds an `Authentication` stored in the `SecurityContextHolder`, and checks permissions. On failure it returns **401/403** and the request goes no further.\n   - CORS, compression, and so on.\n10. **`DispatcherServlet`:** the `HandlerMapping` finds the method matching `POST /api/orders`, interceptors' `preHandle` run, then a `HandlerAdapter` invokes the method.\n11. **Turning the body into an object:** an `HttpMessageConverter` (Jackson) reads the JSON into a `CreateOrderRequest`; **`@Valid`** validates it; failures raise `MethodArgumentNotValidException` and return **400**.\n12. The **controller** calls the **service**. The `@Transactional` proxy **opens a transaction**: it takes a connection from **HikariCP** (if none are free it waits, and errors after `connectionTimeout`).\n13. **Business logic:**\n    - Check the **idempotency key** (the `Idempotency-Key` header); on a duplicate, return the previous result.\n    - Read product prices from **Redis** (cache-aside; on a miss, read the DB).\n    - Call the Inventory service **synchronously** to reserve stock, with a timeout and circuit breaker. *Avoid HTTP calls while holding a DB transaction open for long; better to call before opening the transaction, or move to a saga.*\n    - **Hibernate** generates `INSERT INTO orders ...`, which runs on PostgreSQL (writes the **WAL**, updates indexes, MVCC).\n    - **Write the outbox row** `OrderCreated` in the same transaction.\n14. **Commit:** Hibernate flushes, PostgreSQL commits (the WAL is fsynced, so the data is durable), and the connection goes back to the pool.\n15. **Response:** the controller returns an `OrderResponse` with status **201 Created** and a `Location` header; Jackson writes it as JSON; a filter writes the access log (method, path, status, duration). Errors anywhere go through `@ControllerAdvice` and come back as a `ProblemDetail`.\n16. The thread returns to the pool. The response travels back through the LB and CDN to the client.\n\n**Part 3: The asynchronous part after the response**\n\n17. The **outbox relay** (Debezium or polling) reads `OrderCreated` and publishes it to Kafka, keyed by `orderId`.\n18. **Payment, Inventory and Notification** consume the event, each processing it **idempotently**, and publish their own events (`PaymentCompleted`, ...). That's the saga.\n19. The client gets the final status by **polling** (`GET /api/orders/{id}`), via **WebSocket/SSE**, or through a **push notification**.\n\n**Part 4: Observability end to end**\n- The **trace id** travels in HTTP headers and Kafka headers, so Jaeger or Tempo can draw the whole journey.\n- Metrics: request count, error rate, p99 latency (Micrometer, Prometheus); JSON logs with the trace id (ELK, Loki).\n\n**Common follow-up questions:**\n\n| Question | Key points to answer |\n|---|---|\n| \"Where can it be slow?\" | DNS/TLS on the first request, an exhausted connection pool, queries missing indexes, synchronous calls to slow services, GC pauses |\n| \"What if the pod dies midway?\" | Before commit: the transaction rolls back, the client gets an error and retries with the same idempotency key. After commit: the data and outbox are saved, and the relay still publishes the event |\n| \"Can a client retry create duplicate orders?\" | No, thanks to the **idempotency key** stored with the order (a unique constraint) |\n| \"Where does authentication happen?\" | The gateway validates the token; the service still checks **authorization** on the resource (users can only see their own orders) |\n| \"Why return 201 when payment isn't done?\" | The order is in `PENDING_PAYMENT`; the rest is asynchronous (a saga), and the client tracks the status |", "excerpt": "Ví dụ: app mobile gọi POST https://api.shop.vn/api/orders để đặt hàng. Backend là Spring Boot trên Kubernetes (AWS), dùng PostgreSQL, Redis và Kafka. Phần 1: Mạng, trước khi đến backend DNS: client hỏi IP của api.shop.vn", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-scale-up-out", "title": "Scale dọc (vertical) và scale ngang (horizontal) khác nhau thế nào? Khi nào chọn cái nào? / Vertical vs horizontal scaling: how do they differ, and when do you choose each?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["scalability", "system-design", "kafka"], "body": "### Tiếng Việt\n\n**Scale dọc (vertical, scale up):** nâng cấp **một máy** mạnh hơn: thêm CPU, RAM, ổ nhanh hơn. Ví dụ đổi RDS từ `db.r6g.large` (2 vCPU, 16 GB) lên `db.r6g.4xlarge` (16 vCPU, 128 GB).\n\n**Scale ngang (horizontal, scale out):** thêm **nhiều máy** chạy cùng một việc, đặt sau load balancer. Ví dụ tăng từ 3 lên 10 pod của order service.\n\n| | Scale dọc | Scale ngang |\n|---|---|---|\n| Cách làm | Máy to hơn | Thêm máy |\n| Sửa code | **Không cần** | Ứng dụng phải **stateless** (hoặc dữ liệu phải được chia) |\n| Giới hạn | Có trần cứng: máy lớn nhất có hạn, và giá tăng **nhanh hơn tuyến tính** | Gần như không giới hạn với tầng stateless |\n| Chịu lỗi | Vẫn là **một điểm hỏng duy nhất** (SPOF) | Một máy chết, các máy khác gánh |\n| Downtime khi nâng | Thường phải restart, failover | Thêm hoặc bớt node không cần dừng |\n| Độ phức tạp | Thấp | Cao hơn: load balancer, phân tán dữ liệu, nhất quán, deploy, quan sát |\n| Hợp với | Database quan hệ (một primary), giai đoạn đầu, tải tăng vừa phải | Tầng ứng dụng web và API, cache cluster, Kafka, Cassandra |\n\n**Điều kiện để scale ngang tầng ứng dụng: stateless.** Mọi request phải xử lý được ở **bất kỳ instance nào**. Trạng thái phải đưa ra ngoài:\n- **Session:** dùng JWT, hoặc lưu session trong Redis (Spring Session), thay vì lưu trong bộ nhớ instance.\n- **File upload:** đưa lên S3 hoặc object storage, không ghi ổ đĩa local.\n- **Cache local:** chấp nhận lệch giữa các instance, hoặc dùng Redis.\n- **Job định kỳ:** chỉ một instance được chạy, dùng khóa phân tán (ShedLock) hoặc tách ra thành job riêng.\n- **Sticky session** (load balancer gắn user vào một instance) là cách chữa cháy: tải không đều, và instance chết thì mất session.\n\n**Database khó scale ngang hơn**, vì dữ liệu có trạng thái. Thứ tự thường làm:\n1. Tối ưu query và index.\n2. **Scale dọc** primary.\n3. Thêm **cache**.\n4. **Read replica** cho truy vấn đọc.\n5. **Partitioning** trong một máy.\n6. Cuối cùng mới **sharding**, vì nó làm mọi thứ phức tạp hơn (JOIN và transaction xuyên shard, rebalance).\n\nXem thêm [How do you scale a database?](#system-design-20) và [Replication & sharding](#db-replication-sharding).\n\n**Câu trả lời mẫu:** *\"Tôi scale ngang tầng ứng dụng vì nó rẻ và chịu lỗi tốt, với điều kiện service stateless: session ở Redis hoặc JWT, file ở S3. Với database, tôi scale dọc và thêm read replica trước, chỉ sharding khi một primary thật sự không chịu nổi lượng ghi, vì sharding tốn chi phí vận hành lớn.\"*\n\n### English\n\n**Vertical scaling (scale up):** make **one machine** more powerful: more CPU, more RAM, faster disks. For example, moving RDS from `db.r6g.large` (2 vCPU, 16 GB) to `db.r6g.4xlarge` (16 vCPU, 128 GB).\n\n**Horizontal scaling (scale out):** add **more machines** doing the same job behind a load balancer. For example, going from 3 to 10 pods of the order service.\n\n| | Vertical | Horizontal |\n|---|---|---|\n| How | A bigger machine | More machines |\n| Code changes | **None needed** | The application must be **stateless** (or the data must be partitioned) |\n| Limits | A hard ceiling: the biggest machine is finite, and price grows **faster than linearly** | Practically unlimited for stateless tiers |\n| Fault tolerance | Still a **single point of failure** (SPOF) | If one machine dies, the others take over |\n| Downtime when upgrading | Usually a restart or failover | Adding or removing nodes needs no downtime |\n| Complexity | Low | Higher: load balancers, data distribution, consistency, deployment, observability |\n| Fits | Relational databases (a single primary), early stages, moderate growth | Web and API tiers, cache clusters, Kafka, Cassandra |\n\n**The prerequisite for scaling the application tier horizontally: statelessness.** Every request must be servable by **any instance**. State has to move out:\n- **Sessions:** use JWTs, or store sessions in Redis (Spring Session), instead of in instance memory.\n- **File uploads:** put them in S3 or object storage, not on the local disk.\n- **Local caches:** accept divergence between instances, or use Redis.\n- **Scheduled jobs:** only one instance may run them, using a distributed lock (ShedLock) or a separate job.\n- **Sticky sessions** (the load balancer pins a user to one instance) are a stopgap: load becomes uneven, and if the instance dies the session is lost.\n\n**Databases are harder to scale horizontally**, because they hold state. The usual order:\n1. Optimize queries and indexes.\n2. **Scale up** the primary.\n3. Add a **cache**.\n4. **Read replicas** for read queries.\n5. **Partitioning** within one machine.\n6. Only then **sharding**, because it complicates everything (cross-shard JOINs and transactions, rebalancing).\n\nSee also [How do you scale a database?](#system-design-20) and [Replication & sharding](#db-replication-sharding).\n\n**A model answer:** *\"I scale the application tier horizontally because it's cheap and fault tolerant, as long as services are stateless: sessions in Redis or JWTs, files in S3. For the database I scale up and add read replicas first, and only shard when a single primary truly can't handle the write load, because sharding carries a large operational cost.\"*", "excerpt": "Scale dọc (vertical, scale up): nâng cấp một máy mạnh hơn: thêm CPU, RAM, ổ nhanh hơn. Ví dụ đổi RDS từ db.r6g.large (2 vCPU, 16 GB) lên db.r6g.4xlarge (16 vCPU, 128 GB). Scale ngang (horizontal, scale out): thêm nhiều m", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-load-balancer", "title": "Load balancer hoạt động thế nào? L4 và L7 khác gì? Có những thuật toán nào? / How does a load balancer work? How do L4 and L7 differ, and what algorithms exist?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["scalability", "load-balancer", "kubernetes"], "body": "### Tiếng Việt\n\n**Load balancer (LB)** nhận request rồi phân phối cho nhiều instance phía sau, đồng thời **loại instance hỏng** ra khỏi vòng quay nhờ health check.\n\n**L4 và L7:**\n\n| | L4 (transport, TCP/UDP) | L7 (application, HTTP) |\n|---|---|---|\n| Nhìn thấy gì | IP và port | URL, header, cookie, method, body |\n| Định tuyến | Chỉ theo kết nối | Theo nội dung: `/api/orders` sang order service, `/api/users` sang user service |\n| Tốc độ | Rất nhanh, ít tốn CPU | Chậm hơn một chút vì phải đọc HTTP |\n| Làm được thêm | | Kết thúc TLS, nén, rewrite, rate li
