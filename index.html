ST/gRPC/message bro", "catLabel": "Microservices & System Design"}, {"id": "system-design-17", "title": "Design a URL shortener.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Requirements: create a short link, redirect fast, read-heavy. API: `POST /links` and `GET /{code}`. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a key-value lookup from code to URL. Redirects are served from a cache such as Redis in front of the database, with a CDN for popular links. I'd add rate limiting on creation, expiry, and async click analytics through a queue.\"", "kind": "qa", "num": 17, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Requirements: create a short link, redirect fast, read-heavy. API: POST /links and GET /{code}. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a k", "catLabel": "Microservices & System Design"}, {"id": "system-design-18", "title": "Design a rate limiter.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with `Retry-After`, and fails open if Redis is unavailable unless the endpoint is security-sensitive. A sliding window counter is the alternative when I need smoother limits.\"", "kind": "qa", "num": 18, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with Retry-After, and", "catLabel": "Microservices & System Design"}, {"id": "system-design-19", "title": "How do you use caching, and what can go wrong?", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock or jittered TTLs, and cache penetration for missing keys, handled by caching negative results. A CDN applies the same idea at the edge for static and cacheable responses.\"\n\n*Ghi chú: bạn chưa làm thực tế với CDN, nên nếu bị hỏi sâu hãy nói thẳng là bạn hiểu nguyên lý (edge cache, TTL, cache key, invalidation) nhưng chưa vận hành.*", "kind": "qa", "num": 19, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock ", "catLabel": "Microservices & System Design"}, {"id": "system-design-20", "title": "How do you scale a database?", "cat": "arch", "section": "System design", "tags": ["system-design", "transaction"], "body": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, because sharding complicates joins, transactions and rebalancing.\"", "kind": "qa", "num": 20, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, becaus", "catLabel": "Microservices & System Design"}, {"id": "sd-ride-matching", "title": "Design a ride-hailing service that matches riders with nearby drivers.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "geo", "kafka"], "body": "*Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải.*\n\n\"**Requirements.** Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds, a driver is never assigned twice, highly available.\n\n**Estimates.** Say 1 million online drivers sending a location every 4 seconds: about 250,000 location writes per second. That's the hot path, so locations don't go to a relational database.\n\n**Components.**\n\n- A *location service* receives driver updates over a persistent connection, gRPC or WebSocket. It keeps the latest position in memory or Redis, indexed by geospatial cell (geohash or H3), and partitioned by city or cell so each node handles one region.\n- A *matching service* takes a ride request, looks up drivers in the rider's cell and neighbouring cells, ranks them by ETA rather than straight-line distance, and offers the trip to the best one with a short timeout, moving to the next on decline or timeout.\n- A *trip service* owns the trip state machine (requested, matched, arriving, in progress, completed) in a durable database, and publishes events to Kafka for pricing, notifications and analytics.\n\n**Consistency.** To avoid assigning one driver to two trips, I take a short lock or do an atomic compare-and-set on the driver's status (available to reserved), for example Redis `SET NX` with a TTL, and only then send the offer.\n\n**Failure handling.** Location data is ephemeral, so losing a node only costs a few seconds until drivers report again. Trip state is durable and every state transition is idempotent, so retries from mobile clients are safe.\n\n**Scaling.** Partition by geography, because almost all queries are local. Hot cells in city centres can be split into smaller cells.\"", "excerpt": "Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải. \"Requirements. Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds,", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-wallet", "title": "Design a wallet / payment ledger that never loses or double-counts money.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "payments", "kafka", "transaction"], "body": "\"**Requirements.** Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail.\n\n**Data model.** A double-entry ledger: each transaction writes at least two immutable entries, a debit and a credit, that sum to zero. The balance is derived from entries, and I keep a cached balance column updated in the same database transaction for fast reads. Amounts are stored as integers in the smallest currency unit, never floating point.\n\n**Correctness.**\n\n- *Idempotency:* every request carries an idempotency key stored with a unique constraint in the same transaction, so a retry returns the original result instead of charging twice.\n- *Concurrency:* update the balance with a conditional statement, such as `UPDATE wallet SET balance = balance - :amt WHERE id = :id AND balance >= :amt`, or with optimistic locking on a version column. This prevents overdrafts under concurrent payments.\n- *Transfers across shards:* if both wallets are in one database, use one local transaction. Across services or shards, use a saga with a pending state and compensation, never a distributed transaction.\n\n**External payment providers.** Calls are asynchronous: create a pending record, call the provider with our idempotency key, and confirm through the callback or by polling. A daily reconciliation job compares our ledger with provider reports and flags mismatches.\n\n**Events.** Use the outbox pattern to publish 'payment completed' events to Kafka, so downstream services see every committed transaction exactly once in effect.\n\n**Scale.** Shard by wallet ID. Hot merchant wallets can be split into sub-accounts that are summed for reads.\"", "excerpt": "\"Requirements. Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail. Data model. A double-entry ledger: each transaction writes at least two immutable en", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "bai-thuc-hanh-dung-pipeline-cho-mot-spring-boot-service-8-10-gio", "title": "Bài thực hành: dựng pipeline cho một Spring Boot service (8–10 giờ)", "cat": "devops", "section": "Bài thực hành: dựng pipeline cho một Spring Boot service (8–10 giờ)", "kind": "guide", "body": "1. **CI cơ bản:** GitHub Actions chạy build và unit test trên mọi push và pull request; bật branch protection để test fail thì không merge được.\n2. **Quality gate:** thêm Checkstyle hoặc SonarCloud, coverage bằng JaCoCo, và dependency scan.\n3. **Đóng gói:** Dockerfile multi-stage, tag image theo commit SHA, push lên GitHub Container Registry.\n4. **CD:** deploy lên Kubernetes local (`kind`) hoặc một dịch vụ cloud free tier; thêm manual approval trước production.\n5. **Vận hành:** readiness và liveness probe, rollback về image trước, secrets lấy từ GitHub Secrets.\n\nWorkflow tối thiểu để bắt đầu (kiểm tra lại phiên bản action mới nhất khi dùng):\n\n```yaml\nname: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      packages: write\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '21'\n          cache: maven\n      - run: mvn -B verify\n      - uses: docker/login-action@v3\n        if: github.ref == 'refs/heads/main'\n        with:\n          registry: ghcr.io\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n      - uses: docker/build-push-action@v6\n        if: github.ref == 'refs/heads/main'\n        with:\n          context: .\n          push: true\n          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}\n```", "tags": ["huong-dan", "cicd"], "excerpt": "CI cơ bản: GitHub Actions chạy build và unit test trên mọi push và pull request; bật branch protection để test fail thì không merge được. Quality gate: thêm Checkstyle hoặc SonarCloud, coverage bằng JaCoCo, và dependency", "catLabel": "CI/CD & Cloud", "tip": "", "num": null}, {"id": "technical-ci-cd-cloud-devops", "title": "Tổng quan: Technical: CI/CD, cloud, DevOps", "cat": "devops", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Đây là điểm yếu bạn tự nhận, và cách vá nhanh nhất là tự dựng một pipeline thật trong 2–3 ngày rồi trả lời bằng kinh nghiệm đó. Developer senior chỉ cần hiểu và đã từng làm, không cần sâu như DevOps engineer.", "kind": "guide", "excerpt": "Đây là điểm yếu bạn tự nhận, và cách vá nhanh nhất là tự dựng một pipeline thật trong 2–3 ngày rồi trả lời bằng kinh nghiệm đó. Developer senior chỉ cần hiểu và đã từng làm, không cần sâu như DevOps engineer.", "catLabel": "CI/CD & Cloud", "tip": "", "num": null}, {"id": "cicd-1", "title": "What is the difference between CI, continuous delivery and continuous deployment?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Continuous integration means everyone merges small changes often and each change is built and tested automatically. Continuous delivery means every change that passes the pipeline is releasable, and the production release is a manual decision. Continuous deployment removes that manual step: every passing change goes to production automatically.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Continuous integration means everyone merges small changes often and each change is built and tested automatically. Continuous delivery means every change that passes the pipeline is releasable, and the production relea", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-2", "title": "Walk me through the pipeline of your last project.", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "opswat", "dxc", "kubernetes", "docker"], "body": "\"At \\[Opswat/DXC\\] we used \\[Jenkins/GitLab CI/...\\]. A merge request triggered compile, unit tests, static analysis and \\[scan\\]. After merge, the pipeline built a Docker image, pushed it to \\[registry\\] and deployed to \\[dev/staging\\] automatically. Production releases needed \\[approval của ai\\] and ran \\[tần suất\\]. I didn't own the pipeline, so I rebuilt an equivalent one myself with GitHub Actions, Docker and Kubernetes to understand each stage.\"\n\n*Ghi chú: câu cuối biến điểm yếu thành bằng chứng chủ động học; chỉ nói khi đã làm xong bài thực hành.*", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"At Opswat/DXC we used Jenkins/GitLab CI/.... A merge request triggered compile, unit tests, static analysis and scan. After merge, the pipeline built a Docker image, pushed it to registry and deployed to dev/staging aut", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-3", "title": "What stages should a good pipeline have, and in what order?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Fast checks first: compile, unit tests, lint and static analysis. Then security scans for dependencies and secrets, then build the artifact once, run integration tests against it, publish it, deploy to a test environment, run smoke or end-to-end tests, and finally promote to production with an approval or automatically. The principle is fail fast and build once.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Fast checks first: compile, unit tests, lint and static analysis. Then security scans for dependencies and secrets, then build the artifact once, run integration tests against it, publish it, deploy to a test environmen", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-4", "title": "What does 'build once, deploy many' mean?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"The same immutable artifact, identified by commit SHA or version, is promoted through dev, staging and production. Only configuration changes per environment, injected through environment variables, config maps or a secret manager. Rebuilding per environment means production runs something that was never tested.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"The same immutable artifact, identified by commit SHA or version, is promoted through dev, staging and production. Only configuration changes per environment, injected through environment variables, config maps or a sec", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-5", "title": "Compare rolling, blue-green and canary deployments.", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Rolling replaces instances gradually: no extra infrastructure, but two versions run together and rollback is slower. Blue-green runs the new version in a parallel environment and switches traffic at once: instant rollback, double the resources. Canary sends a small percentage of traffic to the new version and increases it while watching metrics: lowest risk, needs good monitoring and traffic control. All three require backward-compatible changes.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"Rolling replaces instances gradually: no extra infrastructure, but two versions run together and rollback is slower. Blue-green runs the new version in a parallel environment and switches traffic at once: instant rollba", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-6", "title": "How do you deploy database changes without downtime?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Schema changes are versioned with Flyway or Liquibase and run in the pipeline. I use expand and contract: first add the new column or table in a backward-compatible way, deploy code that writes both and reads the new one, backfill, then remove the old column in a later release. That way the old and new application versions can both run during a rolling deployment, and I can roll the code back.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Schema changes are versioned with Flyway or Liquibase and run in the pipeline. I use expand and contract: first add the new column or table in a backward-compatible way, deploy code that writes both and reads the new on", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-7", "title": "How do you roll back a bad release?", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "kubernetes"], "body": "\"Redeploy the previous image tag, which is quick because artifacts are immutable; in Kubernetes that's `kubectl rollout undo`. Feature flags let me switch off a feature without redeploying. Database changes are the hard part, which is why migrations must be backward compatible. Afterwards I'd write up the cause and add a test or check so the pipeline catches it next time.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"Redeploy the previous image tag, which is quick because artifacts are immutable; in Kubernetes that's kubectl rollout undo. Feature flags let me switch off a feature without redeploying. Database changes are the hard pa", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-8", "title": "Trunk-based development vs GitFlow?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Trunk-based uses short-lived branches merged to main at least daily, with feature flags hiding unfinished work; it suits continuous delivery and reduces merge conflicts. GitFlow uses long-lived develop and release branches; it suits scheduled releases and supporting several versions, at the cost of slower integration. I prefer trunk-based when the test suite is trustworthy.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Trunk-based uses short-lived branches merged to main at least daily, with feature flags hiding unfinished work; it suits continuous delivery and reduces merge conflicts. GitFlow uses long-lived develop and release branc", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-9", "title": "How do you manage secrets in a pipeline?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Never in the repository or image. They live in the CI system's secret store or a manager such as Vault or AWS Secrets Manager, are injected at runtime, masked in logs, scoped per environment and rotated. I prefer short-lived credentials through OIDC over long-lived keys, and I run secret scanning on commits.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"Never in the repository or image. They live in the CI system's secret store or a manager such as Vault or AWS Secrets Manager, are injected at runtime, masked in logs, scoped per environment and rotated. I prefer short-", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-10", "title": "The pipeline takes 40 minutes. How do you speed it up?", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "docker"], "body": "\"Measure which stage is slow first. Then cache dependencies and Docker layers, run independent jobs in parallel, split or shard the test suite, move slow end-to-end tests to a later stage or nightly run, build only affected modules, and fix flaky tests that cause reruns.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"Measure which stage is slow first. Then cache dependencies and Docker layers, run independent jobs in parallel, split or shard the test suite, move slow end-to-end tests to a later stage or nightly run, build only affec", "catLabel": "CI/CD & Cloud"}, {"id": "cicd-11", "title": "What quality gates do you put in a pipeline?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Tests must pass, static analysis with no new critical issues, coverage on new code above an agreed threshold, no known critical vulnerabilities in dependencies or the image, and at least one approving code review. Gates should be fast and trusted; a gate people routinely bypass is worse than none.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"Tests must pass, static analysis with no new critical issues, coverage on new code above an agreed threshold, no known critical vulnerabilities in dependencies or the image, and at least one approving code review. Gates", "catLabel": "CI/CD & Cloud"}, {"id": "docker-k8s-12", "title": "Image vs container? How do you write a good Dockerfile for a Java service?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s", "docker"], "body": "\"An image is an immutable, layered template; a container is a running instance of it. For Java I use a multi-stage build: compile with a JDK image, run on a slim JRE image. I order instructions so dependencies are cached before source code, run as a non-root user, pin base image versions, and let the JVM size the heap from the container limit with `-XX:MaxRAMPercentage`.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"An image is an immutable, layered template; a container is a running instance of it. For Java I use a multi-stage build: compile with a JDK image, run on a slim JRE image. I order instructions so dependencies are cached", "catLabel": "CI/CD & Cloud"}, {"id": "docker-k8s-13", "title": "Explain Pod, Deployment, Service, Ingress, ConfigMap and Secret.", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"A Pod is one or more containers sharing network and storage. A Deployment manages replicas and rolling updates. A Service gives a stable address and load-balances across pods. An Ingress routes external HTTP traffic to services. ConfigMaps and Secrets hold configuration and sensitive values outside the image.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"A Pod is one or more containers sharing network and storage. A Deployment manages replicas and rolling updates. A Service gives a stable address and load-balances across pods. An Ingress routes external HTTP traffic to ", "catLabel": "CI/CD & Cloud"}, {"id": "docker-k8s-14", "title": "Liveness vs readiness probes?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"Readiness says whether the pod can receive traffic; failing it removes the pod from the Service but doesn't restart it. Liveness says whether the process is stuck; failing it restarts the container. Liveness shouldn't check dependencies such as the database, otherwise a database outage restarts every pod. Spring Boot Actuator exposes both. With graceful shutdown they give zero-downtime rollouts.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"Readiness says whether the pod can receive traffic; failing it removes the pod from the Service but doesn't restart it. Liveness says whether the process is stuck; failing it restarts the container. Liveness shouldn't c", "catLabel": "CI/CD & Cloud"}, {"id": "docker-k8s-15", "title": "How do you set resources and scale?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"Requests are what the scheduler reserves; limits are the cap. Exceeding the memory limit gets the container killed, and exceeding the CPU limit throttles it. The Horizontal Pod Autoscaler adds replicas based on CPU or custom metrics such as queue lag. The service has to be stateless for this to work.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"Requests are what the scheduler reserves; limits are the cap. Exceeding the memory limit gets the container killed, and exceeding the CPU limit throttles it. The Horizontal Pod Autoscaler adds replicas based on CPU or c", "catLabel": "CI/CD & Cloud"}, {"id": "cloud-16", "title": "Which cloud services have you used?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"\\[Trả lời thật.\\] On \\[AWS/Azure/GCP\\] I've worked with \\[compute\\], \\[database\\] and \\[storage/queue\\]. In AWS terms I know the building blocks: EC2 or ECS/EKS for compute, RDS for relational data, S3 for objects, SQS and SNS for messaging, IAM for access, and CloudWatch for logs and metrics.\"\n\n*Ghi chú: nếu kinh nghiệm cloud còn mỏng, nói rõ phần nào đã làm thật, phần nào mới tự học. Người phỏng vấn senior nhận ra ngay câu trả lời thuộc lòng.*", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"Trả lời thật. On AWS/Azure/GCP I've worked with compute, database and storage/queue. In AWS terms I know the building blocks: EC2 or ECS/EKS for compute, RDS for relational data, S3 for objects, SQS and SNS for messagin", "catLabel": "CI/CD & Cloud"}, {"id": "cloud-17", "title": "What is infrastructure as code, and why use it?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"Infrastructure is defined in versioned files, with Terraform or CloudFormation, and applied automatically. It makes environments reproducible, changes reviewable and auditable, and recovery faster than clicking in a console.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Infrastructure is defined in versioned files, with Terraform or CloudFormation, and applied automatically. It makes environments reproducible, changes reviewable and auditable, and recovery faster than clicking in a con", "catLabel": "CI/CD & Cloud"}, {"id": "cloud-18", "title": "What are the twelve-factor principles you apply most?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"Configuration in the environment, stateless processes, logs as event streams written to stdout, backing services as attached resources, fast startup and graceful shutdown, and keeping dev, staging and production as similar as possible.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"Configuration in the environment, stateless processes, logs as event streams written to stdout, backing services as attached resources, fast startup and graceful shutdown, and keeping dev, staging and production as simi", "catLabel": "CI/CD & Cloud"}, {"id": "technical-coding-va-sql", "title": "Tổng quan: Technical: coding và SQL", "cat": "coding", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Bài code ở vòng này thường ở mức easy đến medium; điểm nằm ở cách bạn nói ra suy nghĩ và phân tích độ phức tạp, không chỉ ở đáp án.\n\n*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "kind": "guide", "excerpt": "Bài code ở vòng này thường ở mức easy đến medium; điểm nằm ở cách bạn nói ra suy nghĩ và phân tích độ phức tạp, không chỉ ở đáp án. Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu ", "catLabel": "Coding, DSA & SQL", "tip": "", "num": null}, {"id": "coding-1", "title": "Find the length of the longest substring without repeating characters.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Sliding window: giữ vị trí gần nhất của mỗi ký tự, khi gặp lại thì dời mép trái. Time O(n), space O(k) với k là số ký tự khác nhau.\n\n```java\nint lengthOfLongestSubstring(String s) {\n    Map<Character, Integer> last = new HashMap<>();\n    int best = 0, left = 0;\n    for (int right = 0; right < s.length(); right++) {\n        Integer prev = last.put(s.charAt(right), right);\n        if (prev != null && prev >= left) {\n            left = prev + 1;\n        }\n        best = Math.max(best, right - left + 1);\n    }\n    return best;\n}\n```", "kind": "qa", "num": 1, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Sliding window: giữ vị trí gần nhất của mỗi ký tự, khi gặp lại thì dời mép trái. Time O(n), space O(k) với k là số ký tự khác nhau.", "catLabel": "Coding, DSA & SQL"}, {"id": "coding-2", "title": "Given an int array, group the numbers into ranges 0–9, 10–19, and so on, using Java 8.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Group theo `n / 10`; dùng `TreeMap` để các khoảng được sắp xếp. Giả định số không âm; hãy hỏi lại điều này.\n\n```java\nMap<String, List<Integer>> groupByRange(int[] nums) {\n    Map<Integer, List<Integer>> byBucket = Arrays.stream(nums).boxed()\n        .collect(Collectors.groupingBy(n -> n / 10, TreeMap::new, Collectors.toList()));\n    Map<String, List<Integer>> result = new LinkedHashMap<>();\n    byBucket.forEach((b, list) -> result.put(b * 10 + \"-\" + (b * 10 + 9), list));\n    return result;\n}\n```", "kind": "qa", "num": 2, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Group theo n / 10; dùng TreeMap để các khoảng được sắp xếp. Giả định số không âm; hãy hỏi lại điều này.", "catLabel": "Coding, DSA & SQL"}, {"id": "coding-3", "title": "Two Sum: return the indices of two numbers that add up to a target.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Một lượt duyệt với map từ giá trị sang chỉ số. Time O(n), space O(n); brute force là O(n²).\n\n```java\nint[] twoSum(int[] nums, int target) {\n    Map<Integer, Integer> seen = new HashMap<>();\n    for (int i = 0; i < nums.length; i++) {\n        Integer j = seen.get(target - nums[i]);\n        if (j != null) {\n            return new int[] {j, i};\n        }\n        seen.put(nums[i], i);\n    }\n    return new int[0];\n}\n```", "kind": "qa", "num": 3, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Một lượt duyệt với map từ giá trị sang chỉ số. Time O(n), space O(n); brute force là O(n²).", "catLabel": "Coding, DSA & SQL"}, {"id": "coding-4", "title": "Find the first non-repeated character in a string, using streams.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "`LinkedHashMap` giữ thứ tự xuất hiện. Time O(n).\n\n```java\nCharacter firstUnique(String s) {\n    return s.chars().mapToObj(c -> (char) c)\n        .collect(Collectors.groupingBy(Function.identity(), LinkedHashMap::new, Collectors.counting()))\n        .entrySet().stream()\n        .filter(e -> e.getValue() == 1)\n        .map(Map.Entry::getKey)\n        .findFirst()\n        .orElse(null);\n}\n```", "kind": "qa", "num": 4, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "LinkedHashMap giữ thứ tự xuất hiện. Time O(n).", "catLabel": "Coding, DSA & SQL"}, {"id": "coding-5", "title": "Check whether a string of brackets is valid.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Dùng stack: gặp ngoặc mở thì push ngoặc đóng tương ứng, gặp ngoặc đóng thì pop và so sánh. Time O(n), space O(n).\n\n```java\nboolean isValid(String s) {\n    Deque<Character> stack = new ArrayDeque<>();\n    for (char c : s.toCharArray()) {\n        switch (c) {\n            case '(' -> stack.push(')');\n            case '[' -> stack.push(']');\n            case '{' -> stack.push('}');\n            default -> {\n                if (stack.isEmpty() || stack.pop() != c) {\n                    return false;\n                }\n            }\n        }\n    }\n    return stack.isEmpty();\n}\n```", "kind": "qa", "num": 5, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Dùng stack: gặp ngoặc mở thì push ngoặc đóng tương ứng, gặp ngoặc đóng thì pop và so sánh. Time O(n), space O(n).", "catLabel": "Coding, DSA & SQL"}, {"id": "coding-6", "title": "Given a list of employees, find the highest-paid employee in each department and the average salary per department.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "```java\nMap<String, Optional<Employee>> topByDept = employees.stream()\n    .collect(Collectors.groupingBy(Employee::department,\n        Collectors.maxBy(Comparator.comparingDouble(Employee::salary))));\n\nMap<String, Double> avgByDept = employees.stream()\n    .collect(Collectors.groupingBy(Employee::department,\n        Collectors.averagingDouble(Employee::salary)));\n```\n\n*Các dạng nên luyện thêm: đảo chuỗi và palindrome, anagram, merge hai mảng đã sắp xếp, binary search, tìm phần tử trùng, LRU cache bằng `LinkedHashMap`, duyệt cây BFS/DFS.*", "kind": "qa", "num": 6, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Các dạng nên luyện thêm: đảo chuỗi và palindrome, anagram, merge hai mảng đã sắp xếp, binary search, tìm phần tử trùng, LRU cache bằng LinkedHashMap, duyệt cây BFS/DFS.", "catLabel": "Coding, DSA & SQL"}, {"id": "sql-7", "title": "Find the second highest salary.", "cat": "coding", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);\n```\n\n\"It returns NULL when there is no second value. For the Nth highest I'd use `DENSE_RANK()`.\"", "kind": "qa", "num": 7, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"It returns NULL when there is no second value. For the Nth highest I'd use DENSERANK().\"", "catLabel": "Coding, DSA & SQL"}, {"id": "sql-8", "title": "Find the top 3 salaries in each department.", "cat": "coding", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT department_id, name, salary\nFROM (\n    SELECT e.*,\n           DENSE_RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS rnk\n    FROM employees e\n) ranked\nWHERE rnk <= 3;\n```\n\n\"`ROW_NUMBER` gives exactly three rows per department; `RANK` leaves gaps after ties; `DENSE_RANK` doesn't.\"", "kind": "qa", "num": 8, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"ROWNUMBER gives exactly three rows per department; RANK leaves gaps after ties; DENSERANK doesn't.\"", "catLabel": "Coding, DSA & SQL"}, {"id": "sql-9", "title": "Find duplicate emails, and customers who have never placed an order.", "cat": "coding", "section": "SQL", "tags": ["sql"], "body": "```sql\nSELECT email, COUNT(*) AS cnt\nFROM users\nGROUP BY email\nHAVING COUNT(*) > 1;\n\nSELECT c.id, c.name\nFROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```", "kind": "qa", "num": 9, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "", "catLabel": "Coding, DSA & SQL"}, {"id": "sql-10", "title": "WHERE vs HAVING? INNER vs LEFT JOIN? UNION vs UNION ALL?", "cat": "coding", "section": "SQL", "tags": ["sql"], "body": "\"`WHERE` filters rows before grouping; `HAVING` filters groups after aggregation. An inner join returns only matching rows; a left join keeps every row from the left table with NULLs where there is no match. `UNION` removes duplicates, which costs a sort or hash; `UNION ALL` keeps them and is faster.\"", "kind": "qa", "num": 10, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "\"WHERE filters rows before grouping; HAVING filters groups after aggregation. An inner join returns only matching rows; a left join keeps every row from the left table with NULLs where there is no match. UNION removes du", "catLabel": "Coding, DSA & SQL"}, {"id": "dsa-lru", "title": "Implement an LRU cache with O(1) get and put.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "design"], "body": "Kết hợp hash map (tra cứu O(1)) với danh sách liên kết đôi (di chuyển và xóa O(1)): phần tử mới dùng đưa lên đầu, khi đầy thì xóa phần tử ở cuối. Trong Java, `LinkedHashMap` với `accessOrder = true` làm sẵn việc này; interviewer thường muốn bạn tự cài.\n\n```java\nclass LRUCache {\n    private final int capacity;\n    private final Map<Integer, Node> map = new HashMap<>();\n    private final Node head = new Node(0, 0), tail = new Node(0, 0);\n\n    LRUCache(int capacity) {\n        this.capacity = capacity;\n        head.next = tail;\n        tail.prev = head;\n    }\n\n    int get(int key) {\n        Node n = map.get(key);\n        if (n == null) return -1;\n        moveToFront(n);\n        return n.val;\n    }\n\n    void put(int key, int val) {\n        Node n = map.get(key);\n        if (n != null) {\n            n.val = val;\n            moveToFront(n);\n            return;\n        }\n        if (map.size() == capacity) {\n            Node lru = tail.prev;\n            unlink(lru);\n            map.remove(lru.key);\n        }\n        n = new Node(key, val);\n        map.put(key, n);\n        addFront(n);\n    }\n\n    private void moveToFront(Node n) { unlink(n); addFront(n); }\n    private void unlink(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }\n    private void addFront(Node n) {\n        n.next = head.next; n.prev = head;\n        head.next.prev = n; head.next = n;\n    }\n\n    private static class Node {\n        int key, val; Node prev, next;\n        Node(int k, int v) { key = k; val = v; }\n    }\n}\n```\n\n\"Both operations are O(1) time; space is O(capacity). For concurrent access I'd wrap it with a lock, or use a library such as Caffeine in production.\"", "excerpt": "Kết hợp hash map (tra cứu O(1)) với danh sách liên kết đôi (di chuyển và xóa O(1)): phần tử mới dùng đưa lên đầu, khi đầy thì xóa phần tử ở cuối. Trong Java, LinkedHashMap với accessOrder = true làm sẵn việc này; intervi", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-top-k", "title": "Return the k most frequent elements of an array.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "heap"], "body": "Đếm tần suất bằng map, rồi giữ min-heap kích thước k. Time O(n log k), space O(n). Có thể làm O(n) bằng bucket sort theo tần suất.\n\n```java\nint[] topKFrequent(int[] nums, int k) {\n    Map<Integer, Integer> freq = new HashMap<>();\n    for (int n : nums) freq.merge(n, 1, Integer::sum);\n    PriorityQueue<Map.Entry<Integer, Integer>> heap =\n        new PriorityQueue<>(Map.Entry.comparingByValue());\n    for (Map.Entry<Integer, Integer> e : freq.entrySet()) {\n        heap.offer(e);\n        if (heap.size() > k) heap.poll();\n    }\n    return heap.stream().mapToInt(Map.Entry::getKey).toArray();\n}\n```", "excerpt": "Đếm tần suất bằng map, rồi giữ min-heap kích thước k. Time O(n log k), space O(n). Có thể làm O(n) bằng bucket sort theo tần suất.", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-merge-intervals", "title": "Merge all overlapping intervals.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "sorting"], "body": "Sắp xếp theo điểm bắt đầu, rồi gộp nếu khoảng hiện tại chồng lên khoảng cuối cùng trong kết quả. Time O(n log n) do sắp xếp, space O(n).\n\n```java\nint[][] merge(int[][] intervals) {\n    Arrays.sort(intervals, Comparator.comparingInt(a -> a[0]));\n    List<int[]> out = new ArrayList<>();\n    for (int[] cur : intervals) {\n        if (!out.isEmpty() && out.get(out.size() - 1)[1] >= cur[0]) {\n            out.get(out.size() - 1)[1] = Math.max(out.get(out.size() - 1)[1], cur[1]);\n        } else {\n            out.add(cur);\n        }\n    }\n    return out.toArray(new int[0][]);\n}\n```\n\n\"Hỏi lại interviewer: hai khoảng chạm nhau như [1,2] và [2,3] có tính là chồng không.\"", "excerpt": "Sắp xếp theo điểm bắt đầu, rồi gộp nếu khoảng hiện tại chồng lên khoảng cuối cùng trong kết quả. Time O(n log n) do sắp xếp, space O(n). \"Hỏi lại interviewer: hai khoảng chạm nhau như 1,2 và 2,3 có tính là chồng không.\"", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-islands", "title": "Count the number of islands in a grid of '1' (land) and '0' (water).", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "graph"], "body": "Duyệt từng ô; gặp đất chưa thăm thì tăng bộ đếm và BFS/DFS để đánh dấu cả hòn đảo. Time O(m·n), space O(m·n) trong trường hợp xấu nhất. Dùng BFS với queue để tránh stack overflow trên lưới lớn.\n\n```java\nint numIslands(char[][] grid) {\n    int m = grid.length, n = grid[0].length, count = 0;\n    int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            if (grid[i][j] != '1') continue;\n            count++;\n            Deque<int[]> q = new ArrayDeque<>();\n            q.add(new int[]{i, j});\n            grid[i][j] = '0';\n            while (!q.isEmpty()) {\n                int[] c = q.poll();\n                for (int[] d : dirs) {\n                    int r = c[0] + d[0], col = c[1] + d[1];\n                    if (r >= 0 && r < m && col >= 0 && col < n && grid[r][col] == '1') {\n                        grid[r][col] = '0';\n                        q.add(new int[]{r, col});\n                    }\n                }\n            }\n        }\n    }\n    return count;\n}\n```\n\n\"Nếu không được sửa input, dùng mảng `boolean[][] visited` riêng.\"", "excerpt": "Duyệt từng ô; gặp đất chưa thăm thì tăng bộ đếm và BFS/DFS để đánh dấu cả hòn đảo. Time O(m·n), space O(m·n) trong trường hợp xấu nhất. Dùng BFS với queue để tránh stack overflow trên lưới lớn. \"Nếu không được sửa input,", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-rotated-search", "title": "Search for a target in a rotated sorted array in O(log n).", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "binary-search"], "body": "Binary search: ở mỗi bước, ít nhất một nửa đã được sắp xếp; kiểm tra target có nằm trong nửa đó không để quyết định đi trái hay phải. Time O(log n), space O(1).\n\n```java\nint search(int[] nums, int target) {\n    int lo = 0, hi = nums.length - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (nums[mid] == target) return mid;\n        if (nums[lo] <= nums[mid]) {\n            if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;\n            else lo = mid + 1;\n        } else {\n            if (nums[mid] < target && target <= nums[hi]) lo = mid + 1;\n            else hi = mid - 1;\n        }\n    }\n    return -1;\n}\n```", "excerpt": "Binary search: ở mỗi bước, ít nhất một nửa đã được sắp xếp; kiểm tra target có nằm trong nửa đó không để quyết định đi trái hay phải. Time O(log n), space O(1).", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-phone-letters", "title": "Generate all letter combinations of a phone-keypad digit string.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "backtracking", "axon"], "body": "Backtracking: mỗi chữ số chọn lần lượt từng chữ cái, đệ quy sang chữ số tiếp theo. Time O(4^n · n) vì mỗi số có tối đa 4 chữ cái, space O(n) cho đệ quy (không tính kết quả). Dạng bài này từng được báo cáo ở Axon.\n\n```java\nprivate static final String[] KEYS = {\"\", \"\", \"abc\", \"def\", \"ghi\", \"jkl\", \"mno\", \"pqrs\", \"tuv\", \"wxyz\"};\n\nList<String> letterCombinations(String digits) {\n    List<String> out = new ArrayList<>();\n    if (digits.isEmpty()) return out;\n    backtrack(digits, 0, new StringBuilder(), out);\n    return out;\n}\n\nprivate void backtrack(String digits, int i, StringBuilder cur, List<String> out) {\n    if (i == digits.length()) {\n        out.add(cur.toString());\n        return;\n    }\n    for (char c : KEYS[digits.charAt(i) - '0'].toCharArray()) {\n        cur.append(c);\n        backtrack(digits, i + 1, cur, out);\n        cur.deleteCharAt(cur.length() - 1);\n    }\n}\n```", "excerpt": "Backtracking: mỗi chữ số chọn lần lượt từng chữ cái, đệ quy sang chữ số tiếp theo. Time O(4^n · n) vì mỗi số có tối đa 4 chữ cái, space O(n) cho đệ quy (không tính kết quả). Dạng bài này từng được báo cáo ở Axon.", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-tree-level", "title": "Binary tree: level-order traversal, and invert the tree.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "tree"], "body": "Level order dùng BFS với queue, xử lý theo từng tầng bằng cách lấy kích thước queue đầu mỗi vòng. Invert là đệ quy đổi chỗ con trái và con phải. Cả hai đều O(n) time; space O(w) với w là độ rộng lớn nhất (BFS) hoặc O(h) với h là chiều cao (đệ quy).\n\n```java\nList<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> out = new ArrayList<>();\n    if (root == null) return out;\n    Deque<TreeNode> q = new ArrayDeque<>(List.of(root));\n    while (!q.isEmpty()) {\n        int size = q.size();\n        List<Integer> level = new ArrayList<>(size);\n        for (int i = 0; i < size; i++) {\n            TreeNode n = q.poll();\n            level.add(n.val);\n            if (n.left != null) q.add(n.left);\n            if (n.right != null) q.add(n.right);\n        }\n        out.add(level);\n    }\n    return out;\n}\n\nTreeNode invert(TreeNode root) {\n    if (root == null) return null;\n    TreeNode left = invert(root.left);\n    root.left = invert(root.right);\n    root.right = left;\n    return root;\n}\n```", "excerpt": "Level order dùng BFS với queue, xử lý theo từng tầng bằng cách lấy kích thước queue đầu mỗi vòng. Invert là đệ quy đổi chỗ con trái và con phải. Cả hai đều O(n) time; space O(w) với w là độ rộng lớn nhất (BFS) hoặc O(h) ", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-coin-change", "title": "Coin change: the fewest coins that make up an amount.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "dp"], "body": "Dynamic programming từ dưới lên: `dp[a]` là số đồng ít nhất để tạo ra `a`, với `dp[a] = min(dp[a - c] + 1)` qua mọi đồng `c`. Time O(amount · số loại đồng), space O(amount). Greedy sai với bộ đồng như {1, 3, 4} và amount 6.\n\n```java\nint coinChange(int[] coins, int amount) {\n    int[] dp = new int[amount + 1];\n    Arrays.fill(dp, amount + 1);\n    dp[0] = 0;\n    for (int a = 1; a <= amount; a++) {\n        for (int c : coins) {\n            if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);\n        }\n    }\n    return dp[amount] > amount ? -1 : dp[amount];\n}\n```", "excerpt": "Dynamic programming từ dưới lên: dpa là số đồng ít nhất để tạo ra a, với dpa = min(dpa - c + 1) qua mọi đồng c. Time O(amount · số loại đồng), space O(amount). Greedy sai với bộ đồng như {1, 3, 4} và amount 6.", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-course-schedule", "title": "Can all courses be finished given prerequisite pairs? (cycle detection)", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "graph"], "body": "Topological sort theo thuật toán Kahn: đếm in-degree, đưa các nút có in-degree 0 vào queue, lấy ra và giảm in-degree của nút kề. Nếu xử lý được đủ mọi nút thì không có chu trình. Time O(V + E), space O(V + E). Ứng dụng thực tế: thứ tự khởi động service hoặc chạy migration có phụ thuộc.\n\n```java\nboolean canFinish(int n, int[][] prereq) {\n    List<List<Integer>> g = new ArrayList<>();\n    for (int i = 0; i < n; i++) g.add(new ArrayList<>());\n    int[] indeg = new int[n];\n    for (int[] p : prereq) { g.get(p[1]).add(p[0]); indeg[p[0]]++; }\n    Deque<Integer> q = new ArrayDeque<>();\n    for (int i = 0; i < n; i++) if (indeg[i] == 0) q.add(i);\n    int seen = 0;\n    while (!q.isEmpty()) {\n        int u = q.poll(); seen++;\n        for (int v : g.get(u)) if (--indeg[v] == 0) q.add(v);\n    }\n    return seen == n;\n}\n```", "excerpt": "Topological sort theo thuật toán Kahn: đếm in-degree, đưa các nút có in-degree 0 vào queue, lấy ra và giảm in-degree của nút kề. Nếu xử lý được đủ mọi nút thì không có chu trình. Time O(V + E), space O(V + E). Ứng dụng t", "catLabel": "Coding, DSA & SQL", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "behavioral-va-manager-interview", "title": "Tổng quan: Behavioral và manager interview", "cat": "behavioral", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Vòng này đánh giá bạn có làm việc được với khách hàng và team hay không; mọi câu trả lời nên là một câu chuyện thật theo STAR, dài khoảng 2 phút.\n\n*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "kind": "guide", "excerpt": "Vòng này đánh giá bạn có làm việc được với khách hàng và team hay không; mọi câu trả lời nên là một câu chuyện thật theo STAR, dài khoảng 2 phút. STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action ", "catLabel": "Behavioral & AI", "tip": "", "num": null}, {"id": "behavioral-1", "title": "Tell me about the most challenging project you've worked on.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "opswat", "dxc"], "body": "\"At \\[Opswat/DXC\\] we had to \\[mục tiêu\\] under \\[ràng buộc: deadline, quy mô, hệ thống cũ\\]. I was responsible for \\[phần của bạn\\]. The hard part was \\[vấn đề kỹ thuật cụ thể\\]. I \\[các bước: đo đạc, đề xuất phương án, thử nghiệm, triển khai\\]. As a result \\[kết quả có số liệu\\]. I learned \\[bài học\\].\"", "kind": "qa", "num": 1, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"At Opswat/DXC we had to mục tiêu under ràng buộc: deadline, quy mô, hệ thống cũ. I was responsible for phần của bạn. The hard part was vấn đề kỹ thuật cụ thể. I các bước: đo đạc, đề xuất phương án, thử nghiệm, triển kha", "catLabel": "Behavioral & AI"}, {"id": "behavioral-2", "title": "Describe a production incident you handled.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"\\[Thời điểm\\], \\[triệu chứng\\] affected \\[ai, bao nhiêu\\]. I first mitigated by \\[rollback / tắt feature / scale\\], then found the root cause through \\[log, metric, trace\\]: \\[nguyên nhân\\]. I fixed it with \\[giải pháp\\] and added \\[test, alert, runbook\\] so it can't recur silently. I kept stakeholders updated every \\[X\\] minutes.\"\n\n*Ghi chú: thứ tự \"giảm thiệt hại trước, tìm nguyên nhân sau, rồi ngăn tái diễn\" là thứ người phỏng vấn muốn nghe.*", "kind": "qa", "num": 2, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"Thời điểm, triệu chứng affected ai, bao nhiêu. I first mitigated by rollback / tắt feature / scale, then found the root cause through log, metric, trace: nguyên nhân. I fixed it with giải pháp and added test, alert, run", "catLabel": "Behavioral & AI"}, {"id": "behavioral-3", "title": "Tell me about a disagreement with a teammate or lead.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"We disagreed on \\[quyết định kỹ thuật\\]. I thought \\[quan điểm của bạn\\]; they preferred \\[quan điểm kia\\]. I asked for their reasoning, wrote down the trade-offs of both options, and proposed \\[prototype / benchmark / ý kiến bên thứ ba\\]. We went with \\[kết quả\\]. Whether or not my option won, I committed to the decision. The relationship stayed \\[tốt / tốt hơn\\].\"", "kind": "qa", "num": 3, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"We disagreed on quyết định kỹ thuật. I thought quan điểm của bạn; they preferred quan điểm kia. I asked for their reasoning, wrote down the trade-offs of both options, and proposed prototype / benchmark / ý kiến bên thứ", "catLabel": "Behavioral & AI"}, {"id": "behavioral-4", "title": "How do you handle unclear or changing requirements from a client?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "dxc"], "body": "\"On the insurance projects at DXC, requirements from \\[khách hàng\\] often \\[thay đổi như thế nào\\]. I clarified by restating the requirement in writing with concrete examples and edge cases, and confirmed it before estimating. When a change arrived mid-sprint, I explained the impact on scope and timeline and offered options, rather than just saying yes or no. That reduced \\[rework / bug\\] by \\[kết quả\\].\"", "kind": "qa", "num": 4, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"On the insurance projects at DXC, requirements from khách hàng often thay đổi như thế nào. I clarified by restating the requirement in writing with concrete examples and edge cases, and confirmed it before estimating. W", "catLabel": "Behavioral & AI"}, {"id": "behavioral-5", "title": "Tell me about a time you had to push back on a client or say no.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"The client asked for \\[yêu cầu\\] by \\[deadline\\]. It wasn't feasible without \\[rủi ro\\]. I explained the risk with data, proposed \\[phương án thay thế: chia giai đoạn, giảm phạm vi\\], and we agreed on \\[kết quả\\]. The key was offering an alternative instead of only refusing.\"", "kind": "qa", "num": 5, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"The client asked for yêu cầu by deadline. It wasn't feasible without rủi ro. I explained the risk with data, proposed phương án thay thế: chia giai đoạn, giảm phạm vi, and we agreed on kết quả. The key was offering an a", "catLabel": "Behavioral & AI"}, {"id": "behavioral-6", "title": "Tell me about a deadline you were at risk of missing.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"We were \\[X ngày\\] from the release of \\[tính năng\\] when \\[vấn đề\\]. I flagged it early to \\[lead/PM\\] instead of hoping to catch up, split the work into must-have and can-wait, and \\[hành động\\]. We delivered \\[phạm vi\\] on time and \\[phần còn lại\\] in the next release.\"", "kind": "qa", "num": 6, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"We were X ngày from the release of tính năng when vấn đề. I flagged it early to lead/PM instead of hoping to catch up, split the work into must-have and can-wait, and hành động. We delivered phạm vi on time and phần còn", "catLabel": "Behavioral & AI"}, {"id": "behavioral-7", "title": "Have you mentored or led other engineers?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I \\[onboard / review code / hướng dẫn\\] \\[số người\\] engineers at \\[công ty\\]. My approach is to explain the reasoning in code reviews, pair on the first task in a new area, and give them ownership of something small but complete. One example: \\[người đó tiến bộ thế nào\\].\"\n\n*Ghi chú: nếu chưa từng lead chính thức, nói thật và dùng ví dụ mentoring không chính thức.*", "kind": "qa", "num": 7, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I onboard / review code / hướng dẫn số người engineers at công ty. My approach is to explain the reasoning in code reviews, pair on the first task in a new area, and give them ownership of something small but complete. ", "catLabel": "Behavioral & AI"}, {"id": "behavioral-8", "title": "Tell me about a mistake you made.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I \\[lỗi thật, có hậu quả vừa phải\\]. I noticed it when \\[cách phát hiện\\], told the team immediately, and fixed it by \\[hành động\\]. Since then I \\[thay đổi trong cách làm việc\\].\"\n\n*Ghi chú: chọn lỗi thật, không chọn \"lỗi\" kiểu \"tôi làm việc quá chăm\".*", "kind": "qa", "num": 8, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I lỗi thật, có hậu quả vừa phải. I noticed it when cách phát hiện, told the team immediately, and fixed it by hành động. Since then I thay đổi trong cách làm việc.\" Ghi chú: chọn lỗi thật, không chọn \"lỗi\" kiểu \"tôi làm", "catLabel": "Behavioral & AI"}, {"id": "behavioral-9", "title": "How do you do code review, and how do you handle technical debt?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"In reviews I look at correctness, readability, tests and design, in that order of risk; I ask questions rather than give orders, and separate blocking issues from suggestions. For technical debt I make it visible as tickets with the cost it causes, fix small items as part of related work, and negotiate time for larger ones with a clear benefit, such as fewer incidents or faster delivery.\"", "kind": "qa", "num": 9, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"In reviews I look at correctness, readability, tests and design, in that order of risk; I ask questions rather than give orders, and separate blocking issues from suggestions. For technical debt I make it visible as tic", "catLabel": "Behavioral & AI"}, {"id": "behavioral-10", "title": "How do you estimate work and work in Scrum?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I break a story into tasks, identify unknowns, and spike the risky ones before committing. I estimate relatively in story points with the team and include testing, review and deployment. I raise blockers in the daily stand-up, and use retrospectives to change one concrete thing per sprint.\"", "kind": "qa", "num": 10, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I break a story into tasks, identify unknowns, and spike the risky ones before committing. I estimate relatively in story points with the team and include testing, review and deployment. I raise blockers in the daily st", "catLabel": "Behavioral & AI"}, {"id": "behavioral-11", "title": "How do you learn a new domain or technology quickly?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "opswat", "dxc"], "body": "\"I moved from life insurance at DXC to cybersecurity at Opswat, and from Java to also writing Go. I start with the official docs and the existing codebase, build something small end to end, and ask domain experts focused questions. Within \\[thời gian\\] I was \\[đóng góp gì\\].\"", "kind": "qa", "num": 11, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I moved from life insurance at DXC to cybersecurity at Opswat, and from Java to also writing Go. I start with the official docs and the existing codebase, build something small end to end, and ask domain experts focused", "catLabel": "Behavioral & AI"}, {"id": "behavioral-12", "title": "Where do you see yourself in three years?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"As a strong senior or lead engineer who owns the design of a system and helps a team deliver. I want to deepen system design and cloud skills, and \\[công ty\\] is a good place for that.\"", "kind": "qa", "num": 12, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"As a strong senior or lead engineer who owns the design of a system and helps a team deliver. I want to deepen system design and cloud skills, and công ty is a good place for that.\"", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-13", "title": "How do you use AI coding tools in your work?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"I use \\[công cụ bạn dùng thật\\] for exploring unfamiliar code, generating tests and boilerplate, refactoring, and drafting documentation. I stay responsible for the result: I review every change, run the tests, and don't accept code I can't explain. I don't paste secrets or client data, and I follow the client's policy on AI tools.\"", "kind": "qa", "num": 13, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"I use công cụ bạn dùng thật for exploring unfamiliar code, generating tests and boilerplate, refactoring, and drafting documentation. I stay responsible for the result: I review every change, run the tests, and don't ac", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-14", "title": "How do you write an effective prompt for a coding task?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"I give context, the goal, constraints and the expected output: which files matter, what done looks like, what must not change, and how to verify, for example which tests to run. I split large tasks into small steps, ask for a plan before code on anything non-trivial, and provide examples of the existing style.\"", "kind": "qa", "num": 14, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"I give context, the goal, constraints and the expected output: which files matter, what done looks like, what must not change, and how to verify, for example which tests to run. I split large tasks into small steps, ask", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-15", "title": "What are tokens, and how do you control token usage and cost?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"Models read and write text as tokens, and both cost and the context window are measured in them. Usage grows with everything in the context: the conversation history, files read and tool output. To control it I keep tasks focused, start a fresh session for a new task, point the tool at specific files instead of the whole repository, keep project instructions short, and use a smaller model for simple work. Long sessions also lose accuracy as the context fills, so this is about quality as well as cost.\"", "kind": "qa", "num": 15, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"Models read and write text as tokens, and both cost and the context window are measured in them. Usage grows with everything in the context: the conversation history, files read and tool output. To control it I keep tas", "catLabel": "Behavioral & AI"}]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const A = DATA.articles;
const BY = Object.fromEntries(A.map(a=>[a.id,a]));
const ROUNDS = [['all','Tất cả']].concat(DATA.cats);
const TAGLABEL = {'java-modern':'java-8-21','tong-quan':'tổng-quan','huong-dan':'hướng-dẫn','ke-hoach':'kế-hoạch','cong-ty':'công-ty'};
const tl = t => '#' + (TAGLABEL[t]||t);

const store = {
  get(k,d){ try{ const v=localStorage.getItem('kb.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('kb.'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {round: store.get('round','all'), tag: store.get('tag',null), q:'', todo: store.get('todo',false),
           practice: store.get('practice',false), dark: store.get('dark', matchMedia('(prefers-color-scheme: dark)').matches)};
let done = new Set(store.get('done',[]));
let revealed = new Set();

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
A.forEach(a=>{ a._s = norm(a.title+' '+a.section+' '+a.tags.join(' ')+' '+a.body+' '+(a.tip||'')); });
const QA = A.filter(a=>a.kind==='qa');

function applyTheme(){
  document.documentElement.classList.toggle('dark', S.dark);
  $('#dark').textContent = S.dark ? '[light]' : '[dark]';
  document.body.classList.toggle('practice', S.practice);
  $('#practice').classList.toggle('on', S.practice);
}

function filtered(){
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  return A.filter(a => (S.round==='all' || a.cat===S.round)
    && (!S.tag || a.tags.includes(S.tag))
    && (!S.todo || (a.kind==='qa' && !done.has(a.id)))
    && terms.every(t => a._s.includes(t)));
}

function renderSide(){
  const pool = A.filter(a => S.round==='all' || a.cat===S.round);
  const tc = {};
  pool.forEach(a=>a.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags = Object.entries(tc).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
  const rc = r => r==='all' ? A.length : A.filter(a=>a.cat===r).length;
  const nd = QA.filter(a=>done.has(a.id)).length;
  let h = '<h4>-- CHỦ ĐỀ --</h4>';
  h += ROUNDS.map(([k,l])=>`<div class="row ${S.round===k?'on':''}" data-round="${k}"><span>${l}</span><span class="n">${rc(k)}</span></div>`).join('');
  h += `<h4>-- TIẾN ĐỘ --</h4><div class="row ${S.todo?'on':''}" data-todo="1"><span>chưa thuộc</span><span class="n">${QA.length-nd}</span></div>`;
  h += `<div class="row" style="cursor:default"><span>đã thuộc</span><span class="n">${nd}/${QA.length}</span></div><div class="prog"><div style="width:${(nd/QA.length*100).toFixed(1)}%"></div></div>`;
  const cos = A.filter(a=>a.cat==='company');
  h += '<h4>-- CÔNG TY --</h4>' + cos.map(a=>`<div class="row ${location.hash.slice(1)===a.id?'on':''}" data-id="${a.id}"><span>${esc(a.title)}</span><span class="n">→</span></div>`).join('');
  h += '<h4>-- TAGS --</h4>';
  h += tags.filter(([t,n])=>n>1||t===S.tag).map(([t,n])=>`<div class="row ${S.tag===t?'on':''}" data-tag="${t}"><span>${tl(t)}</span><span class="n">${n}</span></div>`).join('');
  $('#side').innerHTML = h;
}

function card(a){
  const q = a.num ? `<span class="q">Q${a.num}.</span> ` : '';
  const sec = a.section ? ' // ' + esc(a.section) : '';
  const d = done.has(a.id) ? ' <span class="done">✓ đã thuộc</span>' : '';
  return `<div class="card" data-id="${a.id}"><h3>${q}${esc(a.title)}</h3>
    <div class="meta">${esc(a.catLabel)}${sec}${d}</div>
    <div class="ex">${esc(a.excerpt)}</div>
    <div class="tags">${a.tags.map(t=>`<span data-tag="${t}">${tl(t)}</span>`).join('')}</div></div>`;
}

function renderList(){
  const L = filtered();
  const chips = [];
  if (S.round!=='all') chips.push(`<span class="chip" data-clear="round">${esc((ROUNDS.find(r=>r[0]===S.round)||['',''])[1])} ×</span>`);
  if (S.tag) chips.push(`<span class="chip" data-clear="tag">${tl(S.tag)} ×</span>`);
  if (S.todo) chips.push(`<span class="chip" data-clear="todo">chưa thuộc ×</span>`);
  if (S.q) chips.push(`<span class="chip" data-clear="q">"${esc(S.q)}" ×</span>`);
  $('#content').innerHTML = `<div class="listhead"><span>${L.length} articles</span>${chips.join('')}</div>`
    + (L.length ? L.map(card).join('') : '<div class="empty">Không có bài nào khớp bộ lọc.</div>');
  $('#content').scrollTop = 0;
}

function md(src){
  if (window.marked) return marked.parse(src, {gfm:true, breaks:false});
  return '<pre>'+esc(src)+'</pre>';
}
function decorate(root){
  // highlight [placeholders] outside code/links
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    return n.parentElement.closest('code,pre,a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    if (!/\[[^\]\n]{1,90}\]/.test(n.nodeValue)) return;
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(/\[([^\]\n]{1,90})\]/g, '<mark class="fill">[$1]</mark>');
    n.replaceWith(...span.childNodes);
  });
  root.querySelectorAll('pre').forEach(p=>{
    const b=document.createElement('button'); b.textContent='copy';
    b.onclick=e=>{e.stopPropagation(); const t=p.querySelector('code').innerText;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1200);},()=>{b.textContent='select & copy';});};
    p.appendChild(b);
  });
  root.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
}

function renderDetail(id){
  const a = BY[id]; if(!a){ location.hash=''; return; }
  const L = filtered(); let i = L.findIndex(x=>x.id===id);
  const seq = i>=0 ? L : A; if (i<0) i = A.findIndex(x=>x.id===id);
  const prev = seq[i-1], next = seq[i+1];
  const hide = S.practice && a.kind==='qa' && !revealed.has(id);
  const q = a.num ? `Q${a.num}. ` : '';
  const sec = a.section && a.section!==a.title ? ' // ' + esc(a.section) : '';
  let h = `<div class="detail"><div class="nav"><button data-act="back">[&lt;- back]</button>
    ${prev?`<button data-go="${prev.id}" title="k">[&lt; prev]</button>`:''}
    ${next?`<button data-go="${next.id}" title="j">[next &gt;]</button>`:''}
    <span class="kbd" style="margin-left:auto">${i+1}/${seq.length}</span></div>
    <h1>${q}${esc(a.title)}</h1>
    <div class="meta">${esc(a.catLabel)}${sec}</div>
    <div class="tags">${a.tags.map(t=>`<span data-tag="${t}">${tl(t)}</span>`).join('')}</div>`;
  if (a.tip) h += `<div class="tip body">${md(a.tip)}</div>`;
  h += hide ? `<button class="reveal" data-act="reveal">[ tự trả lời to trong 60–90 giây, rồi bấm để xem câu trả lời mẫu ]</button>`
            : `<div class="body" id="ans">${md(a.body)}</div>`;
  if (a.kind==='qa') h += `<div class="foot-actions"><button data-act="done" class="${done.has(id)?'on':''}">${done.has(id)?'[x] đã thuộc':'[ ] đánh dấu đã thuộc'}</button>
     ${next?`<button data-go="${next.id}">[câu tiếp &gt;]</button>`:''}</div>`;
  h += '</div>';
  $('#content').innerHTML = h;
  $('#content').querySelectorAll('.body').forEach(decorate);
  $('#content').scrollTop = 0;
}

function route(){
  const id = location.hash.slice(1);
  renderSide();
  if (id && BY[id]) renderDetail(id); else renderList();
  $('#fl').textContent = `${A.length} articles // ${QA.length} câu hỏi // ${DATA.cats.length} chủ đề`;
}
function save(){ store.set('round',S.round); store.set('tag',S.tag); store.set('todo',S.todo); }
function toList(){ if (location.hash) { history.pushState(null,'',location.pathname+location.search); } route(); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-round],[data-tag],[data-todo],[data-clear],[data-id],[data-go],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.round){ S.round=d.round; if (S.tag && !A.some(a=>(S.round==='all'||a.cat===S.round)&&a.tags.includes(S.tag))) S.tag=null; save(); closeSide(); toList(); }
  else if (d.tag){ e.stopPropagation(); S.tag = S.tag===d.tag ? null : d.tag; save(); closeSide(); toList(); }
  else if (d.todo){ S.todo=!S.todo; save(); closeSide(); toList(); }
  else if (d.clear){ if(d.clear==='round')S.round='all'; else if(d.clear==='tag')S.tag=null; else if(d.clear==='todo')S.todo=false; else {S.q='';$('#q').value='';} save(); route(); }
  else if (d.id || d.go){ closeSide(); location.hash = d.id || d.go; }
  else if (d.act==='back'){ toList(); }
  else if (d.act==='reveal'){ const id=location.hash.slice(1); revealed.add(id); renderDetail(id); }
  else if (d.act==='done'){ const id=location.hash.slice(1); done.has(id)?done.delete(id):done.add(id); store.set('done',[...done]); renderSide(); renderDetail(id); }
});
window.addEventListener('hashchange', route);
$('#q').addEventListener('input', e=>{ S.q=e.target.value; if (location.hash) history.pushState(null,'',location.pathname+location.search); renderSide(); renderList(); });
$('#home').onclick = ()=>{ S.round='all'; S.tag=null; S.todo=false; S.q=''; $('#q').value=''; save(); toList(); };
$('#dark').onclick = ()=>{ S.dark=!S.dark; store.set('dark',S.dark); applyTheme(); };
$('#practice').onclick = ()=>{ S.practice=!S.practice; store.set('practice',S.practice); revealed.clear(); applyTheme(); route(); };
$('#menu').onclick = ()=> $('#side').classList.toggle('open');
function closeSide(){ $('#side').classList.remove('open'); }
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key==='/' && !typing){ e.preventDefault(); $('#q').focus(); return; }
  if (e.key==='Escape'){ if (typing){ $('#q').blur(); } else if (location.hash) toList(); return; }
  if (typing || !location.hash) return;
  if (e.key==='j' || e.key==='ArrowRight'){ const b=$('[data-go][title="j"]'); if(b) location.hash=b.dataset.go; }
  if (e.key==='k' || e.key==='ArrowLeft'){ const b=$('[data-go][title="k"]'); if(b) location.hash=b.dataset.go; }
});
applyTheme(); route();
})();
</script>
</body>
</html>
