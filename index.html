nCOPY --from=build /app /app\nUSER nonroot\nENTRYPOINT [\"/app\"]\n```\n\n\"Copying `go.mod` first caches the dependency layer. `CGO_ENABLED=0` produces a static binary that runs without libc. Distroless includes CA certificates and timezone data that `scratch` lacks, and runs as non-root. The result is usually 10–20 MB with almost no attack surface. `exec format error` means the binary was built for a different OS or CPU architecture; set `GOOS`/`GOARCH` or use `docker buildx` for multi-arch. Without a shell, I debug with `kubectl debug` and an ephemeral container.\"\n\nTham khảo thêm: [Docker Multistage Builds (Golang)](https://minhnhat97kg.github.io/docsify/content/devops-docker-multistage-builds-golang-optimization/vi.md)", "excerpt": "Multi-stage build: compile trong image có Go toolchain, chạy trong image tối giản. \"Copying go.mod first caches the dependency layer. CGOENABLED=0 produces a static binary that runs without libc. Distroless includes CA c", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "k8s-debug", "title": "A pod is in CrashLoopBackOff. How do you debug it?", "cat": "devops", "section": "Docker và Kubernetes", "kind": "qa", "tags": ["kubernetes", "troubleshooting", "observability", "docker"], "body": "\"Step by step:\n\n1. `kubectl describe pod` for events: OOMKilled, failed probes, image pull errors, missing ConfigMap or Secret.\n2. `kubectl logs <pod> --previous` to see why the last container instance exited.\n3. Check the exit code: 137 means killed, usually out of memory; 1 is an application error.\n4. Common causes: wrong configuration or environment variables, the database unreachable at startup, a liveness probe that fires before the app is ready (use a startup probe), or memory limits too low.\n5. If needed, `kubectl debug` with an ephemeral container, or run the image locally with the same configuration.\n\nFor observability, Prometheus **pulls** metrics by scraping `/metrics` endpoints and stores them as time series; logs go to Loki or ELK; traces to Jaeger or Tempo through OpenTelemetry. Kubernetes over Docker Swarm: much richer ecosystem, autoscaling and scheduling, at the cost of complexity.\"\n\nTham khảo thêm: [DevOps - Advance](https://minhnhat97kg.github.io/docsify/content/devops-advance/vi.md)", "excerpt": "\"Step by step: kubectl describe pod for events: OOMKilled, failed probes, image pull errors, missing ConfigMap or Secret. kubectl logs <pod --previous to see why the last container instance exited. Check the exit code: 1", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "troubleshoot-10min", "title": "Production is slow and alerts are firing. Walk me through the first 10 minutes.", "cat": "devops", "section": "Vận hành", "kind": "qa", "tags": ["troubleshooting", "observability", "incident"], "body": "\"**Minutes 0–2, triage:** what's the user impact, which endpoints, since when? Check the dashboards for rate, errors and latency, and ask what changed: a deploy, a config change, a traffic spike, a dependency incident.\n\n**Minutes 2–5, narrow down:** compare healthy and unhealthy instances or endpoints. Look at saturation: CPU, memory, GC pauses, thread or connection pools, database connections, queue lag.\n\n**Minutes 5–8, trace:** pick slow traces and find the hop that dominates; check slow query logs and lock waits in the database.\n\n**Minutes 8–10, mitigate before root-causing:** roll back the recent deploy, scale out, turn off the feature flag, or shed load with rate limits.\n\nThroughout, I post short status updates in the incident channel. After recovery: root cause, then a blameless postmortem with actions such as an alert, a test or a runbook.\"\n\nTham khảo thêm: [Troubleshooting](https://minhnhat97kg.github.io/docsify/content/troubleshooting/vi.md)", "excerpt": "\"Minutes 0–2, triage: what's the user impact, which endpoints, since when? Check the dashboards for rate, errors and latency, and ask what changed: a deploy, a config change, a traffic spike, a dependency incident. Minut", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "eng-testing", "title": "TDD vs BDD, and what is the test pyramid?", "cat": "devops", "section": "Engineering practice (EPAM rapid-fire)", "kind": "qa", "tags": ["testing", "tdd", "bdd", "epam"], "body": "\"**TDD**: write a failing unit test, write the minimum code to pass, refactor: red, green, refactor. It drives design toward small, testable units.\n\n**BDD**: describes behaviour in business language, often Given/When/Then scenarios with Cucumber, so product people and engineers agree on acceptance criteria.\n\n**Test pyramid**: many fast unit tests at the base, fewer integration tests in the middle (database, messaging, using Testcontainers), and very few slow end-to-end or UI tests at the top. An inverted pyramid, mostly UI tests, gives slow, flaky pipelines.\n\nHonest answer about my practice: I write tests alongside the code rather than strictly test-first, but I do use TDD for tricky business logic and bug fixes, where a failing test reproduces the bug first.\"", "excerpt": "\"TDD: write a failing unit test, write the minimum code to pass, refactor: red, green, refactor. It drives design toward small, testable units. BDD: describes behaviour in business language, often Given/When/Then scenari", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "sec-jwt", "title": "How does JWT work, and how do you revoke one?", "cat": "security", "section": "Authentication", "kind": "qa", "tags": ["security", "jwt", "authentication"], "body": "\"A JWT is three base64url parts: a header with the algorithm, a payload of claims such as `sub`, `exp`, `aud`, and a signature. The server verifies the signature and the claims without a database lookup, which is why it scales. The payload is only encoded, not encrypted, so it must not contain secrets; JWE is the encrypted variant.\n\nHS256 uses one shared secret, so every verifier could also issue tokens. RS256 or ES256 sign with a private key and verify with a public key, which is what I use between services, with keys published via JWKS.\n\nRevocation is the weak point. Options: short-lived access tokens, around 5–15 minutes, plus refresh tokens that can be revoked; a deny list of token IDs in Redis kept until expiry; or a per-user token version checked on each request. Checklist: always validate `alg`, `exp`, `iss` and `aud`; reject `alg: none`; keep tokens small because they travel with every request.\"\n\nTham khảo thêm: [Security - JWT](https://minhnhat97kg.github.io/docsify/content/security-jwt-json-web-tokens/vi.md)", "excerpt": "\"A JWT is three base64url parts: a header with the algorithm, a payload of claims such as sub, exp, aud, and a signature. The server verifies the signature and the claims without a database lookup, which is why it scales", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-oauth", "title": "Explain OAuth 2.0 and OpenID Connect. Which flow would you use?", "cat": "security", "section": "Authentication", "kind": "qa", "tags": ["security", "oauth2", "oidc", "authentication"], "body": "\"OAuth 2.0 is about **authorization**: a client gets an access token to call an API on a user's behalf. OpenID Connect adds **authentication** on top: an ID token that says who the user is.\n\nRoles: resource owner (user), client (app), authorization server (Keycloak, Auth0, Cognito), and resource server (API).\n\nFlows:\n\n- **Authorization Code with PKCE** for web and mobile apps: the browser gets a one-time code, the client exchanges it with a code verifier, so an intercepted code is useless.\n- **Client Credentials** for service-to-service calls with no user.\n- Implicit and password grants are deprecated.\n\nThe API validates the access token's signature, expiry, audience and scopes; the ID token is for the client only and shouldn't be sent to APIs. In the browser I keep tokens out of localStorage, which XSS can read, using a backend-for-frontend with HttpOnly cookies. Refresh tokens should be rotated on each use so reuse can be detected.\"\n\nTham khảo thêm: [Security - OAuth 2.0 & OIDC](https://minhnhat97kg.github.io/docsify/content/security-oauth-20-oidc-modern-authentication/vi.md)", "excerpt": "\"OAuth 2.0 is about authorization: a client gets an access token to call an API on a user's behalf. OpenID Connect adds authentication on top: an ID token that says who the user is. Roles: resource owner (user), client (", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-password", "title": "How should passwords be stored?", "cat": "security", "section": "Cryptography", "kind": "qa", "tags": ["security", "hashing", "authentication"], "body": "\"Hash, never encrypt: we never need the original password back. And not with SHA-256 or MD5, which are designed to be fast, so GPUs can try billions of guesses per second.\n\nUse a slow, salted password hashing algorithm: **Argon2id** for new systems, or **bcrypt**, which is still fine. The salt is random per user and stored with the hash; it defeats rainbow tables and makes identical passwords hash differently. The work factor, such as bcrypt cost or Argon2 memory and iterations, is tuned so one hash takes roughly 100–300 ms, and raised over time, rehashing on the user's next login.\n\nA pepper is an extra secret kept outside the database, for example in a KMS, so a stolen database alone isn't enough. On top of hashing: rate limiting and lockout on login, checking new passwords against breached-password lists, and MFA.\"\n\nTham khảo thêm: [Security - Password Hashing](https://minhnhat97kg.github.io/docsify/content/security-password-hashing/vi.md)", "excerpt": "\"Hash, never encrypt: we never need the original password back. And not with SHA-256 or MD5, which are designed to be fast, so GPUs can try billions of guesses per second. Use a slow, salted password hashing algorithm: A", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-crypto", "title": "Hashing vs encryption, and how do you manage keys?", "cat": "security", "section": "Cryptography", "kind": "qa", "tags": ["security", "cryptography", "encryption", "kms"], "body": "\"Hashing is one-way and used for integrity and passwords. Encryption is reversible with a key and used for confidentiality.\n\nFor symmetric encryption I use **AES-GCM**, which provides both confidentiality and integrity; never ECB, which leaks patterns, and never reuse a nonce with the same key. AES-128 is already secure; AES-256 is chosen for compliance or long-term margins at a small cost.\n\nThe hard part is **key management**: keys don't belong in code, config files or environment variables in images. They live in a KMS or Vault, access is controlled by IAM, use is audited, and keys rotate. A secret, such as a key or password, is different from configuration such as a URL: secrets need access control, auditing and rotation.\"\n\nTham khảo thêm: [Security - Cryptography](https://minhnhat97kg.github.io/docsify/content/security-cryptography/vi.md)", "excerpt": "\"Hashing is one-way and used for integrity and passwords. Encryption is reversible with a key and used for confidentiality. For symmetric encryption I use AES-GCM, which provides both confidentiality and integrity; never", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-pii", "title": "How do you protect PII at rest, and still search it?", "cat": "security", "section": "Cryptography", "kind": "qa", "tags": ["security", "pii", "encryption", "kms"], "body": "\"There are three layers. Disk or volume encryption protects against stolen disks. Database TDE protects files and backups. **Application-level encryption** protects against anyone with database access, including DBAs and SQL injection, so for sensitive fields such as ID numbers or phone numbers I encrypt in the application with AES-GCM.\n\nKeys use **envelope encryption**: a data key encrypts the data, a master key in KMS encrypts the data key, and only the encrypted data key is stored next to the data. Rotating the master key doesn't require re-encrypting all data.\n\nSearching: encrypted values can't be compared, so I add a **blind index**, an HMAC of the normalized value with a separate key, stored in its own column for exact-match lookups. Masking (showing `****1234`) is a display control, not protection. Plus: collect less PII, define retention, and keep PII out of logs.\"\n\nTham khảo thêm: [Security - PII Data Protection](https://minhnhat97kg.github.io/docsify/content/security-pii-data-protection-encryption-at-rest/vi.md)", "excerpt": "\"There are three layers. Disk or volume encryption protects against stolen disks. Database TDE protects files and backups. Application-level encryption protects against anyone with database access, including DBAs and SQL", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-owasp-api", "title": "What are the most important OWASP API security risks?", "cat": "security", "section": "Application security", "kind": "qa", "tags": ["security", "owasp", "api"], "body": "\"From the OWASP API Security Top 10 (2023), the ones I see most:\n\n- **BOLA, broken object-level authorization:** `GET /accounts/123` returns account 123 to any logged-in user. Fix: check ownership on every object access, ideally in a shared layer, and prefer non-guessable IDs as defense in depth.\n- **Broken authentication:** weak token validation, no rate limit on login.\n- **BOPLA, broken object property-level authorization:** returning internal fields (excessive data exposure) or accepting fields the user shouldn't set, such as `role` (mass assignment). Fix: explicit request and response DTOs, never binding requests straight to entities.\n- **Unrestricted resource consumption:** no rate limits, pagination caps or payload size limits.\n- **Unrestricted access to sensitive business flows:** bots abusing sign-up or checkout.\n\nBOLA is about which object; BOPLA is about which fields of an object.\"\n\nTham khảo thêm: [Security - OWASP Top 10 API Security](https://minhnhat97kg.github.io/docsify/content/security-owasp-top-10-api-security/vi.md)", "excerpt": "\"From the OWASP API Security Top 10 (2023), the ones I see most: BOLA, broken object-level authorization: GET /accounts/123 returns account 123 to any logged-in user. Fix: check ownership on every object access, ideally ", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-sqli", "title": "How do you prevent SQL injection?", "cat": "security", "section": "Application security", "kind": "qa", "tags": ["security", "sql", "owasp"], "body": "\"Use parameterized queries everywhere, so input is always sent as data and never parsed as SQL. ORMs such as JPA and GORM do this for normal methods, but not for raw or string-built queries such as `createNativeQuery` with concatenation or GORM's `Raw` with `fmt.Sprintf`.\n\nPlaces parameters can't help: identifiers such as column names in `ORDER BY` or table names. There I map user input to an allow-list of known columns.\n\nRegex sanitization isn't a defense: there are too many encodings and edge cases. Stored procedures are only safe if they don't build dynamic SQL internally. For `LIKE`, pass the pattern as a parameter and escape `%` and `_` in user input. Defense in depth: the application's database user has least privilege, and errors don't leak SQL details.\"\n\nTham khảo thêm: [Security - SQL Injection Prevention](https://minhnhat97kg.github.io/docsify/content/security-sql-injection-prevention/vi.md)", "excerpt": "\"Use parameterized queries everywhere, so input is always sent as data and never parsed as SQL. ORMs such as JPA and GORM do this for normal methods, but not for raw or string-built queries such as createNativeQuery with", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-xss-csrf", "title": "XSS vs CSRF: what are they and how do you defend?", "cat": "security", "section": "Application security", "kind": "qa", "tags": ["security", "xss", "csrf", "web"], "body": "\"**XSS**: an attacker's script runs in the victim's page and can do anything the user can. Defense: context-aware output encoding (frameworks do it by default; avoid raw HTML injection), a strict Content-Security-Policy, and HttpOnly cookies. HttpOnly doesn't stop XSS; it only stops scripts from reading the cookie.\n\n**CSRF**: another site makes the victim's browser send an authenticated request, because cookies are attached automatically. Defense: `SameSite=Lax` or `Strict` cookies, anti-CSRF tokens for state-changing requests, and never changing state on `GET`.\n\nIf the API uses a bearer token from JavaScript instead of cookies, CSRF doesn't apply, but the token is then exposed to XSS. Postman isn't blocked by CORS or CSRF protections because those are browser mechanisms. Also send `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`, and frame protection headers.\"\n\nTham khảo thêm: [Security - CSRF & XSS](https://minhnhat97kg.github.io/docsify/content/security-csrf-xss-the-twin-killers/vi.md)", "excerpt": "\"XSS: an attacker's script runs in the victim's page and can do anything the user can. Defense: context-aware output encoding (frameworks do it by default; avoid raw HTML injection), a strict Content-Security-Policy, and", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-mtls", "title": "What is mTLS and when do you use it?", "cat": "security", "section": "Infrastructure security", "kind": "qa", "tags": ["security", "mtls", "zero-trust", "microservices", "kubernetes"], "body": "\"In normal TLS only the server presents a certificate. In mutual TLS the client also presents one, so both sides prove their identity cryptographically, and traffic is encrypted.\n\nI use it for service-to-service traffic, usually through a service mesh such as Istio or Linkerd, whose sidecars issue short-lived certificates automatically and rotate them. That's much stronger than IP allow-lists, because IPs in Kubernetes change and can be spoofed inside a network.\n\nIt doesn't replace JWT or OAuth: mTLS proves which **service** is calling; a token says which **user** and what they may do. The cost is the handshake, which connection reuse amortizes, plus certificate management. The hard parts are rotation and protecting the CA: if the CA key leaks, every certificate is untrustworthy, so it lives in an HSM or KMS.\"\n\nTham khảo thêm: [Security - mTLS](https://minhnhat97kg.github.io/docsify/content/security-mtls/vi.md)", "excerpt": "\"In normal TLS only the server presents a certificate. In mutual TLS the client also presents one, so both sides prove their identity cryptographically, and traffic is encrypted. I use it for service-to-service traffic, ", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-rbac-abac", "title": "RBAC vs ABAC: how do you design authorization?", "cat": "security", "section": "Authorization", "kind": "qa", "tags": ["security", "authorization", "rbac", "abac"], "body": "\"**RBAC** grants permissions to roles and roles to users. It's simple to reason about and audit. Tables: `users`, `roles`, `permissions`, and join tables `user_roles` and `role_permissions`, with permissions cached per user.\n\nIt breaks down with **role explosion**: 'manager of branch A for loans under 1 billion' becomes a new role. That's when I move to **ABAC**: policies evaluated against attributes of the user, the resource and the context, such as department, owner, amount or time. Tools such as OPA or Cedar keep policies as code, separate from business logic.\n\nA common hybrid: roles for coarse access, attributes for fine-grained rules. For relationship-heavy cases, like 'can edit documents in folders shared with my team', Google's Zanzibar model (relationship-based access, as in OpenFGA or SpiceDB) fits best. Performance: evaluate close to the service and cache decisions briefly.\"\n\nTham khảo thêm: [Security - RBAC & ABAC](https://minhnhat97kg.github.io/docsify/content/security-rbac-abac/vi.md)", "excerpt": "\"RBAC grants permissions to roles and roles to users. It's simple to reason about and audit. Tables: users, roles, permissions, and join tables userroles and rolepermissions, with permissions cached per user. It breaks d", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-zero-trust", "title": "What is Zero Trust?", "cat": "security", "section": "Infrastructure security", "kind": "qa", "tags": ["security", "zero-trust"], "body": "\"'Never trust, always verify': no request is trusted because of where it comes from on the network. Every request is authenticated and authorized based on identity, device posture and context, with least privilege.\n\nComponents: a strong identity provider with MFA, device checks, a policy engine and enforcement points (an identity-aware proxy or service mesh), mTLS between services, micro-segmentation, and continuous logging.\n\nA traditional VPN isn't Zero Trust: once inside, a user often reaches the whole network, which enables **lateral movement**, an attacker hopping from one compromised machine to others. Zero Trust limits each identity to the specific resources it needs. Legacy apps that can't do modern auth are put behind an identity-aware proxy. The trade-offs are latency from extra checks and operational complexity, so it's rolled out incrementally, starting with the most sensitive systems.\"\n\nTham khảo thêm: [Security - Zero Trust](https://minhnhat97kg.github.io/docsify/content/security-zero-trust/vi.md)", "excerpt": "\"'Never trust, always verify': no request is trusted because of where it comes from on the network. Every request is authenticated and authorized based on identity, device posture and context, with least privilege. Compo", "catLabel": "Security", "tip": "", "num": null}, {"id": "sec-stride", "title": "How do you threat-model a feature? Explain STRIDE.", "cat": "security", "section": "Secure design", "kind": "qa", "tags": ["security", "threat-modeling", "stride"], "body": "\"I threat-model during design, on a data-flow diagram showing trust boundaries, and go through STRIDE for each element:\n\n- **Spoofing** identity → authentication.\n- **Tampering** with data → integrity, signatures, validation.\n- **Repudiation**, denying an action → audit logs that can't be altered, which matters a lot for payments.\n- **Information disclosure** → encryption, access control.\n- **Denial of service** → rate limits, quotas.\n- **Elevation of privilege** → authorization checks, least privilege.\n\nSpoofing is pretending to be someone else; elevation is gaining rights you shouldn't have even as yourself.\n\nEach threat gets a risk rating and a mitigation or an explicit accepted risk. If the business won't fund a fix, I document the risk with its impact and get an owner to sign off, rather than silently dropping it. Keep it lightweight and repeat it when the design changes, otherwise it becomes shelfware.\"\n\nTham khảo thêm: [Security - Threat Modeling & STRIDE](https://minhnhat97kg.github.io/docsify/content/security-threat-modeling-mo-hinh-hoa-moi-đe-doa-va-bo-khung-stride/vi.md)", "excerpt": "\"I threat-model during design, on a data-flow diagram showing trust boundaries, and go through STRIDE for each element: Spoofing identity → authentication. Tampering with data → integrity, signatures, validation. Repudia", "catLabel": "Security", "tip": "", "num": null}, {"id": "technical-coding-va-sql", "title": "Tổng quan: Technical: coding và SQL", "cat": "coding", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Bài code ở vòng này thường ở mức easy đến medium; điểm nằm ở cách bạn nói ra suy nghĩ và phân tích độ phức tạp, không chỉ ở đáp án.\n\n*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "kind": "guide", "excerpt": "Bài code ở vòng này thường ở mức easy đến medium; điểm nằm ở cách bạn nói ra suy nghĩ và phân tích độ phức tạp, không chỉ ở đáp án. Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu ", "catLabel": "Coding & DSA", "tip": "", "num": null}, {"id": "coding-1", "title": "Find the length of the longest substring without repeating characters.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Sliding window: giữ vị trí gần nhất của mỗi ký tự, khi gặp lại thì dời mép trái. Time O(n), space O(k) với k là số ký tự khác nhau.\n\n```java\nint lengthOfLongestSubstring(String s) {\n    Map<Character, Integer> last = new HashMap<>();\n    int best = 0, left = 0;\n    for (int right = 0; right < s.length(); right++) {\n        Integer prev = last.put(s.charAt(right), right);\n        if (prev != null && prev >= left) {\n            left = prev + 1;\n        }\n        best = Math.max(best, right - left + 1);\n    }\n    return best;\n}\n```", "kind": "qa", "num": 1, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Sliding window: giữ vị trí gần nhất của mỗi ký tự, khi gặp lại thì dời mép trái. Time O(n), space O(k) với k là số ký tự khác nhau.", "catLabel": "Coding & DSA"}, {"id": "coding-2", "title": "Given an int array, group the numbers into ranges 0–9, 10–19, and so on, using Java 8.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Group theo `n / 10`; dùng `TreeMap` để các khoảng được sắp xếp. Giả định số không âm; hãy hỏi lại điều này.\n\n```java\nMap<String, List<Integer>> groupByRange(int[] nums) {\n    Map<Integer, List<Integer>> byBucket = Arrays.stream(nums).boxed()\n        .collect(Collectors.groupingBy(n -> n / 10, TreeMap::new, Collectors.toList()));\n    Map<String, List<Integer>> result = new LinkedHashMap<>();\n    byBucket.forEach((b, list) -> result.put(b * 10 + \"-\" + (b * 10 + 9), list));\n    return result;\n}\n```", "kind": "qa", "num": 2, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Group theo n / 10; dùng TreeMap để các khoảng được sắp xếp. Giả định số không âm; hãy hỏi lại điều này.", "catLabel": "Coding & DSA"}, {"id": "coding-3", "title": "Two Sum: return the indices of two numbers that add up to a target.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Một lượt duyệt với map từ giá trị sang chỉ số. Time O(n), space O(n); brute force là O(n²).\n\n```java\nint[] twoSum(int[] nums, int target) {\n    Map<Integer, Integer> seen = new HashMap<>();\n    for (int i = 0; i < nums.length; i++) {\n        Integer j = seen.get(target - nums[i]);\n        if (j != null) {\n            return new int[] {j, i};\n        }\n        seen.put(nums[i], i);\n    }\n    return new int[0];\n}\n```", "kind": "qa", "num": 3, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Một lượt duyệt với map từ giá trị sang chỉ số. Time O(n), space O(n); brute force là O(n²).", "catLabel": "Coding & DSA"}, {"id": "coding-4", "title": "Find the first non-repeated character in a string, using streams.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "`LinkedHashMap` giữ thứ tự xuất hiện. Time O(n).\n\n```java\nCharacter firstUnique(String s) {\n    return s.chars().mapToObj(c -> (char) c)\n        .collect(Collectors.groupingBy(Function.identity(), LinkedHashMap::new, Collectors.counting()))\n        .entrySet().stream()\n        .filter(e -> e.getValue() == 1)\n        .map(Map.Entry::getKey)\n        .findFirst()\n        .orElse(null);\n}\n```", "kind": "qa", "num": 4, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "LinkedHashMap giữ thứ tự xuất hiện. Time O(n).", "catLabel": "Coding & DSA"}, {"id": "coding-5", "title": "Check whether a string of brackets is valid.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "Dùng stack: gặp ngoặc mở thì push ngoặc đóng tương ứng, gặp ngoặc đóng thì pop và so sánh. Time O(n), space O(n).\n\n```java\nboolean isValid(String s) {\n    Deque<Character> stack = new ArrayDeque<>();\n    for (char c : s.toCharArray()) {\n        switch (c) {\n            case '(' -> stack.push(')');\n            case '[' -> stack.push(']');\n            case '{' -> stack.push('}');\n            default -> {\n                if (stack.isEmpty() || stack.pop() != c) {\n                    return false;\n                }\n            }\n        }\n    }\n    return stack.isEmpty();\n}\n```", "kind": "qa", "num": 5, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Dùng stack: gặp ngoặc mở thì push ngoặc đóng tương ứng, gặp ngoặc đóng thì pop và so sánh. Time O(n), space O(n).", "catLabel": "Coding & DSA"}, {"id": "coding-6", "title": "Given a list of employees, find the highest-paid employee in each department and the average salary per department.", "cat": "coding", "section": "Coding", "tags": ["coding"], "body": "```java\nMap<String, Optional<Employee>> topByDept = employees.stream()\n    .collect(Collectors.groupingBy(Employee::department,\n        Collectors.maxBy(Comparator.comparingDouble(Employee::salary))));\n\nMap<String, Double> avgByDept = employees.stream()\n    .collect(Collectors.groupingBy(Employee::department,\n        Collectors.averagingDouble(Employee::salary)));\n```\n\n*Các dạng nên luyện thêm: đảo chuỗi và palindrome, anagram, merge hai mảng đã sắp xếp, binary search, tìm phần tử trùng, LRU cache bằng `LinkedHashMap`, duyệt cây BFS/DFS.*", "kind": "qa", "num": 6, "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "excerpt": "Các dạng nên luyện thêm: đảo chuỗi và palindrome, anagram, merge hai mảng đã sắp xếp, binary search, tìm phần tử trùng, LRU cache bằng LinkedHashMap, duyệt cây BFS/DFS.", "catLabel": "Coding & DSA"}, {"id": "dsa-lru", "title": "Implement an LRU cache with O(1) get and put.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "design"], "body": "Kết hợp hash map (tra cứu O(1)) với danh sách liên kết đôi (di chuyển và xóa O(1)): phần tử mới dùng đưa lên đầu, khi đầy thì xóa phần tử ở cuối. Trong Java, `LinkedHashMap` với `accessOrder = true` làm sẵn việc này; interviewer thường muốn bạn tự cài.\n\n```java\nclass LRUCache {\n    private final int capacity;\n    private final Map<Integer, Node> map = new HashMap<>();\n    private final Node head = new Node(0, 0), tail = new Node(0, 0);\n\n    LRUCache(int capacity) {\n        this.capacity = capacity;\n        head.next = tail;\n        tail.prev = head;\n    }\n\n    int get(int key) {\n        Node n = map.get(key);\n        if (n == null) return -1;\n        moveToFront(n);\n        return n.val;\n    }\n\n    void put(int key, int val) {\n        Node n = map.get(key);\n        if (n != null) {\n            n.val = val;\n            moveToFront(n);\n            return;\n        }\n        if (map.size() == capacity) {\n            Node lru = tail.prev;\n            unlink(lru);\n            map.remove(lru.key);\n        }\n        n = new Node(key, val);\n        map.put(key, n);\n        addFront(n);\n    }\n\n    private void moveToFront(Node n) { unlink(n); addFront(n); }\n    private void unlink(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }\n    private void addFront(Node n) {\n        n.next = head.next; n.prev = head;\n        head.next.prev = n; head.next = n;\n    }\n\n    private static class Node {\n        int key, val; Node prev, next;\n        Node(int k, int v) { key = k; val = v; }\n    }\n}\n```\n\n\"Both operations are O(1) time; space is O(capacity). For concurrent access I'd wrap it with a lock, or use a library such as Caffeine in production.\"", "excerpt": "Kết hợp hash map (tra cứu O(1)) với danh sách liên kết đôi (di chuyển và xóa O(1)): phần tử mới dùng đưa lên đầu, khi đầy thì xóa phần tử ở cuối. Trong Java, LinkedHashMap với accessOrder = true làm sẵn việc này; intervi", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-top-k", "title": "Return the k most frequent elements of an array.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "heap"], "body": "Đếm tần suất bằng map, rồi giữ min-heap kích thước k. Time O(n log k), space O(n). Có thể làm O(n) bằng bucket sort theo tần suất.\n\n```java\nint[] topKFrequent(int[] nums, int k) {\n    Map<Integer, Integer> freq = new HashMap<>();\n    for (int n : nums) freq.merge(n, 1, Integer::sum);\n    PriorityQueue<Map.Entry<Integer, Integer>> heap =\n        new PriorityQueue<>(Map.Entry.comparingByValue());\n    for (Map.Entry<Integer, Integer> e : freq.entrySet()) {\n        heap.offer(e);\n        if (heap.size() > k) heap.poll();\n    }\n    return heap.stream().mapToInt(Map.Entry::getKey).toArray();\n}\n```", "excerpt": "Đếm tần suất bằng map, rồi giữ min-heap kích thước k. Time O(n log k), space O(n). Có thể làm O(n) bằng bucket sort theo tần suất.", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-merge-intervals", "title": "Merge all overlapping intervals.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "sorting"], "body": "Sắp xếp theo điểm bắt đầu, rồi gộp nếu khoảng hiện tại chồng lên khoảng cuối cùng trong kết quả. Time O(n log n) do sắp xếp, space O(n).\n\n```java\nint[][] merge(int[][] intervals) {\n    Arrays.sort(intervals, Comparator.comparingInt(a -> a[0]));\n    List<int[]> out = new ArrayList<>();\n    for (int[] cur : intervals) {\n        if (!out.isEmpty() && out.get(out.size() - 1)[1] >= cur[0]) {\n            out.get(out.size() - 1)[1] = Math.max(out.get(out.size() - 1)[1], cur[1]);\n        } else {\n            out.add(cur);\n        }\n    }\n    return out.toArray(new int[0][]);\n}\n```\n\n\"Hỏi lại interviewer: hai khoảng chạm nhau như [1,2] và [2,3] có tính là chồng không.\"", "excerpt": "Sắp xếp theo điểm bắt đầu, rồi gộp nếu khoảng hiện tại chồng lên khoảng cuối cùng trong kết quả. Time O(n log n) do sắp xếp, space O(n). \"Hỏi lại interviewer: hai khoảng chạm nhau như 1,2 và 2,3 có tính là chồng không.\"", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-islands", "title": "Count the number of islands in a grid of '1' (land) and '0' (water).", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "graph"], "body": "Duyệt từng ô; gặp đất chưa thăm thì tăng bộ đếm và BFS/DFS để đánh dấu cả hòn đảo. Time O(m·n), space O(m·n) trong trường hợp xấu nhất. Dùng BFS với queue để tránh stack overflow trên lưới lớn.\n\n```java\nint numIslands(char[][] grid) {\n    int m = grid.length, n = grid[0].length, count = 0;\n    int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            if (grid[i][j] != '1') continue;\n            count++;\n            Deque<int[]> q = new ArrayDeque<>();\n            q.add(new int[]{i, j});\n            grid[i][j] = '0';\n            while (!q.isEmpty()) {\n                int[] c = q.poll();\n                for (int[] d : dirs) {\n                    int r = c[0] + d[0], col = c[1] + d[1];\n                    if (r >= 0 && r < m && col >= 0 && col < n && grid[r][col] == '1') {\n                        grid[r][col] = '0';\n                        q.add(new int[]{r, col});\n                    }\n                }\n            }\n        }\n    }\n    return count;\n}\n```\n\n\"Nếu không được sửa input, dùng mảng `boolean[][] visited` riêng.\"", "excerpt": "Duyệt từng ô; gặp đất chưa thăm thì tăng bộ đếm và BFS/DFS để đánh dấu cả hòn đảo. Time O(m·n), space O(m·n) trong trường hợp xấu nhất. Dùng BFS với queue để tránh stack overflow trên lưới lớn. \"Nếu không được sửa input,", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-rotated-search", "title": "Search for a target in a rotated sorted array in O(log n).", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "binary-search"], "body": "Binary search: ở mỗi bước, ít nhất một nửa đã được sắp xếp; kiểm tra target có nằm trong nửa đó không để quyết định đi trái hay phải. Time O(log n), space O(1).\n\n```java\nint search(int[] nums, int target) {\n    int lo = 0, hi = nums.length - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (nums[mid] == target) return mid;\n        if (nums[lo] <= nums[mid]) {\n            if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;\n            else lo = mid + 1;\n        } else {\n            if (nums[mid] < target && target <= nums[hi]) lo = mid + 1;\n            else hi = mid - 1;\n        }\n    }\n    return -1;\n}\n```", "excerpt": "Binary search: ở mỗi bước, ít nhất một nửa đã được sắp xếp; kiểm tra target có nằm trong nửa đó không để quyết định đi trái hay phải. Time O(log n), space O(1).", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-phone-letters", "title": "Generate all letter combinations of a phone-keypad digit string.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "backtracking", "axon"], "body": "Backtracking: mỗi chữ số chọn lần lượt từng chữ cái, đệ quy sang chữ số tiếp theo. Time O(4^n · n) vì mỗi số có tối đa 4 chữ cái, space O(n) cho đệ quy (không tính kết quả). Dạng bài này từng được báo cáo ở Axon.\n\n```java\nprivate static final String[] KEYS = {\"\", \"\", \"abc\", \"def\", \"ghi\", \"jkl\", \"mno\", \"pqrs\", \"tuv\", \"wxyz\"};\n\nList<String> letterCombinations(String digits) {\n    List<String> out = new ArrayList<>();\n    if (digits.isEmpty()) return out;\n    backtrack(digits, 0, new StringBuilder(), out);\n    return out;\n}\n\nprivate void backtrack(String digits, int i, StringBuilder cur, List<String> out) {\n    if (i == digits.length()) {\n        out.add(cur.toString());\n        return;\n    }\n    for (char c : KEYS[digits.charAt(i) - '0'].toCharArray()) {\n        cur.append(c);\n        backtrack(digits, i + 1, cur, out);\n        cur.deleteCharAt(cur.length() - 1);\n    }\n}\n```", "excerpt": "Backtracking: mỗi chữ số chọn lần lượt từng chữ cái, đệ quy sang chữ số tiếp theo. Time O(4^n · n) vì mỗi số có tối đa 4 chữ cái, space O(n) cho đệ quy (không tính kết quả). Dạng bài này từng được báo cáo ở Axon.", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-tree-level", "title": "Binary tree: level-order traversal, and invert the tree.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "tree"], "body": "Level order dùng BFS với queue, xử lý theo từng tầng bằng cách lấy kích thước queue đầu mỗi vòng. Invert là đệ quy đổi chỗ con trái và con phải. Cả hai đều O(n) time; space O(w) với w là độ rộng lớn nhất (BFS) hoặc O(h) với h là chiều cao (đệ quy).\n\n```java\nList<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> out = new ArrayList<>();\n    if (root == null) return out;\n    Deque<TreeNode> q = new ArrayDeque<>(List.of(root));\n    while (!q.isEmpty()) {\n        int size = q.size();\n        List<Integer> level = new ArrayList<>(size);\n        for (int i = 0; i < size; i++) {\n            TreeNode n = q.poll();\n            level.add(n.val);\n            if (n.left != null) q.add(n.left);\n            if (n.right != null) q.add(n.right);\n        }\n        out.add(level);\n    }\n    return out;\n}\n\nTreeNode invert(TreeNode root) {\n    if (root == null) return null;\n    TreeNode left = invert(root.left);\n    root.left = invert(root.right);\n    root.right = left;\n    return root;\n}\n```", "excerpt": "Level order dùng BFS với queue, xử lý theo từng tầng bằng cách lấy kích thước queue đầu mỗi vòng. Invert là đệ quy đổi chỗ con trái và con phải. Cả hai đều O(n) time; space O(w) với w là độ rộng lớn nhất (BFS) hoặc O(h) ", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-coin-change", "title": "Coin change: the fewest coins that make up an amount.", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "dp"], "body": "Dynamic programming từ dưới lên: `dp[a]` là số đồng ít nhất để tạo ra `a`, với `dp[a] = min(dp[a - c] + 1)` qua mọi đồng `c`. Time O(amount · số loại đồng), space O(amount). Greedy sai với bộ đồng như {1, 3, 4} và amount 6.\n\n```java\nint coinChange(int[] coins, int amount) {\n    int[] dp = new int[amount + 1];\n    Arrays.fill(dp, amount + 1);\n    dp[0] = 0;\n    for (int a = 1; a <= amount; a++) {\n        for (int c : coins) {\n            if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);\n        }\n    }\n    return dp[amount] > amount ? -1 : dp[amount];\n}\n```", "excerpt": "Dynamic programming từ dưới lên: dpa là số đồng ít nhất để tạo ra a, với dpa = min(dpa - c + 1) qua mọi đồng c. Time O(amount · số loại đồng), space O(amount). Greedy sai với bộ đồng như {1, 3, 4} và amount 6.", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-course-schedule", "title": "Can all courses be finished given prerequisite pairs? (cycle detection)", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "graph"], "body": "Topological sort theo thuật toán Kahn: đếm in-degree, đưa các nút có in-degree 0 vào queue, lấy ra và giảm in-degree của nút kề. Nếu xử lý được đủ mọi nút thì không có chu trình. Time O(V + E), space O(V + E). Ứng dụng thực tế: thứ tự khởi động service hoặc chạy migration có phụ thuộc.\n\n```java\nboolean canFinish(int n, int[][] prereq) {\n    List<List<Integer>> g = new ArrayList<>();\n    for (int i = 0; i < n; i++) g.add(new ArrayList<>());\n    int[] indeg = new int[n];\n    for (int[] p : prereq) { g.get(p[1]).add(p[0]); indeg[p[0]]++; }\n    Deque<Integer> q = new ArrayDeque<>();\n    for (int i = 0; i < n; i++) if (indeg[i] == 0) q.add(i);\n    int seen = 0;\n    while (!q.isEmpty()) {\n        int u = q.poll(); seen++;\n        for (int v : g.get(u)) if (--indeg[v] == 0) q.add(v);\n    }\n    return seen == n;\n}\n```", "excerpt": "Topological sort theo thuật toán Kahn: đếm in-degree, đưa các nút có in-degree 0 vào queue, lấy ra và giảm in-degree của nút kề. Nếu xử lý được đủ mọi nút thì không có chu trình. Time O(V + E), space O(V + E). Ứng dụng t", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "dsa-rain-water", "title": "Trapping Rain Water: how much water is trapped between bars?", "cat": "coding", "section": "DSA", "kind": "qa", "tags": ["dsa", "two-pointers", "epam"], "body": "Nước tại vị trí i bằng `min(maxLeft, maxRight) - height[i]`. Dùng hai con trỏ từ hai đầu: phía nào có max nhỏ hơn thì nước ở phía đó đã được xác định, nên xử lý phía đó rồi tiến vào. Time O(n), space O(1). Cách dễ nói hơn là dùng hai mảng prefix max và suffix max, O(n) space.\n\n```java\nint trap(int[] h) {\n    int left = 0, right = h.length - 1;\n    int leftMax = 0, rightMax = 0, water = 0;\n    while (left < right) {\n        if (h[left] < h[right]) {\n            leftMax = Math.max(leftMax, h[left]);\n            water += leftMax - h[left];\n            left++;\n        } else {\n            rightMax = Math.max(rightMax, h[right]);\n            water += rightMax - h[right];\n            right--;\n        }\n    }\n    return water;\n}\n```\n\n\"Why it's correct: when `h[left] < h[right]`, there is a bar on the right at least as tall as `h[left]`, so the water at `left` is limited only by `leftMax`. Example: `[0,1,0,2,1,0,1,3,2,1,2,1]` traps 6.\"", "excerpt": "Nước tại vị trí i bằng min(maxLeft, maxRight) - heighti. Dùng hai con trỏ từ hai đầu: phía nào có max nhỏ hơn thì nước ở phía đó đã được xác định, nên xử lý phía đó rồi tiến vào. Time O(n), space O(1). Cách dễ nói hơn là", "catLabel": "Coding & DSA", "tip": "*Cách làm mỗi bài: nhắc lại đề và hỏi ràng buộc (input rỗng, ký tự gì, kích thước) → nêu cách brute force và độ phức tạp → nêu cách tối ưu → code → chạy tay một ví dụ → nói time và space complexity.*", "num": null}, {"id": "behavioral-va-manager-interview", "title": "Tổng quan: Behavioral và manager interview", "cat": "behavioral", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Vòng này đánh giá bạn có làm việc được với khách hàng và team hay không; mọi câu trả lời nên là một câu chuyện thật theo STAR, dài khoảng 2 phút.\n\n*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "kind": "guide", "excerpt": "Vòng này đánh giá bạn có làm việc được với khách hàng và team hay không; mọi câu trả lời nên là một câu chuyện thật theo STAR, dài khoảng 2 phút. STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action ", "catLabel": "Behavioral & AI", "tip": "", "num": null}, {"id": "behavioral-1", "title": "Tell me about the most challenging project you've worked on.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "opswat", "dxc"], "body": "\"At \\[Opswat/DXC\\] we had to \\[mục tiêu\\] under \\[ràng buộc: deadline, quy mô, hệ thống cũ\\]. I was responsible for \\[phần của bạn\\]. The hard part was \\[vấn đề kỹ thuật cụ thể\\]. I \\[các bước: đo đạc, đề xuất phương án, thử nghiệm, triển khai\\]. As a result \\[kết quả có số liệu\\]. I learned \\[bài học\\].\"", "kind": "qa", "num": 1, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"At Opswat/DXC we had to mục tiêu under ràng buộc: deadline, quy mô, hệ thống cũ. I was responsible for phần của bạn. The hard part was vấn đề kỹ thuật cụ thể. I các bước: đo đạc, đề xuất phương án, thử nghiệm, triển kha", "catLabel": "Behavioral & AI"}, {"id": "behavioral-2", "title": "Describe a production incident you handled.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"\\[Thời điểm\\], \\[triệu chứng\\] affected \\[ai, bao nhiêu\\]. I first mitigated by \\[rollback / tắt feature / scale\\], then found the root cause through \\[log, metric, trace\\]: \\[nguyên nhân\\]. I fixed it with \\[giải pháp\\] and added \\[test, alert, runbook\\] so it can't recur silently. I kept stakeholders updated every \\[X\\] minutes.\"\n\n*Ghi chú: thứ tự \"giảm thiệt hại trước, tìm nguyên nhân sau, rồi ngăn tái diễn\" là thứ người phỏng vấn muốn nghe.*", "kind": "qa", "num": 2, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"Thời điểm, triệu chứng affected ai, bao nhiêu. I first mitigated by rollback / tắt feature / scale, then found the root cause through log, metric, trace: nguyên nhân. I fixed it with giải pháp and added test, alert, run", "catLabel": "Behavioral & AI"}, {"id": "behavioral-3", "title": "Tell me about a disagreement with a teammate or lead.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"We disagreed on \\[quyết định kỹ thuật\\]. I thought \\[quan điểm của bạn\\]; they preferred \\[quan điểm kia\\]. I asked for their reasoning, wrote down the trade-offs of both options, and proposed \\[prototype / benchmark / ý kiến bên thứ ba\\]. We went with \\[kết quả\\]. Whether or not my option won, I committed to the decision. The relationship stayed \\[tốt / tốt hơn\\].\"", "kind": "qa", "num": 3, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"We disagreed on quyết định kỹ thuật. I thought quan điểm của bạn; they preferred quan điểm kia. I asked for their reasoning, wrote down the trade-offs of both options, and proposed prototype / benchmark / ý kiến bên thứ", "catLabel": "Behavioral & AI"}, {"id": "behavioral-4", "title": "How do you handle unclear or changing requirements from a client?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "dxc"], "body": "\"On the insurance projects at DXC, requirements from \\[khách hàng\\] often \\[thay đổi như thế nào\\]. I clarified by restating the requirement in writing with concrete examples and edge cases, and confirmed it before estimating. When a change arrived mid-sprint, I explained the impact on scope and timeline and offered options, rather than just saying yes or no. That reduced \\[rework / bug\\] by \\[kết quả\\].\"", "kind": "qa", "num": 4, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"On the insurance projects at DXC, requirements from khách hàng often thay đổi như thế nào. I clarified by restating the requirement in writing with concrete examples and edge cases, and confirmed it before estimating. W", "catLabel": "Behavioral & AI"}, {"id": "behavioral-5", "title": "Tell me about a time you had to push back on a client or say no.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"The client asked for \\[yêu cầu\\] by \\[deadline\\]. It wasn't feasible without \\[rủi ro\\]. I explained the risk with data, proposed \\[phương án thay thế: chia giai đoạn, giảm phạm vi\\], and we agreed on \\[kết quả\\]. The key was offering an alternative instead of only refusing.\"", "kind": "qa", "num": 5, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"The client asked for yêu cầu by deadline. It wasn't feasible without rủi ro. I explained the risk with data, proposed phương án thay thế: chia giai đoạn, giảm phạm vi, and we agreed on kết quả. The key was offering an a", "catLabel": "Behavioral & AI"}, {"id": "behavioral-6", "title": "Tell me about a deadline you were at risk of missing.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"We were \\[X ngày\\] from the release of \\[tính năng\\] when \\[vấn đề\\]. I flagged it early to \\[lead/PM\\] instead of hoping to catch up, split the work into must-have and can-wait, and \\[hành động\\]. We delivered \\[phạm vi\\] on time and \\[phần còn lại\\] in the next release.\"", "kind": "qa", "num": 6, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"We were X ngày from the release of tính năng when vấn đề. I flagged it early to lead/PM instead of hoping to catch up, split the work into must-have and can-wait, and hành động. We delivered phạm vi on time and phần còn", "catLabel": "Behavioral & AI"}, {"id": "behavioral-7", "title": "Have you mentored or led other engineers?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I \\[onboard / review code / hướng dẫn\\] \\[số người\\] engineers at \\[công ty\\]. My approach is to explain the reasoning in code reviews, pair on the first task in a new area, and give them ownership of something small but complete. One example: \\[người đó tiến bộ thế nào\\].\"\n\n*Ghi chú: nếu chưa từng lead chính thức, nói thật và dùng ví dụ mentoring không chính thức.*", "kind": "qa", "num": 7, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I onboard / review code / hướng dẫn số người engineers at công ty. My approach is to explain the reasoning in code reviews, pair on the first task in a new area, and give them ownership of something small but complete. ", "catLabel": "Behavioral & AI"}, {"id": "behavioral-8", "title": "Tell me about a mistake you made.", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I \\[lỗi thật, có hậu quả vừa phải\\]. I noticed it when \\[cách phát hiện\\], told the team immediately, and fixed it by \\[hành động\\]. Since then I \\[thay đổi trong cách làm việc\\].\"\n\n*Ghi chú: chọn lỗi thật, không chọn \"lỗi\" kiểu \"tôi làm việc quá chăm\".*", "kind": "qa", "num": 8, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I lỗi thật, có hậu quả vừa phải. I noticed it when cách phát hiện, told the team immediately, and fixed it by hành động. Since then I thay đổi trong cách làm việc.\" Ghi chú: chọn lỗi thật, không chọn \"lỗi\" kiểu \"tôi làm", "catLabel": "Behavioral & AI"}, {"id": "behavioral-9", "title": "How do you do code review, and how do you handle technical debt?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"In reviews I look at correctness, readability, tests and design, in that order of risk; I ask questions rather than give orders, and separate blocking issues from suggestions. For technical debt I make it visible as tickets with the cost it causes, fix small items as part of related work, and negotiate time for larger ones with a clear benefit, such as fewer incidents or faster delivery.\"", "kind": "qa", "num": 9, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"In reviews I look at correctness, readability, tests and design, in that order of risk; I ask questions rather than give orders, and separate blocking issues from suggestions. For technical debt I make it visible as tic", "catLabel": "Behavioral & AI"}, {"id": "behavioral-10", "title": "How do you estimate work and work in Scrum?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"I break a story into tasks, identify unknowns, and spike the risky ones before committing. I estimate relatively in story points with the team and include testing, review and deployment. I raise blockers in the daily stand-up, and use retrospectives to change one concrete thing per sprint.\"", "kind": "qa", "num": 10, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I break a story into tasks, identify unknowns, and spike the risky ones before committing. I estimate relatively in story points with the team and include testing, review and deployment. I raise blockers in the daily st", "catLabel": "Behavioral & AI"}, {"id": "behavioral-11", "title": "How do you learn a new domain or technology quickly?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral", "opswat", "dxc"], "body": "\"I moved from life insurance at DXC to cybersecurity at Opswat, and from Java to also writing Go. I start with the official docs and the existing codebase, build something small end to end, and ask domain experts focused questions. Within \\[thời gian\\] I was \\[đóng góp gì\\].\"", "kind": "qa", "num": 11, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"I moved from life insurance at DXC to cybersecurity at Opswat, and from Java to also writing Go. I start with the official docs and the existing codebase, build something small end to end, and ask domain experts focused", "catLabel": "Behavioral & AI"}, {"id": "behavioral-12", "title": "Where do you see yourself in three years?", "cat": "behavioral", "section": "Behavioral", "tags": ["behavioral"], "body": "\"As a strong senior or lead engineer who owns the design of a system and helps a team deliver. I want to deepen system design and cloud skills, and \\[công ty\\] is a good place for that.\"", "kind": "qa", "num": 12, "tip": "*STAR: Situation (bối cảnh, 1–2 câu) → Task (trách nhiệm của bạn) → Action (bạn đã làm gì, dùng \"I\" chứ không phải \"we\") → Result (con số hoặc kết quả cụ thể, và bài học). Các câu mẫu dưới đây là khung; phần trong ngoặc vuông phải là chuyện thật của bạn. Chuẩn bị 6–8 câu chuyện là đủ dùng cho hầu hết câu hỏi.*", "excerpt": "\"As a strong senior or lead engineer who owns the design of a system and helps a team deliver. I want to deepen system design and cloud skills, and công ty is a good place for that.\"", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-13", "title": "How do you use AI coding tools in your work?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"I use \\[công cụ bạn dùng thật\\] for exploring unfamiliar code, generating tests and boilerplate, refactoring, and drafting documentation. I stay responsible for the result: I review every change, run the tests, and don't accept code I can't explain. I don't paste secrets or client data, and I follow the client's policy on AI tools.\"", "kind": "qa", "num": 13, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"I use công cụ bạn dùng thật for exploring unfamiliar code, generating tests and boilerplate, refactoring, and drafting documentation. I stay responsible for the result: I review every change, run the tests, and don't ac", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-14", "title": "How do you write an effective prompt for a coding task?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"I give context, the goal, constraints and the expected output: which files matter, what done looks like, what must not change, and how to verify, for example which tests to run. I split large tasks into small steps, ask for a plan before code on anything non-trivial, and provide examples of the existing style.\"", "kind": "qa", "num": 14, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"I give context, the goal, constraints and the expected output: which files matter, what done looks like, what must not change, and how to verify, for example which tests to run. I split large tasks into small steps, ask", "catLabel": "Behavioral & AI"}, {"id": "ai-tools-15", "title": "What are tokens, and how do you control token usage and cost?", "cat": "behavioral", "section": "AI-assisted development", "tags": ["ai-tools"], "body": "\"Models read and write text as tokens, and both cost and the context window are measured in them. Usage grows with everything in the context: the conversation history, files read and tool output. To control it I keep tasks focused, start a fresh session for a new task, point the tool at specific files instead of the whole repository, keep project instructions short, and use a smaller model for simple work. Long sessions also lose accuracy as the context fills, so this is about quality as well as cost.\"", "kind": "qa", "num": 15, "tip": "Câu hỏi về công cụ AI khi lập trình đang xuất hiện ngày càng nhiều; ví dụ một báo cáo phỏng vấn EPAM tháng 7/2026 ghi câu hỏi về Claude Code, prompt và token usage ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).", "excerpt": "\"Models read and write text as tokens, and both cost and the context window are measured in them. Usage grows with everything in the context: the conversation history, files read and tool output. To control it I keep tas", "catLabel": "Behavioral & AI"}, {"id": "eng-sdlc-agile", "title": "What is the SDLC, and why is Agile usually preferred over Waterfall?", "cat": "behavioral", "section": "Engineering practice (EPAM rapid-fire)", "kind": "qa", "tags": ["sdlc", "agile", "process", "epam", "opswat", "dxc"], "body": "\"The SDLC is the lifecycle of building software: requirements, design, implementation, testing, deployment and maintenance.\n\n**Waterfall** runs those phases once, in sequence. It suits fixed, well-understood requirements, for example regulated or contract-fixed projects, but changes late in the project are expensive and users see value only at the end.\n\n**Agile** runs short iterations, typically two-week sprints in Scrum, each delivering a working increment, with regular feedback from stakeholders. It handles changing requirements and reduces risk because problems surface early.\n\nAt DXC, the insurance clients [mô tả quy trình thật: Scrum 2 tuần, sprint review với khách hàng, ...]. At Opswat we [mô tả]. I've seen hybrid setups too: fixed-scope contracts on the client side, run internally in sprints.\"\n\n*Ghi chú: câu \"Agile practices in your project\" phải trả lời bằng dự án thật: độ dài sprint, các buổi họp, ai là PO, công cụ (Jira), cách ước lượng.*", "excerpt": "\"The SDLC is the lifecycle of building software: requirements, design, implementation, testing, deployment and maintenance. Waterfall runs those phases once, in sequence. It suits fixed, well-understood requirements, for", "catLabel": "Behavioral & AI", "tip": "", "num": null}]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const A = DATA.articles;
const BY = Object.fromEntries(A.map(a=>[a.id,a]));
const ROUNDS = [['all','Tất cả']].concat(DATA.cats);
const TAGLABEL = {'java-modern':'java-8-21','tong-quan':'tổng-quan','huong-dan':'hướng-dẫn','ke-hoach':'kế-hoạch','cong-ty':'công-ty'};
const tl = t => '#' + (TAGLABEL[t]||t);

const store = {
  get(k,d){ try{ const v=localStorage.getItem('kb.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('kb.'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {round: store.get('round','all'), tag: store.get('tag',null), q:'', todo: store.get('todo',false),
           practice: store.get('practice',false), dark: store.get('dark', matchMedia('(prefers-color-scheme: dark)').matches)};
let done = new Set(store.get('done',[]));
let revealed = new Set();
function chkState(id){ return store.get('chk.'+id, {}); }

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
A.forEach(a=>{ a._s = norm(a.title+' '+a.section+' '+a.tags.join(' ')+' '+a.body+' '+(a.tip||'')); });
const QA = A.filter(a=>a.kind==='qa');

function applyTheme(){
  document.documentElement.classList.toggle('dark', S.dark);
  $('#dark').textContent = S.dark ? '[light]' : '[dark]';
  document.body.classList.toggle('practice', S.practice);
  $('#practice').classList.toggle('on', S.practice);
}

function filtered(){
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  return A.filter(a => (S.round==='all' || a.cat===S.round)
    && (!S.tag || a.tags.includes(S.tag))
    && (!S.todo || (a.kind==='qa' && !done.has(a.id)))
    && terms.every(t => a._s.includes(t)));
}

function renderSide(){
  const pool = A.filter(a => S.round==='all' || a.cat===S.round);
  const tc = {};
  pool.forEach(a=>a.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags = Object.entries(tc).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
  const rc = r => r==='all' ? A.length : A.filter(a=>a.cat===r).length;
  const nd = QA.filter(a=>done.has(a.id)).length;
  let h = '<h4>-- CHỦ ĐỀ --</h4>';
  h += ROUNDS.map(([k,l])=>`<div class="row ${S.round===k?'on':''}" data-round="${k}"><span>${l}</span><span class="n">${rc(k)}</span></div>`).join('');
  h += `<h4>-- TIẾN ĐỘ --</h4><div class="row ${S.todo?'on':''}" data-todo="1"><span>chưa thuộc</span><span class="n">${QA.length-nd}</span></div>`;
  h += `<div class="row" style="cursor:default"><span>đã thuộc</span><span class="n">${nd}/${QA.length}</span></div><div class="prog"><div style="width:${(nd/QA.length*100).toFixed(1)}%"></div></div>`;
  const days = A.filter(a=>a.cat==='plan');
  h += '<h4>-- LỘ TRÌNH --</h4>' + days.map(a=>{
    const ck = chkState(a.id), total = (a.body.match(/^- \[ \]/gm)||[]).length, n = Object.values(ck).filter(Boolean).length;
    return `<div class="row ${location.hash.slice(1)===a.id?'on':''}" data-id="${a.id}"><span>${esc(a.title)}</span><span class="n">${n}/${total}</span></div>`;
  }).join('');
  const cos = A.filter(a=>a.cat==='company');
  h += '<h4>-- CÔNG TY --</h4>' + cos.map(a=>`<div class="row ${location.hash.slice(1)===a.id?'on':''}" data-id="${a.id}"><span>${esc(a.title)}</span><span class="n">→</span></div>`).join('');
  h += '<h4>-- TAGS --</h4>';
  h += tags.filter(([t,n])=>n>1||t===S.tag).map(([t,n])=>`<div class="row ${S.tag===t?'on':''}" data-tag="${t}"><span>${tl(t)}</span><span class="n">${n}</span></div>`).join('');
  $('#side').innerHTML = h;
}

function card(a){
  const q = a.num ? `<span class="q">Q${a.num}.</span> ` : '';
  const sec = a.section ? ' // ' + esc(a.section) : '';
  const d = done.has(a.id) ? ' <span class="done">✓ đã thuộc</span>' : '';
  return `<div class="card" data-id="${a.id}"><h3>${q}${esc(a.title)}</h3>
    <div class="meta">${esc(a.catLabel)}${sec}${d}</div>
    <div class="ex">${esc(a.excerpt)}</div>
    <div class="tags">${a.tags.map(t=>`<span data-tag="${t}">${tl(t)}</span>`).join('')}</div></div>`;
}

function renderList(){
  const L = filtered();
  const chips = [];
  if (S.round!=='all') chips.push(`<span class="chip" data-clear="round">${esc((ROUNDS.find(r=>r[0]===S.round)||['',''])[1])} ×</span>`);
  if (S.tag) chips.push(`<span class="chip" data-clear="tag">${tl(S.tag)} ×</span>`);
  if (S.todo) chips.push(`<span class="chip" data-clear="todo">chưa thuộc ×</span>`);
  if (S.q) chips.push(`<span class="chip" data-clear="q">"${esc(S.q)}" ×</span>`);
  $('#content').innerHTML = `<div class="listhead"><span>${L.length} articles</span>${chips.join('')}</div>`
    + (L.length ? L.map(card).join('') : '<div class="empty">Không có bài nào khớp bộ lọc.</div>');
  $('#content').scrollTop = 0;
}

function md(src){
  if (window.marked) return marked.parse(src, {gfm:true, breaks:false});
  return '<pre>'+esc(src)+'</pre>';
}
function decorate(root){
  // highlight [placeholders] outside code/links
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    return n.parentElement.closest('code,pre,a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    if (!/\[[^\]\n]{1,90}\]/.test(n.nodeValue)) return;
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(/\[([^\]\n]{1,90})\]/g, '<mark class="fill">[$1]</mark>');
    n.replaceWith(...span.childNodes);
  });
  root.querySelectorAll('pre').forEach(p=>{
    const b=document.createElement('button'); b.textContent='copy';
    b.onclick=e=>{e.stopPropagation(); const t=p.querySelector('code').innerText;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1200);},()=>{b.textContent='select & copy';});};
    p.appendChild(b);
  });
  root.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
  const id = location.hash.slice(1);
  if (id) {
    const st = chkState(id);
    root.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{
      cb.disabled = false; cb.checked = !!st[i];
      cb.closest('li')?.classList.toggle('checked', cb.checked);
      cb.addEventListener('change', ()=>{
        const s2 = chkState(id); s2[i] = cb.checked; store.set('chk.'+id, s2);
        cb.closest('li')?.classList.toggle('checked', cb.checked); renderSide();
      });
    });
  }
}

function renderDetail(id){
  const a = BY[id]; if(!a){ location.hash=''; return; }
  const L = filtered(); let i = L.findIndex(x=>x.id===id);
  const seq = i>=0 ? L : A; if (i<0) i = A.findIndex(x=>x.id===id);
  const prev = seq[i-1], next = seq[i+1];
  const hide = S.practice && a.kind==='qa' && !revealed.has(id);
  const q = a.num ? `Q${a.num}. ` : '';
  const sec = a.section && a.section!==a.title ? ' // ' + esc(a.section) : '';
  let h = `<div class="detail"><div class="nav"><button data-act="back">[&lt;- back]</button>
    ${prev?`<button data-go="${prev.id}" title="k">[&lt; prev]</button>`:''}
    ${next?`<button data-go="${next.id}" title="j">[next &gt;]</button>`:''}
    <span class="kbd" style="margin-left:auto">${i+1}/${seq.length}</span></div>
    <h1>${q}${esc(a.title)}</h1>
    <div class="meta">${esc(a.catLabel)}${sec}</div>
    <div class="tags">${a.tags.map(t=>`<span data-tag="${t}">${tl(t)}</span>`).join('')}</div>`;
  if (a.tip) h += `<div class="tip body">${md(a.tip)}</div>`;
  h += hide ? `<button class="reveal" data-act="reveal">[ tự trả lời to trong 60–90 giây, rồi bấm để xem câu trả lời mẫu ]</button>`
            : `<div class="body" id="ans">${md(a.body)}</div>`;
  if (a.kind==='qa') h += `<div class="foot-actions"><button data-act="done" class="${done.has(id)?'on':''}">${done.has(id)?'[x] đã thuộc':'[ ] đánh dấu đã thuộc'}</button>
     ${next?`<button data-go="${next.id}">[câu tiếp &gt;]</button>`:''}</div>`;
  h += '</div>';
  $('#content').innerHTML = h;
  $('#content').querySelectorAll('.body').forEach(decorate);
  $('#content').scrollTop = 0;
}

function route(){
  const id = location.hash.slice(1);
  renderSide();
  if (id && BY[id]) renderDetail(id); else renderList();
  $('#fl').textContent = `${A.length} articles // ${QA.length} câu hỏi // ${DATA.cats.length} chủ đề`;
}
function save(){ store.set('round',S.round); store.set('tag',S.tag); store.set('todo',S.todo); }
function toList(){ if (location.hash) { history.pushState(null,'',location.pathname+location.search); } route(); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-round],[data-tag],[data-todo],[data-clear],[data-id],[data-go],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.round){ S.round=d.round; if (S.tag && !A.some(a=>(S.round==='all'||a.cat===S.round)&&a.tags.includes(S.tag))) S.tag=null; save(); closeSide(); toList(); }
  else if (d.tag){ e.stopPropagation(); S.tag = S.tag===d.tag ? null : d.tag; save(); closeSide(); toList(); }
  else if (d.todo){ S.todo=!S.todo; save(); closeSide(); toList(); }
  else if (d.clear){ if(d.clear==='round')S.round='all'; else if(d.clear==='tag')S.tag=null; else if(d.clear==='todo')S.todo=false; else {S.q='';$('#q').value='';} save(); route(); }
  else if (d.id || d.go){ closeSide(); location.hash = d.id || d.go; }
  else if (d.act==='back'){ toList(); }
  else if (d.act==='reveal'){ const id=location.hash.slice(1); revealed.add(id); renderDetail(id); }
  else if (d.act==='done'){ const id=location.hash.slice(1); done.has(id)?done.delete(id):done.add(id); store.set('done',[...done]); renderSide(); renderDetail(id); }
});
window.addEventListener('hashchange', route);
$('#q').addEventListener('input', e=>{ S.q=e.target.value; if (location.hash) history.pushState(null,'',location.pathname+location.search); renderSide(); renderList(); });
$('#home').onclick = ()=>{ S.round='all'; S.tag=null; S.todo=false; S.q=''; $('#q').value=''; save(); toList(); };
$('#dark').onclick = ()=>{ S.dark=!S.dark; store.set('dark',S.dark); applyTheme(); };
$('#practice').onclick = ()=>{ S.practice=!S.practice; store.set('practice',S.practice); revealed.clear(); applyTheme(); route(); };
$('#menu').onclick = ()=> $('#side').classList.toggle('open');
function closeSide(){ $('#side').classList.remove('open'); }
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key==='/' && !typing){ e.preventDefault(); $('#q').focus(); return; }
  if (e.key==='Escape'){ if (typing){ $('#q').blur(); } else if (location.hash) toList(); return; }
  if (typing || !location.hash) return;
  if (e.key==='j' || e.key==='ArrowRight'){ const b=$('[data-go][title="j"]'); if(b) location.hash=b.dataset.go; }
  if (e.key==='k' || e.key==='ArrowLeft'){ const b=$('[data-go][title="k"]'); if(b) location.hash=b.dataset.go; }
});
applyTheme(); route();
})();
</script>
</body>
</html>
