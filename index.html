**Câu trả lời mẫu (khoảng 45 giây):** *\"Outbox giải quyết bài toán dual write: không thể commit DB và gửi Kafka một cách atomic. Tôi ghi thay đổi nghiệp vụ và một dòng outbox trong cùng transaction local, rồi một relay, polling với `FOR UPDATE SKIP LOCKED` hoặc Debezium đọc WAL, đẩy dòng đó lên Kafka với key là aggregate id để giữ thứ tự. Đảm bảo là at-least-once, nên mỗi sự kiện có id và consumer chống trùng bằng bảng processed-events trong cùng transaction với xử lý nghiệp vụ.\"*\n\n### English\n\n**1. The problem: dual writes**\n\nThe Order service has to do two things: save the order in PostgreSQL **and** publish an `OrderCreated` event to Kafka so Payment and Inventory can continue. The two systems **share no transaction**, so every ordering has a failure mode:\n\n| Approach | Fails when | Consequence |\n|---|---|---|\n| Save to the DB, then send to Kafka | The app crashes or Kafka fails **after the commit** | The order exists but **nobody receives the event**: no payment, no stock reservation |\n| Send to Kafka, then save to the DB | The DB rolls back (constraint violation, timeout) | Other systems process an **order that doesn't exist** |\n| Send to Kafka **inside** `@Transactional` | The transaction rolls back after the send | Same as above |\n| `@TransactionalEventListener(AFTER_COMMIT)` | The app crashes right after the commit | The event lived only in memory, so it's **lost** |\n\n**2. The idea:** don't send directly to the broker. Write the event to an **`outbox` table in the same database, in the same transaction** as the business data. A local transaction is atomic: either both the order and the event exist, or neither does. A separate process (the **relay**) then reads the outbox table and pushes the events to Kafka.\n\n```\n[Order service]\n  BEGIN\n    INSERT INTO orders ...\n    INSERT INTO outbox ...      ← same transaction\n  COMMIT\n            │\n            ▼\n[Relay: polling or CDC] ──► Kafka topic \"order.events\" ──► Payment, Inventory\n```\n\n**3. The outbox table:**\n\n```sql\nCREATE TABLE outbox (\n    id             uuid PRIMARY KEY,          -- also the eventId consumers use for deduplication\n    aggregate_type varchar(50)  NOT NULL,     -- 'Order' → selects the topic\n    aggregate_id   varchar(50)  NOT NULL,     -- orderId → the Kafka key, preserving per-order ordering\n    event_type     varchar(100) NOT NULL,     -- 'OrderCreated'\n    payload        jsonb        NOT NULL,\n    created_at     timestamptz  NOT NULL DEFAULT now(),\n    published_at   timestamptz                -- NULL = not yet sent (only needed for polling)\n);\nCREATE INDEX idx_outbox_unpublished ON outbox (created_at) WHERE published_at IS NULL;\n```\n\n**4. The write side (Spring):**\n\n```java\n@Transactional\npublic Order createOrder(CreateOrderCommand cmd) {\n    Order order = orderRepository.save(Order.from(cmd));\n    outboxRepository.save(new OutboxEvent(\n        UUID.randomUUID(), \"Order\", order.getId().toString(),\n        \"OrderCreated\", toJson(new OrderCreated(order.getId(), order.getTotal()))));\n    return order;   // do NOT call kafkaTemplate here\n}\n```\n\n**5. The relay, two options:**\n\n**a) Polling publisher:** a job that runs every 0.5–1 seconds.\n\n```java\n@Scheduled(fixedDelay = 500)\n@Transactional\npublic void publish() {\n    // SKIP LOCKED: several instances can run without picking the same rows\n    List<OutboxEvent> batch = em.createNativeQuery(\"\"\"\n        SELECT * FROM outbox WHERE published_at IS NULL\n        ORDER BY created_at LIMIT 100 FOR UPDATE SKIP LOCKED\"\"\", OutboxEvent.class).getResultList();\n    for (OutboxEvent e : batch) {\n        kafkaTemplate.send(\"order.events\", e.getAggregateId(), e.getPayload()).get(); // wait for the broker ack\n        e.setPublishedAt(Instant.now());\n    }\n}\n```\n\n- Pros: simple, no extra infrastructure.\n- Cons: latency equals the poll interval, constant queries against the DB, and the table needs periodic cleanup.\n\n**b) CDC (Change Data Capture) with Debezium:** Debezium reads **PostgreSQL's WAL** (or MySQL's binlog), sees new rows in `outbox` and pushes them to Kafka. Debezium ships an **Outbox Event Router** that picks the topic from `aggregate_type` and uses `aggregate_id` as the key.\n\n- Pros: low latency (milliseconds), no DB polling, ordering matches commit order.\n- Cons: you have to run Kafka Connect and Debezium and configure a replication slot. A forgotten slot makes the WAL grow and can fill the disk.\n- With CDC you can delete the outbox row in the same transaction (INSERT then DELETE), because Debezium still reads it from the WAL, so the table always stays small.\n\n**6. Delivery guarantee: at-least-once, not exactly-once.** The relay can send to Kafka and crash before marking `published_at`, so it **sends again** next time. That's why **consumers must be idempotent**. The common approach is a table of processed events (also called the **inbox pattern**):\n\n```java\n@KafkaListener(topics = \"order.events\")\n@Transactional\npublic void on(ConsumerRecord<String, String> rec) {\n    UUID eventId = UUID.fromString(new String(rec.headers().lastHeader(\"id\").value()));\n    // INSERT ... ON CONFLICT DO NOTHING returns 0 if it was already processed\n    if (processedRepo.insertIfAbsent(eventId) == 0) return;   // duplicate → skip\n    paymentService.charge(parse(rec.value()));                 // same transaction as the processed row\n}\n```\n\n**7. Ordering:** `aggregate_id` is the Kafka key, so every event for the same order lands in the **same partition**, in order. With polling, `created_at` order can be slightly off when several transactions commit concurrently; if you need it strict, use CDC, or add a version column so consumers ignore events older than what they've seen.\n\n**8. Operations:**\n- **Cleanup:** delete rows sent more than N days ago, or partition the table by day and drop old partitions.\n- **Monitoring:** the number of unsent rows and the age of the oldest one. If they keep growing, the relay is stuck.\n- **Event schema:** treat the payload as a public contract, version it, and use Avro or JSON Schema with a Schema Registry.\n\n**9. When you don't need an outbox:** when losing an event is acceptable (logs, analytics), or when the event **is** the source of truth (event sourcing: write straight to Kafka and let services build their state from it).\n\n**A model answer (about 45 seconds):** *\"The outbox solves the dual-write problem: you can't commit to the database and publish to Kafka atomically. I write the business change and an outbox row in the same local transaction, and a relay, either polling with `FOR UPDATE SKIP LOCKED` or Debezium reading the WAL, pushes that row to Kafka keyed by the aggregate id to preserve ordering. The guarantee is at-least-once, so every event carries an id and consumers deduplicate with a processed-events table in the same transaction as the business logic.\"*", "kind": "qa", "num": 4, "tip": "", "excerpt": "1. Vấn đề cần giải quyết: dual write (ghi hai nơi) Order service cần làm hai việc: lưu đơn vào PostgreSQL và gửi sự kiện OrderCreated lên Kafka để Payment và Inventory xử lý tiếp. Hai hệ thống này không có transaction ch", "catLabel": "Microservices & System Design", "bilingual": true}, {"id": "kafka-10", "title": "Explain topics, partitions, offsets and consumer groups.", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"A topic is split into partitions, each an ordered, append-only log. Each record has an offset. Within a consumer group each partition is read by exactly one consumer, so partitions are the unit of parallelism; adding consumers beyond the partition count gives no benefit. Different groups each receive all records.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"A topic is split into partitions, each an ordered, append-only log. Each record has an offset. Within a consumer group each partition is read by exactly one consumer, so partitions are the unit of parallelism; adding co", "catLabel": "Microservices & System Design"}, {"id": "kafka-11", "title": "What is a message key and why use it?", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"The key determines the partition, by hash. Records with the same key go to the same partition and keep their order. So I key by the entity ID, such as order ID, when order per entity matters. A poorly distributed key creates hot partitions.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"The key determines the partition, by hash. Records with the same key go to the same partition and keep their order. So I key by the entity ID, such as order ID, when order per entity matters. A poorly distributed key cr", "catLabel": "Microservices & System Design"}, {"id": "kafka-12", "title": "What delivery guarantees does Kafka offer?", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"At most once if I commit offsets before processing; at least once if I commit after, which is the usual choice and requires idempotent consumers. Exactly once is available within Kafka through idempotent producers and transactions, but as soon as a database or external call is involved I still need idempotency on my side.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"At most once if I commit offsets before processing; at least once if I commit after, which is the usual choice and requires idempotent consumers. Exactly once is available within Kafka through idempotent producers and t", "catLabel": "Microservices & System Design"}, {"id": "kafka-13", "title": "What is a dead letter queue? What happens after a message lands there?", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"It's a separate topic for messages that fail after the configured retries, so one poison message doesn't block the partition. I include the error and original metadata in headers, alert on DLQ volume, and have a process: inspect, fix the cause, then replay to the main topic or discard. A DLQ nobody monitors is just data loss with extra steps.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"It's a separate topic for messages that fail after the configured retries, so one poison message doesn't block the partition. I include the error and original metadata in headers, alert on DLQ volume, and have a process", "catLabel": "Microservices & System Design"}, {"id": "kafka-14", "title": "What is a rebalance, and what is consumer lag?", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"A rebalance reassigns partitions when consumers join, leave or exceed `max.poll.interval.ms`. During it consumption pauses and uncommitted work can be reprocessed. Lag is the gap between the latest offset and the group's committed offset; growing lag means consumers are too slow, so I scale consumers up to the partition count or speed up processing.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"A rebalance reassigns partitions when consumers join, leave or exceed max.poll.interval.ms. During it consumption pauses and uncommitted work can be reprocessed. Lag is the gap between the latest offset and the group's ", "catLabel": "Microservices & System Design"}, {"id": "kafka-15", "title": "Kafka và RabbitMQ khác nhau thế nào? Khi nào chọn cái nào? / Kafka vs RabbitMQ: how do they differ and when do you choose each?", "cat": "messaging", "section": "Kafka và messaging", "tags": ["kafka"], "body": "### Tiếng Việt\n\n**Khác biệt cốt lõi:** Kafka là **log phân tán**: message được ghi nối tiếp và **giữ lại** theo thời gian cấu hình, consumer tự quản lý vị trí đọc (offset) và đọc lại được. RabbitMQ là **message broker**: message được định tuyến vào queue và **bị xóa khi consumer ack**.\n\n| | Kafka | RabbitMQ |\n|---|---|---|\n| Mô hình | Log bất biến, chia partition | Exchange định tuyến vào queue |\n| Sau khi đọc | Message **vẫn còn** tới khi hết retention | Message **bị xóa** sau khi ack |\n| Đọc lại (replay) | Có, tua offset về trước | Không (trừ RabbitMQ Streams) |\n| Nhiều nhóm consumer cùng đọc | Tự nhiên: mỗi consumer group có offset riêng | Phải tạo queue riêng cho từng nhóm (fanout) |\n| Thứ tự | Đảm bảo **trong một partition** | Trong một queue với một consumer |\n| Định tuyến | Đơn giản: topic + key → partition | **Linh hoạt**: direct, topic (wildcard), fanout, headers |\n| Thông lượng | Rất cao (hàng trăm nghìn tới hàng triệu msg/s) | Cao, thường thấp hơn Kafka |\n| Ack | Theo offset (commit vị trí) | Theo **từng message**, có nack và requeue |\n| Ưu tiên, delay | Không có sẵn | Có priority queue, TTL, delay qua plugin hoặc DLX |\n\n**Chọn Kafka khi:**\n- Cần **event streaming**: nhiều service cùng phản ứng với một sự kiện (order created → kho, thanh toán, analytics).\n- Cần **đọc lại** dữ liệu cũ, ví dụ để rebuild read model hoặc xử lý lại sau khi sửa bug.\n- Thông lượng lớn: log, tracking, CDC (Debezium), metrics.\n- Cần **thứ tự theo entity** (dùng key = orderId).\n\n**Chọn RabbitMQ khi:**\n- Cần **phân phối công việc** (task queue): gửi email, resize ảnh, mỗi job chỉ một worker xử lý.\n- Cần **định tuyến phức tạp** theo routing key hoặc header.\n- Cần ack, retry, hoặc ưu tiên **theo từng message**, hoặc message có độ trễ.\n- Hệ thống nhỏ hơn, muốn vận hành đơn giản.\n\n**Câu chốt:** *\"Kafka cho luồng sự kiện cần lưu lại và nhiều bên đọc; RabbitMQ cho hàng đợi công việc cần định tuyến linh hoạt và ack từng message.\"*\n\n### English\n\n**Core difference:** Kafka is a **distributed log**: messages are appended and **retained** for a configured period, consumers track their own position (offset) and can re-read. RabbitMQ is a **message broker**: messages are routed into queues and **deleted once a consumer acks them**.\n\n| | Kafka | RabbitMQ |\n|---|---|---|\n| Model | Immutable log, split into partitions | Exchanges route into queues |\n| After consumption | Message **stays** until retention expires | Message is **deleted** after ack |\n| Replay | Yes, rewind the offset | No (except RabbitMQ Streams) |\n| Several consumer groups reading | Natural: each consumer group has its own offset | Needs a separate queue per group (fanout) |\n| Ordering | Guaranteed **within one partition** | Within one queue with a single consumer |\n| Routing | Simple: topic + key → partition | **Flexible**: direct, topic (wildcards), fanout, headers |\n| Throughput | Very high (hundreds of thousands to millions of msg/s) | High, usually lower than Kafka |\n| Acknowledgement | By offset (commit a position) | **Per message**, with nack and requeue |\n| Priority, delay | Not built in | Priority queues, TTL, delays via plugin or DLX |\n\n**Choose Kafka when:**\n- You need **event streaming**: several services react to the same event (order created → inventory, payment, analytics).\n- You need to **replay** old data, for example to rebuild a read model or reprocess after fixing a bug.\n- Throughput is high: logs, tracking, CDC (Debezium), metrics.\n- You need **ordering per entity** (key = orderId).\n\n**Choose RabbitMQ when:**\n- You need **work distribution** (a task queue): sending emails, resizing images, each job handled by exactly one worker.\n- You need **complex routing** by routing key or headers.\n- You need **per-message** ack, retry or priority, or delayed messages.\n- The system is smaller and you want simpler operations.\n\n**Closing line:** *\"Kafka for event streams that must be retained and read by many parties; RabbitMQ for work queues that need flexible routing and per-message acknowledgement.\"*", "kind": "qa", "num": 15, "tip": "", "excerpt": "Khác biệt cốt lõi: Kafka là log phân tán: message được ghi nối tiếp và giữ lại theo thời gian cấu hình, consumer tự quản lý vị trí đọc (offset) và đọc lại được. RabbitMQ là message broker: message được định tuyến vào que", "catLabel": "Microservices & System Design", "bilingual": true}, {"id": "rabbitmq-basics", "title": "RabbitMQ hoạt động thế nào? Exchange có những loại nào? / How does RabbitMQ work, and what types of exchange are there?", "cat": "messaging", "section": "RabbitMQ", "kind": "qa", "tags": ["rabbitmq", "messaging"], "body": "### Tiếng Việt\n\n**Luồng cơ bản:** Producer **không gửi thẳng vào queue**. Producer gửi message vào **exchange**, kèm một **routing key**. Exchange dựa vào các **binding** (quy tắc nối exchange với queue) để quyết định đưa message vào queue nào. Consumer đọc từ queue.\n\n```\nProducer → Exchange --(binding)--> Queue → Consumer\n```\n\n**4 loại exchange:**\n\n| Loại | Cách định tuyến | Ví dụ dùng |\n|---|---|---|\n| **direct** | Routing key phải **khớp chính xác** binding key | `payment.failed` chỉ vào queue xử lý lỗi thanh toán |\n| **topic** | Khớp theo **mẫu**: `*` thay đúng một từ, `#` thay 0 hoặc nhiều từ | `order.*.vn` nhận `order.created.vn`; `order.#` nhận mọi sự kiện order |\n| **fanout** | Gửi tới **mọi queue** được bind, bỏ qua routing key | Broadcast: một sự kiện cho nhiều service |\n| **headers** | Khớp theo **header** của message thay vì routing key | Định tuyến theo nhiều thuộc tính (`region=vn`, `type=pdf`) |\n\nNgoài ra có **default exchange** (tên rỗng): kiểu direct, mọi queue tự bind với routing key bằng chính tên queue. Đây là lý do có thể \"gửi thẳng vào queue theo tên\".\n\n**Mô hình consumer:**\n- **Work queue (competing consumers):** nhiều consumer cùng đọc một queue, mỗi message chỉ tới **một** consumer, chia đều kiểu round-robin. Dùng để scale xử lý.\n- **Pub/sub:** fanout exchange, mỗi service có queue riêng, nên mỗi service đều nhận được bản sao của message.\n\n**Prefetch (`basic.qos`):** giới hạn số message chưa ack mà một consumer được giữ cùng lúc. Prefetch = 1 chia việc công bằng khi job nặng nhẹ khác nhau; prefetch lớn hơn (10–100) cho thông lượng cao hơn với job nhẹ.\n\n### English\n\n**Basic flow:** a producer **doesn't publish directly to a queue**. It publishes to an **exchange**, with a **routing key**. The exchange uses **bindings** (rules linking an exchange to queues) to decide which queues get the message. Consumers read from queues.\n\n```\nProducer → Exchange --(binding)--> Queue → Consumer\n```\n\n**The four exchange types:**\n\n| Type | Routing rule | Example use |\n|---|---|---|\n| **direct** | Routing key must **match exactly** the binding key | `payment.failed` goes only to the payment-failure queue |\n| **topic** | Matches by **pattern**: `*` stands for exactly one word, `#` for zero or more words | `order.*.vn` receives `order.created.vn`; `order.#` receives every order event |\n| **fanout** | Delivers to **every bound queue**, ignoring the routing key | Broadcast: one event to many services |\n| **headers** | Matches on message **headers** instead of the routing key | Routing on several attributes (`region=vn`, `type=pdf`) |\n\nThere's also the **default exchange** (empty name): a direct exchange to which every queue is automatically bound with its own name as the routing key. That's why you can \"publish to a queue by name\".\n\n**Consumer models:**\n- **Work queue (competing consumers):** several consumers read one queue, each message goes to **one** consumer, distributed round-robin. Used to scale processing.\n- **Pub/sub:** a fanout exchange with one queue per service, so every service gets its own copy of the message.\n\n**Prefetch (`basic.qos`):** limits how many unacknowledged messages a consumer may hold at once. Prefetch = 1 spreads work fairly when jobs vary in cost; a larger prefetch (10–100) gives higher throughput for light jobs.", "excerpt": "Luồng cơ bản: Producer không gửi thẳng vào queue. Producer gửi message vào exchange, kèm một routing key. Exchange dựa vào các binding (quy tắc nối exchange với queue) để quyết định đưa message vào queue nào. Consumer đọ", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "rabbitmq-reliability", "title": "Làm sao để RabbitMQ không mất message? Retry và dead letter làm thế nào? / How do you make RabbitMQ not lose messages, and how do you handle retries and dead letters?", "cat": "messaging", "section": "RabbitMQ", "kind": "qa", "tags": ["rabbitmq", "reliability", "dlq"], "body": "### Tiếng Việt\n\nMessage có thể mất ở **3 chỗ**, mỗi chỗ có một cách chống:\n\n1. **Producer → broker:** mạng lỗi hoặc broker sập trước khi nhận xong.\n   → Bật **publisher confirms**: broker xác nhận đã nhận (và đã ghi đĩa với message persistent). Không nhận được confirm thì gửi lại, nên consumer phải idempotent. Dùng thêm flag `mandatory` để biết message không vào được queue nào.\n2. **Trong broker:** broker restart.\n   → Queue khai báo **durable**, message gửi với **delivery mode persistent**. Để chịu lỗi node, dùng **quorum queue** (nhân bản bằng Raft). Classic mirrored queue đã bị loại bỏ ở RabbitMQ 4.0.\n3. **Broker → consumer:** consumer nhận rồi chết giữa chừng.\n   → Dùng **manual ack**, chỉ ack **sau khi** xử lý xong. Consumer chết khi chưa ack thì message được giao lại cho consumer khác. Không dùng auto-ack cho việc quan trọng.\n\n**Retry và dead letter:**\n- Xử lý lỗi: `basic.nack` hoặc `basic.reject`. Nếu `requeue=true`, message quay lại queue ngay; với lỗi không tự hết, việc này gây **vòng lặp vô hạn** (poison message).\n- Cách đúng: cấu hình **Dead Letter Exchange (DLX)** cho queue (`x-dead-letter-exchange`). Message bị reject (`requeue=false`), hết TTL, hoặc vượt giới hạn độ dài queue sẽ được chuyển sang DLX.\n- **Retry có độ trễ:** queue `retry.5s` có `x-message-ttl=5000` và DLX trỏ ngược về exchange chính. Hết TTL thì message quay lại xử lý. Đếm số lần retry qua header `x-death`; quá N lần thì chuyển vào queue **parking lot** để người xem xét.\n- Quorum queue có sẵn `x-delivery-limit` để giới hạn số lần giao lại.\n\n**Luôn kèm:** consumer **idempotent**, vì cả publisher confirm lẫn redelivery đều có thể tạo trùng lặp; và **alert** khi DLQ có message.\n\n### English\n\nMessages can be lost in **three places**, each with its own defense:\n\n1. **Producer → broker:** the network fails or the broker crashes before it has the message.\n   → Enable **publisher confirms**: the broker acknowledges receipt (and, for persistent messages, that it's on disk). Without a confirm, resend, which means consumers must be idempotent. Use the `mandatory` flag to learn when a message couldn't be routed to any queue.\n2. **Inside the broker:** the broker restarts.\n   → Declare queues as **durable** and publish with **persistent delivery mode**. To survive node failures, use **quorum queues** (replicated with Raft). Classic mirrored queues were removed in RabbitMQ 4.0.\n3. **Broker → consumer:** the consumer receives a message and dies mid-processing.\n   → Use **manual ack** and ack only **after** processing finishes. If the consumer dies before acking, the message is redelivered to another consumer. Don't use auto-ack for important work.\n\n**Retries and dead letters:**\n- On failure: `basic.nack` or `basic.reject`. With `requeue=true` the message goes straight back to the queue; for errors that don't go away, that causes an **infinite loop** (a poison message).\n- The right way: configure a **Dead Letter Exchange (DLX)** on the queue (`x-dead-letter-exchange`). Messages that are rejected (`requeue=false`), expire their TTL, or exceed the queue length limit are moved to the DLX.\n- **Delayed retry:** a `retry.5s` queue with `x-message-ttl=5000` whose DLX points back to the main exchange. When the TTL expires, the message returns for processing. Count attempts with the `x-death` header; after N attempts, move it to a **parking-lot** queue for a human to review.\n- Quorum queues have a built-in `x-delivery-limit` to cap redeliveries.\n\n**Always add:** **idempotent** consumers, because both publisher confirms and redelivery can create duplicates; and an **alert** when the DLQ has messages.", "excerpt": "Message có thể mất ở 3 chỗ, mỗi chỗ có một cách chống: Producer → broker: mạng lỗi hoặc broker sập trước khi nhận xong. → Bật publisher confirms: broker xác nhận đã nhận (và đã ghi đĩa với message persistent). Không nhận", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "kafka-ordering-retry", "title": "Kafka đảm bảo thứ tự thế nào? Retry khi xử lý lỗi mà không làm hỏng thứ tự? / How does Kafka guarantee ordering, and how do you retry failures without breaking it?", "cat": "messaging", "section": "Kafka và messaging", "kind": "qa", "tags": ["kafka", "ordering", "retry"], "body": "### Tiếng Việt\n\n**Thứ tự chỉ được đảm bảo trong một partition.** Message cùng **key** luôn vào cùng partition (theo hash của key), nên muốn mọi sự kiện của một đơn hàng theo đúng thứ tự thì dùng `key = orderId`.\n\n**Những chỗ làm mất thứ tự:**\n1. **Phía producer khi retry:** gửi batch 1 lỗi, batch 2 thành công, batch 1 gửi lại thì nằm sau batch 2. Cách chống: bật `enable.idempotence=true` (mặc định từ Kafka 3.0), khi đó vẫn giữ được thứ tự với `max.in.flight.requests.per.connection` tối đa 5.\n2. **Đổi số partition:** tăng partition làm key được hash sang partition khác, nên thứ tự giữa dữ liệu cũ và mới không còn đảm bảo. Hãy chọn đủ số partition ngay từ đầu.\n3. **Phía consumer xử lý song song:** nếu một consumer chia message của cùng một partition cho nhiều thread, thứ tự bị phá. Cách làm đúng: song song hóa **theo key** (cùng key vào cùng thread), ví dụ dùng thư viện Confluent Parallel Consumer.\n\n**Retry khi xử lý lỗi, hai lựa chọn với đánh đổi khác nhau:**\n\n| | Blocking retry | Non-blocking retry (retry topic) |\n|---|---|---|\n| Cách làm | Retry ngay trong consumer với backoff, không commit offset | Đẩy message lỗi sang `orders.retry.1m`, `orders.retry.10m`, rồi `orders.dlt` |\n| Thứ tự | **Giữ nguyên** | **Mất thứ tự** với các message sau |\n| Nhược điểm | Một message lỗi **chặn cả partition**, lag tăng | Phải chấp nhận xử lý không theo thứ tự |\n| Hợp với | Sự kiện cần đúng thứ tự (trạng thái đơn hàng, số dư) | Sự kiện độc lập (gửi email, thông báo) |\n\nSpring Kafka hỗ trợ cả hai: `DefaultErrorHandler` với `BackOff` cho blocking retry, `@RetryableTopic` cho retry topic.\n\n**Kết hợp hay dùng:** blocking retry vài lần cho lỗi tạm thời (timeout, DB bận), rồi đưa vào DLT. Nếu cần giữ thứ tự theo key, ghi nhận key đang có message lỗi và **tạm dừng các message sau của cùng key**, cho tới khi message lỗi được xử lý.\n\n### English\n\n**Ordering is guaranteed only within a partition.** Messages with the same **key** always go to the same partition (by hashing the key), so to keep every event of one order in sequence, use `key = orderId`.\n\n**What breaks ordering:**\n1. **Producer retries:** batch 1 fails, batch 2 succeeds, batch 1 is resent and lands after batch 2. The fix: `enable.idempotence=true` (the default since Kafka 3.0), which preserves ordering with up to 5 `max.in.flight.requests.per.connection`.\n2. **Changing the partition count:** adding partitions makes keys hash to different partitions, so ordering between old and new data is no longer guaranteed. Pick enough partitions up front.\n3. **Parallel processing in the consumer:** if one consumer hands messages from the same partition to several threads, ordering breaks. The right way is to parallelize **by key** (same key, same thread), for example with the Confluent Parallel Consumer library.\n\n**Retrying failed processing: two options with different trade-offs:**\n\n| | Blocking retry | Non-blocking retry (retry topics) |\n|---|---|---|\n| How | Retry inside the consumer with backoff, without committing the offset | Send the failed message to `orders.retry.1m`, `orders.retry.10m`, then `orders.dlt` |\n| Ordering | **Preserved** | **Lost** relative to later messages |\n| Downside | One failing message **blocks the whole partition**, lag grows | You must accept out-of-order processing |\n| Fits | Events that must stay ordered (order status, balances) | Independent events (emails, notifications) |\n\nSpring Kafka supports both: `DefaultErrorHandler` with a `BackOff` for blocking retries, and `@RetryableTopic` for retry topics.\n\n**A common combination:** a few blocking retries for transient errors (timeouts, a busy database), then the DLT. If per-key ordering matters, record which keys have a failed message and **hold back later messages for the same key** until the failed one is resolved.", "excerpt": "Thứ tự chỉ được đảm bảo trong một partition. Message cùng key luôn vào cùng partition (theo hash của key), nên muốn mọi sự kiện của một đơn hàng theo đúng thứ tự thì dùng key = orderId. Những chỗ làm mất thứ tự: Phía pro", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "kafka-retention", "title": "Kafka giữ dữ liệu bao lâu? Log compaction là gì? / How long does Kafka keep data, and what is log compaction?", "cat": "messaging", "section": "Kafka và messaging", "kind": "qa", "tags": ["kafka", "retention", "compaction"], "body": "### Tiếng Việt\n\nMỗi partition được lưu thành nhiều **segment** (file). Kafka xóa dữ liệu theo **segment**, không theo từng message, dựa trên `cleanup.policy`:\n\n**1. `delete` (mặc định): xóa theo thời gian hoặc dung lượng.**\n- `retention.ms`: mặc định **7 ngày**. Segment cũ hơn mức này bị xóa.\n- `retention.bytes`: giới hạn dung lượng mỗi partition (mặc định không giới hạn).\n- Consumer đọc chậm hơn retention sẽ **mất dữ liệu**: offset của nó không còn tồn tại, và nó nhảy tới vị trí theo `auto.offset.reset` (`earliest` hoặc `latest`).\n\n**2. `compact`: chỉ giữ giá trị mới nhất cho mỗi key.**\n- Kafka giữ lại **bản ghi cuối cùng của mỗi key**, xóa các bản cũ hơn của cùng key.\n- Gửi message với value `null` (**tombstone**) để xóa hẳn một key; tombstone bị dọn sau `delete.retention.ms`.\n- Topic khi đó giống một **bảng key-value có thể đọc lại từ đầu**.\n- Dùng cho: trạng thái hiện tại (giá sản phẩm, profile người dùng, cấu hình), changelog của Kafka Streams, và topic nội bộ `__consumer_offsets` của chính Kafka.\n\n**3. `compact,delete`:** vừa compact vừa xóa theo thời gian.\n\n**Ví dụ:**\n\n```\nTopic user-profile (compact), key = userId\noffset 0: u1 → {name: \"An\"}\noffset 1: u2 → {name: \"Bình\"}\noffset 2: u1 → {name: \"An Nguyễn\"}   ← sau compaction chỉ còn bản ghi này cho u1\noffset 3: u2 → null                   ← tombstone: u2 bị xóa\n```\n\n**Câu hỏi phụ: \"Có thể dùng Kafka làm database không?\"** Có thể dùng làm nguồn sự kiện (event sourcing) và compacted topic làm trạng thái, nhưng Kafka không có truy vấn tùy ý, index phụ hay transaction như database. Thường kết hợp Kafka với database hoặc state store.\n\n### English\n\nEach partition is stored as several **segments** (files). Kafka deletes data **by segment**, not message by message, according to `cleanup.policy`:\n\n**1. `delete` (default): delete by time or size.**\n- `retention.ms`: **7 days** by default. Segments older than that are deleted.\n- `retention.bytes`: a size cap per partition (unlimited by default).\n- A consumer that falls behind retention **loses data**: its offset no longer exists, and it jumps to the position given by `auto.offset.reset` (`earliest` or `latest`).\n\n**2. `compact`: keep only the latest value for each key.**\n- Kafka keeps **the last record of each key** and removes older records with the same key.\n- Send a message with a `null` value (a **tombstone**) to delete a key entirely; tombstones are cleaned up after `delete.retention.ms`.\n- The topic then behaves like a **key-value table you can replay from the beginning**.\n- Used for current state (product prices, user profiles, configuration), Kafka Streams changelogs, and Kafka's own internal `__consumer_offsets` topic.\n\n**3. `compact,delete`:** compaction plus time-based deletion.\n\n**Example:**\n\n```\nTopic user-profile (compact), key = userId\noffset 0: u1 → {name: \"An\"}\noffset 1: u2 → {name: \"Binh\"}\noffset 2: u1 → {name: \"An Nguyen\"}   ← after compaction only this record remains for u1\noffset 3: u2 → null                   ← tombstone: u2 is deleted\n```\n\n**Follow-up: \"Can Kafka be used as a database?\"** It can serve as an event source (event sourcing), with compacted topics holding state, but it has no ad-hoc queries, secondary indexes or transactions like a database. It's usually combined with a database or a state store.", "excerpt": "Mỗi partition được lưu thành nhiều segment (file). Kafka xóa dữ liệu theo segment, không theo từng message, dựa trên cleanup.policy: 1. delete (mặc định): xóa theo thời gian hoặc dung lượng. retention.ms: mặc định 7 ngày", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "dt-2pc", "title": "Two-phase commit (2PC) là gì? Vì sao microservices ít dùng? / What is two-phase commit (2PC), and why do microservices rarely use it?", "cat": "messaging", "section": "Distributed transactions", "kind": "qa", "tags": ["distributed-transaction", "2pc", "kafka"], "body": "### Tiếng Việt\n\n**2PC** giúp nhiều tài nguyên (nhiều database, hoặc database và message broker) cùng commit hoặc cùng rollback, có một **coordinator** điều phối:\n\n1. **Phase 1, Prepare (vote):** coordinator hỏi từng participant *\"Bạn commit được không?\"*. Mỗi participant ghi dữ liệu vào log, **giữ khóa**, rồi trả lời YES hoặc NO.\n2. **Phase 2, Commit hoặc Abort:** tất cả YES thì coordinator gửi COMMIT; có một NO hoặc timeout thì gửi ABORT. Participant thực hiện rồi nhả khóa.\n\nTrong Java, đây là **XA transaction** qua JTA (Atomikos, Narayana), ví dụ một transaction trải trên hai database.\n\n**Vấn đề:**\n- **Blocking:** nếu coordinator chết sau khi participant đã YES, participant **phải giữ khóa và chờ**, không dám tự commit hay rollback. Tài nguyên bị khóa có thể rất lâu.\n- **Độ trễ và thông lượng:** nhiều vòng mạng, khóa giữ suốt hai phase, làm hệ thống chậm và khó scale.\n- **Khả dụng:** mọi participant phải sống thì transaction mới hoàn tất, nên một service chết kéo theo cả luồng.\n- **Không được hỗ trợ rộng:** Kafka, nhiều NoSQL và REST API của bên thứ ba không tham gia XA được.\n- **3PC** thêm một phase để giảm blocking nhưng vẫn không chịu được phân vùng mạng, nên hầu như không dùng trong thực tế.\n\n**Vì vậy microservices dùng:** Saga cùng outbox và consumer idempotent, chấp nhận eventual consistency.\n\n**Khi nào 2PC vẫn hợp lý:** trong một hệ thống nhỏ, ít tài nguyên, cùng mạng nội bộ, cần nhất quán tức thì và chấp nhận chi phí hiệu năng. Bên trong một số database phân tán như Spanner hay CockroachDB cũng dùng 2PC kết hợp đồng thuận (Paxos/Raft), nhưng phần đó được ẩn khỏi lập trình viên.\n\n### English\n\n**2PC** makes several resources (several databases, or a database and a message broker) commit or roll back together, coordinated by a **coordinator**:\n\n1. **Phase 1, Prepare (vote):** the coordinator asks each participant *\"Can you commit?\"*. Each participant writes its changes to a log, **holds its locks**, and answers YES or NO.\n2. **Phase 2, Commit or Abort:** if everyone said YES, the coordinator sends COMMIT; if anyone said NO or timed out, it sends ABORT. Participants apply the decision and release their locks.\n\nIn Java this is an **XA transaction** via JTA (Atomikos, Narayana), for example one transaction spanning two databases.\n\n**Problems:**\n- **Blocking:** if the coordinator dies after participants voted YES, they **must hold their locks and wait**; they can't safely commit or roll back on their own. Resources can stay locked for a long time.\n- **Latency and throughput:** several network round trips, with locks held across both phases, make the system slow and hard to scale.\n- **Availability:** every participant must be up for a transaction to complete, so one dead service stalls the whole flow.\n- **Limited support:** Kafka, many NoSQL stores and third-party REST APIs can't take part in XA.\n- **3PC** adds a phase to reduce blocking but still can't tolerate network partitions, so it's almost never used in practice.\n\n**So microservices use** sagas with an outbox and idempotent consumers, accepting eventual consistency.\n\n**When 2PC is still reasonable:** a small system with few resources on the same internal network, where immediate consistency is required and the performance cost is acceptable. Some distributed databases such as Spanner or CockroachDB also use 2PC combined with consensus (Paxos/Raft) internally, but that's hidden from developers.", "excerpt": "2PC giúp nhiều tài nguyên (nhiều database, hoặc database và message broker) cùng commit hoặc cùng rollback, có một coordinator điều phối: Phase 1, Prepare (vote): coordinator hỏi từng participant \"Bạn commit được không?\"", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "dt-tcc", "title": "TCC (Try-Confirm-Cancel) là gì? Khác Saga thế nào? / What is TCC (Try-Confirm-Cancel), and how does it differ from a saga?", "cat": "messaging", "section": "Distributed transactions", "kind": "qa", "tags": ["distributed-transaction", "tcc"], "body": "### Tiếng Việt\n\n**TCC** chia mỗi thao tác nghiệp vụ thành 3 API:\n\n1. **Try:** kiểm tra và **giữ chỗ tài nguyên** nhưng chưa dùng thật. Ví dụ: chuyển 100k từ \"số dư khả dụng\" sang \"số dư tạm giữ\".\n2. **Confirm:** dùng phần đã giữ, hoàn tất giao dịch. Ví dụ: trừ hẳn 100k khỏi số dư tạm giữ.\n3. **Cancel:** trả lại phần đã giữ. Ví dụ: chuyển 100k từ tạm giữ về khả dụng.\n\nCoordinator gọi Try ở mọi service; tất cả thành công thì gọi Confirm ở tất cả, có một lỗi thì gọi Cancel ở những service đã Try.\n\n**Ví dụ đặt vé máy bay và khách sạn:**\n\n```\nTry:     giữ ghế 15 phút   |  giữ phòng 15 phút\nConfirm: xuất vé           |  xác nhận phòng\nCancel:  nhả ghế           |  nhả phòng\n```\n\n**So sánh với Saga:**\n\n| | Saga | TCC |\n|---|---|---|\n| Bước đầu | Commit thật ngay | Chỉ **giữ chỗ** (Try) |\n| Hoàn tác | Transaction bù (hoàn tiền sau khi đã trừ) | Cancel phần đã giữ, **chưa ai thấy kết quả** |\n| Isolation | Kém: người khác thấy trạng thái trung gian | **Tốt hơn**: tài nguyên bị khóa ở mức nghiệp vụ |\n| Công sức | Mỗi bước thêm 1 hành động bù | Mỗi service phải viết **3 API** và quản lý trạng thái giữ chỗ |\n| Hợp với | Đa số luồng nghiệp vụ | Tài nguyên khan hiếm cần giữ chỗ: ghế, phòng, tồn kho, hạn mức tiền |\n\n**Các bẫy phải xử lý:**\n- **Idempotent:** Confirm hoặc Cancel có thể bị gọi lại nhiều lần.\n- **Empty rollback:** Cancel tới trước khi Try kịp chạy (Try bị timeout); Cancel phải xử lý được trường hợp chưa có gì để hủy.\n- **Suspension:** Try tới **sau** Cancel; phải ghi nhận đã Cancel để từ chối Try đến muộn, nếu không tài nguyên bị giữ mãi.\n- Phần giữ chỗ cần **TTL** để tự nhả khi coordinator chết.\n\nFramework hỗ trợ: Apache Seata (chế độ TCC).\n\n### English\n\n**TCC** splits each business operation into three APIs:\n\n1. **Try:** validate and **reserve the resource** without consuming it. Example: move 100k from \"available balance\" to \"held balance\".\n2. **Confirm:** consume the reservation and complete the transaction. Example: deduct the 100k from the held balance for good.\n3. **Cancel:** release the reservation. Example: move the 100k from held back to available.\n\nThe coordinator calls Try on every service; if all succeed it calls Confirm on all of them, and if any fails it calls Cancel on those that ran Try.\n\n**Example: booking a flight and a hotel:**\n\n```\nTry:     hold the seat 15 minutes   |  hold the room 15 minutes\nConfirm: issue the ticket           |  confirm the room\nCancel:  release the seat           |  release the room\n```\n\n**Compared with a saga:**\n\n| | Saga | TCC |\n|---|---|---|\n| First step | Commits for real immediately | Only **reserves** (Try) |\n| Undo | A compensating transaction (refund after charging) | Cancel the reservation, **nobody has seen the result yet** |\n| Isolation | Weak: others see intermediate state | **Better**: resources are locked at the business level |\n| Effort | One compensating action per step | Each service writes **3 APIs** and manages reservation state |\n| Fits | Most business flows | Scarce resources that need holding: seats, rooms, stock, credit limits |\n\n**Traps you must handle:**\n- **Idempotency:** Confirm or Cancel may be called several times.\n- **Empty rollback:** Cancel arrives before Try ever ran (Try timed out); Cancel must cope with nothing to cancel.\n- **Suspension:** Try arrives **after** Cancel; you must record the cancellation and reject the late Try, otherwise the resource stays held forever.\n- Reservations need a **TTL** so they're released automatically if the coordinator dies.\n\nFramework support: Apache Seata (TCC mode).", "excerpt": "TCC chia mỗi thao tác nghiệp vụ thành 3 API: Try: kiểm tra và giữ chỗ tài nguyên nhưng chưa dùng thật. Ví dụ: chuyển 100k từ \"số dư khả dụng\" sang \"số dư tạm giữ\". Confirm: dùng phần đã giữ, hoàn tất giao dịch. Ví dụ: tr", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "dt-compare", "title": "So sánh các cách xử lý giao dịch phân tán: 2PC, Saga, TCC, Outbox. / Compare the approaches to distributed transactions: 2PC, saga, TCC, outbox.", "cat": "messaging", "section": "Distributed transactions", "kind": "qa", "tags": ["distributed-transaction", "opswat", "dxc"], "body": "### Tiếng Việt\n\n| | 2PC / XA | Saga | TCC | Outbox (+ consumer idempotent) |\n|---|---|---|---|---|\n| Nhất quán | Mạnh, tức thì | Eventual | Eventual, isolation tốt hơn Saga | Eventual |\n| Khóa tài nguyên | Khóa DB suốt hai phase | Không | Giữ chỗ ở mức nghiệp vụ | Không |\n| Độ phức tạp | Thấp với dev, cao khi vận hành | Trung bình (viết bước bù) | **Cao** (3 API mỗi service) | Thấp |\n| Hiệu năng | Kém | Tốt | Tốt | Tốt |\n| Giải quyết vấn đề | Commit nhiều tài nguyên cùng lúc | Luồng nghiệp vụ nhiều service | Giữ tài nguyên khan hiếm | **Ghi DB và gửi message** không lệch nhau |\n\n**Chúng không loại trừ nhau.** Outbox là **nền tảng** để Saga hoặc TCC gửi sự kiện tin cậy; idempotency là bắt buộc ở mọi cách.\n\n**Cây quyết định khi trả lời phỏng vấn:**\n1. Có thể **gom dữ liệu về một service hoặc một database** không? Nếu được thì dùng transaction cục bộ: đơn giản nhất. Ranh giới service sai thường là nguồn gốc của nhu cầu distributed transaction.\n2. Chỉ cần \"cập nhật DB **và** phát sự kiện\"? Dùng **outbox** (chi tiết: [Outbox pattern](#microservices-4)).\n3. Luồng nhiều service, chấp nhận trạng thái trung gian? Dùng **Saga**: orchestration nếu luồng dài, choreography nếu ngắn.\n4. Cần giữ chỗ tài nguyên khan hiếm, không muốn người khác thấy trạng thái trung gian? Dùng **TCC**.\n5. Bắt buộc nhất quán tức thì, ít tài nguyên, cùng mạng? Cân nhắc **2PC**, chấp nhận chi phí.\n\n**Kinh nghiệm thực tế để kể:** *\"Ở [Opswat/DXC], [luồng X] đi qua [N] service; chúng tôi dùng [outbox/saga/...] và xử lý trùng lặp bằng [idempotency key]...\"* (điền chuyện thật).\n\n### English\n\n| | 2PC / XA | Saga | TCC | Outbox (+ idempotent consumers) |\n|---|---|---|---|---|\n| Consistency | Strong, immediate | Eventual | Eventual, better isolation than a saga | Eventual |\n| Resource locking | Database locks across both phases | None | Business-level reservations | None |\n| Complexity | Low for developers, high to operate | Medium (write compensations) | **High** (3 APIs per service) | Low |\n| Performance | Poor | Good | Good | Good |\n| Problem it solves | Committing several resources at once | Business flows spanning services | Reserving scarce resources | **Writing to the DB and publishing a message** without divergence |\n\n**They're not mutually exclusive.** The outbox is the **foundation** that lets sagas or TCC publish events reliably, and idempotency is mandatory in every approach.\n\n**A decision tree for interviews:**\n1. Can the data **live in one service or one database**? If so, use a local transaction: simplest. Wrong service boundaries are often what creates the need for distributed transactions.\n2. Do you only need to \"update the DB **and** publish an event\"? Use an **outbox** (details: [Outbox pattern](#microservices-4)).\n3. A flow across several services where intermediate states are acceptable? Use a **saga**: orchestration for long flows, choreography for short ones.\n4. Need to reserve scarce resources without others seeing intermediate state? Use **TCC**.\n5. Immediate consistency is mandatory, with few resources on the same network? Consider **2PC** and accept the cost.\n\n**A real story to tell:** *\"At [Opswat/DXC], [flow X] spanned [N] services; we used [outbox/saga/...] and handled duplicates with [idempotency keys]...\"* (fill in your real story).", "excerpt": "Chúng không loại trừ nhau. Outbox là nền tảng để Saga hoặc TCC gửi sự kiện tin cậy; idempotency là bắt buộc ở mọi cách. Cây quyết định khi trả lời phỏng vấn: Có thể gom dữ liệu về một service hoặc một database không? Nếu", "catLabel": "Kafka, RabbitMQ & Distributed TX", "tip": "", "num": null}, {"id": "kafka-internals", "title": "Why is Kafka fast, and what are ISR and exactly-once?", "cat": "messaging", "section": "Kafka và messaging", "kind": "qa", "tags": ["kafka", "distributed-systems", "performance"], "body": "\"**Why fast despite writing to disk:** it appends sequentially to a log, which disks do very fast; it relies on the OS page cache instead of its own cache; it uses zero-copy `sendfile` from page cache to the socket; and it batches and compresses records.\n\n**ISR, in-sync replicas:** the followers that are caught up with the partition leader. With `acks=all` and `min.insync.replicas=2`, a write succeeds only when at least two replicas have it, so losing one broker loses no acknowledged data. Only ISR members can become leader, unless unclean leader election is enabled, which trades data loss for availability.\n\n**Consumer crashes before processing:** if offsets are committed after processing, the message is redelivered: at-least-once.\n\n**Exactly-once:** idempotent producers remove duplicates from retries, and transactions write output records and consumer offsets atomically for read-process-write within Kafka. Once a database or external API is involved, I still need idempotent consumers. Modern Kafka runs in KRaft mode, without ZooKeeper.\"\n\nTham khảo thêm: [Kafka - Basic Concepts](https://minhnhat97kg.github.io/docsify/content/kafka-basic/vi.md)", "excerpt": "\"Why fast despite writing to disk: it appends sequentially to a log, which disks do very fast; it relies on the OS page cache instead of its own cache; it uses zero-copy sendfile from page cache to the socket; and it bat", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "bai-thuc-hanh-dung-pipeline-cho-mot-spring-boot-service-8-10-gio", "title": "Bài thực hành: dựng pipeline cho một Spring Boot service (8–10 giờ)", "cat": "devops", "section": "Bài thực hành: dựng pipeline cho một Spring Boot service (8–10 giờ)", "kind": "guide", "body": "1. **CI cơ bản:** GitHub Actions chạy build và unit test trên mọi push và pull request; bật branch protection để test fail thì không merge được.\n2. **Quality gate:** thêm Checkstyle hoặc SonarCloud, coverage bằng JaCoCo, và dependency scan.\n3. **Đóng gói:** Dockerfile multi-stage, tag image theo commit SHA, push lên GitHub Container Registry.\n4. **CD:** deploy lên Kubernetes local (`kind`) hoặc một dịch vụ cloud free tier; thêm manual approval trước production.\n5. **Vận hành:** readiness và liveness probe, rollback về image trước, secrets lấy từ GitHub Secrets.\n\nWorkflow tối thiểu để bắt đầu (kiểm tra lại phiên bản action mới nhất khi dùng):\n\n```yaml\nname: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      packages: write\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '21'\n          cache: maven\n      - run: mvn -B verify\n      - uses: docker/login-action@v3\n        if: github.ref == 'refs/heads/main'\n        with:\n          registry: ghcr.io\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n      - uses: docker/build-push-action@v6\n        if: github.ref == 'refs/heads/main'\n        with:\n          context: .\n          push: true\n          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}\n```", "tags": ["huong-dan", "cicd"], "excerpt": "CI cơ bản: GitHub Actions chạy build và unit test trên mọi push và pull request; bật branch protection để test fail thì không merge được. Quality gate: thêm Checkstyle hoặc SonarCloud, coverage bằng JaCoCo, và dependency", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "technical-ci-cd-cloud-devops", "title": "Tổng quan: Technical: CI/CD, cloud, DevOps", "cat": "devops", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Đây là điểm yếu bạn tự nhận, và cách vá nhanh nhất là tự dựng một pipeline thật trong 2–3 ngày rồi trả lời bằng kinh nghiệm đó. Developer senior chỉ cần hiểu và đã từng làm, không cần sâu như DevOps engineer.", "kind": "guide", "excerpt": "Đây là điểm yếu bạn tự nhận, và cách vá nhanh nhất là tự dựng một pipeline thật trong 2–3 ngày rồi trả lời bằng kinh nghiệm đó. Developer senior chỉ cần hiểu và đã từng làm, không cần sâu như DevOps engineer.", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "cicd-1", "title": "What is the difference between CI, continuous delivery and continuous deployment?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Continuous integration means everyone merges small changes often and each change is built and tested automatically. Continuous delivery means every change that passes the pipeline is releasable, and the production release is a manual decision. Continuous deployment removes that manual step: every passing change goes to production automatically.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Continuous integration means everyone merges small changes often and each change is built and tested automatically. Continuous delivery means every change that passes the pipeline is releasable, and the production relea", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-2", "title": "Walk me through the pipeline of your last project.", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "opswat", "dxc", "kubernetes", "docker"], "body": "\"At \\[Opswat/DXC\\] we used \\[Jenkins/GitLab CI/...\\]. A merge request triggered compile, unit tests, static analysis and \\[scan\\]. After merge, the pipeline built a Docker image, pushed it to \\[registry\\] and deployed to \\[dev/staging\\] automatically. Production releases needed \\[approval của ai\\] and ran \\[tần suất\\]. I didn't own the pipeline, so I rebuilt an equivalent one myself with GitHub Actions, Docker and Kubernetes to understand each stage.\"\n\n*Ghi chú: câu cuối biến điểm yếu thành bằng chứng chủ động học; chỉ nói khi đã làm xong bài thực hành.*", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"At Opswat/DXC we used Jenkins/GitLab CI/.... A merge request triggered compile, unit tests, static analysis and scan. After merge, the pipeline built a Docker image, pushed it to registry and deployed to dev/staging aut", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-3", "title": "What stages should a good pipeline have, and in what order?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Fast checks first: compile, unit tests, lint and static analysis. Then security scans for dependencies and secrets, then build the artifact once, run integration tests against it, publish it, deploy to a test environment, run smoke or end-to-end tests, and finally promote to production with an approval or automatically. The principle is fail fast and build once.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Fast checks first: compile, unit tests, lint and static analysis. Then security scans for dependencies and secrets, then build the artifact once, run integration tests against it, publish it, deploy to a test environmen", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-4", "title": "What does 'build once, deploy many' mean?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"The same immutable artifact, identified by commit SHA or version, is promoted through dev, staging and production. Only configuration changes per environment, injected through environment variables, config maps or a secret manager. Rebuilding per environment means production runs something that was never tested.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"The same immutable artifact, identified by commit SHA or version, is promoted through dev, staging and production. Only configuration changes per environment, injected through environment variables, config maps or a sec", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-5", "title": "Compare rolling, blue-green and canary deployments.", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Rolling replaces instances gradually: no extra infrastructure, but two versions run together and rollback is slower. Blue-green runs the new version in a parallel environment and switches traffic at once: instant rollback, double the resources. Canary sends a small percentage of traffic to the new version and increases it while watching metrics: lowest risk, needs good monitoring and traffic control. All three require backward-compatible changes.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"Rolling replaces instances gradually: no extra infrastructure, but two versions run together and rollback is slower. Blue-green runs the new version in a parallel environment and switches traffic at once: instant rollba", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-6", "title": "How do you deploy database changes without downtime?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Schema changes are versioned with Flyway or Liquibase and run in the pipeline. I use expand and contract: first add the new column or table in a backward-compatible way, deploy code that writes both and reads the new one, backfill, then remove the old column in a later release. That way the old and new application versions can both run during a rolling deployment, and I can roll the code back.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Schema changes are versioned with Flyway or Liquibase and run in the pipeline. I use expand and contract: first add the new column or table in a backward-compatible way, deploy code that writes both and reads the new on", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-7", "title": "How do you roll back a bad release?", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "kubernetes"], "body": "\"Redeploy the previous image tag, which is quick because artifacts are immutable; in Kubernetes that's `kubectl rollout undo`. Feature flags let me switch off a feature without redeploying. Database changes are the hard part, which is why migrations must be backward compatible. Afterwards I'd write up the cause and add a test or check so the pipeline catches it next time.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"Redeploy the previous image tag, which is quick because artifacts are immutable; in Kubernetes that's kubectl rollout undo. Feature flags let me switch off a feature without redeploying. Database changes are the hard pa", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-8", "title": "Trunk-based development vs GitFlow?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Trunk-based uses short-lived branches merged to main at least daily, with feature flags hiding unfinished work; it suits continuous delivery and reduces merge conflicts. GitFlow uses long-lived develop and release branches; it suits scheduled releases and supporting several versions, at the cost of slower integration. I prefer trunk-based when the test suite is trustworthy.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Trunk-based uses short-lived branches merged to main at least daily, with feature flags hiding unfinished work; it suits continuous delivery and reduces merge conflicts. GitFlow uses long-lived develop and release branc", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-9", "title": "How do you manage secrets in a pipeline?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Never in the repository or image. They live in the CI system's secret store or a manager such as Vault or AWS Secrets Manager, are injected at runtime, masked in logs, scoped per environment and rotated. I prefer short-lived credentials through OIDC over long-lived keys, and I run secret scanning on commits.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"Never in the repository or image. They live in the CI system's secret store or a manager such as Vault or AWS Secrets Manager, are injected at runtime, masked in logs, scoped per environment and rotated. I prefer short-", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-10", "title": "The pipeline takes 40 minutes. How do you speed it up?", "cat": "devops", "section": "CI/CD", "tags": ["cicd", "docker"], "body": "\"Measure which stage is slow first. Then cache dependencies and Docker layers, run independent jobs in parallel, split or shard the test suite, move slow end-to-end tests to a later stage or nightly run, build only affected modules, and fix flaky tests that cause reruns.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"Measure which stage is slow first. Then cache dependencies and Docker layers, run independent jobs in parallel, split or shard the test suite, move slow end-to-end tests to a later stage or nightly run, build only affec", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cicd-11", "title": "What quality gates do you put in a pipeline?", "cat": "devops", "section": "CI/CD", "tags": ["cicd"], "body": "\"Tests must pass, static analysis with no new critical issues, coverage on new code above an agreed threshold, no known critical vulnerabilities in dependencies or the image, and at least one approving code review. Gates should be fast and trusted; a gate people routinely bypass is worse than none.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"Tests must pass, static analysis with no new critical issues, coverage on new code above an agreed threshold, no known critical vulnerabilities in dependencies or the image, and at least one approving code review. Gates", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "docker-k8s-12", "title": "Image vs container? How do you write a good Dockerfile for a Java service?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s", "docker"], "body": "\"An image is an immutable, layered template; a container is a running instance of it. For Java I use a multi-stage build: compile with a JDK image, run on a slim JRE image. I order instructions so dependencies are cached before source code, run as a non-root user, pin base image versions, and let the JVM size the heap from the container limit with `-XX:MaxRAMPercentage`.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"An image is an immutable, layered template; a container is a running instance of it. For Java I use a multi-stage build: compile with a JDK image, run on a slim JRE image. I order instructions so dependencies are cached", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "docker-k8s-13", "title": "Explain Pod, Deployment, Service, Ingress, ConfigMap and Secret.", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"A Pod is one or more containers sharing network and storage. A Deployment manages replicas and rolling updates. A Service gives a stable address and load-balances across pods. An Ingress routes external HTTP traffic to services. ConfigMaps and Secrets hold configuration and sensitive values outside the image.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"A Pod is one or more containers sharing network and storage. A Deployment manages replicas and rolling updates. A Service gives a stable address and load-balances across pods. An Ingress routes external HTTP traffic to ", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "docker-k8s-14", "title": "Liveness vs readiness probes?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"Readiness says whether the pod can receive traffic; failing it removes the pod from the Service but doesn't restart it. Liveness says whether the process is stuck; failing it restarts the container. Liveness shouldn't check dependencies such as the database, otherwise a database outage restarts every pod. Spring Boot Actuator exposes both. With graceful shutdown they give zero-downtime rollouts.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"Readiness says whether the pod can receive traffic; failing it removes the pod from the Service but doesn't restart it. Liveness says whether the process is stuck; failing it restarts the container. Liveness shouldn't c", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "docker-k8s-15", "title": "How do you set resources and scale?", "cat": "devops", "section": "Docker và Kubernetes", "tags": ["docker-k8s"], "body": "\"Requests are what the scheduler reserves; limits are the cap. Exceeding the memory limit gets the container killed, and exceeding the CPU limit throttles it. The Horizontal Pod Autoscaler adds replicas based on CPU or custom metrics such as queue lag. The service has to be stateless for this to work.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"Requests are what the scheduler reserves; limits are the cap. Exceeding the memory limit gets the container killed, and exceeding the CPU limit throttles it. The Horizontal Pod Autoscaler adds replicas based on CPU or c", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cloud-16", "title": "Which cloud services have you used?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"\\[Trả lời thật.\\] On \\[AWS/Azure/GCP\\] I've worked with \\[compute\\], \\[database\\] and \\[storage/queue\\]. In AWS terms I know the building blocks: EC2 or ECS/EKS for compute, RDS for relational data, S3 for objects, SQS and SNS for messaging, IAM for access, and CloudWatch for logs and metrics.\"\n\n*Ghi chú: nếu kinh nghiệm cloud còn mỏng, nói rõ phần nào đã làm thật, phần nào mới tự học. Người phỏng vấn senior nhận ra ngay câu trả lời thuộc lòng.*", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"Trả lời thật. On AWS/Azure/GCP I've worked with compute, database and storage/queue. In AWS terms I know the building blocks: EC2 or ECS/EKS for compute, RDS for relational data, S3 for objects, SQS and SNS for messagin", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cloud-17", "title": "What is infrastructure as code, and why use it?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"Infrastructure is defined in versioned files, with Terraform or CloudFormation, and applied automatically. It makes environments reproducible, changes reviewable and auditable, and recovery faster than clicking in a console.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Infrastructure is defined in versioned files, with Terraform or CloudFormation, and applied automatically. It makes environments reproducible, changes reviewable and auditable, and recovery faster than clicking in a con", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "cloud-18", "title": "What are the twelve-factor principles you apply most?", "cat": "devops", "section": "Cloud", "tags": ["cloud"], "body": "\"Configuration in the environment, stateless processes, logs as event streams written to stdout, backing services as attached resources, fast startup and graceful shutdown, and keeping dev, staging and production as similar as possible.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"Configuration in the environment, stateless processes, logs as event streams written to stdout, backing services as attached resources, fast startup and graceful shutdown, and keeping dev, staging and production as simi", "catLabel": "CI/CD, Cloud & AWS"}, {"id": "aws-big-picture", "title": "Walk me through a typical secure web architecture on AWS.", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "cloud", "architecture", "vpc"], "body": "\"From the outside in: Route 53 for DNS, CloudFront as CDN with AWS WAF, then an Application Load Balancer in **public subnets**. The application runs in **private subnets** on ECS, EKS or EC2 in an Auto Scaling group, spread across at least two availability zones. Databases such as RDS and ElastiCache sit in separate private data subnets.\n\nOutbound internet from private subnets goes through a NAT gateway, one per AZ for availability. Traffic to S3 or DynamoDB uses a VPC gateway endpoint so it never touches the internet and costs no NAT fees.\n\nSecurity layers: security groups chained by reference (ALB → app → database), IAM roles for workloads instead of keys, KMS encryption at rest, Secrets Manager for credentials, CloudTrail and CloudWatch for audit and monitoring. Single points of failure to call out: a single NAT gateway, a single-AZ database, or one region if the business needs regional DR.\"\n\nTham khảo thêm: [Cloud Architecture - The Big Picture](https://minhnhat97kg.github.io/docsify/content/cloud-architecture-the-big-picture/vi.md), [VPC & Subnet Architecture](https://minhnhat97kg.github.io/docsify/content/devops-vpc-virtual-private-cloud-subnet-architecture/vi.md)", "excerpt": "\"From the outside in: Route 53 for DNS, CloudFront as CDN with AWS WAF, then an Application Load Balancer in public subnets. The application runs in private subnets on ECS, EKS or EC2 in an Auto Scaling group, spread acr", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-sg-nacl", "title": "Security Group vs Network ACL vs WAF?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "security", "networking", "vpc"], "body": "\"**Security groups** attach to network interfaces, allow rules only, and are **stateful**: return traffic is allowed automatically. **NACLs** apply to a subnet, have ordered allow and deny rules, and are **stateless**, so you must also allow return traffic on ephemeral ports 1024–65535, a common mistake.\n\nA packet must pass both: if the NACL allows it but the security group doesn't, the instance never sees it. To block one attacking IP, use a NACL deny rule or WAF, since security groups can't deny. In practice most teams leave NACLs at default and do everything with security groups, because they're stateful and can reference other groups.\n\n**WAF** works at layer 7 on CloudFront, ALB or API Gateway: SQL injection and XSS patterns, rate-based rules, geo-blocking, bot control. It sees decrypted HTTPS because it runs where TLS terminates. It can't protect against an attacker already inside the VPC.\"\n\nTham khảo thêm: [Security Groups vs NACL](https://minhnhat97kg.github.io/docsify/content/aws-security-groups-vs-nacl/vi.md), [AWS WAF](https://minhnhat97kg.github.io/docsify/content/aws-waf-web-application-firewall/vi.md)", "excerpt": "\"Security groups attach to network interfaces, allow rules only, and are stateful: return traffic is allowed automatically. NACLs apply to a subnet, have ordered allow and deny rules, and are stateless, so you must also ", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-iam", "title": "How do IAM roles and policies work? How do you apply least privilege?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "iam", "security", "kubernetes"], "body": "\"A **user** is a long-lived identity with credentials; a **role** is assumed temporarily and gives short-lived credentials through STS. Workloads always use roles: an EC2 instance profile, an ECS task role, or IRSA or EKS Pod Identity for Kubernetes pods. No access keys in code.\n\nA policy lists allowed or denied actions on resources, with optional conditions. Evaluation: everything is implicitly denied, an explicit allow grants access, and an explicit deny always wins. Permission boundaries and organization SCPs cap the maximum a role can ever get.\n\nLeast privilege in practice: start narrow, scope resources by ARN, use IAM Access Analyzer to trim unused permissions, and manage policies in Terraform. Developers reach production through SSO and short-lived role sessions, ideally read-only by default with audited break-glass access.\n\nIf a key leaks to GitHub: deactivate and delete it immediately, check CloudTrail for what it was used for, rotate anything it could reach, then fix the process with secret scanning.\"\n\nTham khảo thêm: [IAM Roles & Policies](https://minhnhat97kg.github.io/docsify/content/aws-iam-roles-policies-least-privilege/vi.md)", "excerpt": "\"A user is a long-lived identity with credentials; a role is assumed temporarily and gives short-lived credentials through STS. Workloads always use roles: an EC2 instance profile, an ECS task role, or IRSA or EKS Pod Id", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-kms", "title": "What is envelope encryption with KMS?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "kms", "encryption", "security"], "body": "\"KMS keys never leave the KMS hardware, and `Encrypt` only accepts up to 4 KB, so you don't send your data to KMS. Instead:\n\n1. Call `GenerateDataKey`: KMS returns a plaintext data key and the same key encrypted under your KMS key.\n2. Encrypt the data locally with the plaintext key using AES-GCM, then discard the plaintext key from memory.\n3. Store the encrypted data key next to the ciphertext.\n4. To decrypt, send the encrypted data key to KMS `Decrypt`, then decrypt locally.\n\nBenefits: large data never crosses the network to KMS, each object can have its own key, access to decryption is controlled and audited through IAM and CloudTrail. With automatic rotation, KMS keeps old key material to decrypt old data keys, so you don't re-encrypt the database. Multi-region keys let you decrypt in a DR region.\"\n\nTham khảo thêm: [AWS - KMS & Envelope Encryption](https://minhnhat97kg.github.io/docsify/content/aws-aws-kms-envelope-encryption/vi.md)", "excerpt": "\"KMS keys never leave the KMS hardware, and Encrypt only accepts up to 4 KB, so you don't send your data to KMS. Instead: Call GenerateDataKey: KMS returns a plaintext data key and the same key encrypted under your KMS k", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-secrets", "title": "Secrets Manager vs Parameter Store, and how does rotation work?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "security", "secrets"], "body": "\"Secrets Manager stores secrets encrypted with KMS and can rotate them automatically with a Lambda, with built-in support for RDS. Parameter Store is cheaper, and free for standard parameters, but has no built-in rotation. I use Secrets Manager for database credentials and API keys, and Parameter Store for ordinary configuration.\n\nRotation uses two versions, so the application doesn't break: the new password is created and set in the database while the old one stays valid, then the 'current' label moves. Existing connections keep working because databases check the password only when a connection opens; new connections pick up the new value.\n\nIn the application I cache the secret with a TTL rather than calling the API on every request, and on an authentication error I refresh the cache and retry once. Access is restricted per service through IAM, and every read is in CloudTrail.\"\n\nTham khảo thêm: [AWS - Secrets Manager & Automated Rotation](https://minhnhat97kg.github.io/docsify/content/aws-aws-secrets-manager-automated-rotation/vi.md)", "excerpt": "\"Secrets Manager stores secrets encrypted with KMS and can rotate them automatically with a Lambda, with built-in support for RDS. Parameter Store is cheaper, and free for standard parameters, but has no built-in rotatio", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-rds", "title": "RDS Multi-AZ vs read replicas?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "database", "high-availability"], "body": "\"They solve different problems.\n\n**Multi-AZ** is for **availability**: a standby in another AZ with synchronous replication. You can't read from the classic standby. On failure, RDS fails over by switching DNS, typically within a minute or two. Writes are slightly slower because each commit waits for the standby.\n\n**Read replicas** are for **read scaling**: asynchronous copies you query directly, possibly in other regions. They have replication lag, so a user may not see their own write; read-your-writes paths go to the primary.\n\nWrite scaling needs other tools: a bigger instance, batching, caching, queues, or sharding. **Aurora** separates compute from a storage layer replicated six ways across three AZs; replicas share storage, so lag is usually tens of milliseconds and failover is faster.\"\n\nTham khảo thêm: [RDS Multi-AZ vs Read Replicas](https://minhnhat97kg.github.io/docsify/content/aws-aws-rds-multi-az-vs-read-replicas/vi.md)", "excerpt": "\"They solve different problems. Multi-AZ is for availability: a standby in another AZ with synchronous replication. You can't read from the classic standby. On failure, RDS fails over by switching DNS, typically within a", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-s3", "title": "What should a backend engineer know about S3?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "s3", "storage"], "body": "\"S3 is object storage: you replace whole objects, not edit blocks like a disk. Since December 2020 it's **strongly consistent** for reads after writes and lists.\n\nCost: storage classes from Standard to Infrequent Access to Glacier, with lifecycle rules to move or expire objects; Intelligent-Tiering when access patterns are unknown.\n\nPatterns:\n\n- **Presigned URLs** so clients upload and download directly, without streaming files through the API servers.\n- **Multipart upload** for large files, roughly over 100 MB: parallel parts, retry per part.\n- **Versioning plus Object Lock** to recover from accidental deletes or ransomware.\n- Static websites: S3 behind CloudFront with origin access control, so the bucket stays private.\n\nSecurity: block public access at the account level, encrypt with SSE-KMS, and grant access through bucket policies and IAM roles.\"\n\nTham khảo thêm: [S3 - Object Storage, Lifecycle & Consistency](https://minhnhat97kg.github.io/docsify/content/s3-simple-storage-service-object-storage-lifecycle-consistency/vi.md)", "excerpt": "\"S3 is object storage: you replace whole objects, not edit blocks like a disk. Since December 2020 it's strongly consistent for reads after writes and lists. Cost: storage classes from Standard to Infrequent Access to Gl", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-lambda", "title": "When would you use AWS Lambda, and what are its limits?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "serverless", "lambda", "kubernetes"], "body": "\"Lambda runs functions on events with no servers to manage and per-request billing. It fits glue work: processing files after an S3 upload, consuming SQS or EventBridge events, scheduled jobs, and low or spiky-traffic APIs.\n\nLimits: maximum 15 minutes per invocation, memory up to 10 GB, CPU tied to memory, no long-lived connections, and **cold starts** when a new environment starts. Go has small cold starts; Java's are larger, which SnapStart or provisioned concurrency mitigate.\n\nPractical points: initialize clients outside the handler so warm invocations reuse them; use RDS Proxy because many concurrent functions can exhaust database connections; make handlers idempotent because events can be delivered more than once; and attach a dead-letter queue or on-failure destination for failed async events. For long or steady workloads, containers on ECS or Kubernetes are usually cheaper.\"\n\nTham khảo thêm: [DevOps - AWS Lambda](https://minhnhat97kg.github.io/docsify/content/devops-aws-lambda-serverless-compute/vi.md)", "excerpt": "\"Lambda runs functions on events with no servers to manage and per-request billing. It fits glue work: processing files after an S3 upload, consuming SQS or EventBridge events, scheduled jobs, and low or spiky-traffic AP", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-autoscaling", "title": "How does EC2 Auto Scaling work?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "ec2", "autoscaling", "high-availability"], "body": "\"Three parts: a **launch template** describing the instance, an **Auto Scaling group** with minimum, desired and maximum counts across AZs, and **scaling policies**.\n\nPolicies: **target tracking**, such as 'keep average CPU at 50%', is the default choice; step scaling for finer control; scheduled scaling for known peaks; predictive scaling for regular patterns.\n\nIt doesn't make a single request faster; it adds capacity and replaces unhealthy instances. It only works cleanly for stateless services: sessions in Redis, files in S3, databases outside the group.\n\nDetails interviewers probe: **lifecycle hooks** to finish work or drain before termination; **scale-in protection** for an instance running a long job; cooldowns and warm-up to prevent flapping; and health checks from the load balancer, not just EC2 status.\"\n\nTham khảo thêm: [DevOps - EC2 Auto Scaling](https://minhnhat97kg.github.io/docsify/content/devops-ec2-auto-scaling/vi.md)", "excerpt": "\"Three parts: a launch template describing the instance, an Auto Scaling group with minimum, desired and maximum counts across AZs, and scaling policies. Policies: target tracking, such as 'keep average CPU at 50%', is t", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "aws-eks", "title": "What do you need to know about running services on EKS?", "cat": "devops", "section": "AWS", "kind": "qa", "tags": ["aws", "eks", "kubernetes"], "body": "\"AWS runs the Kubernetes control plane; you manage the data plane: managed node groups, self-managed nodes, or Fargate.\n\nThings that matter in practice:\n\n- **Networking:** the VPC CNI gives each pod a real VPC IP, so pods can be targeted by security groups, but subnet IP space must be planned.\n- **Pod permissions:** IRSA or EKS Pod Identity gives each service account its own IAM role. A pod reaches RDS through that role plus security groups, or with IAM database authentication.\n- **Scaling:** HPA scales pods; Cluster Autoscaler or Karpenter adds nodes.\n- **Security:** private API endpoint, secrets from Secrets Manager via the CSI driver, network policies.\n- **Upgrades:** Kubernetes minor versions go out of standard support within about 14 months, so upgrades are routine: control plane first, then add-ons, then nodes, after checking for deprecated APIs.\"\n\nTham khảo thêm: [DevOps - Amazon EKS](https://minhnhat97kg.github.io/docsify/content/devops-amazon-eks-elastic-kubernetes-service/vi.md)", "excerpt": "\"AWS runs the Kubernetes control plane; you manage the data plane: managed node groups, self-managed nodes, or Fargate. Things that matter in practice: Networking: the VPC CNI gives each pod a real VPC IP, so pods can be", "catLabel": "CI/CD, Cloud & AWS", "tip": "", "num": null}, {"id": "docker-go", "title": "How do you build a small, secure Docker image for a Go service?", "cat": "devops", "section": "Docker và Kubernetes", "kind": "qa", "tags": ["docker", "go", "devops", "kubernetes"], "body": "Multi-stage build: compile trong image có Go toolchain, chạy trong image tối giản.\n\n```dockerfile\nFROM golang:1.23 AS build\nWORKDIR /src\nCOPY go.mod go.sum ./\nRUN go mod download\nCOPY . .\nRUN CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags=\"-s -w\" -o /app ./cmd/api\n\nFROM gcr.io/distroless/static-debian12:nonroot\
