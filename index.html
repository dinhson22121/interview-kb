<style>
:root{
  --bg:#ffffff; --bg2:#f4f4f2; --fg:#1b1b1b; --muted:#6b6b6b; --line:#d6d6d2;
  --accent:#1b1b1b; --hl:#fff3b0; --hlfg:#5a4a00; --tip:#eef4ff; --tipline:#9db4e0;
  --ok:#1f7a3a; --code:#f2f2ef;
}
html.dark{
  --bg:#141414; --bg2:#1c1c1c; --fg:#e4e4e0; --muted:#8e8e88; --line:#333330;
  --accent:#e4e4e0; --hl:#3b3416; --hlfg:#f0dc8a; --tip:#18202e; --tipline:#3c5582;
  --ok:#5cc47a; --code:#1f1f1d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.6 "JetBrains Mono","Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);padding:2px 9px;cursor:pointer}
button:hover{border-color:var(--fg)}
button.on{border-color:var(--fg);font-weight:700}
a{color:inherit}
header{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.logo{font-weight:700;white-space:nowrap;cursor:pointer}
.search{flex:1;max-width:420px;display:flex;border:1px solid var(--line)}
.search span{padding:3px 8px;color:var(--muted);border-right:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;padding:3px 8px;min-width:0}
.search:focus-within{border-color:var(--fg)}
.hdr-right{margin-left:auto;display:flex;gap:6px}
#menu{display:none}
main{flex:1;display:flex;min-height:0}
aside{width:210px;flex:none;border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:10px 0 20px}
aside h4{margin:10px 8px 4px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.05em}
aside .row{display:flex;justify-content:space-between;gap:8px;padding:2px 10px;cursor:pointer;color:var(--fg)}
aside .row:hover{background:var(--bg)}
aside .row.on{background:var(--fg);color:var(--bg)}
aside .row .n{color:var(--muted)}
aside .row.on .n{color:var(--bg)}
.prog{margin:4px 10px 0;height:6px;border:1px solid var(--line)}
.prog div{height:100%;background:var(--ok)}
#content{flex:1;overflow-y:auto;min-width:0}
.listhead{padding:8px 12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.listhead .chip{border:1px solid var(--line);padding:0 6px;color:var(--fg);cursor:pointer}
.card{padding:12px 12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover{background:var(--bg2)}
.card h3{margin:0 0 2px;font-size:14px}
.card h3 .q{color:var(--muted);font-weight:400}
.meta{color:var(--muted);font-size:12px}
.meta .done{color:var(--ok)}
.ex{margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.practice .ex{display:none}
.tags{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:0 10px}
.tags span{cursor:pointer}
.tags span:hover{color:var(--fg);text-decoration:underline}
.empty{padding:30px 12px;color:var(--muted)}
.detail{max-width:860px;padding:12px 16px 60px}
.detail .nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.detail h1{font-size:19px;margin:0 0 4px;line-height:1.4}
.detail .tags{margin:4px 0 14px}
.tip{background:var(--tip);border-left:3px solid var(--tipline);padding:8px 12px;margin:0 0 14px}
.tip p{margin:0}
.reveal{margin:6px 0 16px;width:100%;padding:18px;border-style:dashed;color:var(--muted)}
.body{font-size:13.5px}
.body p{margin:0 0 12px}
.body h3{font-size:14px;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:3px}
.body ul,.body ol{padding-left:22px;margin:0 0 12px}
.body li{margin:2px 0}
.body code{background:var(--code);padding:0 4px}
.body pre{background:var(--code);border:1px solid var(--line);padding:10px 12px;overflow-x:auto;position:relative;font-size:12.5px;line-height:1.5}
.body pre code{background:none;padding:0}
.body pre button{position:absolute;top:6px;right:6px;font-size:11px;background:var(--bg)}
.body table{border-collapse:collapse;margin:0 0 14px;width:100%;font-size:12.5px}
.body th,.body td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.body th{background:var(--bg2)}
.body blockquote{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.body em{color:var(--muted)}
mark.fill{background:var(--hl);color:var(--hlfg);padding:0 2px}
.body input[type=checkbox]{margin-right:6px;cursor:pointer}
.body li.checked{color:var(--muted)}
.body li.checked a{text-decoration:line-through}
.body li:has(> input[type=checkbox]){list-style:none;margin-left:-18px}
.foot-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px;padding-top:12px;border-top:1px solid var(--line)}
footer{display:flex;justify-content:space-between;padding:5px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
.kbd{color:var(--muted)}
@media (max-width:760px){
  #menu{display:inline-block}
  aside{position:fixed;top:43px;bottom:28px;left:0;z-index:5;display:none;box-shadow:2px 0 8px rgba(0,0,0,.15)}
  aside.open{display:block}
  header{flex-wrap:wrap;gap:8px}
  .search{order:5;flex:1 1 100%;max-width:none}
  aside{top:84px}
  .logo .full{display:none}
  footer span:last-child{display:none}
}
</style>
</head>
<body>
<header>
  <button id="menu" title="Menu">[=]</button>
  <div class="logo" id="home">[ interview<span class="full">.kb</span> ]</div>
  <label class="search"><span>/</span><input id="q" placeholder="search..." autocomplete="off"></label>
  <div class="hdr-right">
    <button id="practice" title="Ẩn câu trả lời để tự luyện">[luyện<span class="lbl"> tập</span>]</button>
    <button id="dark">[dark]</button>
  </div>
</header>
<main>
  <aside id="side"></aside>
  <section id="content"></section>
</main>

\nSong song mỗi ngày: 2 bài coding (xem tag `#dsa` và `#coding`), nói to độ phức tạp Big-O. Nếu đang nhắm Grab hoặc Axon, tăng lên 3–4 bài mức medium mỗi ngày.\n\n### Tuần 2: Nâng tầm senior và luyện thể hiện\n\n| Ngày | Chủ đề | Đầu ra |\n|---|---|---|\n| 8 | System design 1: khung trả lời, caching, load balancing, CDN ở mức khái niệm | URL shortener và rate limiter, 35 phút mỗi bài |\n| 9 | System design 2: hệ thống Opswat làm case, cộng một bài quy mô lớn (ride matching hoặc ví điện tử) | Sơ đồ kiến trúc và 5 quyết định thiết kế bảo vệ được |\n| 10 | Cloud và DevOps: Docker, Kubernetes cơ bản, CI/CD, AWS cơ bản, observability | Mô tả pipeline từ commit đến production |\n| 11 | Design patterns, SOLID, testing (JUnit 5, Mockito, Testcontainers), REST API design | 1 bài refactor nhỏ, giải thích bằng tiếng Anh |\n| 12 | Behavioral: 8 câu chuyện STAR; AI-assisted development | Bản nháp 8 câu chuyện, mỗi câu 2 phút |\n| 13 | Mock lần 2 full theo đúng quy trình của công ty sắp phỏng vấn | Sửa 3 điểm yếu nhất |\n| 14 | Ôn nhẹ: self-introduction, lý do rời Opswat, câu hỏi ngược | Nghỉ sớm, không học mới |\n\n### Điểm cần ưu tiên theo hồ sơ của bạn\n\n- **Lỗ hổng CDN, cloud và CI/CD:** vòng senior hay hỏi, nên ngày 8 và 10 không được cắt; xem bài \"Vá điểm yếu CI/CD\".\n- **Go và Java:** công ty Java (EPAM, mgm) sẽ hỏi sâu Java gần đây bạn dùng thế nào; công ty dùng Go (Grab) sẽ quan tâm kinh nghiệm Go ở Opswat.\n- **Hai kiểu công ty:** công ty dịch vụ hỏi lý thuyết và kinh nghiệm làm với khách hàng; công ty product hỏi DSA và system design sâu hơn.", "excerpt": "Kế hoạch 14 ngày, khoảng 3–4 giờ mỗi ngày, dùng chung cho mọi vị trí Senior Backend. Trước mỗi cuộc phỏng vấn cụ thể, mở trang của công ty đó trong mục Công ty để dồn thời gian vào vòng nặng nhất. Song song mỗi ngày: 2 b", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cach-dung-tai-lieu", "title": "Cách dùng tài liệu", "cat": "guide", "section": "", "tags": ["huong-dan"], "body": "Kho kiến thức gom câu hỏi và câu trả lời mẫu cho phỏng vấn Senior Backend (Java/Go), dùng chung cho nhiều công ty: HR screening, technical (Java, Spring, database, microservices, system design, CI/CD, coding) và behavioral. Quy trình và trọng tâm riêng của từng công ty nằm ở mục Công ty. Câu hỏi và câu trả lời viết bằng tiếng Anh vì bạn sẽ phải nói bằng tiếng Anh; ghi chú viết bằng tiếng Việt.\n\n- **Trước mỗi cuộc phỏng vấn:** đọc trang của công ty đó để biết vòng nào nặng (coding, system design hay kiến thức Java) rồi ôn theo tag tương ứng.\n- **Chỗ trong ngoặc vuông `[...]`** là thông tin chỉ bạn biết (số liệu, tên công cụ, sự cố thật). Hãy điền bằng sự thật, đừng dùng nguyên câu mẫu.\n- **Cách luyện:** che câu trả lời, nói to trong 60–90 giây, ghi âm, rồi so lại. Câu mẫu là khung ý, không phải để học thuộc.\n- **Khi bị hỏi vặn:** nêu trade-off và ví dụ từ dự án thật (Opswat, DXC) thay vì lặp lại định nghĩa.", "kind": "guide", "excerpt": "Kho kiến thức gom câu hỏi và câu trả lời mẫu cho phỏng vấn Senior Backend (Java/Go), dùng chung cho nhiều công ty: HR screening, technical (Java, Spring, database, microservices, system design, CI/CD, coding) và behavior", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cicd-fix", "title": "Vá điểm yếu CI/CD trong 2–3 ngày", "cat": "guide", "section": "", "kind": "guide", "tags": ["huong-dan", "cicd", "ke-hoach"], "body": "CI/CD là điểm yếu dễ vá nhất: phỏng vấn senior developer chỉ hỏi ở mức \"hiểu và đã từng làm\". Cách nhanh nhất là tự dựng một pipeline thật, sau đó trả lời bằng kinh nghiệm thay vì lý thuyết.\n\n### Dựng một pipeline hoàn chỉnh (8–10 giờ)\n\n1. **CI cơ bản:** mỗi push/PR chạy build, unit test; fail thì chặn merge (branch protection).\n2. **Quality gate:** lint/static analysis (Checkstyle hoặc SonarCloud), coverage JaCoCo, dependency scan.\n3. **Đóng gói:** multi-stage Dockerfile, tag theo commit SHA, push lên GHCR.\n4. **CD:** deploy tự động lên `kind` local hoặc cloud free tier, manual approval trước production.\n5. **Vận hành:** health check sau deploy, rollback về image trước, secrets từ GitHub Secrets.\n\n### Khái niệm cần nói trôi chảy\n\n- CI, continuous delivery và continuous deployment khác nhau ở đâu.\n- Chiến lược deploy: rolling, blue-green, canary.\n- Branching: trunk-based so với GitFlow, feature flag.\n- Build once, promote cùng một image qua dev → staging → prod.\n- Database migration: Flyway/Liquibase, expand → migrate → contract.\n- Tối ưu pipeline: cache, chạy song song, test pyramid.\n- Zero-downtime: readiness/liveness probe, graceful shutdown.\n\n### Tận dụng kinh nghiệm sẵn có\n\nGhi lại pipeline ở Opswat và DXC: công cụ gì, các stage từ commit đến production, ai approve release, một lần pipeline hỏng và cách xử lý. Câu trả lời tốt nhất: \"ở công ty quy trình như thế này, và tôi đã tự dựng lại một pipeline tương tự để hiểu từng bước.\"", "excerpt": "CI/CD là điểm yếu dễ vá nhất: phỏng vấn senior developer chỉ hỏi ở mức \"hiểu và đã từng làm\". Cách nhanh nhất là tự dựng một pipeline thật, sau đó trả lời bằng kinh nghiệm thay vì lý thuyết. CI cơ bản: mỗi push/PR chạy b", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cau-hoi-nen-hoi", "title": "Câu hỏi nên hỏi ngược interviewer", "cat": "guide", "section": "Câu hỏi nên hỏi", "kind": "guide", "body": "Luôn hỏi lại 2–3 câu ở cuối mỗi vòng; không hỏi gì bị xem là thiếu quan tâm.\n\n**Vòng HR**\n\n- \"What does the rest of the interview process look like, and what is the timeline?\"\n- \"Is this position for a specific project, or will I be assigned after joining?\"\n- \"What does the career path from Senior to Lead look like here?\"\n\n**Vòng technical**\n\n- \"What does the tech stack and architecture of the project look like?\"\n- \"How does the team handle code review, testing and releases? How often do you deploy?\"\n- \"What is the biggest technical challenge the team is facing now?\"\n\n**Vòng manager/client**\n\n- \"What would you expect me to achieve in the first three months?\"\n- \"How is the team structured, and how much overlap with the client's time zone is expected?\"\n- \"How do you measure success for this role?\"", "tags": ["huong-dan"], "excerpt": "Vòng HR \"What does the rest of the interview process look like, and what is the timeline?\" \"Is this position for a specific project, or will I be assigned after joining?\" \"What does the career path from Senior to Lead lo", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "checklist-truoc-ngay-phong-van", "title": "Checklist trước ngày phỏng vấn", "cat": "guide", "section": "Checklist trước ngày phỏng vấn", "kind": "guide", "body": "- [ ] Self-introduction 90 giây, đã ghi âm và nghe lại\n- [ ] Câu trả lời về lý do rời Opswat và khoảng trống từ tháng 8\n- [ ] Sơ đồ kiến trúc dự án Opswat và một dự án DXC, nói được trong 3 phút mỗi cái\n- [ ] 6–8 câu chuyện STAR đã điền đủ phần trong ngoặc vuông\n- [ ] Pipeline CI/CD tự dựng đã chạy được, repo sẵn sàng để chia sẻ\n- [ ] Mọi công nghệ ghi trong CV đều trả lời được câu \"bạn đã dùng nó như thế nào\"\n- [ ] Hai buổi mock bằng tiếng Anh đã xong, ba điểm yếu nhất đã vá\n- [ ] Mức lương kỳ vọng và ngày có thể bắt đầu\n- [ ] Kiểm tra camera, micro, mạng và IDE cho phần live coding", "tags": ["huong-dan"], "excerpt": "Self-introduction 90 giây, đã ghi âm và nghe lại Câu trả lời về lý do rời Opswat và khoảng trống từ tháng 8 Sơ đồ kiến trúc dự án Opswat và một dự án DXC, nói được trong 3 phút mỗi cái 6–8 câu chuyện STAR đã điền đủ phần", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "sources", "title": "Nguồn tham khảo", "cat": "guide", "section": "", "kind": "guide", "tags": ["huong-dan"], "body": "Các bài trong mục Go, Security, AWS, PostgreSQL internals và một phần System design được viết lại bằng lời của kho này, dựa trên danh sách chủ đề và câu hỏi phỏng vấn của [knowledge base của nathan.huynh](https://minhnhat97kg.github.io/docsify/). Mỗi bài có link \"Tham khảo thêm\" tới bài gốc để đọc chi tiết, kèm code Go.\n\nThông tin quy trình  complexity, code Java không autocomplete.*\n\n- [ ] [1. Two Sum](https://leetcode.com/problems/two-sum/) (Easy)\n- [ ] [49. Group Anagrams](https://leetcode.com/problems/group-anagrams/) (Medium)\n- [ ] [3. Longest Substring Without Repeating Characters](https://leetcode.com/problems/longest-substring-without-repeating-characters/) (Medium)\n- [ ] [347. Top K Frequent Elements](https://leetcode.com/problems/top-k-frequent-elements/) (Medium)\n\n### Chốt ngày\n\n- [ ] Ghi âm 2 câu khó nhất, nghe lại\n- [ ] Đánh dấu \"đã thuộc\" cho các câu nói trôi chảy\n- [ ] Ghi lại câu còn vấp và bài coding bị kẹt", "excerpt": "Mục tiêu: Collections, HashMap, String, OOP, exception, generics. Bật nút luyện tập, tự nói bằng tiếng Anh 60–90 giây rồi mới xem câu trả lời mẫu. HashMap hoạt động bên trong thế nào? HashMap, ConcurrentHashMap và synchr", "catLabel": "Lộ trình 14 ngày", "tip": "", "num": null}, {"id": "day-2", "title": "Day 2: JVM & concurrency", "cat": "plan", "section": "Day 2", "kind": "guide", "tags": ["lo-trinh"], "body": "**Mục tiêu:** Bộ nhớ JVM, GC, class loader, thread pool, virtual threads, Java 8–21.\n\n### Lý thuyết (19 câu)\n\n*Bật nút luyện tập, tự nói bằng tiếng Anh 60–90 giây rồi mới xem câu trả lời mẫu.*\n\n- [ ] [Explain the Stream API. What is the difference between map and flatMap?](#java-modern-7)\n- [ ] [What is Optional for, and how is it misused?](#java-modern-9)\n- [ ] [Describe the JVM memory areas.](#jvm-10)\n- [ ] [Which garbage collectors do you know, and how do you choose?](#jvm-11)\n- [ ] [How do you find a memory leak?](#jvm-12)\n- [ ] [How do class loaders work?](#jvm-13)\n- [ ] [volatile vs synchronized vs Atomic classes?](#concurrency-14)\n- [ ] [How does ThreadPoolExecutor decide when to create threads?](#concurrency-15)\n- [ ] [What are virtual threads and when would you use them?](#concurrency-16)\n- [ ] [What is a deadlock and how do you prevent and diagnose it?](#concurrency-17)\n- [ ] [How do you run several remote calls in paralle urcing ở DXC là lợi thế; chuẩn bị chuyện làm việc với khách hàng nước ngoài.\n\n### Ưu tiên ôn\n\n- [HashMap internals](#java-core-1), [ConcurrentHashMap](#java-core-2), [JVM memory](#jvm-10), [GC](#jvm-11)\n- [@Transactional](#spring-3), [Propagation và isolation](#spring-4), [N+1](#jpa-16)\n- [Kafka message key](#kafka-11), [DLQ](#kafka-13), [Outbox](#microservices-4)\n- [CI/CD: pipeline dự án cũ](#cicd-2), [Rollout strategies](#cicd-5)\n- Cloud (senior hay bị hỏi): [Kiến trúc AWS tổng quan](#aws-big-picture), [IAM](#aws-iam), [RDS Multi-AZ vs replica](#aws-rds), [CDN](#sd-cdn)\n- [Longest substring](#coding-1), [Group by range bằng stream](#coding-2)\n- [Làm việc với yêu cầu không rõ của khách hàng](#behavioral-4), [Dùng AI tools](#ai-tools-13)\n- Câu hỏi nhanh từ một buổi phỏng vấn EPAM Ấn Độ (2 vòng technical, vị trí 3–7 năm, [video GenZ Career](https://www.youtube.com/watch?v=VZ3T2gFlEiA)): [Abstraction vs encapsulation](#jc-abstraction-encapsulation), [String pool](#jc-string-pool), [Private method trong interface](#jc-interface-private), [Vi phạm OCP](#jc-ocp-violation), [finally đè exception](#jc-finally), [Map vs Collection, HashMap vs TreeMap](#jc-collection-map), [Không cần @SpringBootApplication](#sp-without-sba), [DispatcherServlet](#sp-dispatcher), [@RequestParam vs @PathVariable](#sp-param-path), [Spring profiles](#sp-profiles), [REST stateless](#arch-rest), [Circuit breaker mở quá lâu](#arch-cb-open), [TDD/BDD/test pyramid](#eng-testing), [SDLC và Agile](#eng-sdlc-agile), [Trapping Rain Water](#dsa-rain-water)\n- Lưu ý: \"22 LPA\" trong video là lương EPAM Ấn Độ (Lakhs Per Annum, khoảng ₫600M/năm), không áp dụng cho Việt Nam.", "excerpt": "Công ty dịch vụ phần mềm toàn cầu; vòng technical nặng lý thuyết Java hỏi nhanh, ít LeetCode. HR screening ~25 phút: câu hỏi HR, kiểm tra tiếng Anh (Glassdoor). Technical ~90 phút: từ cơ bản đến nâng cao; senior bị hỏi t", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-mgm", "title": "mgm technology pa -9)\n- [CrashLoopBackOff](#k8s-debug), [Xử lý sự cố production](#troubleshoot-10min)", "excerpt": "Công ty phần mềm gốc Đức, có văn phòng TP.HCM và Đà Nẵng; tiếng Anh và live coding Java là hai cửa chính. Vòng 1: lọc CV và gọi phỏng vấn với HR (TopDev). Một ứng viên ở TP.HCM tháng 12/2025 mô tả: lọc CV, cuộc gọi kiểm ", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-grab", "title": "Grab", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "grab", "product"], "body": "Công ty product quy mô Đông Nam Á; vòng coding và system design khó hơn hẳn các công ty dịch vụ.\n\n### Quy trình (theo báo cáo ứng viên)\n\n1. **HR screening:** giới thiệu ngắn, có ứng viên ở TP.HCM mô tả chỉ khoảng 15 phút ([Taro](https://www.jointaro.com/interviews/companies/grab/work-experiences/software-engineer-ho-chi-minh-city-september-10-2019-4-fddfc697)).\n2. **Live coding:** ứng viên khuyên luyện LeetCode nhiều ([Taro](https://www.jointaro.com/interviews/companies/grab/work-experiences/software-engineer-ho-chi-minh-city-september-10-2019-4-fddfc697)); một ứng viên Senior ở TP.HCM gặp hai bài live coding trong một buổi ([Taro](https://www.jointaro.com/interviews/companies/grab/experiences/senior-software-engineer-ho-chi-minh-city-april-6-2024-no-offer-negative-418070e2/)).\n3. **System design:** ở mức senior xoay quanh bài toán quy mô lớn đặc thù khu vực như ghép chuyến, bản đồ, thanh toán ([techinterview.org](https://www.techinterview.org/companies/grab-interview-guide/?format=md)).\n4. **Hiring manager / behavioral:** khoảng 45 phút về leadership và teamwork ([hw.glich.co](https://hw.glich.co/resources/companies/grab/interview-process/g4-software-engineer)).\n\nToàn bộ quá trình thường mất 4–6 tuần ([techinterview.org](https://www.techinterview.org/companies/grab-interview-guide/)).\n\n### Trọng tâm\n\n- DSA mức easy–medium, làm nhanh và đúng: array, string, hash map, cây, đồ thị.\n- System design có số liệu: ước lượng QPS, lưu trữ, phân vùng dữ liệu, xử lý lỗi.\n- Một ứng viên backend từng bị hỏi Golang, system và database ([Taro](https://www.jointaro.com/interviews/companies/grab/experiences/backend-developer-vietnam-november-25-2018-no-offer-positive-bac77e7d/)); kinh nghiệm Go ở Opswat là điểm cộng, nên chuẩn bị nói về goroutine, channel, context.\n- Nhiều vị trí backend ở TP.HCM thuộc domain thanh toán ([Grab Careers](https://www.grab.careers/en/jobs/744000144226510/senior-software-engineer-backend/)), nên idempotency và tính nhất quán dữ liệu rất đáng ôn.\n\n### Ưu tiên ôn\n\n- Toàn bộ tag `#dsa` và `#coding`\n- [Design ride matching](#sd-ride-matching), [Design wallet/ledger](#sd-wallet), [Rate limiter](#system-design-18), [Scale database](#system-design-20)\n- [Idempotency](#microservices-5), [Saga](#microservices-3), [Outbox](#microservices-4), [Kafka delivery](#kafka-12)\n- Go (kinh nghiệm Opswat): [Worker pool + context](#go-worker-pool), [Channels](#go-channels), [Context](#go-context), [Goroutine leak](#go-goroutine-leak), [Map và concurrency](#go-map), [Mutex vs atomic](#go-sync), [Race condition](#go-race), [GC](#go-gc)\n- [System design framework](#sd-checklist), [Consistent hashing](#sd-consistent-hashing), [Distributed lock](#sd-distributed-lock), [Flash sale](#sd-flash-sale), [Double-entry ledger](#sd-double-entry), [Xử lý tiền](#go-money)\n- [Production incident](#behavioral-2), [Bất đồng với đồng nghiệp](#behavioral-3), [Mentoring](#behavioral-7)", "excerpt": "Công ty product quy mô Đông Nam Á; vòng coding và system design khó hơn hẳn các công ty dịch vụ. HR screening: giới thiệu ngắn, có ứng viên ở TP.HCM mô tả chỉ khoảng 15 phút (Taro). Live coding: ứng viên khuyên luyện Lee", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-axon", "title": "Axon", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "axon", "product"], "body": "Công ty product (body camera, phần mềm cho lực lượng an toàn công cộng) có văn phòng kỹ thuật ở TP.HCM; phỏng vấn nặng DSA và yêu cầu giải thích trade-off.\n\n*Lưu ý: trang này là Axon (Axon Enterprise). Nếu bạn nhắm Axon Active (công ty gia công gốc Thụy Sĩ), quy trình khác: ứng viên mô tả 2 vòng, vòng 1 với Technical Lead và Head of Department ([Glassdoor](https://www.glassdoor.co.in/Interview/AXON-ACTIVE-Java-Software-Developer-Interview-Questions-EI_IE1063309.0,11_KO12,35.htm)).*\n\n### Quy trình (theo báo cáo ứng viên)\n\n1. Một ứng viên ở TP.HCM mô tả 4 vòng trong 2 tuần: lọc CV, test online, nói chuyện với senior engineer, rồi onsite 4 giờ với 4 interviewer, vòng khó nhất ([Glassdoor](https://www.glassdoor.com.br/Entrevista/Axon-Entrevista-E1597674-RVW41496445.htm)).\n2. Câu hỏi được nhắc: sinh chuỗi theo bàn phím điện thoại, binary tree, hash table, thiết kế kiến trúc, dynamic programming ([Glassdoor](https://www.glassdoor.com.au/Interview/Axon-Interview-E1597674-RVW17537841.htm)); ứng viên khác gặp câu hỏi CS và system design ([Glassdoor](https://www.glassdoor.com.hk/Interview/Axon-Interview-E1597674-RVW90693581.htm)).\n3. Email trước buổi phỏng vấn có thể báo nội dung từ DSA, OOP đến API design ([Glassdoor](https://www.glassdoor.sg/Interview/Axon-Interview-E1597674-RVW95653280.htm)).\n\nVị trí ở TP.HCM làm hybrid, onsite từ thứ Ba đến thứ Sáu ([Axon Careers](https://job-boards.greenhouse.io/axon/jobs/7694598003)).\n\n### Trọng tâm\n\n- Làm đúng chưa đủ: một ứng viên TP.HCM tháng 9/2026 giải được bài nhưng bị loại vì không giải thích được trade-off và độ phức tạp ([Glassdoor](https://clear.glassdoor.nl/Interview/Axon-Interview-E1597674-RVW86305866.htm)). Luôn nói time/space complexity và phương án thay thế.\n- OOP và API design: thiết kế class, interface, REST endpoint sạch.\n- Domain bảo mật: kinh nghiệm cybersecurity ở Opswat liên quan trực tiếp.\n\n### Ưu tiên ôn\n\n- [Letter combinations (bàn phím điện thoại)](#dsa-phone-letters), [Cây nhị phân](#dsa-tree-level), [LRU cache](#dsa-lru), [Coin change (DP)](#dsa-coin-change)\n- Toàn bộ tag `#dsa` và `#coding`\n- [REST API design](#spring-8), [Design patterns và SOLID](#spring-9), [Spring Security và auth](#spring-7)\n- [Kiến trúc dự án gần nhất](#system-design-16), [Caching](#system-design-19)\n- Security (gắn với kinh nghiệm Opswat): [OWASP API](#sec-owasp-api), [OAuth/OIDC](#sec-oauth), [JWT](#sec-jwt), [mTLS](#sec-mtls), [RBAC/ABAC](#sec-rbac-abac), [Bảo vệ PII](#sec-pii), [STRIDE](#sec-stride)", "excerpt": "Công ty product (body camera, phần mềm cho lực lượng an toàn công cộng) có văn phòng kỹ thuật ở TP.HCM; phỏng vấn nặng DSA và yêu cầu giải thích trade-off. Lưu ý: trang này là Axon (Axon Enterprise). Nếu bạn nhắm Axon Ac", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "hr-screening", "title": "Tổng quan: HR screening", "cat": "hr", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Vòng này kiểm tra tiếng Anh, độ khớp với vị trí và kỳ vọng lương; trả lời ngắn, rõ, không đi sâu kỹ thuật.", "kind": "guide", "excerpt": "Vòng này kiểm tra tiếng Anh, độ khớp với vị trí và kỳ vọng lương; trả lời ngắn, rõ, không đi sâu kỹ thuật.", "catLabel": "HR & giới thiệu", "tip": "", "num": null}, {"id": "hr-screening-1", "title": "Tell me about yourself.", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"I'm a backend engineer with about five years of experience, mainly in Java and Spring Boot, plus two years of Go. I spent three years at DXC Technology building life insurance platforms for clients such as Shinhan Life, MapLife and MetLife. Then I moved to Opswat, where I worked on an endpoint management platform in the cybersecurity domain. My strengths are API design, microservices and working directly with international stakeholders. I'm now looking for a senior role where I can own larger parts of a system and mentor others.\"\n\n*Ghi chú: giữ dưới 90 giây, kết thúc bằng lý do hợp với công ty đang phỏng vấn. Với công ty product (Grab, Axon) nhấn vào ownership và quy mô; với công ty dịch vụ (EPAM, mgm) nhấn vào kinh nghiệm làm với khách hàng nước ngoài.*", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"I'm a backend engineer with about five years of experience, mainly in Java and Spring Boot, plus two years of Go. I spent three years at DXC Technology building life insurance platforms for clients such as Shinhan Life,", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-2", "title": "Why did you leave your last company?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat"], "body": "\"I left Opswat in August 2026 because \\[lý do thật, nói trung tính: muốn phạm vi lớn hơn / thay đổi tổ chức / ...\\]. I used the time since then to \\[việc đã làm: ôn system design, luyện tiếng Anh, làm side project\\]. I'm now ready to commit to a long-term role.\"\n\n*Ghi chú: không chê công ty cũ. Chuẩn bị sẵn câu giải thích khoảng trống từ tháng 8 đến nay, vì gần như chắc chắn sẽ bị hỏi.*", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"I left Opswat in August 2026 because lý do thật, nói trung tính: muốn phạm vi lớn hơn / thay đổi tổ chức / .... I used the time since then to việc đã làm: ôn system design, luyện tiếng Anh, làm side project. I'm now rea", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-3", "title": "Why do you want to join our company?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"Three reasons. First, \\[điều cụ thể về sản phẩm hoặc khách hàng của công ty\\], which matches what I want to work on. Second, my background fits: \\[kinh nghiệm liên quan nhất\\]. Third, \\[văn hóa kỹ thuật / lộ trình phát triển / quy mô hệ thống\\], which matters to me at the senior level.\"\n\n*Ghi chú theo công ty:*\n\n- *EPAM, mgm: dự án cho khách hàng toàn cầu, đa domain; bạn có 3 năm làm outsourcing cho khách hàng nước ngoài ở DXC.*\n- *Grab: hệ thống quy mô Đông Nam Á, ownership end-to-end; bạn đã dùng Go và Java ở môi trường production.*\n- *Axon: sản phẩm có sứ mệnh rõ (an toàn công cộng), domain bảo mật; bạn có kinh nghiệm nền tảng cybersecurity ở Opswat.*", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Three reasons. First, điều cụ thể về sản phẩm hoặc khách hàng của công ty, which matches what I want to work on. Second, my background fits: kinh nghiệm liên quan nhất. Third, văn hóa kỹ thuật / lộ trình phát triển / qu", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-4", "title": "What are you looking for in your next role?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"A senior backend role where I own features end to end, take part in design decisions, and help less experienced engineers. I'd like to stay hands-on with Java and cloud-native systems.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"A senior backend role where I own features end to end, take part in design decisions, and help less experienced engineers. I'd like to stay hands-on with Java and cloud-native systems.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-5", "title": "What is your experience working with international clients or teams?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"At DXC I worked on projects for Korean and international insurers. I joined requirement clarification calls, wrote technical documentation in English and handled production support with client teams. At Opswat the engineering organization was international, so English was the working language for \\[design reviews / tickets / stand-ups\\].\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"At DXC I worked on projects for Korean and international insurers. I joined requirement clarification calls, wrote technical documentation in English and handled production support with client teams. At Opswat the engin", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-6", "title": "What is your salary expectation?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"Based on my experience and the senior level of this role, I'm expecting around \\[con số hoặc khoảng của bạn\\] gross per month. I'm open to discussing the whole package.\"\n\n*Ghi chú: tra mức lương thị trường trước và nêu một khoảng, cận dưới là mức bạn chấp nhận được.*", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Based on my experience and the senior level of this role, I'm expecting around con số hoặc khoảng của bạn gross per month. I'm open to discussing the whole package.\" Ghi chú: tra mức lương thị trường trước và nêu một kh", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-7", "title": "When can you start? Are you interviewing elsewhere?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"I can start \\[ngay / trong vòng X tuần\\]. I'm in discussions with a few other companies, but this role is one of my top choices because of \\[lý do cụ thể\\].\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"I can start ngay / trong vòng X tuần. I'm in discussions with a few other companies, but this role is one of my top choices because of lý do cụ thể.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-8", "title": "Are you open to working on a project chosen after you join, or in a different time zone?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"Yes. I'm flexible about the domain. For time zones, I can overlap with \\[EU/US\\] hours for meetings as long as it's planned. I'd like to know the expected overlap for the project.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Yes. I'm flexible about the domain. For time zones, I can overlap with EU/US hours for meetings as long as it's planned. I'd like to know the expected overlap for the project.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-9", "title": "What is your strongest technology, and your weakest?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "kubernetes", "docker"], "body": "\"My strongest area is Java with Spring Boot and relational databases. An area I'm actively improving is CI/CD: I've used pipelines daily, and recently I built a full pipeline myself with GitHub Actions, Docker and Kubernetes to understand each stage.\"\n\n*Ghi chú: chỉ nói câu cuối sau khi bạn đã thực sự dựng pipeline đó.*", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"My strongest area is Java with Spring Boot and relational databases. An area I'm actively improving is CI/CD: I've used pipelines daily, and recently I built a full pipeline myself with GitHub Actions, Docker and Kubern", "catLabel": "HR & giới thiệu"}, {"id": "technical-java-core-jvm-concurrency", "title": "Tổng quan: Technical: Java core, JVM, concurrency", "cat": "java", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Đây là nhóm câu hỏi xuất hiện nhiều nhất; người hỏi thường đi từ định nghĩa sang \"bên trong hoạt động thế nào\" và \"bạn đã gặp ở đâu\".", "kind": "guide", "excerpt": "Đây là nhóm câu hỏi xuất hiện nhiều nhất; người hỏi thường đi từ định nghĩa sang \"bên trong hoạt động thế nào\" và \"bạn đã gặp ở đâu\".", "catLabel": "Java & JVM", "tip": "", "num": null}, {"id": "java-core-1", "title": "HashMap hoạt động bên trong thế nào? / How does HashMap work internally?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\n**Cấu trúc:** HashMap là một mảng các \"bucket\" (`Node<K,V>[] table`). Mỗi bucket chứa một danh sách liên kết, hoặc một cây đỏ-đen khi bucket quá đông.\n\n**Khi `put(key, value)`:**\n\n1. Tính `hash = key.hashCode() ^ (h >>> 16)`: XOR 16 bit cao xuống 16 bit thấp, để các key chỉ khác nhau ở bit cao vẫn rơi vào bucket khác nhau.\n2. Tính chỉ số bucket: `index = (n - 1) & hash`, với `n` là kích thước mảng, luôn là lũy thừa của 2. Phép `&` này tương đương `% n` nhưng nhanh hơn.\n3. Nếu bucket trống: tạo node mới.\n4. Nếu bucket có sẵn phần tử: duyệt, so `hash` trước rồi mới gọi `equals`. Trùng key thì ghi đè value; không trùng thì thêm node vào cuối.\n5. **Treeify:** khi một bucket có **từ 8 node** và mảng có **ít nhất 64 bucket**, danh sách chuyển thành cây đỏ-đen, nên trường hợp xấu nhất là O(log n) thay vì O(n). Nếu mảng chưa đủ 64, HashMap resize thay vì treeify. Khi bucket giảm còn 6 node thì cây quay lại thành danh sách.\n6. **Resize:** khi `size > capacity × loadFactor` (mặc định 16 × 0.75 = 12), mảng tăng gấp đôi. Nhờ kích thước là lũy thừa của 2, mỗi node chỉ ở lại vị trí cũ hoặc dời đi đúng `oldCapacity`, không cần tính lại hash.\n\n**`get(key)`:** tính hash, tìm bucket, so `hash` rồi `equals`. Trung bình O(1).\n\n**Lưu ý hay bị hỏi:**\n- Cho phép **một key `null`** (luôn nằm ở bucket 0) và nhiều value `null`.\n- **Không thread-safe:** ghi đồng thời có thể làm mất dữ liệu. Ở Java 7, resize đồng thời còn có thể tạo vòng lặp vô hạn.\n- Key nên **immutable**: nếu đổi field dùng trong `hashCode` sau khi `put`, sẽ không bao giờ tìm lại được entry đó.\n- Biết trước số phần tử thì khởi tạo sẵn capacity để tránh resize nhiều lần: `new HashMap<>(expected / 0.75f + 1)`, hoặc `HashMap.newHashMap(expected)` từ Java 19.\n\n### English\n\n**Structure:** a HashMap is an array of \"buckets\" (`Node<K,V>[] table`). Each bucket holds a linked list, or a red-black tree when the bucket gets crowded.\n\n**On `put(key, value)`:**\n\n1. Compute `hash = key.hashCode() ^ (h >>> 16)`: XOR the high 16 bits into the low 16 bits, so keys that differ only in their high bits still land in different buckets.\n2. Compute the bucket index: `index = (n - 1) & hash`, where `n` is the table size, always a power of two. This `&` is equivalent to `% n` but faster.\n3. If the bucket is empty: create a new node.\n4. If the bucket already has entries: walk it, comparing `hash` first and only then calling `equals`. An equal key overwrites the value; otherwise a node is appended at the end.\n5. **Treeify:** when one bucket reaches **8 nodes** and the table has **at least 64 buckets**, the list becomes a red-black tree, so the worst case is O(log n) instead of O(n). If the table is smaller than 64, HashMap resizes instead of treeifying. When a bucket shrinks to 6 nodes, the tree turns back into a list.\n6. **Resize:** when `size > capacity × loadFactor` (by default 16 × 0.75 = 12), the table doubles. Because sizes are powers of two, each node either stays at its old index or moves by exactly `oldCapacity`, so hashes don't need to be recomputed.\n\n**`get(key)`:** compute the hash, find the bucket, compare `hash` and then `equals`. O(1) on average.\n\n**Points interviewers often follow up on:**\n- It allows **one `null` key** (always stored in bucket 0) and any number of `null` values.\n- **Not thread-safe:** concurrent writes can lose data. In Java 7, concurrent resizing could even create an infinite loop.\n- Keys should be **immutable**: if you change a field used in `hashCode` after `put`, that entry can never be found again.\n- If you know the expected number of entries, pre-size the map to avoid repeated resizing: `new HashMap<>(expected / 0.75f + 1)`, or `HashMap.newHashMap(expected)` since Java 19.", "kind": "qa", "num": 1, "tip": "", "excerpt": "Cấu trúc: HashMap là một mảng các \"bucket\" (Node<K,V table). Mỗi bucket chứa một danh sách liên kết, hoặc một cây đỏ-đen khi bucket quá đông. Khi put(key, value): Tính hash = key.hashCode() ^ (h 16): XOR 16 bit cao xuống", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-core-2", "title": "HashMap, ConcurrentHashMap và synchronizedMap khác nhau thế nào? / HashMap vs ConcurrentHashMap vs Collections.synchronizedMap?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\n| | HashMap | Collections.synchronizedMap | ConcurrentHashMap |\n|---|---|---|---|\n| Thread-safe | Không | Có | Có |\n| Cách khóa | Không khóa | Một khóa cho **cả map** | CAS và khóa **từng bucket** |\n| Đọc | Không khóa | Có khóa | **Không khóa** (đọc biến `volatile`) |\n| `null` key/value | Cho phép | Cho phép | **Không cho phép** |\n| Iterator | Fail-fast (`ConcurrentModificationException`) | Fail-fast, phải tự `synchronized` khi duyệt | **Weakly consistent**, không ném lỗi |\n\n**ConcurrentHashMap từ Java 8 hoạt động thế nào:**\n- Bucket trống: chèn bằng **CAS** (compare-and-swap), không cần khóa.\n- Bucket đã có phần tử: `synchronized` trên **node đầu tiên của bucket đó**. Hai thread ghi vào hai bucket khác nhau không chặn nhau.\n- Đọc hoàn toàn không khóa.\n- Resize được nhiều thread cùng giúp chuyển dữ liệu.\n- (Java 7 dùng \"segment\", mặc định 16 segment khóa riêng. Java 8 bỏ cách này.)\n\n**Vì sao không cho `null`:** trong môi trường đa luồng, `get(key) == null` sẽ không phân biệt được \"không có key\" với \"value là null\", vì giữa `containsKey` và `get` có thể có thread khác thay đổi map.\n\n**Bẫy hay gặp: thao tác ghép không atomic.**\n\n```java\n// SAI: hai thread có thể cùng đọc ra null rồi cùng put\nif (!map.containsKey(k)) map.put(k, 1);\n// SAI: đọc rồi ghi, mất cập nhật\nmap.put(k, map.get(k) + 1);\n\n// ĐÚNG: atomic\nmap.putIfAbsent(k, 1);\nmap.merge(k, 1, Integer::sum);\nmap.computeIfAbsent(k, x -> new ArrayList<>()).add(v);\n```\n\n**Khi nào dùng:** gần như luôn chọn ConcurrentHashMap khi cần map dùng chung giữa nhiều thread, ví dụ cache trong bộ nhớ. `synchronizedMap` chỉ hợp khi cần bọc nhanh một map có sẵn và tải thấp.\n\n### English\n\n| | HashMap | Collections.synchronizedMap | ConcurrentHashMap |\n|---|---|---|---|\n| Thread-safe | No | Yes | Yes |\n| Locking | None | One lock for the **whole map** | CAS plus a lock **per bucket** |\n| Reads | No lock | Locked | **Lock-free** (reads `volatile` fields) |\n| `null` key/value | Allowed | Allowed | **Not allowed** |\n| Iterator | Fail-fast (`ConcurrentModificationException`) | Fail-fast; you must `synchronized` on the map while iterating | **Weakly consistent**, never throws |\n\n**How ConcurrentHashMap works since Java 8:**\n- Empty bucket: insert with **CAS** (compare-and-swap), no lock needed.\n- Non-empty bucket: `synchronized` on **the first node of that bucket only**. Two threads writing to different buckets don't block each other.\n- Reads take no lock at all.\n- Resizing is helped along by several threads moving entries in parallel.\n- (Java 7 used \"segments\", 16 independently locked segments by default. Java 8 dropped that design.)\n\n**Why nulls aren't allowed:** in a concurrent map, `get(key) == null` couldn't distinguish \"key absent\" from \"value is null\", because another thread can change the map between a `containsKey` call and a `get` call.\n\n**The common bug: compound operations aren't atomic.**\n\n```java\n// WRONG: two threads can both see \"absent\" and both put\nif (!map.containsKey(k)) map.put(k, 1);\n// WRONG: read then write, updates get lost\nmap.put(k, map.get(k) + 1);\n\n// RIGHT: atomic\nmap.putIfAbsent(k, 1);\nmap.merge(k, 1, Integer::sum);\nmap.computeIfAbsent(k, x -> new ArrayList<>()).add(v);\n```\n\n**When to use which:** almost always ConcurrentHashMap when a map is shared between threads, for example an in-memory cache. `synchronizedMap` only makes sense for quickly wrapping an existing map under low load.", "kind": "qa", "num": 2, "tip": "", "excerpt": "ConcurrentHashMap từ Java 8 hoạt động thế nào: Bucket trống: chèn bằng CAS (compare-and-swap), không cần khóa. Bucket đã có phần tử: synchronized trên node đầu tiên của bucket đó. Hai thread ghi vào hai bucket khác nhau ", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-core-3", "title": "Quan hệ giữa equals() và hashCode() là gì? / What is the contract between equals() and hashCode()?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\n**Hợp đồng (contract):**\n1. Hai object `equals` nhau thì **bắt buộc** `hashCode` bằng nhau.\n2. `hashCode` bằng nhau thì **chưa chắc** `equals` (đó là collision, chấp nhận được).\n3. `equals` phải có tính phản xạ, đối xứng, bắc cầu, nhất quán, và `x.equals(null)` trả về `false`.\n\n**Nếu override `equals` mà quên `hashCode`:**\n\n```java\nclass User {\n    String email;\n    @Override public boolean equals(Object o) {\n        return o instanceof User u && email.equals(u.email);\n    }\n    // quên hashCode → dùng hashCode mặc định của Object (khác nhau với mỗi object)\n}\n\nSet<User> set = new HashSet<>();\nset.add(new User(\"a@x.com\"));\nset.contains(new User(\"a@x.com\")); // false! hash khác → tìm sai bucket\n```\n\nHai object \"bằng nhau\" nhưng nằm ở hai bucket khác nhau, nên `HashSet` không lọc được trùng và `HashMap.get` trả về `null`.\n\n**Bẫy thứ hai: key bị thay đổi sau khi đưa vào map.** Nếu sửa field dùng trong `hashCode` sau khi `put`, entry vẫn nằm ở bucket cũ, nên không bao giờ tìm lại được. Vì vậy key nên immutable, ví dụ `String`, `Integer` hoặc `record`.\n\n**Cách viết đúng trong thực tế:**\n- Dùng **`record`** (Java 16+): tự sinh `equals`, `hashCode`, `toString` theo mọi field, và bất biến.\n- Hoặc dùng `Objects.equals(...)` và `Objects.hash(field1, field2)`, hay để IDE hoặc Lombok `@EqualsAndHashCode` sinh ra.\n- **Với JPA entity:** không dùng id tự sinh trong `hashCode`, vì id là `null` trước khi persist rồi mới có giá trị, làm hash thay đổi. Hãy dùng business key, hoặc trả về một hằng số cho `hashCode`.\n\n### English\n\n**The contract:**\n1. If two objects are `equals`, their `hashCode` **must** be equal.\n2. Equal hash codes **don't** imply `equals` (that's a collision, which is acceptable).\n3. `equals` must be reflexive, symmetric, transitive and consistent, and `x.equals(null)` must return `false`.\n\n**If you override `equals` but forget `hashCode`:**\n\n```java\nclass User {\n    String email;\n    @Override public boolean equals(Object o) {\n        return o instanceof User u && email.equals(u.email);\n    }\n    // forgot hashCode → Object's default hashCode (different for every object)\n}\n\nSet<User> set = new HashSet<>();\nset.add(new User(\"a@x.com\"));\nset.contains(new User(\"a@x.com\")); // false! different hash → wrong bucket\n```\n\nTwo \"equal\" objects end up in two different buckets, so a `HashSet` fails to remove duplicates and `HashMap.get` returns `null`.\n\n**The second trap: mutating a key after it's in the map.** If you change a field used in `hashCode` after `put`, the entry stays in the old bucket and can never be found again. That's why keys should be immutable, such as `String`, `Integer` or a `record`.\n\n**How to write it correctly in practice:**\n- Use a **`record`** (Java 16+): it generates `equals`, `hashCode` and `toString` from all fields, and it's immutable.\n- Or use `Objects.equals(...)` and `Objects.hash(field1, field2)`, or let the IDE or Lombok `@EqualsAndHashCode` generate them.\n- **For JPA entities:** don't use the generated ID in `hashCode`, because the ID is `null` before persist and only gets a value afterwards, which changes the hash. Use a business key, or return a constant from `hashCode`.", "kind": "qa", "num": 3, "tip": "", "excerpt": "Hợp đồng (contract): Hai object equals nhau thì bắt buộc hashCode bằng nhau. hashCode bằng nhau thì chưa chắc equals (đó là collision, chấp nhận được). equals phải có tính phản xạ, đối xứng, bắc cầu, nhất quán, và x.equa", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-core-4", "title": "Vì sao String là immutable? / Why is String immutable?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\nString bất biến: mọi phương thức \"sửa\" như `concat`, `replace`, `toUpperCase` đều tạo object mới, object cũ giữ nguyên. Có 4 lý do chính:\n\n1. **String pool:** nhiều biến cùng trỏ tới một literal `\"hello\"`. Nếu String sửa được, đổi qua một biến sẽ làm hỏng tất cả biến còn lại. Bất biến giúp chia sẻ an toàn và tiết kiệm bộ nhớ.\n2. **Bảo mật:** String được dùng làm tên class khi class loading, đường dẫn file, URL, connection string. Nếu bị sửa sau khi đã kiểm tra quyền, kẻ tấn công có thể đổi `/safe/file` thành `/etc/passwd` giữa lúc kiểm tra và lúc dùng.\n3. **Thread-safe miễn phí:** chia sẻ giữa các thread không cần đồng bộ.\n4. **Cache được `hashCode`:** hash tính một lần rồi lưu trong field `hash`, nên String là key rất nhanh trong HashMap. Nếu String sửa được, hash sẽ sai.\n\n**Hệ quả về hiệu năng:**\n\n```java\n// Chậm: mỗi vòng tạo String mới, O(n²) ký tự được copy\nString s = \"\";\nfor (int i = 0; i < 10_000; i++) s += i;\n\n// Nhanh: một buffer sửa được\nStringBuilder sb = new StringBuilder();\nfor (int i = 0; i < 10_000; i++) sb.append(i);\nString result = sb.toString();\n```\n\n- `StringBuilder`: sửa được, không đồng bộ, **dùng mặc định**.\n- `StringBuffer`: sửa được, có `synchronized`, hiếm khi cần.\n- Nối chuỗi đơn giản trên một dòng (`a + b + c`) thì compiler tự tối ưu, không cần StringBuilder.\n\n**Câu hỏi phụ:** *\"Vì sao mật khẩu nên lưu trong `char[]` thay vì `String`?\"* Vì String bất biến, không xóa được khỏi bộ nhớ và có thể nằm trong pool tới khi GC dọn. `char[]` thì ghi đè bằng 0 ngay sau khi dùng được.\n\n### English\n\nString is immutable: every \"modifying\" method such as `concat`, `replace` or `toUpperCase` returns a new object and leaves the original unchanged. There are four main reasons:\n\n1. **The string pool:** many variables can point to the same literal `\"hello\"`. If strings were mutable, changing it through one variable would corrupt all the others. Immutability makes sharing safe and saves memory.\n2. **Security:** strings are used for class names during class loading, file paths, URLs and connection strings. If they could be changed after a permission check, an attacker could swap `/safe/file` for `/etc/passwd` between the check and the use.\n3. **Thread safety for free:** they can be shared between threads without synchronization.\n4. **Cached `hashCode`:** the hash is computed once and stored in the `hash` field, which makes String a very fast HashMap key. If strings were mutable, that cached hash would become wrong.\n\n**Performance consequence:**\n\n```java\n// Slow: every iteration creates a new String, O(n²) characters copied\nString s = \"\";\nfor (int i = 0; i < 10_000; i++) s += i;\n\n// Fast: one mutable buffer\nStringBuilder sb = new StringBuilder();\nfor (int i = 0; i < 10_000; i++) sb.append(i);\nString result = sb.toString();\n```\n\n- `StringBuilder`: mutable, not synchronized, **the default choice**.\n- `StringBuffer`: mutable, `synchronized`, rarely needed.\n- Simple concatenation on one line (`a + b + c`) is optimized by the compiler, so it doesn't need a StringBuilder.\n\n**Follow-up question:** *\"Why should passwords be kept in a `char[]` rather than a `String`?\"* Because a String is immutable, it can't be wiped from memory and may stay there until the GC collects it. A `char[]` can be overwritten with zeros right after use.", "kind": "qa", "num": 4, "tip": "", "excerpt": "String bất biến: mọi phương thức \"sửa\" như concat, replace, toUpperCase đều tạo object mới, object cũ giữ nguyên. Có 4 lý do chính: String pool: nhiều biến cùng trỏ tới một literal \"hello\". Nếu String sửa được, đổi qua m", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-core-5", "title": "ArrayList và LinkedList khác nhau thế nào? StringBuilder và StringBuffer? / ArrayList vs LinkedList? StringBuilder vs StringBuffer?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\n| Thao tác | ArrayList (mảng động) | LinkedList (danh sách liên kết đôi) |\n|---|---|---|\n| `get(i)` | **O(1)** | O(n), phải duyệt |\n| `add(e)` vào cuối | O(1) trung bình (thỉnh thoảng phải mở rộng mảng) | O(1) |\n| Chèn hoặc xóa ở giữa | O(n), phải dời phần tử | O(1) **nếu đã có node**, nhưng tìm tới node mất O(n) |\n| Bộ nhớ | Gọn, các phần tử liền nhau | Mỗi phần tử tốn thêm 2 con trỏ (prev, next) và header của node |\n| Cache CPU | **Rất tốt** | Kém, node nằm rải rác trong heap |\n\n**Kết luận thực tế:** gần như **luôn dùng ArrayList**. Thế mạnh \"chèn O(1)\" của LinkedList chỉ có khi đã cầm sẵn iterator ở đúng vị trí. Trong đa số trường hợp, chi phí tìm vị trí và việc cache CPU kém làm LinkedList chậm hơn, kể cả với thao tác chèn.\n- Cần queue hoặc stack: dùng **`ArrayDeque`**, nhanh hơn cả LinkedList lẫn class `Stack` cũ.\n- ArrayList khi mở rộng tăng khoảng 1,5 lần (`old + old >> 1`). Biết trước kích thước thì dùng `new ArrayList<>(n)`.\n\n**StringBuilder và StringBuffer:** cả hai đều là chuỗi sửa được. `StringBuffer` có `synchronized` trên mọi phương thức nên chậm hơn. Mặc định dùng `StringBuilder`, vì thường chỉ một thread dựng chuỗi.\n\n### English\n\n| Operation | ArrayList (dynamic array) | LinkedList (doubly linked list) |\n|---|---|---|\n| `get(i)` | **O(1)** | O(n), must traverse |\n| `add(e)` at the end | O(1) amortized (occasionally grows the array) | O(1) |\n| Insert or remove in the middle | O(n), elements shift | O(1) **if you already hold the node**, but reaching it is O(n) |\n| Memory | Compact, elements are contiguous | Each element costs 2 extra pointers (prev, next) plus a node header |\n| CPU cache | **Very good** | Poor, nodes are scattered across the heap |\n\n**Practical conclusion:** almost **always use ArrayList**. LinkedList's \"O(1) insert\" only helps when you already hold an iterator at the right position. In most cases, the cost of finding the position and the poor cache behavior make LinkedList slower, even for inserts.\n- For a queue or stack: use **`ArrayDeque`**, which is faster than both LinkedList and the legacy `Stack` class.\n- ArrayList grows by about 1.5 times (`old + old >> 1`). If you know the size, use `new ArrayList<>(n)`.\n\n**StringBuilder vs StringBuffer:** both are mutable character sequences. `StringBuffer` has `synchronized` on every method, so it's slower. Default to `StringBuilder`, since a string is usually built by a single thread.", "kind": "qa", "num": 5, "tip": "", "excerpt": "Kết luận thực tế: gần như luôn dùng ArrayList. Thế mạnh \"chèn O(1)\" của LinkedList chỉ có khi đã cầm sẵn iterator ở đúng vị trí. Trong đa số trường hợp, chi phí tìm vị trí và việc cache CPU kém làm LinkedList chậm hơn, k", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-core-6", "title": "Checked và unchecked exception khác nhau thế nào? Bạn thiết kế xử lý lỗi trong service ra sao? / Checked vs unchecked exceptions, and how do you design error handling in a service?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "### Tiếng Việt\n\n**Cây kế thừa:**\n\n```\nThrowable\n├── Error                      ← lỗi JVM, không nên bắt: OutOfMemoryError, StackOverflowError\n└── Exception\n    ├── IOException, SQLException...   ← checked\n    └── RuntimeException               ← unchecked\n        ├── NullPointerException\n        ├── IllegalArgumentException\n        └── ...\n```\n\n- **Checked:** compiler bắt buộc phải `catch` hoặc khai báo `throws`. Dùng cho lỗi có thể **lường trước và phục hồi được**, ví dụ file không tồn tại hay mạng lỗi.\n- **Unchecked** (`RuntimeException`): không bắt buộc xử lý. Thường do **lỗi lập trình** (null, sai tham số) hoặc lỗi nghiệp vụ mà tầng gọi không xử lý gì khác được.\n- Có thể tự tạo checked exception bằng cách `extends Exception`, hoặc unchecked bằng `extends RuntimeException`.\n\n**Cách thiết kế trong một Spring service:**\n\n1. Tạo exception nghiệp vụ **unchecked**, mang mã lỗi: `OrderNotFoundException extends BusinessException`, trong đó `BusinessException` chứa `errorCode`.\n2. Xử lý tập trung một chỗ bằng `@RestControllerAdvice`:\n\n```java\n@RestControllerAdvice\nclass GlobalHandler {\n    @ExceptionHandler(OrderNotFoundException.class)\n    ResponseEntity<ErrorResponse> notFound(OrderNotFoundException e) {\n        return ResponseEntity.status(404).body(new ErrorResponse(\"ORDER_NOT_FOUND\", e.getMessage()));\n    }\n    @ExceptionHandler(Exception.class)\n    ResponseEntity<ErrorResponse> unexpected(Exception e) {\n        log.error(\"Unexpected error\", e);           // log một lần, kèm stack trace\n        return ResponseEntity.status(500).body(new ErrorResponse(\"INTERNAL_ERROR\", \"Something went wrong\"));\n    }\n}\n```\n\n3. **Không** nuốt exception (`catch (Exception e) {}`), **không** log rồi lại ném lên (bị log trùng), **không** dùng exception cho luồng logic bình thường.\n4. Khi bọc exception, giữ nguyên nguyên nhân gốc: `throw new PaymentException(\"...\", e)`.\n5. Không trả stack trace hay chi tiết SQL ra cho client.\n\n**Vì sao Spring và nhiều framework hiện đại ưa unchecked:** checked exception làm chữ ký phương thức bị \"lây\" `throws` qua nhiều tầng, và không dùng được trong lambda hay stream.\n\n### English\n\n**The hierarchy:**\n\n```\nThrowable\n├── Error                      ← JVM problems, don't catch: OutOfMemoryError, StackOverflowError\n└── Exception\n    ├── IOException, SQLException...   ← checked\n    └── RuntimeException               ← unchecked\n        ├── NullPointerException\n        ├── IllegalArgumentException\n        └── ...\n```\n\n- **Checked:** the compiler forces you to `catch` it or declare `throws`. Used for errors that are **expected and recoverable**, such as a missing file or a network failure.\n- **Unchecked** (`RuntimeException`): handling isn't enforced. Usually caused by **programming errors** (null, invalid arguments) or business failures the caller can't do anything else about.\n- You create your own checked exception by extending `Exception`, or an unchecked one by extending `RuntimeException`.\n\n**How I design error handling in a Spring service:**\n\n1. Create **unchecked** domain exceptions that carry an error code: `OrderNotFoundException extends BusinessException`, where `BusinessException` holds an `errorCode`.\n2. Handle them centrally in one place with `@RestControllerAdvice`:\n\n```java\n@RestControllerAdvice\nclass GlobalHandler {\n    @ExceptionHandler(OrderNotFoundException.class)\n    ResponseEntity<ErrorResponse> notFound(OrderNotFoundException e) {\n        return ResponseEntity.status(404).body(new ErrorResponse(\"ORDER_NOT_FOUND\", e.getMessage()));\n    }\n    @ExceptionHandler(Exception.class)\n    ResponseEntity<ErrorResponse> unexpected(Exception e) {\n        log.error(\"Unexpected error\", e);           // log once, with the stack trace\n        return ResponseEntity.status(500).body(new ErrorResponse(\"INTERNAL_ERROR\", \"Something went wrong\"));\n    }\n}\n```\n\n3. **Don't** swallow exceptions (`catch (Exception e) {}`), **don't** log and then rethrow (it gets logged twice), and **don't** use exceptions for normal control flow.\n4. When wrapping an exception, keep the root cause: `throw new PaymentException(\"...\", e)`.\n5. Never return stack traces or SQL details to the client.\n\n**Why Spring and many modern frameworks prefer unchecked exceptions:** checked exceptions spread `throws` clauses through every layer of method signatures, and they don't work inside lambdas and streams.", "kind": "qa", "num": 6, "tip": "", "excerpt": "Cây kế thừa: Checked: compiler bắt buộc phải catch hoặc khai báo throws. Dùng cho lỗi có thể lường trước và phục hồi được, ví dụ file không tồn tại hay mạng lỗi. Unchecked (RuntimeException): không bắt buộc xử lý. Thường", "catLabel": "Java & JVM", "bilingual": true}, {"id": "java-modern-7", "title": "Explain the Stream API. What is the difference between map and flatMap?", "cat": "java", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"A stream is a lazy pipeline: intermediate operations such as `filter` and `map` only run when a terminal operation such as `collect` is called. `map` transforms each element one to one; `flatMap` maps each element to a stream and flattens the results. I avoid parallel streams for I/O or small collections, because they share the common ForkJoinPool and the overhead often outweighs the gain.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"A stream is a lazy pipeline: intermediate operations such as filter and map only run when a terminal operation such as collect is called. map transforms each element one to one; flatMap maps each element to a stream and", "catLabel": "Java & JVM"}, {"id": "java-modern-9", "title": "What is Optional for, and how is it misused?", "cat": "java", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"It's a return type that makes 'no result' explicit. Misuses are calling `get()` without checking, using it for fields or method parameters, and wrapping collections, where an empty collection is better. I prefer `map`, `orElseGet` and `orElseThrow`.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"It's a return type that makes 'no result' explicit. Misuses are calling get() without checking, using it for fields or method parameters, and wrapping collections, where an empty collection is better. I prefer map, orEl", "catLabel": "Java & JVM"}, {"id": "jvm-10", "title": "Describe the JVM memory areas.", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"The heap holds objects and is split into a young generation, with Eden and survivor spaces, and an old generation. Metaspace holds class metadata in native memory. Each thread has its own stack for frames and local variables. There is also the code cache for JIT-compiled code. `StackOverflowError` comes from deep recursion; `OutOfMemoryError` can come from heap, metaspace or direct memory.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"The heap holds objects and is split into a young generation, with Eden and survivor spaces, and an old generation. Metaspace holds class metadata in native memory. Each thread has its own stack for frames and local vari", "catLabel": "Java & JVM"}, {"id": "jvm-11", "title": "Which garbage collectors do you know, and how do you choose?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"G1 is the default: region-based, aims for a pause-time target, good for most services. ZGC does almost all work concurrently, with pauses typically under a millisecond even on large heaps, and has been generational since Java 21; I'd pick it for latency-sensitive services. Parallel GC maximizes throughput for batch jobs. I start with the default, set heap size, enable GC logs, and tune only after measuring.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"G1 is the default: region-based, aims for a pause-time target, good for most services. ZGC does almost all work concurrently, with pauses typically under a millisecond even on large heaps, and has been generational sinc", "catLabel": "Java & JVM"}, {"id": "jvm-12", "title": "How do you find a memory leak?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm", "opswat", "dxc"], "body": "\"I confirm it first: old generation usage keeps growing after full GCs. Then I take a heap dump, with `jcmd` or `-XX:+HeapDumpOnOutOfMemoryError`, and open it in Eclipse MAT to look at the dominator tree and the path to GC roots. Typical causes are static or unbounded caches, `ThreadLocal` values in pooled threads, listeners never removed, and unclosed resources. At \\[Opswat/DXC\\] I found \\[sự cố thật nếu có\\].\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"I confirm it first: old generation usage keeps growing after full GCs. Then I take a heap dump, with jcmd or -XX:+HeapDumpOnOutOfMemoryError, and open it in Eclipse MAT to look at the dominator tree and the path to GC r", "catLabel": "Java & JVM"}, {"id": "jvm-13", "title": "How do class loaders work?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"There are three built-in loaders: bootstrap, platform and application. They follow parent delegation: a loader asks its parent first and loads the class itself only if the parent can't, which prevents core classes from being replaced. A class is identified by its name plus its loader, which is why the same class loaded twice causes `ClassCastException` in app servers.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"There are three built-in loaders: bootstrap, platform and application. They follow parent delegation: a loader asks its parent first and loads the class itself only if the parent can't, which prevents core classes from ", "catLabel": "Java & JVM"}, {"id": "concurrency-14", "title": "volatile vs synchronized vs Atomic classes?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"`volatile` guarantees visibility and ordering for a single variable but not atomicity of compound actions such as `count++`. `synchronized` gives mutual exclusion and visibility. Atomic classes use CAS for lock-free atomic updates of one variable; `LongAdder` is better under high contention. For anything involving several variables I use a lock or an immutable snapshot.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"volatile guarantees visibility and ordering for a single variable but not atomicity of compound actions such as count++. synchronized gives mutual exclusion and visibility. Atomic classes use CAS for lock-free atomic up", "catLabel": "Java & JVM"}, {"id": "concurrency-15", "title": "How does ThreadPoolExecutor decide when to create threads?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"It creates threads up to the core size, then puts tasks in the queue, and only when the queue is full creates threads up to the maximum. After that the rejection policy applies. So with an unbounded queue the maximum size is never used and memory can grow without limit. I size bounded queues deliberately, use `CallerRunsPolicy` for back-pressure, and keep separate pools for CPU-bound and blocking work.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"It creates threads up to the core size, then puts tasks in the queue, and only when the queue is full creates threads up to the maximum. After that the rejection policy applies. So with an unbounded queue the maximum si", "catLabel": "Java & JVM"}, {"id": "concurrency-16", "title": "What are virtual threads and when would you use them?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"They're lightweight threads scheduled by the JVM onto a small set of carrier threads. When a virtual thread blocks on I/O it unmounts, so the carrier is free. That makes thread-per-request code scale to many thousands of concurrent blocking calls. They don't help CPU-bound work, they shouldn't be pooled, and concurrency to a limited resource should be capped with a semaphore. Before JDK 24, blocking inside `synchronized` pinned the carrier thread.\"", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"They're lightweight threads scheduled by the JVM onto a small set of carrier threads. When a virtual thread blocks on I/O it unmounts, so the carrier is free. That makes thread-per-request code scale to many thousands o", "catLabel": "Java & JVM"}, {"id": "concurrency-17", "title": "What is a deadlock and how do you prevent and diagnose it?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"Two or more threads each hold a lock the other needs. I prevent it by acquiring locks in a fixed global order, keeping critical sections small, using `tryLock` with a timeout, and preferring concurrent collections or message passing. To diagnose I take a thread dump with `jstack` or `jcmd Thread.print`, which reports the deadlock cycle.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Two or more threads each hold a lock the other needs. I prevent it by acquiring locks in a fixed global order, keeping critical sections small, using tryLock with a timeout, and preferring concurrent collections or mess", "catLabel": "Java & JVM"}, {"id": "concurrency-18", "title": "How do you run several remote calls in parallel and combine the results?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"With `CompletableFuture.supplyAsync` on a dedicated executor, then `thenCombine` or `allOf`, with `orTimeout` and `exceptionally` for failures. I never use the common pool for blocking calls. On Java 21, starting one virtual thread per call is simpler and reads like sequential code.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"With CompletableFuture.supplyAsync on a dedicated executor, then thenCombine or allOf, with orTimeout and exceptionally for failures. I never use the common pool for blocking calls. On Java 21, starting one virtual thre", "catLabel": "Java & JVM"}, {"id": "jc-abstraction-encapsulation", "title": "Abstraction và encapsulation khác nhau thế nào? Có encapsulation mà không có abstraction được không? / Abstraction vs encapsulation: can you have encapsulation without abstraction?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "oop", "epam"], "body": "### Tiếng Việt\n\n| | Abstraction (trừu tượng hóa) | Encapsulation (đóng gói) |\n|---|---|---|\n| Trả lời câu hỏi | Object **làm được gì**? | Dữ liệu được **bảo vệ** thế nào? |\n| Mục đích | Ẩn **chi tiết cài đặt**, chỉ lộ ra hợp đồng | Ẩn **trạng thái**, chỉ cho sửa qua phương thức hợp lệ |\n| Công cụ | `interface`, `abstract class` | `private` field, getter/setter có kiểm tra, immutable |\n| Ví dụ | `PaymentGateway.charge()`, không cần biết bên dưới là VNPay hay Stripe | `BankAccount` có `private balance`, chỉ đổi qua `withdraw()` có kiểm tra số dư |\n\n```java\n// Abstraction: người gọi chỉ biết hợp đồng\ninterface PaymentGateway { Receipt charge(Money amount); }\n\n// Encapsulation: bảo vệ bất biến \"số dư không âm\"\nclass BankAccount {\n    private long balance;                       // không ai sửa trực tiếp được\n    void withdraw(long amount) {\n        if (amount > balance) throw new InsufficientFundsException();\n        balance -= amount;\n    }\n    long balance() { return balance; }\n}\n```\n\n**Có encapsulation mà không có abstraction không?** **Có.** Một class chỉ có field `private` cùng getter và setter \"trần\" là có đóng gói (về hình thức), nhưng không trừu tượng hóa gì cả: người gọi vẫn phải biết và phụ thuộc vào từng field. Loại class này thường gọi là \"anemic model\".\n\n**Ngược lại**, có abstraction mà encapsulation kém cũng được: một interface đẹp nhưng bên trong để field `public`.\n\n**Thiết kế tốt dùng cả hai:** interface nhỏ, rõ ràng (abstraction), còn trạng thái bên trong chỉ class đó được sửa và luôn giữ hợp lệ (encapsulation).\n\n### English\n\n| | Abstraction | Encapsulation |\n|---|---|---|\n| Answers the question | **What can** the object do? | How is the data **protected**? |\n| Purpose | Hide **implementation details**, expose only a contract | Hide **state**, allow changes only through valid methods |\n| Tools | `interface`, `abstract class` | `private` fields, validating getters/setters, immutability |\n| Example | `PaymentGateway.charge()`: the caller doesn't need to know whether VNPay or Stripe is behind it | `BankAccount` with a `private balance`, changed only through `withdraw()`, which checks the balance |\n\n```java\n// Abstraction: the caller only knows the contract\ninterface PaymentGateway { Receipt charge(Money amount); }\n\n// Encapsulation: protects the invariant \"balance is never negative\"\nclass BankAccount {\n    private long balance;                       // nobody can change it directly\n    void withdraw(long amount) {\n        if (amount > balance) throw new InsufficientFundsException();\n        balance -= amount;\n    }\n    long balance() { return balance; }\n}\n```\n\n**Can you have encapsulation without abstraction?** **Yes.** A class with only `private` fields and plain getters and setters is encapsulated (in form), but it abstracts nothing: callers still have to know and depend on every field. Such classes are often called an \"anemic model\".\n\n**The reverse** is also possible: a clean interface whose implementation exposes `public` fields has abstraction but poor encapsulation.\n\n**Good design uses both:** a small, clear interface (abstraction), and internal state that only the class itself can change and always keeps valid (encapsulation).", "excerpt": "Có encapsulation mà không có abstraction không? Có. Một class chỉ có field private cùng getter và setter \"trần\" là có đóng gói (về hình thức), nhưng không trừu tượng hóa gì cả: người gọi vẫn phải biết và phụ thuộc vào từ", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-string-pool", "title": "String constant pool là gì? String được lưu ở đâu? / What is the String constant pool, and where do strings live?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "string", "jvm", "epam"], "body": "### Tiếng Việt\n\n**String pool** là vùng nhớ đặc biệt chứa các String literal, để tái sử dụng thay vì tạo nhiều bản giống nhau. **Từ Java 7, pool nằm trong heap** (trước đó ở PermGen), nên được GC dọn như object thường.\n\n```java\nString a = \"hi\";               // literal → lấy từ pool (tạo nếu chưa có)\nString b = \"hi\";               // trỏ CÙNG object với a\nString c = new String(\"hi\");   // luôn tạo object MỚI trên heap\nString d = c.intern();         // trả về bản trong pool\n\na == b      // true  (cùng object)\na == c      // false (khác object)\na.equals(c) // true  (cùng nội dung)\na == d      // true\n```\n\n**Câu hỏi bẫy:** *\"`new String(\"hi\")` tạo ra mấy object?\"* Tối đa **2**: một literal `\"hi\"` trong pool (nếu chưa có) và một object mới trên heap.\n\n**Nối chuỗi:**\n\n```java\nString x = \"a\" + \"b\";      // hằng số lúc compile → gộp thành \"ab\", nằm trong pool\nString y = \"ab\";\nx == y                      // true\n\nString part = \"a\";\nString z = part + \"b\";     // nối lúc chạy → object mới\nz == y                      // false\n```\n\n**Bài học:**\n- **Luôn so sánh String bằng `equals`**, không dùng `==`.\n- `intern()` có thể tiết kiệm bộ nhớ khi có rất nhiều chuỗi trùng (ví dụ mã quốc gia đọc từ file), nhưng ít khi cần. JVM hiện đại còn có `-XX:+UseStringDeduplication` với G1.\n- Pool chia sẻ an toàn được là **nhờ String immutable**.\n\n### English\n\nThe **string pool** is a special memory area that holds String literals so they can be reused instead of creating many identical copies. **Since Java 7 the pool lives in the heap** (before that it was in PermGen), so it's garbage-collected like ordinary objects.\n\n```java\nString a = \"hi\";               // literal → taken from the pool (created if absent)\nString b = \"hi\";               // points to the SAME object as a\nString c = new String(\"hi\");   // always creates a NEW object on the heap\nString d = c.intern();         // returns the pooled instance\n\na == b      // true  (same object)\na == c      // false (different objects)\na.equals(c) // true  (same content)\na == d      // true\n```\n\n**Trick question:** *\"How many objects does `new String(\"hi\")` create?\"* Up to **2**: the literal `\"hi\"` in the pool (if not already there) and one new object on the heap.\n\n**Concatenation:**\n\n```java\nString x = \"a\" + \"b\";      // compile-time constants → folded into \"ab\", pooled\nString y = \"ab\";\nx == y                      // true\n\nString part = \"a\";\nString z = part + \"b\";     // concatenated at runtime → new object\nz == y                      // false\n```\n\n**Takeaways:**\n- **Always compare strings with `equals`**, never with `==`.\n- `intern()` can save memory when there are huge numbers of duplicate strings (for example country codes read from a file), but it's rarely needed. Modern JVMs also offer `-XX:+UseStringDeduplication` with G1.\n- The pool can be shared safely **only because String is immutable**.", "excerpt": "String pool là vùng nhớ đặc biệt chứa các String literal, để tái sử dụng thay vì tạo nhiều bản giống nhau. Từ Java 7, pool nằm trong heap (trước đó ở PermGen), nên được GC dọn như object thường. Câu hỏi bẫy: \"new String(", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-interface-private", "title": "Interface có private method được không? Để làm gì? / Can an interface have private methods? Why would it?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "java-modern", "epam"], "body": "### Tiếng Việt\n\n**Có, từ Java 9.** Tóm tắt interface qua các phiên bản:\n\n| Java | Interface có thể chứa |\n|---|---|\n| ≤ 7 | Chỉ method abstract và hằng `public static final` |\n| 8 | Thêm **`default`** method (có thân hàm) và **`static`** method |\n| 9 | Thêm **`private`** và **`private static`** method |\n\n**Vì sao cần:** từ Java 8, interface có code thật trong `default` method. Khi nhiều default method dùng chung một đoạn logic, private method giúp **tái sử dụng mà không lộ ra ngoài**, vì nó không thuộc hợp đồng public.\n\n```java\ninterface ReportExporter {\n    default String toCsv(List<Row> rows)  { return header() + join(rows, \",\"); }\n    default String toTsv(List<Row> rows)  { return header() + join(rows, \"\\t\"); }\n\n    private String join(List<Row> rows, String sep) {      // helper dùng chung, không public\n        return rows.stream().map(r -> r.format(sep)).collect(Collectors.joining(\"\\n\"));\n    }\n    private static String header() { return \"id,name,amount\\n\"; }\n}\n```\n\n**Giới hạn vẫn còn:**\n- Interface **không có trạng thái instance**: field luôn là `public static final`.\n- Private method **không được** đánh dấu `default` hay `abstract`.\n- Một class implement hai interface có default method trùng chữ ký thì **phải override** để chọn, ví dụ gọi `A.super.method()`.\n\n**Khi nào nên dùng abstract class thay vì interface:** khi cần lưu trạng thái chung, cần constructor, hoặc cần method `protected`.\n\n### English\n\n**Yes, since Java 9.** How interfaces evolved:\n\n| Java | An interface can contain |\n|---|---|\n| ≤ 7 | Only abstract methods and `public static final` constants |\n| 8 | Adds **`default`** methods (with a body) and **`static`** methods |\n| 9 | Adds **`private`** and **`private static`** methods |\n\n**Why they're needed:** since Java 8, interfaces contain real code in `default` methods. When several default methods share some logic, a private method lets them **reuse it without exposing it**, because it isn't part of the public contract.\n\n```java\ninterface ReportExporter {\n    default String toCsv(List<Row> rows)  { return header() + join(rows, \",\"); }\n    default String toTsv(List<Row> rows)  { return header() + join(rows, \"\\t\"); }\n\n    private String join(List<Row> rows, String sep) {      // shared helper, not public\n        return rows.stream().map(r -> r.format(sep)).collect(Collectors.joining(\"\\n\"));\n    }\n    private static String header() { return \"id,name,amount\\n\"; }\n}\n```\n\n**Limits that still apply:**\n- Interfaces have **no instance state**: fields are always `public static final`.\n- A private method **can't** be `default` or `abstract`.\n- If a class implements two interfaces with default methods of the same signature, it **must override** the method to choose, for example by calling `A.super.method()`.\n\n**When to use an abstract class instead of an interface:** when you need shared state, a constructor, or `protected` methods.", "excerpt": "Có, từ Java 9. Tóm tắt interface qua các phiên bản: Vì sao cần: từ Java 8, interface có code thật trong default method. Khi nhiều default method dùng chung một đoạn logic, private method giúp tái sử dụng mà không lộ ra n", "catLabel": "Java & JVM", "tip": "", "num": null, "bilingual": true}, {"id": "jc-ocp-violation", "title": "Có khi nào được phép vi phạm nguyên tắc Open/Closed không? / Is it ever acceptable to violate the Open/Closed Principle?", "cat": "java", "section": "Java core (EPAM rapid-fire)", "kind": "qa", "tags": ["java-core", "solid", "design", "epam"], "body": "### Tiếng Việt\n\n**Nhắc lại OCP:** code nên **mở để mở rộng, đóng để sửa đổi**. Thêm tính năng mới bằng cách thêm class mới, không phải sửa code đang chạy ổn.\n\n```java\n// Vi phạm OCP: thêm phương thức thanh toán mới thì phải sửa switch\nlong fee(PaymentType t, long amount) {\n    return switch (t) {\n        case CARD -> amount * 2 / 100;\n        case WALLET -> 1_000;\n    };\n}\n\n// Theo OCP: thêm loại mới = thêm class implement interface\ninterface FeePolicy { long fee(long amount); }\nclass CardFee implements FeePolicy { public long fee(long a) { return a * 2 / 100; } }\nclass WalletFee implements FeePolicy { public long fee(long a) { return 1_000; } }\n```\n\n**Có, đôi khi vi phạm là lựa chọn đúng:**\n- **Dự án nhỏ, prototype, sửa gấp:** thêm một nhánh `case` đơn giản và dễ đọc hơn việc tạo interface với một implementation duy nhất. Đây là nguyên tắc **YAGNI** (You Aren't Gonna Need It).\n- **Biến thể chưa chắc sẽ xuất hiện:** trừu tượng hóa quá sớm tạo ra \"abstraction sai\", còn tốn kém hơn sửa code.\n- **Quy tắc ba lần (rule of three):** lần thứ ba phải sửa cùng một `switch` để thêm biến thể mới thì mới tách interface.\n\n**Nên tuân thủ OCP khi:** biến thể thật sự lặp lại và có xu hướng tăng, ví dụ phương thức thanh toán, quy tắc tính phí, kênh gửi thông báo, plugin.\n\n**Lựa chọn trung gian với Java 21:** `sealed interface` kết hợp `switch` đầy đủ các trường hợp. Việc sửa vẫn phải làm, nhưng **compiler báo lỗi** ở mọi chỗ cần cập nhật khi thêm loại mới, nên không bỏ sót.\n\n**Ví dụ thực tế để kể:** *\"Ở DXC, [tính phí bảo hiểm theo loại sản phẩm]: ban đầu là một `switch`, đến khi có sản phẩm thứ ba thì tôi tách thành strategy...\"* (thay bằng chuyện thật của bạn).\n\n### English\n\n**A reminder of OCP:** code should be **open for extension, closed for modification**. A new feature is added by adding a new class, not by editing code that already works.\n\n```java\n// Violates OCP: adding a payment method means editing the switch\nlong fee(PaymentType t, long amount) {\n    return switch (t) {\n        case CARD -> amount * 2 / 100;\n        case WALLET -> 1_000;\n    };\n}\n\n// Follows OCP: a new type = a new class implementing the interface\ninterface FeePolicy { long fee(long amount); }\nclass CardFee implements FeePolicy { public long f
