mit, xác thực, canary theo header |\n| Ví dụ | AWS NLB, LVS | AWS ALB, Nginx, Envoy, HAProxy (mode http), Kubernetes Ingress |\n\n**Thuật toán phân phối:**\n\n| Thuật toán | Cách làm | Hợp khi |\n|---|---|---|\n| Round robin | Lần lượt từng instance | Instance giống nhau, request tốn công như nhau |\n| Weighted round robin | Instance mạnh nhận nhiều hơn | Máy có cấu hình khác nhau, canary 5% |\n| **Least connections / least outstanding requests** | Chọn instance đang bận ít nhất | Request có thời gian xử lý chênh lệch nhiều |\n| IP hash / consistent hashing | Cùng client hoặc key luôn vào cùng instance | Cần cache cục bộ theo key, sticky session |\n| Power of two choices | Chọn ngẫu nhiên 2 instance, lấy cái ít tải hơn | Cụm lớn, cân bằng tốt mà rẻ |\n\n**Health check:**\n- **Liveness:** process còn sống không. **Readiness:** đã sẵn sàng nhận request chưa (đã nối DB, đã warm cache).\n- Instance lỗi liên tục N lần thì bị loại, hồi phục thì được đưa lại.\n- **Connection draining:** khi deploy hoặc scale down, LB ngừng gửi request mới nhưng để request đang chạy xử lý xong.\n\n**Chính LB có phải là điểm hỏng duy nhất không?** Có, nếu chỉ có một. Cách xử lý: LB được quản lý (ALB tự chạy ở nhiều AZ), hoặc cặp LB active-passive dùng chung virtual IP (keepalived), hoặc DNS trỏ tới nhiều LB.\n\n**Các tầng phân phối trong thực tế:**\n```\nDNS (GeoDNS, Route 53) → CDN → L4/L7 LB (ALB) → Ingress hoặc API gateway → service (Kubernetes Service, client-side LB)\n```\n\n**Bên trong hệ thống microservices:** Kubernetes Service phân phối ở L4 (kube-proxy). Khi gọi gRPC, kết nối HTTP/2 tồn tại lâu nên L4 dồn hết request vào một pod: cần **LB ở L7** (Envoy, service mesh) hoặc client-side load balancing.\n\n### English\n\nA **load balancer (LB)** receives requests and distributes them across many instances behind it, and it **removes unhealthy instances** from rotation using health checks.\n\n**L4 vs L7:**\n\n| | L4 (transport, TCP/UDP) | L7 (application, HTTP) |\n|---|---|---|\n| What it sees | IPs and ports | URL, headers, cookies, method, body |\n| Routing | By connection only | By content: `/api/orders` to the order service, `/api/users` to the user service |\n| Speed | Very fast, cheap on CPU | Slightly slower because it parses HTTP |\n| Extras | | TLS termination, compression, rewrites, rate limiting, authentication, header-based canaries |\n| Examples | AWS NLB, LVS | AWS ALB, Nginx, Envoy, HAProxy (http mode), Kubernetes Ingress |\n\n**Distribution algorithms:**\n\n| Algorithm | How | Fits when |\n|---|---|---|\n| Round robin | Each instance in turn | Identical instances and equally expensive requests |\n| Weighted round robin | Stronger instances get more | Mixed machine sizes, a 5% canary |\n| **Least connections / least outstanding requests** | Picks the least busy instance | Request durations vary a lot |\n| IP hash / consistent hashing | The same client or key always goes to the same instance | Per-key local caches, sticky sessions |\n| Power of two choices | Pick 2 instances at random, use the less loaded one | Large clusters; good balance at low cost |\n\n**Health checks:**\n- **Liveness:** is the process alive? **Readiness:** is it ready to take requests (DB connected, cache warmed)?\n- An instance failing N times in a row is removed, and added back when it recovers.\n- **Connection draining:** during deploys or scale-down, the LB stops sending new requests but lets in-flight ones finish.\n\n**Isn't the LB itself a single point of failure?** Yes, if there's only one. Fixes: a managed LB (ALB runs across several AZs automatically), an active-passive LB pair sharing a virtual IP (keepalived), or DNS pointing at several LBs.\n\n**Distribution layers in practice:**\n```\nDNS (GeoDNS, Route 53) → CDN → L4/L7 LB (ALB) → Ingress or API gateway → service (Kubernetes Service, client-side LB)\n```\n\n**Inside a microservices system:** a Kubernetes Service balances at L4 (kube-proxy). With gRPC, long-lived HTTP/2 connections mean L4 sends every request to one pod: you need **L7 balancing** (Envoy, a service mesh) or client-side load balancing.", "excerpt": "Load balancer (LB) nhận request rồi phân phối cho nhiều instance phía sau, đồng thời loại instance hỏng ra khỏi vòng quay nhờ health check. L4 và L7: Thuật toán phân phối: Health check: Liveness: process còn sống không. ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-availability", "title": "High availability là gì? 99,9% và 99,99% khác nhau bao nhiêu? Thiết kế thế nào để không có điểm hỏng duy nhất? / What is high availability? How different are 99.9% and 99.99%, and how do you design out single points of failure?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["availability", "reliability", "kafka", "kubernetes"], "body": "### Tiếng Việt\n\n**Availability** là tỷ lệ thời gian hệ thống phục vụ được.\n\n| Mức | Downtime mỗi năm | Mỗi tháng |\n|---|---|---|\n| 99% | khoảng 3,65 ngày | khoảng 7,3 giờ |\n| 99,9% (\"ba số 9\") | khoảng 8,76 giờ | khoảng 43,8 phút |\n| 99,99% | khoảng 52,6 phút | khoảng 4,4 phút |\n| 99,999% | khoảng 5,3 phút | khoảng 26 giây |\n\nMỗi số 9 thêm vào **đắt hơn nhiều**: ở 99,99% thì không còn thời gian cho con người phản ứng, mọi thứ phải tự động failover.\n\n**SLA, SLO, SLI:**\n- **SLI:** chỉ số đo được, ví dụ tỷ lệ request thành công, p99 latency.\n- **SLO:** mục tiêu nội bộ, ví dụ 99,9% request thành công trong 30 ngày.\n- **SLA:** cam kết với khách hàng, có phạt; thường thấp hơn SLO.\n- **Error budget** = 100% − SLO. Còn budget thì được deploy nhanh; hết budget thì dừng tính năng mới để tập trung vào độ ổn định.\n\n**Availability của chuỗi phụ thuộc:** gọi nối tiếp 3 service, mỗi cái 99,9%, thì tổng chỉ còn khoảng 0,999³ ≈ **99,7%**. Muốn hệ thống đạt 99,9% thì từng thành phần phải tốt hơn, hoặc phải có fallback.\n\n**Có dự phòng thì tăng:** hai instance độc lập, mỗi cái 99%, thì xác suất cả hai cùng chết là 0,01 × 0,01, nên tổng khoảng 99,99%. Điều kiện là chúng **hỏng độc lập**: khác máy, khác AZ, không chung một phụ thuộc.\n\n**Cách loại bỏ điểm hỏng duy nhất (SPOF):**\n\n| Tầng | Cách làm |\n|---|---|\n| Ứng dụng | ≥ 2 instance trải trên **nhiều AZ**, có health check và tự thay thế (Kubernetes, auto scaling group) |\n| Load balancer | LB được quản lý chạy nhiều AZ |\n| Database | Primary và standby **đồng bộ** ở AZ khác, tự failover (RDS Multi-AZ, Patroni); backup và **thử restore** định kỳ |\n| Cache, broker | Redis Sentinel hoặc Cluster; Kafka `replication.factor=3`, `min.insync.replicas=2` |\n| Phụ thuộc ngoài | Timeout, retry, circuit breaker, **fallback** (dữ liệu cache cũ, degrade tính năng) |\n| Con người, quy trình | Deploy dần (canary, blue-green), rollback nhanh, feature flag, runbook, alert theo SLO |\n\n**Active-passive và active-active:**\n- **Active-passive:** một bên phục vụ, một bên chờ. Đơn giản, nhưng tốn tài nguyên chờ và failover mất thời gian.\n- **Active-active:** mọi bên cùng phục vụ. Tận dụng tài nguyên, failover gần như tức thì, nhưng **ghi ở nhiều nơi** gây xung đột dữ liệu.\n\n**Multi-region:** chỉ cần khi SLO rất cao hoặc yêu cầu khôi phục sau thảm họa. Phải xác định **RPO** (chấp nhận mất bao nhiêu dữ liệu) và **RTO** (mất bao lâu để khôi phục).\n\n**Câu trả lời mẫu:** *\"Tôi bắt đầu từ SLO, ví dụ 99,9%, rồi tìm từng điểm hỏng duy nhất theo đường đi của request: ít nhất 2 instance trên nhiều AZ, database có standby tự failover, Kafka replication 3. Với phụ thuộc ngoài, tôi dùng timeout, circuit breaker và fallback, vì availability của chuỗi phụ thuộc là tích của từng phần.\"*\n\n### English\n\n**Availability** is the fraction of time the system can serve requests.\n\n| Level | Downtime per year | Per month |\n|---|---|---|\n| 99% | about 3.65 days | about 7.3 hours |\n| 99.9% (\"three nines\") | about 8.76 hours | about 43.8 minutes |\n| 99.99% | about 52.6 minutes | about 4.4 minutes |\n| 99.999% | about 5.3 minutes | about 26 seconds |\n\nEach extra nine **costs much more**: at 99.99% there's no time for humans to react, so everything must fail over automatically.\n\n**SLA, SLO, SLI:**\n- **SLI:** a measured indicator, for example the success rate or p99 latency.\n- **SLO:** an internal target, for example 99.9% of requests succeed over 30 days.\n- **SLA:** a commitment to customers, with penalties; usually lower than the SLO.\n- **Error budget** = 100% − SLO. With budget left you can ship fast; when it's spent, you stop new features and focus on stability.\n\n**Availability of a dependency chain:** calling 3 services in series, each at 99.9%, gives only about 0.999³ ≈ **99.7%** overall. For the system to reach 99.9%, each component must do better, or there must be fallbacks.\n\n**Redundancy raises it:** two independent instances at 99% each fail together with probability 0.01 × 0.01, so together they give about 99.99%. The condition is that they **fail independently**: different machines, different AZs, no shared dependency.\n\n**Removing single points of failure (SPOFs):**\n\n| Tier | How |\n|---|---|\n| Application | ≥ 2 instances across **several AZs**, with health checks and automatic replacement (Kubernetes, auto scaling groups) |\n| Load balancer | A managed LB spanning several AZs |\n| Database | A **synchronous** standby in another AZ with automatic failover (RDS Multi-AZ, Patroni); backups, plus **regular restore tests** |\n| Cache, broker | Redis Sentinel or Cluster; Kafka `replication.factor=3`, `min.insync.replicas=2` |\n| External dependencies | Timeouts, retries, circuit breakers, **fallbacks** (stale cached data, degraded features) |\n| People and process | Gradual deploys (canary, blue-green), fast rollback, feature flags, runbooks, SLO-based alerts |\n\n**Active-passive vs active-active:**\n- **Active-passive:** one side serves while the other waits. Simple, but the standby resources sit idle and failover takes time.\n- **Active-active:** every side serves. Better resource use and near-instant failover, but **writes in several places** cause data conflicts.\n\n**Multi-region:** only needed for very high SLOs or disaster-recovery requirements. You must define **RPO** (how much data loss is acceptable) and **RTO** (how long recovery may take).\n\n**A model answer:** *\"I start from the SLO, say 99.9%, and then find each single point of failure along the request path: at least 2 instances across several AZs, a database with an automatically failing-over standby, and Kafka replication of 3. For external dependencies I use timeouts, circuit breakers and fallbacks, because a chain's availability is the product of its parts.\"*", "excerpt": "Availability là tỷ lệ thời gian hệ thống phục vụ được. Mỗi số 9 thêm vào đắt hơn nhiều: ở 99,99% thì không còn thời gian cho con người phản ứng, mọi thứ phải tự động failover. SLA, SLO, SLI: SLI: chỉ số đo được, ví dụ tỷ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-estimation", "title": "Ước lượng dung lượng (back-of-the-envelope) làm thế nào? Những con số nào cần nhớ? / How do you do back-of-the-envelope capacity estimation, and which numbers should you remember?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["system-design", "capacity", "kafka"], "body": "### Tiếng Việt\n\nỞ phút thứ 5–10 của buổi system design, interviewer muốn thấy bạn **ước lượng được quy mô** để chọn kiến trúc. Không cần chính xác, chỉ cần đúng **bậc độ lớn**.\n\n**Con số cần nhớ:**\n- **1 ngày ≈ 86.400 giây ≈ 10⁵ giây** (làm tròn để tính nhẩm).\n- **1 triệu request/ngày ≈ 12 request/giây.** 100 triệu/ngày ≈ 1.200 QPS.\n- **Peak** thường gấp 2–5 lần trung bình (flash sale có thể gấp 10–100 lần).\n- Độ trễ, theo bậc:\n\n| Thao tác | Thời gian xấp xỉ |\n|---|---|\n| Đọc RAM | khoảng 100 ns |\n| Đọc ngẫu nhiên SSD | khoảng 100 µs |\n| Gọi trong cùng data center (round trip) | khoảng 0,5 ms |\n| Lệnh Redis | khoảng 0,1–1 ms |\n| Query DB có index | khoảng 1–10 ms |\n| Round trip giữa hai châu lục | khoảng 100–150 ms |\n\n- Năng lực tham khảo, rất phụ thuộc phần cứng và workload: một instance API Java khoảng 1.000–5.000 req/s cho request đơn giản; PostgreSQL một node khoảng vài nghìn đến hàng chục nghìn truy vấn đơn giản mỗi giây; Redis khoảng 100.000 lệnh/giây mỗi node; một partition Kafka khoảng 10 MB/s.\n\n**Ví dụ: URL shortener, 100 triệu URL mới mỗi tháng, tỷ lệ đọc:ghi là 100:1.**\n\n| Bước | Tính | Kết quả |\n|---|---|---|\n| Ghi/giây | 100M / (30 × 10⁵) | khoảng **40 ghi/s**, peak khoảng 200 |\n| Đọc/giây | 40 × 100 | khoảng **4.000 đọc/s**, peak khoảng 20.000 |\n| Dung lượng mỗi bản ghi | URL khoảng 500 byte + metadata | khoảng 1 KB |\n| Lưu trữ 5 năm | 100M × 12 × 5 × 1 KB | khoảng **6 TB** |\n| Cache 20% URL nóng của một ngày | 4.000 × 10⁵ × 20% × 1 KB | khoảng **80 GB** RAM |\n\n**Rút ra kết luận kiến trúc** (đây mới là phần ghi điểm):\n- 40 ghi/s rất nhỏ: một PostgreSQL primary là đủ, **không cần sharding**.\n- 20.000 đọc/s lúc peak: cần **cache Redis** phía trước, cộng vài instance API scale ngang.\n- 6 TB trong 5 năm: một node lưu được, nhưng nên partition theo thời gian hoặc tính trước việc chia sau này.\n- Mã ngắn: 62⁷ ≈ 3,5 nghìn tỷ tổ hợp, dư cho 6 tỷ URL.\n\n**Mẹo:** nói to giả định (\"tôi giả sử...\"), làm tròn mạnh tay, và **luôn kết thúc bằng một quyết định thiết kế** rút ra từ con số.\n\n### English\n\nAround minutes 5–10 of a system design interview, the interviewer wants to see that you can **estimate the scale** to choose an architecture. Precision doesn't matter; the **order of magnitude** does.\n\n**Numbers to remember:**\n- **1 day ≈ 86,400 seconds ≈ 10⁵ seconds** (rounded for mental math).\n- **1 million requests/day ≈ 12 requests/second.** 100 million/day ≈ 1,200 QPS.\n- **Peak** is usually 2–5× the average (a flash sale can be 10–100×).\n- Latencies, by order of magnitude:\n\n| Operation | Approximate time |\n|---|---|\n| RAM read | about 100 ns |\n| SSD random read | about 100 µs |\n| Round trip within a data center | about 0.5 ms |\n| Redis command | about 0.1–1 ms |\n| Indexed DB query | about 1–10 ms |\n| Intercontinental round trip | about 100–150 ms |\n\n- Reference capacities, highly dependent on hardware and workload: one Java API instance handles about 1,000–5,000 req/s for simple requests; a single PostgreSQL node handles a few thousand to tens of thousands of simple queries per second; Redis about 100,000 commands/second per node; one Kafka partition about 10 MB/s.\n\n**Example: a URL shortener with 100 million new URLs a month and a 100:1 read-to-write ratio.**\n\n| Step | Calculation | Result |\n|---|---|---|\n| Writes/second | 100M / (30 × 10⁵) | about **40 writes/s**, peak about 200 |\n| Reads/second | 40 × 100 | about **4,000 reads/s**, peak about 20,000 |\n| Size per record | URL about 500 bytes + metadata | about 1 KB |\n| Storage for 5 years | 100M × 12 × 5 × 1 KB | about **6 TB** |\n| Cache for the hottest 20% of a day | 4,000 × 10⁵ × 20% × 1 KB | about **80 GB** of RAM |\n\n**Draw architectural conclusions** (this is what earns the points):\n- 40 writes/s is tiny: one PostgreSQL primary is enough, **no sharding needed**.\n- 20,000 reads/s at peak: put a **Redis cache** in front, plus a few horizontally scaled API instances.\n- 6 TB over 5 years: one node can hold it, but partition by time or plan for splitting later.\n- Short codes: 62⁷ ≈ 3.5 trillion combinations, plenty for 6 billion URLs.\n\n**Tip:** state your assumptions out loud (\"I'll assume...\"), round aggressively, and **always end with a design decision** drawn from the numbers.", "excerpt": "Ở phút thứ 5–10 của buổi system design, interviewer muốn thấy bạn ước lượng được quy mô để chọn kiến trúc. Không cần chính xác, chỉ cần đúng bậc độ lớn. Con số cần nhớ: 1 ngày ≈ 86.400 giây ≈ 10⁵ giây (làm tròn để tính n", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-autoscaling", "title": "Autoscaling hoạt động thế nào? Scale theo chỉ số gì, và có những bẫy nào? / How does autoscaling work, which metrics should drive it, and what are the pitfalls?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["scalability", "kubernetes", "autoscaling", "kafka"], "body": "### Tiếng Việt\n\n**Các loại autoscaling:**\n\n| Loại | Làm gì | Ví dụ |\n|---|---|---|\n| **Ngang theo pod hoặc instance** | Thêm hoặc bớt bản sao | Kubernetes **HPA**, AWS Auto Scaling Group |\n| **Dọc theo pod** | Tăng hoặc giảm CPU và RAM request của pod | Kubernetes **VPA** (thường chỉ dùng để gợi ý cấu hình) |\n| **Theo node** | Thêm máy khi pod không còn chỗ chạy | Cluster Autoscaler, **Karpenter** |\n| **Theo sự kiện** | Scale theo độ dài hàng đợi, kể cả về 0 | **KEDA** (Kafka consumer lag, độ dài hàng đợi SQS hay RabbitMQ) |\n\n**HPA:** `số pod mong muốn = ceil(số pod hiện tại × giá trị đo / giá trị mục tiêu)`. Ví dụ 4 pod, CPU trung bình 90%, mục tiêu 60%, thì cần ceil(4 × 90 / 60) = 6 pod.\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef: { kind: Deployment, name: order-service }\n  minReplicas: 3            # ≥ 2 để chịu lỗi, trải trên nhiều AZ\n  maxReplicas: 30           # chặn trên để bảo vệ DB và chi phí\n  metrics:\n    - type: Resource\n      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }\n  behavior:\n    scaleDown: { stabilizationWindowSeconds: 300 }   # giảm chậm để tránh dao động\n```\n\n**Chọn chỉ số nào:**\n- **CPU:** hợp với service nặng CPU. Service Java nặng I/O có thể chậm mà CPU vẫn thấp.\n- **Request/giây mỗi pod** hoặc **latency:** sát với trải nghiệm người dùng hơn (cần Prometheus Adapter).\n- **Consumer lag hoặc độ dài hàng đợi:** đúng cho worker xử lý message (KEDA). Lưu ý số consumer Kafka hiệu quả **không vượt quá số partition**.\n- **Memory:** ít khi dùng để scale, vì JVM không trả lại bộ nhớ ngay nên dễ scale lên mà không scale xuống.\n\n**Bẫy:**\n1. **Scale chậm hơn tải tăng:** HPA đo mỗi 15 giây, cộng thời gian tạo node, kéo image, **JVM khởi động và warm-up**, có thể mất vài phút. Giải pháp: `minReplicas` đủ cao, **scale theo lịch** trước sự kiện biết trước (flash sale, 9 giờ sáng), giữ sẵn node dự phòng, khởi động nhanh hơn (CDS, AOT cache, image nhỏ).\n2. **Thiếu `requests` CPU trong pod spec** thì HPA tính phần trăm CPU sai.\n3. **Dao động lên xuống liên tục (flapping):** dùng `stabilizationWindowSeconds` và scale down chậm.\n4. **Đẩy nghẽn xuống tầng dưới:** 30 pod × pool 20 kết nối = 600 kết nối vào PostgreSQL, có thể vượt `max_connections`. Cần PgBouncer, đặt `maxReplicas` hợp lý và giới hạn đồng thời.\n5. **Readiness probe sai** thì pod mới nhận traffic khi chưa sẵn sàng, gây lỗi hàng loạt đúng lúc đang cần scale.\n6. **Scale down làm đứt request đang chạy:** cần graceful shutdown (`server.shutdown=graceful` trong Spring), `preStop` hook và connection draining.\n\n### English\n\n**Types of autoscaling:**\n\n| Type | What it does | Examples |\n|---|---|---|\n| **Horizontal, pods or instances** | Adds or removes replicas | Kubernetes **HPA**, AWS Auto Scaling Groups |\n| **Vertical, pods** | Raises or lowers a pod's CPU and memory requests | Kubernetes **VPA** (often used only for recommendations) |\n| **Nodes** | Adds machines when pods have nowhere to run | Cluster Autoscaler, **Karpenter** |\n| **Event-driven** | Scales on queue length, including down to zero | **KEDA** (Kafka consumer lag, SQS or RabbitMQ queue length) |\n\n**HPA:** `desired pods = ceil(current pods × measured value / target value)`. For example, 4 pods at 90% average CPU with a 60% target need ceil(4 × 90 / 60) = 6 pods.\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef: { kind: Deployment, name: order-service }\n  minReplicas: 3            # ≥ 2 for fault tolerance, spread across AZs\n  maxReplicas: 30           # an upper bound protects the DB and the bill\n  metrics:\n    - type: Resource\n      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }\n  behavior:\n    scaleDown: { stabilizationWindowSeconds: 300 }   # scale down slowly to avoid oscillation\n```\n\n**Which metric to use:**\n- **CPU:** suits CPU-bound services. An I/O-bound Java service can be slow while CPU stays low.\n- **Requests per second per pod** or **latency:** closer to user experience (needs a Prometheus Adapter).\n- **Consumer lag or queue length:** right for message workers (KEDA). Note that the number of useful Kafka consumers **can't exceed the partition count**.\n- **Memory:** rarely used for scaling, because the JVM doesn't release memory promptly, so it tends to scale up without scaling down.\n\n**Pitfalls:**\n1. **Scaling lags behind rising load:** HPA samples every 15 seconds, plus node creation, image pulls, and **JVM startup and warm-up**, which can add up to minutes. Fixes: a high enough `minReplicas`, **scheduled scaling** ahead of known events (a flash sale, 9 a.m.), spare node capacity, faster startup (CDS, AOT cache, smaller images).\n2. **Missing CPU `requests` in the pod spec** make the HPA's CPU percentage meaningless.\n3. **Flapping up and down:** use `stabilizationWindowSeconds` and scale down slowly.\n4. **Pushing the bottleneck downstream:** 30 pods × a pool of 20 connections = 600 connections to PostgreSQL, which can exceed `max_connections`. You need PgBouncer, a sensible `maxReplicas` and concurrency limits.\n5. **A wrong readiness probe** sends traffic to new pods before they're ready, causing mass errors exactly when you need to scale.\n6. **Scale-down cuts in-flight requests:** you need graceful shutdown (`server.shutdown=graceful` in Spring), a `preStop` hook and connection draining.", "excerpt": "Các loại autoscaling: HPA: số pod mong muốn = ceil(số pod hiện tại × giá trị đo / giá trị mục tiêu). Ví dụ 4 pod, CPU trung bình 90%, mục tiêu 60%, thì cần ceil(4 × 90 / 60) = 6 pod. Chọn chỉ số nào: CPU: hợp với service", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-queue-backpressure", "title": "Dùng hàng đợi để chịu tải đột biến thế nào? Backpressure là gì? / How do you use queues to absorb load spikes, and what is backpressure?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["scalability", "messaging", "backpressure", "kafka"], "body": "### Tiếng Việt\n\n**Load leveling (san phẳng tải):** thay vì xử lý mọi việc trong request, API **nhận yêu cầu, ghi vào hàng đợi, trả 202 Accepted ngay**. Worker phía sau xử lý với tốc độ **ổn định mà hệ thống chịu được**. Tải đột biến được hàng đợi \"hấp thụ\" thay vì làm sập database.\n\n```\nClient → API (validate, ghi vào Kafka, trả 202 + requestId)\n                │\n                ▼\n         Kafka topic  ──►  worker × N (tốc độ cố định) ──► DB, dịch vụ ngoài\n                                    │\nClient hỏi trạng thái (GET /requests/{id}) hoặc nhận webhook / thông báo khi xong\n```\n\n**Hợp với:** gửi email hoặc thông báo, tạo báo cáo, xử lý ảnh và video, import file, đồng bộ với hệ thống bên thứ ba, ghi log hoặc sự kiện analytics.\n**Không hợp với:** việc người dùng cần kết quả ngay và nhất quán ngay (kiểm tra số dư khi thanh toán).\n\n**Lợi ích:**\n- Tách producer khỏi consumer: worker chết thì message vẫn còn trong hàng đợi.\n- Scale worker độc lập theo độ dài hàng đợi (KEDA).\n- Retry tự nhiên, có DLQ cho message lỗi.\n\n**Backpressure:** cơ chế để phía chậm **báo cho phía nhanh giảm tốc**, thay vì để hàng đợi phình vô hạn rồi hết bộ nhớ.\n\n| Cách | Ví dụ |\n|---|---|\n| **Hàng đợi có giới hạn, từ chối khi đầy** | `ThreadPoolExecutor` với `ArrayBlockingQueue(1000)`; đầy thì trả **429** hoặc **503** kèm `Retry-After` |\n| **Kéo (pull) thay vì đẩy (push)** | Kafka consumer tự `poll` theo khả năng; RabbitMQ dùng `prefetch` (QoS) để giới hạn số message chưa ack |\n| **Giới hạn đồng thời** | `Semaphore`, bulkhead của Resilience4j, `@ConcurrencyLimit` (Spring 7) |\n| **Reactive Streams** | Subscriber yêu cầu `request(n)` (Project Reactor, WebFlux) |\n| **Rate limiting ở cổng vào** | API gateway giới hạn theo user hoặc API key |\n| **Load shedding** | Quá tải thì bỏ bớt request ít quan trọng trước (analytics), giữ request quan trọng (thanh toán) |\n\n**Giám sát:** độ dài hàng đợi, **consumer lag**, tuổi của message cũ nhất. Lag tăng liên tục nghĩa là tốc độ xử lý thấp hơn tốc độ đến, cần thêm worker (và partition) hoặc tối ưu xử lý.\n\n**Câu trả lời mẫu:** *\"Với việc không cần kết quả ngay, tôi trả 202 và đẩy vào Kafka, để worker xử lý ở tốc độ database chịu được, scale worker theo consumer lag. Ở mọi chỗ có hàng đợi tôi đặt giới hạn: hàng đợi bị chặn trên, đầy thì trả 429 hoặc 503, để quá tải biến thành phản hồi có kiểm soát thay vì sập dây chuyền.\"*\n\n### English\n\n**Load leveling:** instead of doing all the work inside the request, the API **accepts the request, writes it to a queue, and immediately returns 202 Accepted**. Workers behind it process at a **steady rate the system can handle**. The queue \"absorbs\" spikes instead of letting them take down the database.\n\n```\nClient → API (validate, write to Kafka, return 202 + requestId)\n                │\n                ▼\n         Kafka topic  ──►  workers × N (steady rate) ──► DB, external services\n                                    │\nClient polls the status (GET /requests/{id}) or gets a webhook / notification when done\n```\n\n**Fits:** sending emails or notifications, generating reports, image and video processing, file imports, syncing with third-party systems, logging or analytics events.\n**Doesn't fit:** work where the user needs an immediate, consistent result (checking the balance during payment).\n\n**Benefits:**\n- Decouples producers from consumers: if workers die, messages stay in the queue.\n- Workers scale independently on queue length (KEDA).\n- Natural retries, with a DLQ for failing messages.\n\n**Backpressure:** a mechanism for the slow side to **tell the fast side to slow down**, instead of letting a queue grow without bound until memory runs out.\n\n| Approach | Example |\n|---|---|\n| **Bounded queues that reject when full** | A `ThreadPoolExecutor` with `ArrayBlockingQueue(1000)`; when full, return **429** or **503** with `Retry-After` |\n| **Pull instead of push** | Kafka consumers `poll` at their own pace; RabbitMQ uses `prefetch` (QoS) to cap unacknowledged messages |\n| **Concurrency limits** | A `Semaphore`, a Resilience4j bulkhead, `@ConcurrencyLimit` (Spring 7) |\n| **Reactive Streams** | The subscriber signals `request(n)` (Project Reactor, WebFlux) |\n| **Rate limiting at the edge** | The API gateway limits per user or API key |\n| **Load shedding** | Under overload, drop less important requests first (analytics) and keep important ones (payments) |\n\n**Monitoring:** queue length, **consumer lag**, and the age of the oldest message. Steadily growing lag means processing is slower than arrivals, so you need more workers (and partitions) or faster processing.\n\n**A model answer:** *\"For work that doesn't need an immediate result, I return 202 and push to Kafka, so workers process at a pace the database can handle, scaling workers on consumer lag. Every queue I use is bounded: when it's full I return 429 or 503, so overload becomes a controlled response instead of a cascading failure.\"*", "excerpt": "Load leveling (san phẳng tải): thay vì xử lý mọi việc trong request, API nhận yêu cầu, ghi vào hàng đợi, trả 202 Accepted ngay. Worker phía sau xử lý với tốc độ ổn định mà hệ thống chịu được. Tải đột biến được hàng đợi \"", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-bottleneck", "title": "Hệ thống chậm khi tải tăng: bạn tìm và xử lý điểm nghẽn thế nào? / The system slows down under load: how do you find and fix the bottleneck?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["performance", "scalability", "troubleshooting"], "body": "### Tiếng Việt\n\n**Nguyên tắc: đo trước, sửa sau.** Không đoán, không scale bừa: thêm pod khi điểm nghẽn là database chỉ làm database chết nhanh hơn.\n\n**Bước 1: Xác định triệu chứng bằng số liệu.**\n- **RED** cho từng service: **R**ate (request/s), **E**rrors (tỷ lệ lỗi), **D**uration (p50, p95, **p99**). Nhìn p99 chứ không nhìn trung bình, vì trung bình che mất những request chậm.\n- **USE** cho tài nguyên: **U**tilization, **S**aturation (hàng đợi, thread chờ), **E**rrors. Áp dụng cho CPU, RAM, disk, mạng, connection pool.\n- Chậm từ lúc nào? Trùng với deploy, thay đổi cấu hình hay tăng traffic?\n\n**Bước 2: Khoanh vùng bằng distributed tracing** (Jaeger, Tempo, Zipkin). Mở trace của một request chậm để biết thời gian nằm ở span nào: service A, query SQL, hay lời gọi HTTP ra ngoài.\n\n**Bước 3: Kiểm tra các điểm nghẽn hay gặp, theo thứ tự:**\n\n| Nơi | Dấu hiệu | Cách xử lý |\n|---|---|---|\n| **Database** | Query chậm trong `pg_stat_statements`, CPU DB cao, lock wait | `EXPLAIN ANALYZE`, thêm index, sửa **N+1** (JPA `JOIN FETCH`, `@EntityGraph`), phân trang theo keyset, cache, read replica |\n| **Connection pool** | Thread chờ lấy kết nối, HikariCP `pending` > 0, lỗi `Connection is not available` | Transaction ngắn lại (không gọi HTTP trong transaction), tăng pool ở mức hợp lý, thêm PgBouncer |\n| **Thread pool** | Tomcat hết thread, request xếp hàng | Tìm lời gọi blocking chậm; đặt timeout; dùng virtual threads; thêm bulkhead |\n| **Gọi ra ngoài** | Span HTTP dài | **Timeout**, circuit breaker, cache, gọi song song, chuyển sang bất đồng bộ |\n| **JVM** | GC pause dài, heap gần đầy | GC log, heap dump (`jcmd`), sửa rò rỉ bộ nhớ, chỉnh heap, chuyển G1 hoặc ZGC |\n| **CPU** | CPU 100% | Profile bằng async-profiler hoặc JFR, xem flame graph: serialize JSON, regex, log quá nhiều, vòng lặp nặng |\n| **Lock và tranh chấp** | Thread `BLOCKED` trong thread dump, row lock trong DB | Giảm phạm vi khóa, tránh hot row (ví dụ một dòng bộ đếm), dùng atomic update |\n\n**Bước 4: Sửa điểm nghẽn lớn nhất, đo lại, lặp lại.** Gỡ một điểm nghẽn thì điểm nghẽn tiếp theo sẽ lộ ra.\n\n**Bước 5: Ngăn tái diễn.** Load test (k6, Gatling) trong pipeline trước sự kiện lớn, alert theo SLO, và dashboard cho connection pool, GC, consumer lag.\n\n**Câu chuyện mẫu (thay bằng chuyện thật của bạn):** *\"API danh sách thiết bị tăng p99 từ 200 ms lên 3 giây khi số khách hàng tăng. Trace cho thấy 90% thời gian nằm trong DB; `pg_stat_statements` chỉ ra một query N+1 do lazy loading. Tôi đổi sang `JOIN FETCH`, thêm composite index, và phân trang theo keyset. p99 về lại khoảng 150 ms, CPU DB giảm từ 80% xuống 25%.\"*\n\n### English\n\n**Principle: measure first, fix second.** Don't guess and don't scale blindly: adding pods when the bottleneck is the database just kills the database faster.\n\n**Step 1: Pin down the symptom with data.**\n- **RED** for each service: **R**ate (requests/s), **E**rrors (error rate), **D**uration (p50, p95, **p99**). Look at p99, not the average, because averages hide slow requests.\n- **USE** for resources: **U**tilization, **S**aturation (queues, waiting threads), **E**rrors. Apply it to CPU, memory, disk, network and connection pools.\n- When did it start? Does it line up with a deploy, a config change or a traffic increase?\n\n**Step 2: Narrow it down with distributed tracing** (Jaeger, Tempo, Zipkin). Open the trace of a slow request to see which span holds the time: service A, an SQL query, or an outbound HTTP call.\n\n**Step 3: Check the usual bottlenecks, in order:**\n\n| Where | Signs | Fixes |\n|---|---|---|\n| **Database** | Slow queries in `pg_stat_statements`, high DB CPU, lock waits | `EXPLAIN ANALYZE`, add indexes, fix **N+1** (JPA `JOIN FETCH`, `@EntityGraph`), keyset pagination, caching, read replicas |\n| **Connection pool** | Threads waiting for connections, HikariCP `pending` > 0, `Connection is not available` errors | Shorter transactions (no HTTP calls inside a transaction), a sensibly larger pool, add PgBouncer |\n| **Thread pool** | Tomcat runs out of threads, requests queue up | Find slow blocking calls; set timeouts; use virtual threads; add bulkheads |\n| **Outbound calls** | Long HTTP spans | **Timeouts**, circuit breakers, caching, parallel calls, moving to asynchronous processing |\n| **JVM** | Long GC pauses, heap nearly full | GC logs, heap dumps (`jcmd`), fix memory leaks, tune the heap, switch to G1 or ZGC |\n| **CPU** | CPU at 100% | Profile with async-profiler or JFR and read the flame graph: JSON serialization, regexes, excessive logging, heavy loops |\n| **Locks and contention** | `BLOCKED` threads in a thread dump, row locks in the DB | Narrow lock scope, avoid hot rows (for example a single counter row), use atomic updates |\n\n**Step 4: Fix the biggest bottleneck, measure again, repeat.** Removing one bottleneck exposes the next.\n\n**Step 5: Prevent recurrence.** Load tests (k6, Gatling) in the pipeline before big events, SLO-based alerts, and dashboards for connection pools, GC and consumer lag.\n\n**A sample story (replace it with your real one):** *\"The device-list API's p99 went from 200 ms to 3 seconds as the customer count grew. Tracing showed 90% of the time in the database; `pg_stat_statements` pointed to an N+1 query caused by lazy loading. I switched to `JOIN FETCH`, added a composite index and moved to keyset pagination. p99 went back to about 150 ms and DB CPU dropped from 80% to 25%.\"*", "excerpt": "Nguyên tắc: đo trước, sửa sau. Không đoán, không scale bừa: thêm pod khi điểm nghẽn là database chỉ làm database chết nhanh hơn. Bước 1: Xác định triệu chứng bằng số liệu. RED cho từng service: Rate (request/s), Errors (", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-checklist", "title": "What is your framework for a 45-minute system design interview?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "framework"], "body": "*Đây là khung dùng cho mọi bài system design; tập nói theo đúng thứ tự này.*\n\n\"1. **Clarify requirements, 5–10 minutes:** core features, what's out of scope, and non-functional needs: scale (daily active users, read/write ratio), latency, availability target, consistency needs.\n2. **Estimate, about 5 minutes:** QPS at average and peak, storage per year, bandwidth. Rough orders of magnitude are enough; they drive later choices.\n3. **High-level design, 10–15 minutes:** API, data model, main components and the request flow. Get something end to end on the board before optimizing.\n4. **Deep dive, 15–20 minutes:** the bottleneck the interviewer cares about: database choice and schema, scaling and partitioning, caching, concurrency, failure handling and single points of failure.\n5. **Wrap up, 2–3 minutes:** trade-offs I made, what I'd monitor, and what I'd improve with more time.\n\nThroughout I say the trade-offs out loud and check in with the interviewer before going deep.\"\n\nTham khảo thêm: [System Design Interview - The Ultimate Checklist](https://minhnhat97kg.github.io/docsify/content/system-design-interview-the-ultimate-checklist/vi.md)", "excerpt": "Đây là khung dùng cho mọi bài system design; tập nói theo đúng thứ tự này. \"1. Clarify requirements, 5–10 minutes: core features, what's out of scope, and non-functional needs: scale (daily active users, read/write ratio", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-cdn", "title": "How does a CDN work, and what can it do for an API?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "cdn", "caching", "performance"], "body": "*Đây là chủ đề bạn chưa làm thực tế; trả lời ở mức nguyên lý và nói rõ điều đó nếu bị hỏi sâu.*\n\n\"A CDN caches content at edge locations close to users, so requests don't travel to the origin, which cuts latency and offloads the origin.\n\n- **Static assets** such as images, JS and video are cached for a long time, with versioned file names (`app.3f9a.js`) so a deploy never needs invalidation.\n- **Dynamic API responses** can be cached briefly when they're public, such as a product catalogue for 30 seconds, controlled by `Cache-Control: public, max-age=30, stale-while-revalidate=60`. Personalized responses get `private` or `no-store`. The cache key must include anything that changes the response, but not unnecessary cookies or query parameters, or the hit rate collapses.\n- **Invalidation** is the hard part: prefer short TTLs or versioned URLs over purges.\n- **Protection:** the edge absorbs DDoS traffic, and request collapsing stops a thundering herd when a popular object expires, by sending one request to the origin.\n- **Edge computing** runs small functions at the edge for redirects, auth checks or A/B routing.\n\nEven without a CDN in my past projects, the same reasoning applies to the API gateway and Redis caching I did use.\"\n\nTham khảo thêm: [System Design - CDN & Edge Computing](https://minhnhat97kg.github.io/docsify/content/system-design-cdn-edge-computing/vi.md)", "excerpt": "Đây là chủ đề bạn chưa làm thực tế; trả lời ở mức nguyên lý và nói rõ điều đó nếu bị hỏi sâu. \"A CDN caches content at edge locations close to users, so requests don't travel to the origin, which cuts latency and offload", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-consistent-hashing", "title": "What is consistent hashing and why use it?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "distributed-systems", "hashing"], "body": "\"With `hash(key) % N`, changing N from 4 to 5 moves almost every key, which empties a cache cluster. Consistent hashing places both nodes and keys on a ring; a key belongs to the first node clockwise. Adding or removing a node moves only about 1/N of the keys, those between it and its neighbour.\n\nPlain rings distribute unevenly, so each physical node gets many **virtual nodes**, typically 100–200, which smooths the load and lets stronger machines take more. Lookup is a binary search over sorted ring positions: O(log V).\n\nReplication: store each key on the next R distinct physical nodes clockwise. Used by Cassandra and DynamoDB-style stores, client-side memcached sharding, and load balancers that need session affinity. Redis Cluster instead uses 16,384 fixed hash slots, which is a related idea.\"\n\nTham khảo thêm: [System Design - Consistent Hashing](https://minhnhat97kg.github.io/docsify/content/system-design-consistent-hashing/vi.md)", "excerpt": "\"With hash(key) % N, changing N from 4 to 5 moves almost every key, which empties a cache cluster. Consistent hashing places both nodes and keys on a ring; a key belongs to the first node clockwise. Adding or removing a ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-distributed-lock", "title": "How do you implement a distributed lock, and what can go wrong?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "distributed-systems", "redis", "lock"], "body": "\"Single Redis: `SET lock:key <random-token> NX PX 30000`. The random token lets me release safely with a Lua script that deletes only if the value is still mine, so I never delete a lock another client acquired after mine expired. The TTL prevents a crashed holder from blocking forever.\n\n**Redlock** acquires the lock on a majority of independent Redis nodes within a time budget, to survive a node failure. It's debated because it depends on bounded clock drift and process pauses.\n\nThe fundamental problem: a holder can pause, for example in a long GC, past its TTL, and then write after someone else took the lock. The fix is a **fencing token**: an increasing number issued with each lock, which the storage layer checks and rejects if it's older than one it has seen.\n\nSo: Redis locks for efficiency, such as avoiding duplicate work. For correctness, I use ZooKeeper or etcd with fencing, or better, a database constraint or conditional update that makes the lock unnecessary.\"\n\nTham khảo thêm: [System Design - Distributed Locking (Redlock)](https://minhnhat97kg.github.io/docsify/content/system-design-distributed-locking-redlock/vi.md)", "excerpt": "\"Single Redis: SET lock:key <random-token NX PX 30000. The random token lets me release safely with a Lua script that deletes only if the value is still mine, so I never delete a lock another client acquired after mine e", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-eventual", "title": "What is eventual consistency, and when is it acceptable?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "consistency", "distributed-systems"], "body": "\"If no new writes happen, all replicas eventually converge to the same value. It's the BASE side of the trade-off with ACID: basically available, soft state, eventually consistent.\n\nAcceptable when a short delay doesn't break business rules: transaction history views, loyalty points, search indexes, like counters, notifications. Not acceptable for the balance check that decides whether a payment goes through; that stays strongly consistent in one database.\n\n'How long is eventually' should be measured, through replication or consumer lag metrics, and bounded with alerts. Conflicts on concurrent writes are resolved by last-write-wins with timestamps (simple but lossy), version vectors, or CRDTs. Replicas repair through read repair and background anti-entropy. On the UX side: read-your-own-writes from the primary, or show a 'processing' state.\"\n\nTham khảo thêm: [System Design - Eventual Consistency](https://minhnhat97kg.github.io/docsify/content/system-design-eventual-consistency/vi.md)", "excerpt": "\"If no new writes happen, all replicas eventually converge to the same value. It's the BASE side of the trade-off with ACID: basically available, soft state, eventually consistent. Acceptable when a short delay doesn't b", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-flash-sale", "title": "Design a flash sale: 1,000 items, one million users clicking at once.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "concurrency", "redis", "kafka"], "body": "\"**The two problems:** a thundering herd of traffic, and overselling.\n\n**Absorb traffic:** static pages on a CDN, a countdown handled client-side, rate limiting and a virtual waiting room at the gateway, so only a manageable flow reaches the backend.\n\n**No overselling:** keep the stock counter in Redis and decrement atomically, with a Lua script that checks `stock > 0` and decrements in one step, or `DECR` and roll back if the result is negative. Only requests that win a unit continue.\n\n**Protect the database:** winners go onto a queue such as Kafka; consumers create orders at a pace the database handles, with a unique constraint on (user, sale) so each user buys once, and idempotent processing.\n\n**Reservations:** a won unit is held for, say, 10 minutes awaiting payment; on timeout, a delayed job returns it to stock.\n\n**Consistency:** Redis is the gatekeeper, the database is the source of truth; a reconciliation job compares them after the sale.\"\n\nTham khảo thêm: [Behavioral Interview (có phần thiết kế flash sale)](https://minhnhat97kg.github.io/docsify/content/behavioral-interview/vi.md)", "excerpt": "\"The two problems: a thundering herd of traffic, and overselling. Absorb traffic: static pages on a CDN, a countdown handled client-side, rate limiting and a virtual waiting room at the gateway, so only a manageable flow", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-double-entry", "title": "How does double-entry bookkeeping work in a ledger?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "fintech", "payments", "ledger"], "body": "\"Money is never created or destroyed: every transaction has entries that sum to zero, for example debit Alice 100 and credit Bob 100.\n\nSchema: `accounts`, `transactions` (one business event, with an idempotency key) and `entries` (transaction ID, account ID, signed amount). Entries are a separate table, not JSON, so they can be indexed, summed and constrained, and the database can enforce that each transaction balances.\n\nThe ledger is **immutable**: no updates or deletes. A mistake is fixed by a new reversing transaction, which keeps the audit trail.\n\nFees and external money flow through **system accounts**: a fee revenue account, a settlement account for each bank partner, a suspense account for unmatched items. So a 100 transfer with a 1 fee is three entries: Alice −101, Bob +100, fees +1.\n\nDaily **reconciliation** checks that the entries sum to zero, that cached balances match the sum of entries, and that settlement accounts match bank statements.\"\n\nTham khảo thêm: [Double Entry Bookkeeping](https://minhnhat97kg.github.io/docsify/content/system-design-double-entry-bookkeeping/vi.md), [E-Wallet (High Consistency)](https://minhnhat97kg.github.io/docsify/content/system-design-e-wallet-high-consistency-reliability/vi.md)", "excerpt": "\"Money is never created or destroyed: every transaction has entries that sum to zero, for example debit Alice 100 and credit Bob 100. Schema: accounts, transactions (one business event, with an idempotency key) and entri", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-strangler", "title": "How do you migrate a monolith to microservices safely?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["system-design", "migration", "microservices"], "body": "\"Not with a big-bang rewrite: it freezes features for months and fails at cutover. I use the **Strangler Fig** pattern:\n\n1. Put a facade, such as an API gateway or NGINX, in front of the monolith.\n2. Pick one bounded context with clear edges and value, build it as a service, and route its endpoints there, gradually, by percentage or by user.\n3. Repeat until the monolith is empty or small enough to keep.\n\nRollback is just switching the route back, which is why routing must be configurable without a deploy.\n\nThe database is the hardest part: start with the new service reading the shared database if needed, then give it its own store, synchronized by backfill plus change data capture (Debezium) or dual writes, verified by comparing results, before cutting over.\n\nWhen not to use it: small systems where a rewrite is cheap, or when you can't intercept calls to the old system.\"\n\nTham khảo thêm: [Strangler Fig Pattern](https://minhnhat97kg.github.io/docsify/content/system-design-strangler-fig-pattern/vi.md)", "excerpt": "\"Not with a big-bang rewrite: it freezes features for months and fails at cutover. I use the Strangler Fig pattern: Put a facade, such as an API gateway or NGINX, in front of the monolith. Pick one bounded context with c", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-hexagonal", "title": "What is hexagonal (ports and adapters) architecture?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["architecture", "clean-architecture", "design", "kafka"], "body": "\"The domain and use cases sit in the core with no dependencies on frameworks or databases. The core defines **ports**, interfaces such as `PaymentRepository` or `NotificationSender`. **Adapters** implement them on the outside: a Postgres repository, a Kafka publisher, an HTTP controller. Dependencies point inward only.\n\nBenefits: business logic is testable with fakes in milliseconds, and infrastructure can change, such as swapping a database or adding a gRPC API, without touching the core.\n\nA practical rule: don't use ORM entities as domain models, for example a GORM model or a JPA entity full of annotations and lazy-loading proxies leaking into business logic; map at the adapter boundary.\n\nCosts: more files and mapping code. The performance overhead is negligible. I'd skip it for simple CRUD services or short-lived prototypes, and use it where business rules are rich and long-lived.\"\n\nTham khảo thêm: [Clean Architecture - Hexagonal, Ports & Adapters](https://minhnhat97kg.github.io/docsify/content/clean-architecture-hexagonal-ports-adapters/vi.md)", "excerpt": "\"The domain and use cases sit in the core with no dependencies on frameworks or databases. The core defines ports, interfaces such as PaymentRepository or NotificationSender. Adapters implement them on the outside: a Pos", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-principles", "title": "DRY, KISS, YAGNI: duplication or coupling?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["clean-code", "principles", "design"], "body": "\"- **DRY** is about knowledge, not identical-looking code. Two pieces of code that look the same but change for different reasons should stay separate; merging them couples unrelated features.\n- **KISS:** the simplest design that works, readable by the next engineer.\n- **YAGNI:** don't build for requirements that don't exist yet.\n- **Rule of three:** abstract on the third occurrence, when the pattern is actually clear.\n- **Law of Demeter:** talk to direct collaborators, not `a.getB().getC().doX()`.\n- **Fail fast:** validate early and surface errors immediately.\n\nDuplication or coupling? I usually prefer a little duplication over the wrong abstraction. Across microservices especially, sharing a domain library couples deployments; duplicating a small DTO is cheaper than a shared library every service must upgrade together.\"\n\nTham khảo thêm: [Software Principles](https://minhnhat97kg.github.io/docsify/content/software-principles/vi.md)", "excerpt": "\"- DRY is about knowledge, not identical-looking code. Two pieces of code that look the same but change for different reasons should stay separate; merging them couples unrelated features. KISS: the simplest design that ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-stateless-stateful", "title": "Stateless và stateful khác nhau thế nào? Cho ví dụ ở từng tầng của hệ thống. / What's the difference between stateless and stateful? Give examples at each layer of a system.", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["stateless", "stateful", "scalability", "kafka", "kubernetes"], "body": "### Tiếng Việt\n\n**Định nghĩa:**\n- **Stateless (phi trạng thái):** server **không giữ thông tin gì về các request trước** của client. Mỗi request mang **đủ thông tin** để được xử lý độc lập, nên **bất kỳ instance nào** cũng xử lý được.\n- **Stateful (có trạng thái):** server **nhớ trạng thái** giữa các request (session, kết nối, dữ liệu trong bộ nhớ). Request sau phụ thuộc vào request trước, nên thường phải quay về **đúng instance** đang giữ trạng thái đó.\n\n**Lưu ý quan trọng:** hệ thống nào cũng có trạng thái (giỏ hàng, đơn hàng, số dư). \"Stateless service\" nghĩa là **trạng thái được đẩy ra ngoài** (database, Redis, token phía client), chứ không phải không có trạng thái.\n\n| | Stateless | Stateful |\n|---|---|---|\n| Trạng thái nằm ở | Ngoài process: DB, Redis, S3, token của client | Trong bộ nhớ hoặc đĩa của chính instance |\n| Scale ngang | **Dễ**: thêm instance, load balancer chia đều | Khó: cần sticky session, chia dữ liệu, đồng bộ trạng thái |\n| Instance chết | Không mất gì, request sau sang instance khác | **Mất trạng thái** (session, kết nối) nếu không có bản sao |\n| Deploy, restart | Dễ, rolling update thoải mái | Phải drain, chuyển hoặc khôi phục trạng thái |\n| Hiệu năng | Có thể chậm hơn vì mỗi request phải đọc trạng thái từ ngoài | Nhanh vì dữ liệu sẵn trong bộ nhớ |\n| Độ phức tạp | Thấp ở tầng app | Cao hơn |\n\n**Ví dụ ở từng tầng:**\n\n| Tầng | Stateless | Stateful |\n|---|---|---|\n| **Giao thức** | HTTP: mỗi request độc lập | TCP (kết nối có trạng thái), **WebSocket**, gRPC streaming, FTP |\n| **Xác thực** | **JWT**: token chứa thông tin user và chữ ký, server chỉ cần kiểm tra chữ ký | **Session**: server lưu session, client giữ `JSESSIONID` cookie |\n| **Service** | REST API Spring Boot, mọi dữ liệu nằm ở DB hoặc Redis | Game server, chat server giữ kết nối WebSocket, service có cache cục bộ quan trọng |\n| **Lưu trữ** | | Database, Kafka broker, Redis, Elasticsearch: **bản chất là stateful** |\n| **Kubernetes** | **Deployment**: pod giống nhau, tên ngẫu nhiên, thay thế tùy ý | **StatefulSet**: pod có tên cố định (`db-0`, `db-1`), ổ đĩa riêng gắn theo pod, khởi động theo thứ tự |\n| **Firewall** | Stateless firewall: xét từng gói tin riêng lẻ | Stateful firewall: nhớ kết nối, tự cho gói trả lời đi qua (AWS Security Group là stateful, Network ACL là stateless) |\n| **Xử lý stream** | Lọc, biến đổi từng message | Đếm, cộng dồn theo cửa sổ thời gian, join stream (Kafka Streams, Flink lưu state store) |\n\n**Session và JWT, chi tiết hơn:**\n\n| | Session (stateful) | JWT (stateless) |\n|---|---|---|\n| Lưu ở đâu | Server (bộ nhớ, hoặc Redis qua Spring Session) | Client giữ token |\n| Thu hồi ngay (logout, khóa tài khoản) | **Dễ**: xóa session | **Khó**: token còn hiệu lực tới khi hết hạn; cần TTL ngắn + refresh token, hoặc danh sách chặn (lại thành có trạng thái) |\n| Scale | Cần session dùng chung (Redis) hoặc sticky session | Dễ, instance nào cũng kiểm tra được |\n| Kích thước | Cookie nhỏ | Token lớn hơn, gửi kèm mỗi request |\n| Hợp với | Web app truyền thống, cần thu hồi ngay | API, mobile, microservices, gọi giữa các service |\n\nThực tế hay kết hợp: **access token JWT sống ngắn (5–15 phút) + refresh token lưu ở server** để thu hồi được.\n\n**Câu trả lời mẫu:** *\"Stateless nghĩa là server không nhớ gì giữa các request, nên instance nào cũng phục vụ được và scale ngang dễ. Tôi giữ tầng ứng dụng stateless bằng cách đưa trạng thái ra ngoài: session vào Redis hoặc dùng JWT, file vào S3, cache dùng chung vào Redis. Những thành phần vốn stateful như database, Kafka hay WebSocket server thì tôi xử lý riêng: replication, StatefulSet, hoặc định tuyến về đúng node.\"*\n\n### English\n\n**Definitions:**\n- **Stateless:** the server **keeps nothing about a client's previous requests**. Each request carries **all the information** needed to process it independently, so **any instance** can handle it.\n- **Stateful:** the server **remembers state** between requests (sessions, connections, in-memory data). Later requests depend on earlier ones, so they often have to return to **the same instance** that holds the state.\n\n**An important point:** every system has state (carts, orders, balances). A \"stateless service\" means **the state has been pushed out** (to a database, Redis, or a client-side token), not that there is no state.\n\n| | Stateless | Stateful |\n|---|---|---|\n| Where the state lives | Outside the process: DB, Redis, S3, the client's token | In the instance's own memory or disk |\n| Horizontal scaling | **Easy**: add instances and let the load balancer spread traffic | Hard: needs sticky sessions, data partitioning, state synchronization |\n| An instance dies | Nothing is lost; the next request goes elsewhere | **State is lost** (sessions, connections) unless replicated |\n| Deploys, restarts | Easy; rolling updates freely | State must be drained, moved or restored |\n| Performance | Can be slower, since each request reads state from outside | Fast, since the data is already in memory |\n| Complexity | Low at the application tier | Higher |\n\n**Examples at each layer:**\n\n| Layer | Stateless | Stateful |\n|---|---|---|\n| **Protocols** | HTTP: each request is independent | TCP (stateful connections), **WebSocket**, gRPC streaming, FTP |\n| **Authentication** | **JWT**: the token holds user info and a signature; the server only verifies the signature | **Sessions**: the server stores the session; the client holds a `JSESSIONID` cookie |\n| **Services** | A Spring Boot REST API with all data in the DB or Redis | Game servers, chat servers holding WebSocket connections, services with an important local cache |\n| **Storage** | | Databases, Kafka brokers, Redis, Elasticsearch: **stateful by nature** |\n| **Kubernetes** | **Deployment**: identical pods with random names, replaceable at will | **StatefulSet**: stable pod names (`db-0`, `db-1`), a dedicated volume per pod, ordered startup |\n| **Firewalls** | Stateless firewalls: judge each packet on its own | Stateful firewalls: track connections and let reply packets through automatically (AWS Security Groups are stateful; Network ACLs are stateless) |\n| **Stream processing** | Filtering or transforming each message | Counting, aggregating over time windows, joining streams (Kafka Streams and Flink keep state stores) |\n\n**Sessions vs JWT in more detail:**\n\n| | Sessions (stateful) | JWT (stateless) |\n|---|---|---|\n| Stored where | On the server (in memory, or in Redis via Spring Session) | The client holds the token |\n| Immediate revocation (logout, account lock) | **Easy**: delete the session | **Hard**: the token stays valid until it expires; you need short TTLs + refresh tokens, or a denylist (which brings state back) |\n| Scaling | Needs a shared session store (Redis) or sticky sessions | Easy; any instance can verify |\n| Size | A small cookie | A larger token sent with every request |\n| Fits | Traditional web apps needing immediate revocation | APIs, mobile, microservices, service-to-service calls |\n\nIn practice they're often combined: **a short-lived JWT access token (5–15 minutes) + a refresh token stored on the server** so access can be revoked.\n\n**A model answer:** *\"Stateless means the server remembers nothing between requests, so any instance can serve them and horizontal scaling is easy. I keep the application tier stateless by pushing state out: sessions into Redis or JWTs, files into S3, shared caches into Redis. Components that are stateful by nature, like databases, Kafka or WebSocket servers, I handle separately: replication, StatefulSets, or routing to the right node.\"*", "excerpt": "Định nghĩa: Stateless (phi trạng thái): server không giữ thông tin gì về các request trước của client. Mỗi request mang đủ thông tin để được xử lý độc lập, nên bất kỳ instance nào cũng xử lý được. Stateful (có trạng thái", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-stateful-scaling", "title": "Làm sao scale và vận hành thành phần stateful (WebSocket, database, StatefulSet)? Chuyển một service stateful sang stateless thế nào? / How do you scale and operate stateful components (WebSocket, databases, StatefulSets), and how do you turn a stateful service into a stateless one?", "cat": "arch", "section": "Nền tảng scale", "kind": "qa", "tags": ["stateful", "scalability", "kubernetes", "websocket", "kafka"], "body": "### Tiếng Việt\n\n**1. Chuyển service stateful sang stateless (checklist hay gặp khi lên Kubernetes):**\n\n| Trạng thái đang nằm trong instance | Đưa ra ngoài bằng |\n|---|---|\n| `HttpSession` trong bộ nhớ | **Spring Session + Redis**, hoặc chuyển sang JWT |\n| File upload ghi ra ổ local | **S3** / object storage |\n| Cache cục bộ cần nhất quán | Redis, hoặc chấp nhận lệch với TTL ngắn + broadcast invalidation |\n| Job `@Scheduled` chạy trên mọi instance | **ShedLock** (khóa qua DB/Redis), hoặc tách thành job riêng (Kubernetes CronJob) |\n| Bộ đếm, rate limit trong bộ nhớ | Redis (`INCR`, sorted set) |\n| Khóa `synchronized` để chống trùng | Khóa phân tán, hoặc **ràng buộc unique / optimistic locking trong DB** |\n| Workflow nhiều bước giữ trong RAM | Lưu trạng thái vào DB (state machine), xử lý qua hàng đợi |\n\n**2. Sticky session:** load balancer gắn user vào một instance (theo cookie). Là cách **chữa cháy** khi chưa đưa được trạng thái ra ngoài: tải lệch, instance chết thì user mất session, scale down hay deploy làm đứt phiên.\n\n**3. Scale WebSocket (kết nối là trạng thái không tránh được):**\n- Mỗi client giữ kết nối lâu dài tới **một** instance. Khi user A (ở instance 1) gửi tin cho user B (ở instance 3), instance 1 không có kết nối của B.\n- Giải pháp: **pub/sub giữa các instance** (Redis pub/sub, Kafka, hoặc message broker STOMP như RabbitMQ). Instance 1 phát tin, instance đang giữ kết nối của B nhận và đẩy xuống. Hoặc lưu **registry user → instance** trong Redis để gửi thẳng.\n- Load balancer phải hỗ trợ kết nối lâu (timeout idle lớn, ALB hỗ trợ WebSocket); dùng heartbeat để phát hiện kết nối chết.\n- Khi deploy hoặc instance chết, client **tự kết nối lại** (có backoff) và lấy lại tin nhắn bị lỡ từ DB theo id tin cuối đã nhận.\n- Giới hạn: mỗi instance giữ được bao nhiêu kết nối (file descriptor, RAM); scale theo số kết nối, không theo CPU.\n\n**4. Database và thành phần lưu trữ (stateful thật sự):**\n- **Scale đọc** bằng read replica; **scale ghi** bằng sharding (chia dữ liệu theo key).\n- **HA** bằng replication + failover tự động (Patroni, RDS Multi-AZ).\n- Thường dùng **dịch vụ quản lý** (RDS, ElastiCache, MSK) thay vì tự chạy, vì vận hành stateful khó hơn nhiều.\n\n**5. StatefulSet trong Kubernetes** (khi tự chạy Kafka, PostgreSQL, Elasticsearch, Zookeeper...):\n- **Tên và DNS ổn định:** `kafka-0.kafka.svc`, pod tạo lại vẫn giữ tên, nên các node nhận ra nhau.\n- **Mỗi pod một PersistentVolume riêng** (`volumeClaimTemplates`); pod tạo lại trên node khác vẫn gắn lại đúng ổ của mình.\n- **Thứ tự:** tạo `0, 1, 2` tuần tự, xóa ngược lại; rolling update từng pod một.\n- Cần **headless Service** cho DNS từng pod; `PodDisruptionBudget` để không mất quá nhiều node cùng lúc.\n- Vẫn phải tự lo replication, backup, nâng cấp: thường dùng **Operator** (Strimzi cho Kafka, CloudNativePG / Zalando cho PostgreSQL).\n\n**6. Partition trạng thái theo key** (cách scale stateful phổ biến): định tuyến mọi request của cùng một key về cùng một node bằng **consistent hashing** hoặc partition (Kafka consumer theo partition, Kafka Streams state store, actor model như Akka). Mỗi node giữ trạng thái của một phần key, thêm node thì chuyển một phần key.\n\n**Câu trả lời mẫu:** *\"Tôi giữ service nghiệp vụ stateless và đẩy trạng thái ra DB, Redis, S3. Với thứ vốn stateful như WebSocket, tôi chấp nhận kết nối gắn với một instance nhưng dùng Redis pub/sub để định tuyến tin giữa các instance và cho client tự kết nối lại. Database thì dùng dịch vụ quản lý có replication; nếu phải tự chạy trên Kubernetes thì dùng StatefulSet kèm Operator.\"*\n\n### English\n\n**1. Turning a stateful service into a stateless one (a common checklist when moving to Kubernetes):**\n\n| State currently inside the instance | Move it out with |\n|---|---|\n| In-memory `HttpSession` | **Spring Session + Redis**, or switch to JWTs |\n| File uploads written to local disk | **S3** / object storage |\n| Local caches that must be consistent | Redis, or accept divergence with short TTLs + broadcast invalidation |\n| `@Scheduled` jobs running on every instance | **ShedLock** (a lock in the DB/Redis), or a separate job (a Kubernetes CronJob) |\n| In-memory counters, rate limits | Redis (`INCR`, sorted sets) |\n| `synchronized` locks to prevent duplicates | Distributed locks, or **unique constraints / optimistic locking in the DB** |\n| Multi-step workflows held in RAM | Persist the state in the DB (a state machine) and process via a queue |\n\n**2. Sticky sessions:** the load balancer pins a user to one instance (by cookie). It's a **stopgap** for when state hasn't been moved out yet: load becomes uneven, users lose their session when an instance dies, and scale-downs or deploys cut sessions.\n\n**3. Scaling WebSockets (the connection is unavoidable state):**\n- Each client holds a long-lived connection to **one** instance. When user A (on instance 1) messages user B (on instance 3), instance 1 doesn't hold B's connection.\n- The fix: **pub/sub between instances** (Redis pub/sub, Kafka, or a STOMP broker such as RabbitMQ). Instance 1 publishes, and the instance holding B's connection receives it and pushes it down. Or keep a **user → instance registry** in Redis to send directly.\n- The load balancer must support long-lived connections (a large idle timeout; ALB supports WebSockets); use heartbeats to detect dead connections.\n- On deploys or instance failures, clients **reconnect automatically** (with backoff) and fetch missed messages from the DB using the last received message id.\n- Limits: how many connections one instance can hold (file descriptors, RAM); scale on connection count, not CPU.\n\n**4. Databases and storage (truly stateful):**\n- **Scale reads** with read replicas; **scale writes** with sharding (partitioning data by key).\n- **HA** through replication + automatic failover (Patroni, RDS Multi-AZ).\n- Often use **managed services** (RDS, ElastiCache, MSK) instead of running them yourself, because operating stateful systems is much harder.\n\n**5. StatefulSets in Kubernetes** (when you run Kafka, PostgreSQL, Elasticsearch, ZooKeeper... yourself):\n- **Stable names and DNS:** `kafka-0.kafka.svc`; a recreated pod keeps its name, so nodes recognize each other.\n- **One PersistentVolume per pod** (`volumeClaimTemplates`); a pod recreated on another node reattaches its own volume.\n- **Ordering:** pods are created `0, 1, 2` in sequence and deleted in reverse; rolling updates go one pod at a time.\n- You need a **headless Service** for per-pod DNS, and a `PodDisruptionBudget` so too many nodes aren't lost at once.\n- You still handle replication, backups and upgrades yourself, usually through an **Operator** (Strimzi for Kafka, CloudNativePG / Zalando for PostgreSQL).\n\n**6. Partitioning state by key** (a common way to scale stateful work): route every request for the same key to the same node using **consistent hashing** or partitions (Kafka consumers per partition, Kafka Streams state stores, actor models like Akka). Each node holds the state for a share of the keys, and adding a node moves some keys over.\n\n**A model answer:** *\"I keep business services stateless and push state out to the DB, Redis and S3. For things that are inherently stateful, like WebSockets, I accept that a connection is tied to one instance but use Redis pub/sub to route messages between instances and let clients reconnect automatically. For databases I use managed services with replication; if I have to run them on Kubernetes myself, I use a StatefulSet with an Operator.\"*", "excerpt": "1. Chuyển service stateful sang stateless (checklist hay gặp khi lên Kubernetes): 2. Sticky session: load balancer gắn user vào một instance (theo cookie). Là cách chữa cháy khi chưa đưa được trạng thái ra ngoài: tải lệc", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "microservices-3", "title": "Làm sao giữ dữ liệu nhất quán giữa các service? Saga pattern là gì? / How do you keep data consistent across services? What is the saga pattern?", "cat": "messaging", "section": "Microservices", "tags": ["microservices"], "body": "### Tiếng Việt\n\nMỗi service sở hữu database riêng, nên **không có transaction chung** giữa các service. Distributed transaction kiểu 2PC chặn tài nguyên và không hợp microservices. Cách phổ biến là **Saga**.\n\n**Saga** là chuỗi **transaction cục bộ**: mỗi bước commit trong database của service đó rồi phát sự kiện hoặc lệnh cho bước tiếp theo. Nếu một bước thất bại, các bước **đã commit** được hoàn tác bằng **transaction bù (compensating transaction)**.\n\n**Ví dụ đặt hàng:**\n\n```\n1. Order Service:     tạo đơn PENDING\n2. Payment Service:   trừ tiền            (bù: hoàn tiền)\n3. Inventory Service: giữ hàng            (bù: trả hàng về kho)\n4. Order Service:     chuyển đơn CONFIRMED\nNếu bước 3 hết hàng → chạy bù bước 2 (hoàn tiền) → đơn CANCELLED\n```\n\n**Hai cách triển khai:**\n\n| | Choreography | Orchestration |\n|---|---|---|\n| Cách làm | Mỗi service nghe sự kiện và tự quyết bước tiếp | Một **orchestrator** ra lệnh cho từng service theo kịch bản |\n| Ưu | Đơn giản, ít phụ thuộc trung tâm | **Dễ nhìn toàn bộ luồng**, dễ debug, timeout, retry |\n| Nhược | Luồng dài thì khó theo dõi, dễ phụ thuộc vòng | Thêm một thành phần phải vận hành |\n| Hợp với | 2–4 bước đơn giản | Luồng dài, nghiệp vụ phức tạp (thanh toán, đặt vé) |\n\nOrchestrator có thể tự viết (state machine lưu trong DB) hoặc dùng **Temporal**, Camunda, AWS Step Functions.\n\n**Những điểm bắt buộc:**\n- Mỗi bước phát sự kiện bằng **outbox pattern**, để commit DB và gửi message không bị lệch nhau.\n- Mọi bước và mọi bước bù phải **idempotent**, vì message có thể giao lại.\n- Bước bù phải **luôn thành công được**: retry tới khi xong; nếu nghiệp vụ không hoàn tác được (email đã gửi) thì bù bằng hành động khác (gửi email đính chính).\n- **Thiếu isolation:** trong lúc saga chạy, service khác có thể thấy trạng thái trung gian. Giảm thiểu bằng trạng thái `PENDING` (semantic lock), hoặc sắp xếp bước có rủi ro thất bại cao lên trước bước khó bù.\n\n**Kết quả:** **eventual consistency**: hệ thống nhất quán sau khi saga hoàn tất hoặc đã bù xong. UI và API phải hiển thị được trạng thái trung gian (\"Đang xử lý\").\n\n### English\n\nEach service owns its database, so there's **no shared transaction** across services. Distributed transactions like 2PC lock resources and don't fit microservices. The common approach is a **saga**.\n\nA **saga** is a sequence of **local transactions**: each step commits in its own service's database and then publishes an event or command for the next step. If a step fails, the steps **already committed** are undone with **compensating transactions**.\n\n**Order example:**\n\n```\n1. Order Service:     create order as PENDING\n2. Payment Service:   charge the customer     (compensation: refund)\n3. Inventory Service: reserve the items       (compensation: release stock)\n4. Order Service:     mark order CONFIRMED\nIf step 3 is out of stock → run step 2's compensation (refund) → order CANCELLED\n```\n\n**Two implementation styles:**\n\n| | Choreography | Orchestration |\n|---|---|---|\n| How | Each service listens to events and decides the next step itself | An **orchestrator** commands each service according to a workflow |\n| Pros | Simple, no central component | **Whole flow visible in one place**, easier debugging, timeouts and retries |\n| Cons | Long flows are hard to follow, risk of cyclic dependencies | One more component to operate |\n| Fits | 2–4 simple steps | Long flows, complex business logic (payments, bookings) |\n\nThe orchestrator can be hand-written (a state machine persisted in the database) or a tool such as **Temporal**, Camunda or AWS Step Functions.\n\n**Non-negotiables:**\n- Each step publishes its events with the **outbox pattern**, so the database commit and the message can't diverge.\n- Every step and every compensation must be **idempotent**, because messages can be redelivered.\n- Compensations must **always be able to succeed**: retry until they do; if an action can't be undone (an email was sent), compensate with another action (a correction email).\n- **No isolation:** while a saga runs, other services can see intermediate state. Mitigate with a `PENDING` state (a semantic lock), or order the steps so those most likely to fail run before those that are hard to compensate.\n\n**The result is eventual consistency:** the system is consistent once the saga completes or finishes compensating. UIs and APIs must be able to show intermediate states (\"Processing\").", "kind": "qa", "num": 3, "tip": "", "excerpt": "Mỗi service sở hữu database riêng, nên không có transaction chung giữa các service. Distributed transaction kiểu 2PC chặn tài nguyên và không hợp microservices. Cách phổ biến là Saga. Saga là chuỗi transaction cục bộ: mỗ", "catLabel": "Microservices & System Design", "bilingual": true}, {"id": "microservices-4", "title": "Outbox pattern là gì? Hoạt động cụ thể thế nào? / What is the outbox pattern, and how exactly does it work?", "cat": "messaging", "section": "Microservices", "tags": ["microservices"], "body": "### Tiếng Việt\n\n**1. Vấn đề cần giải quyết: dual write (ghi hai nơi)**\n\nOrder service cần làm hai việc: lưu đơn vào PostgreSQL **và** gửi sự kiện `OrderCreated` lên Kafka để Payment và Inventory xử lý tiếp. Hai hệ thống này **không có transaction chung**, nên dù viết theo thứ tự nào cũng có lỗi:\n\n| Cách viết | Lỗi xảy ra khi | Hậu quả |\n|---|---|---|\n| Lưu DB, rồi gửi Kafka | App chết hoặc Kafka lỗi **sau khi commit** | Có đơn nhưng **không ai nhận sự kiện**: không thanh toán, không trừ kho |\n| Gửi Kafka, rồi lưu DB | DB rollback (vi phạm ràng buộc, timeout) | Hệ thống khác xử lý một **đơn không tồn tại** |\n| Gửi Kafka **bên trong** `@Transactional` | Gửi xong thì transaction rollback | Giống trường hợp trên |\n| `@TransactionalEventListener(AFTER_COMMIT)` | App chết ngay sau commit | Sự kiện chỉ nằm trong RAM nên **mất** |\n\n**2. Ý tưởng:** không gửi trực tiếp lên broker. Ghi sự kiện vào một **bảng `outbox` trong cùng database, cùng transaction** với dữ liệu nghiệp vụ. Một transaction local là atomic: hoặc có cả đơn lẫn sự kiện, hoặc không có gì. Sau đó một tiến trình riêng (**relay**) đọc bảng outbox và đẩy lên Kafka.\n\n```\n[Order service]                                   \n  BEGIN\n    INSERT INTO orders ...                        \n    INSERT INTO outbox ...      ← cùng transaction\n  COMMIT\n            │\n            ▼\n[Relay: polling hoặc CDC] ──► Kafka topic \"order.events\" ──► Payment, Inventory\n```\n\n**3. Bảng outbox:**\n\n```sql\nCREATE TABLE outbox (\n    id             uuid PRIMARY KEY,          -- cũng dùng làm eventId để consumer chống trùng\n    aggregate_type varchar(50)  NOT NULL,     -- 'Order' → chọn topic\n    aggregate_id   varchar(50)  NOT NULL,     -- orderId → làm Kafka key để giữ thứ tự theo đơn\n    event_type     varchar(100) NOT NULL,     -- 'OrderCreated'\n    payload        jsonb        NOT NULL,\n    created_at     timestamptz  NOT NULL DEFAULT now(),\n    published_at   timestamptz                -- NULL = chưa gửi (chỉ cần cho cách polling)\n);\nCREATE INDEX idx_outbox_unpublished ON outbox (created_at) WHERE published_at IS NULL;\n```\n\n**4. Code ghi (Spring):**\n\n```java\n@Transactional\npublic Order createOrder(CreateOrderCommand cmd) {\n    Order order = orderRepository.save(Order.from(cmd));\n    outboxRepository.save(new OutboxEvent(\n        UUID.randomUUID(), \"Order\", order.getId().toString(),\n        \"OrderCreated\", toJson(new OrderCreated(order.getId(), order.getTotal()))));\n    return order;   // KHÔNG gọi kafkaTemplate ở đây\n}\n```\n\n**5. Relay, hai cách:**\n\n**a) Polling publisher:** một job chạy mỗi 0,5–1 giây.\n\n```java\n@Scheduled(fixedDelay = 500)\n@Transactional\npublic void publish() {\n    // SKIP LOCKED: nhiều instance cùng chạy mà không lấy trùng dòng\n    List<OutboxEvent> batch = em.createNativeQuery(\"\"\"\n        SELECT * FROM outbox WHERE published_at IS NULL\n        ORDER BY created_at LIMIT 100 FOR UPDATE SKIP LOCKED\"\"\", OutboxEvent.class).getResultList();\n    for (OutboxEvent e : batch) {\n        kafkaTemplate.send(\"order.events\", e.getAggregateId(), e.getPayload()).get(); // chờ broker ack\n        e.setPublishedAt(Instant.now());\n    }\n}\n```\n\n- Ưu: đơn giản, không cần thêm hạ tầng.\n- Nhược: độ trễ bằng chu kỳ poll, query liên tục vào DB, và bảng phải dọn định kỳ.\n\n**b) CDC (Change Data Capture) với Debezium:** Debezium đọc **WAL của PostgreSQL** (hoặc binlog của MySQL), thấy dòng mới trong `outbox` thì đẩy lên Kafka. Debezium có sẵn **Outbox Event Router** để chọn topic theo `aggregate_type` và dùng `aggregate_id` làm key.\n\n- Ưu: độ trễ thấp (mili giây), không poll DB, thứ tự đúng theo thứ tự commit.\n- Nhược: phải vận hành Kafka Connect và Debezium, cấu hình replication slot. Slot bị bỏ quên thì WAL phình to và có thể làm đầy đĩa.\n- Với CDC có thể xóa dòng outbox ngay trong cùng transaction (INSERT rồi DELETE), vì Debezium vẫn đọc được từ WAL, nên bảng luôn nhỏ.\n\n**6. Đảm bảo giao hàng: at-least-once, không phải exactly-once.** Relay có thể gửi xong lên Kafka nhưng chết trước khi đánh dấu `published_at`, nên lần sau sẽ **gửi lại**. Vì vậy **consumer bắt buộc phải idempotent**. Cách phổ biến là bảng ghi nhận sự kiện đã xử lý (còn gọi là **inbox pattern**):\n\n```java\n@KafkaListener(topics = \"order.events\")\n@Transactional\npublic void on(ConsumerRecord<String, String> rec) {\n    UUID eventId = UUID.fromString(new String(rec.headers().lastHeader(\"id\").value()));\n    // INSERT ... ON CONFLICT DO NOTHING trả về 0 nếu đã xử lý rồi\n    if (processedRepo.insertIfAbsent(eventId) == 0) return;   // trùng → bỏ qua\n    paymentService.charge(parse(rec.value()));                 // cùng transaction với dòng processed\n}\n```\n\n**7. Thứ tự:** dùng `aggregate_id` làm Kafka key, nên mọi sự kiện của cùng một đơn vào **cùng partition**, tức đúng thứ tự. Với polling, thứ tự theo `created_at` có thể lệch nhẹ khi nhiều transaction commit đồng thời; nếu cần chặt chẽ thì dùng CDC, hoặc thêm cột version để consumer bỏ qua sự kiện cũ hơn.\n\n**8. Vận hành:**\n- **Dọn bảng:** xóa dòng đã gửi quá N ngày, hoặc partition bảng theo ngày rồi drop partition cũ.\n- **Giám sát:** số dòng chưa gửi và tuổi của dòng cũ nhất. Tăng dần nghĩa là relay đang kẹt.\n- **Schema sự kiện:** coi payload là hợp đồng công khai, có version, dùng Avro hoặc JSON Schema với Schema Registry.\n\n**9. Khi nào không cần outbox:** khi mất sự kiện cũng chấp nhận được (log, analytics), hoặc khi sự kiện **chính là** nguồn sự thật (event sourcing, ghi thẳng vào Kafka rồi các service tự xây trạng thái từ đó).\n\n**Câu trả lời mẫu (khoảng 45 giây):** *\"Outbox giải quyết bài toán dual write: không thể commit DB và gửi Kafka một cách atomic. Tôi ghi thay đổi nghiệp vụ và một dòng outbox trong cùng transaction local, rồi một relay, polling với `FOR UPDATE SKIP LOCKED` hoặc Debezium đọc WAL, đẩy dòng đó lên Kafka với key là aggregate id để giữ thứ tự. Đảm bảo là at-least-once, nên mỗi sự kiện có id và consumer chống trùng bằng bảng processed-events trong cùng transaction với xử lý nghiệp vụ.\"*\n\n### English\n\n**1. The problem: dual writes**\n\nThe Order service has to do two things: save the order in PostgreSQL **and** publish an `OrderCreated` event to Kafka so Payment and Inventory can continue. The two systems **share no transaction**, so every ordering has a failure mode:\n\n| Approach | Fails when | Consequence |\n|---|---|---|\n| Save to the DB, then send to Kafka | The app crashes or Kafka fails **after the commit** | The order exists but **nobody receives the event**: no payment, no stock reservation |\n| Send to Kafka, then save to the DB | The DB rolls back (constraint violation, timeout) | Other systems process an **order that doesn't exist** |\n| Send to Kafka **inside** `@Transactional` | The transaction rolls back after the send | Same as above |\n| `@TransactionalEventListener(AFTER_COMMIT)` | The app crashes right after the commit | The event lived only in memory, so it's **lost** |\n\n**2. The idea:** don't send directly to the broker. Write the event to an **`outbox` table in the same database, in the same transaction** as the business data. A local transaction is atomic: either both the order and the event exist, or neither does. A separate process (the **relay**) then reads the outbox table and pushes the events to Kafka.\n\n```\n[Order service]\n  BEGIN\n    INSERT INTO orders ...\n    INSERT INTO outbox ...      ← same transaction\n  COMMIT\n            │\n            ▼\n[Relay: polling or CDC] ──► Kafka topic \"order.events\" ──► Payment, Inventory\n```\n\n**3. The outbox table:**\n\n```sql\nCREATE TABLE outbox (\n    id             uuid PRIMARY KEY,          -- also the eventId consumers use for deduplication\n    aggregate_type varchar(50)  NOT NULL,     -- 'Order' → selects the topic\n    aggregate_id   varchar(50)  NOT NULL,     -- orderId → the Kafka key, preserving per-order ordering\n    event_type     varchar(100) NOT NULL,     -- 'OrderCreated'\n    payload        jsonb        NOT NULL,\n    created_at     timestamptz  NOT NULL DEFAULT now(),\n    published_at   timestamptz                -- NULL = not yet sent
