of attempts)\n}\n```\n\nWithin one instance, Caffeine's `LoadingCache` already collapses concurrent loads of the same key. A Redis lock is only needed across several instances.", "excerpt": "Ví dụ single-flight với khóa Redis: Trong một instance, Caffeine với LoadingCache đã tự gộp các lần nạp đồng thời cho cùng key. Khóa Redis chỉ cần khi có nhiều instance. Single-flight example with a Redis lock: Within on", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "cache-consistency", "title": "Làm sao giữ cache và database nhất quán? / How do you keep the cache and the database consistent?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["cache", "consistency", "redis", "kafka"], "body": "### Tiếng Việt\n\nCache và DB là hai hệ thống, nên **không có nhất quán tuyệt đối** nếu không có transaction chung. Mục tiêu là giữ khoảng lệch **ngắn và có giới hạn**.\n\n**So sánh các thứ tự ghi:**\n\n| Cách | Vấn đề |\n|---|---|\n| Cập nhật cache, rồi cập nhật DB | DB lỗi thì cache chứa giá trị **chưa từng tồn tại** |\n| Cập nhật DB, rồi **cập nhật** cache | Hai lần ghi đồng thời có thể để cache theo thứ tự sai, tức **giá trị cũ** |\n| Xóa cache, rồi cập nhật DB | Giữa hai bước, một request đọc nạp lại **giá trị cũ** vào cache |\n| **Cập nhật DB, rồi xóa cache** | **Tốt nhất**, vẫn còn một khe hở nhỏ (xem bên dưới) |\n\n**Khe hở còn lại của \"cập nhật DB rồi xóa cache\":** request A đọc miss và lấy giá trị cũ từ DB; request B cập nhật DB rồi xóa cache; A ghi giá trị cũ vào cache. Khe hở này hiếm vì đọc DB thường nhanh hơn ghi, nhưng vẫn có thể xảy ra.\n\n**Các cách thu hẹp tiếp:**\n1. **TTL là lưới an toàn:** mọi key đều có TTL, nên dữ liệu sai tự hết hạn.\n2. **Delayed double delete:** xóa cache, cập nhật DB, rồi **xóa thêm lần nữa sau vài trăm ms** (bất đồng bộ).\n3. **Xóa qua CDC:** Debezium đọc binlog/WAL của DB rồi phát sự kiện, consumer xóa cache. Không bỏ sót kể cả khi app chết giữa chừng, và **tách việc xóa cache khỏi code nghiệp vụ**. Xóa thất bại thì retry từ Kafka.\n4. **Version hoặc timestamp:** lưu version trong value; chỉ ghi vào cache nếu version mới hơn (dùng Lua script để so sánh và ghi atomic).\n5. **Không cache** dữ liệu bắt buộc mới tuyệt đối: số dư khi trừ tiền, tồn kho lúc đặt hàng. Đọc thẳng DB, hoặc dùng Redis làm nguồn sự thật có kiểm soát (như flash sale) rồi đối soát.\n\n**Cache cục bộ trên nhiều instance (Caffeine):** mỗi instance có bản riêng, nên khi dữ liệu đổi phải **broadcast invalidation** (Redis pub/sub hoặc Kafka) tới mọi instance, hoặc chỉ dùng TTL rất ngắn.\n\n**Câu trả lời mẫu:** *\"Tôi dùng cache-aside: ghi DB, xóa cache sau commit, mọi key có TTL kèm jitter. Với dữ liệu quan trọng, tôi xóa cache qua CDC để không bỏ sót, và không cache những giá trị cần nhất quán mạnh như số dư.\"*\n\n### English\n\nThe cache and the database are two systems, so **there's no perfect consistency** without a shared transaction. The goal is to keep the window of inconsistency **short and bounded**.\n\n**Comparing write orders:**\n\n| Approach | Problem |\n|---|---|\n| Update the cache, then the DB | If the DB write fails, the cache holds a value **that never existed** |\n| Update the DB, then **update** the cache | Two concurrent writes can leave the cache in the wrong order, i.e. a **stale value** |\n| Delete the cache, then update the DB | Between the two steps, a read can reload the **old value** into the cache |\n| **Update the DB, then delete the cache** | **Best**, though a small gap remains (see below) |\n\n**The remaining gap in \"update DB, then delete cache\":** request A misses and reads the old value from the DB; request B updates the DB and deletes the cache; A then writes the old value into the cache. It's rare because DB reads are usually faster than writes, but it can happen.\n\n**Ways to narrow it further:**\n1. **TTL as a safety net:** every key has a TTL, so wrong data expires on its own.\n2. **Delayed double delete:** delete the cache, update the DB, then **delete again a few hundred ms later** (asynchronously).\n3. **Invalidation via CDC:** Debezium reads the DB's binlog/WAL and emits events, and a consumer deletes cache keys. Nothing is missed even if the app dies midway, and **cache invalidation is decoupled from business code**. Failed deletes are retried from Kafka.\n4. **Versions or timestamps:** store a version in the value and only write to the cache if the version is newer (a Lua script compares and writes atomically).\n5. **Don't cache** data that must be absolutely fresh: a balance when charging, stock at checkout. Read the DB directly, or use Redis as a controlled source of truth (as in a flash sale) and reconcile.\n\n**Local caches across many instances (Caffeine):** each instance has its own copy, so on changes you must **broadcast invalidations** (Redis pub/sub or Kafka) to every instance, or use only very short TTLs.\n\n**A model answer:** *\"I use cache-aside: write the DB, delete the cache after commit, and every key has a TTL with jitter. For important data I invalidate through CDC so nothing is missed, and I don't cache values that need strong consistency, such as balances.\"*", "excerpt": "Cache và DB là hai hệ thống, nên không có nhất quán tuyệt đối nếu không có transaction chung. Mục tiêu là giữ khoảng lệch ngắn và có giới hạn. So sánh các thứ tự ghi: Khe hở còn lại của \"cập nhật DB rồi xóa cache\": reque", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "redis-structures", "title": "Redis có những kiểu dữ liệu nào? Dùng cho bài toán gì? Vì sao Redis nhanh? / What data types does Redis have, what are they used for, and why is Redis fast?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["redis", "cache", "kafka"], "body": "### Tiếng Việt\n\n| Kiểu | Lệnh tiêu biểu | Dùng cho |\n|---|---|---|\n| **String** | `SET key val EX 60 NX`, `INCR`, `GET` | Cache object (JSON), bộ đếm, **khóa phân tán** (`SET NX PX`), rate limit |\n| **Hash** | `HSET user:1 name An`, `HINCRBY` | Object nhiều field, cập nhật từng field mà không đọc ghi lại cả object |\n| **List** | `LPUSH`, `RPOP`, `BLPOP`, `LRANGE` | Hàng đợi đơn giản, N mục mới nhất (feed, log gần đây) |\n| **Set** | `SADD`, `SISMEMBER`, `SINTER` | Tập không trùng: tag, người đã like, giao hai tập (bạn chung) |\n| **Sorted Set** | `ZADD`, `ZRANGE ... REV`, `ZRANGEBYSCORE` | **Bảng xếp hạng**, hàng đợi ưu tiên hoặc theo thời gian, **sliding-window rate limit** |\n| **Bitmap** | `SETBIT`, `BITCOUNT` | Điểm danh theo ngày, người dùng hoạt động (1 bit mỗi user) |\n| **HyperLogLog** | `PFADD`, `PFCOUNT` | **Đếm số phần tử khác nhau** gần đúng với khoảng 12 KB, sai số khoảng 0,81% (lượt xem duy nhất) |\n| **Stream** | `XADD`, `XREADGROUP`, `XACK` | Log sự kiện có consumer group, thay Kafka cho tải nhỏ |\n| **Geo** | `GEOADD`, `GEOSEARCH` | Tìm điểm gần nhất (tài xế, cửa hàng) |\n\n**Vì sao Redis nhanh:**\n- Dữ liệu nằm **hoàn toàn trong RAM**.\n- Thực thi lệnh trên **một thread chính**: không tốn chi phí khóa hay chuyển ngữ cảnh, và **mỗi lệnh là atomic**. Từ Redis 6 có thêm I/O thread cho đọc ghi mạng, nhưng lệnh vẫn chạy tuần tự.\n- I/O multiplexing (epoll) phục vụ hàng chục nghìn kết nối.\n- Cấu trúc dữ liệu được tối ưu (listpack, skiplist cho sorted set).\n\n**Hệ quả của single-thread:** **một lệnh chậm chặn tất cả**. Tránh `KEYS *` (dùng `SCAN`), tránh `HGETALL` hay `SMEMBERS` trên tập rất lớn, tránh **big key** (value hàng MB) và xóa big key bằng `UNLINK` thay cho `DEL`.\n\n**Atomic nhiều bước:** dùng **Lua script** (chạy atomic, không bị chen ngang) hoặc `MULTI/EXEC`. Ví dụ trừ tồn kho chỉ khi còn hàng phải nằm trong một Lua script.\n\n### English\n\n| Type | Typical commands | Used for |\n|---|---|---|\n| **String** | `SET key val EX 60 NX`, `INCR`, `GET` | Caching objects (JSON), counters, **distributed locks** (`SET NX PX`), rate limiting |\n| **Hash** | `HSET user:1 name An`, `HINCRBY` | Multi-field objects, updating one field without rewriting the whole object |\n| **List** | `LPUSH`, `RPOP`, `BLPOP`, `LRANGE` | Simple queues, latest-N items (feeds, recent logs) |\n| **Set** | `SADD`, `SISMEMBER`, `SINTER` | Unique collections: tags, users who liked, set intersections (mutual friends) |\n| **Sorted Set** | `ZADD`, `ZRANGE ... REV`, `ZRANGEBYSCORE` | **Leaderboards**, priority or time-ordered queues, **sliding-window rate limiting** |\n| **Bitmap** | `SETBIT`, `BITCOUNT` | Daily check-ins, active users (one bit per user) |\n| **HyperLogLog** | `PFADD`, `PFCOUNT` | **Approximate distinct counts** in about 12 KB with about 0.81% error (unique views) |\n| **Stream** | `XADD`, `XREADGROUP`, `XACK` | An event log with consumer groups, replacing Kafka for small loads |\n| **Geo** | `GEOADD`, `GEOSEARCH` | Nearest-point search (drivers, stores) |\n\n**Why Redis is fast:**\n- Data lives **entirely in RAM**.\n- Commands execute on **one main thread**: no locking or context-switch overhead, and **every command is atomic**. Redis 6 added I/O threads for network reads and writes, but commands still run sequentially.\n- I/O multiplexing (epoll) serves tens of thousands of connections.\n- Data structures are optimized (listpacks, skiplists for sorted sets).\n\n**Consequence of the single thread:** **one slow command blocks everything**. Avoid `KEYS *` (use `SCAN`), avoid `HGETALL` or `SMEMBERS` on very large collections, avoid **big keys** (multi-MB values), and delete big keys with `UNLINK` instead of `DEL`.\n\n**Multi-step atomicity:** use a **Lua script** (runs atomically, nothing interleaves) or `MULTI/EXEC`. For example, decrementing stock only when items remain must happen inside one Lua script.", "excerpt": "Vì sao Redis nhanh: Dữ liệu nằm hoàn toàn trong RAM. Thực thi lệnh trên một thread chính: không tốn chi phí khóa hay chuyển ngữ cảnh, và mỗi lệnh là atomic. Từ Redis 6 có thêm I/O thread cho đọc ghi mạng, nhưng lệnh vẫn ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "redis-ha", "title": "Redis lưu dữ liệu xuống đĩa và chạy HA thế nào? Khi bộ nhớ đầy thì sao? / How does Redis persist data and run highly available, and what happens when memory is full?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["redis", "high-availability"], "body": "### Tiếng Việt\n\n**Persistence, hai cơ chế:**\n\n| | RDB (snapshot) | AOF (append-only file) |\n|---|---|---|\n| Cách làm | Định kỳ fork process, chụp toàn bộ dữ liệu ra file | Ghi **mọi lệnh ghi** vào cuối file |\n| Mất dữ liệu khi sập | Mất từ lần chụp cuối (có thể vài phút) | Với `appendfsync everysec`: mất **tối đa khoảng 1 giây** |\n| Khởi động lại | Nhanh | Chậm hơn (phải chạy lại lệnh); có AOF rewrite để thu gọn |\n| Hợp với | Backup, khôi phục nhanh | Cần ít mất dữ liệu |\n\nThực tế thường bật **cả hai** (Redis 7 dùng AOF nhiều phần, có phần nền dạng RDB). Với cache thuần thì có thể tắt persistence.\n\n**High availability:**\n- **Replication:** một master, nhiều replica, sao chép **bất đồng bộ**, nên master chết có thể mất vài lệnh ghi cuối. `WAIT` giúp giảm rủi ro nhưng không đảm bảo tuyệt đối.\n- **Sentinel:** theo dõi master; master chết thì Sentinel **tự promote** một replica và báo client địa chỉ mới. Dùng khi dữ liệu vừa trong một máy.\n- **Redis Cluster:** chia dữ liệu thành **16.384 hash slot** trên nhiều master (mỗi master có replica), scale cả đọc lẫn ghi. Lệnh nhiều key chỉ chạy được khi các key **cùng slot**: dùng **hash tag** `{user:1}:profile`, `{user:1}:cart`.\n- Dịch vụ quản lý: AWS ElastiCache hoặc MemoryDB, Azure Cache.\n\n**Khi đầy bộ nhớ (`maxmemory`), theo `maxmemory-policy`:**\n\n| Policy | Hành vi |\n|---|---|\n| `noeviction` (mặc định) | Lệnh ghi bị **báo lỗi** |\n| `allkeys-lru` | Xóa key **ít được dùng gần đây nhất** trong mọi key. **Chọn cho cache** |\n| `allkeys-lfu` | Xóa key **ít được dùng thường xuyên nhất**. Tốt khi có key nóng ổn định |\n| `volatile-lru`, `volatile-lfu`, `volatile-ttl` | Chỉ xóa trong các key **có TTL** |\n| `allkeys-random` | Xóa ngẫu nhiên |\n\nLRU và LFU của Redis là **gần đúng** (lấy mẫu một số key) để tiết kiệm bộ nhớ.\n\n**Lưu ý:** **không dùng Redis làm nguồn sự thật duy nhất cho dữ liệu quan trọng** như tiền hay đơn hàng, vì replication bất đồng bộ có thể mất dữ liệu khi failover. Nếu có dùng (ví dụ đếm tồn kho flash sale), phải có đối soát với DB.\n\n### English\n\n**Persistence, two mechanisms:**\n\n| | RDB (snapshot) | AOF (append-only file) |\n|---|---|---|\n| How | Periodically forks and dumps the whole dataset to a file | Appends **every write command** to a file |\n| Data loss on crash | Everything since the last snapshot (possibly minutes) | With `appendfsync everysec`: **at most about 1 second** |\n| Restart | Fast | Slower (commands are replayed); AOF rewrite keeps it compact |\n| Fits | Backups, fast recovery | Minimal data loss |\n\nIn practice both are often enabled (Redis 7 uses a multi-part AOF with an RDB-format base). For a pure cache, persistence can be turned off.\n\n**High availability:**\n- **Replication:** one master, several replicas, replicated **asynchronously**, so a master failure can lose the last few writes. `WAIT` reduces the risk but doesn't guarantee anything.\n- **Sentinel:** monitors the master; if it dies, Sentinel **automatically promotes** a replica and tells clients the new address. Used when the data fits on one machine.\n- **Redis Cluster:** splits data into **16,384 hash slots** across several masters (each with replicas), scaling both reads and writes. Multi-key commands only work when the keys are **in the same slot**: use **hash tags** such as `{user:1}:profile`, `{user:1}:cart`.\n- Managed services: AWS ElastiCache or MemoryDB, Azure Cache.\n\n**When memory is full (`maxmemory`), per `maxmemory-policy`:**\n\n| Policy | Behaviour |\n|---|---|\n| `noeviction` (default) | Writes **return an error** |\n| `allkeys-lru` | Evicts the **least recently used** key among all keys. **The choice for a cache** |\n| `allkeys-lfu` | Evicts the **least frequently used** key. Good when hot keys are stable |\n| `volatile-lru`, `volatile-lfu`, `volatile-ttl` | Evict only among keys **with a TTL** |\n| `allkeys-random` | Evicts at random |\n\nRedis's LRU and LFU are **approximate** (they sample keys) to save memory.\n\n**Note:** **don't use Redis as the only source of truth for important data** like money or orders, because asynchronous replication can lose data on failover. If you do (for example a flash-sale stock counter), reconcile against the database.", "excerpt": "Persistence, hai cơ chế: Thực tế thường bật cả hai (Redis 7 dùng AOF nhiều phần, có phần nền dạng RDB). Với cache thuần thì có thể tắt persistence. High availability: Replication: một master, nhiều replica, sao chép bất ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "cache-local-vs-distributed", "title": "Cache cục bộ (Caffeine) và cache phân tán (Redis) khác nhau thế nào? Khi nào dùng cả hai? / Local cache (Caffeine) vs distributed cache (Redis): how do they differ, and when do you use both?", "cat": "data", "section": "Cache", "kind": "qa", "tags": ["cache", "redis", "caffeine", "kafka"], "body": "### Tiếng Việt\n\n| | Cache cục bộ (Caffeine, Guava, `ConcurrentHashMap`) | Cache phân tán (Redis, Memcached) |\n|---|---|---|\n| Vị trí | Trong heap của **từng instance** | Server riêng, **dùng chung** cho mọi instance |\n| Tốc độ | **Nhanh nhất** (nano đến micro giây), không qua mạng, không serialize | Khoảng 0,1–1 ms, qua mạng và serialize |\n| Nhất quán giữa instance | **Mỗi instance một bản**, có thể lệch nhau | Một bản chung |\n| Dung lượng | Giới hạn bởi heap, cache lớn làm GC nặng | Lớn, scale riêng |\n| Còn sau khi restart app | Mất | Còn |\n| Hợp với | Dữ liệu nhỏ, **rất nóng, ít đổi**: cấu hình, danh mục, quyền | Dữ liệu cần dùng chung: session, giỏ hàng, rate limit, khóa, cache object lớn |\n\n**Cache hai tầng (L1 Caffeine + L2 Redis):**\n\n```\nRequest → L1 (Caffeine, TTL 30 giây) → miss → L2 (Redis, TTL 10 phút) → miss → DB\n```\n\n- Giảm mạnh số lần gọi Redis cho key cực nóng, và **chống avalanche** khi Redis gặp sự cố.\n- **Vấn đề:** dữ liệu đổi thì L1 ở các instance khác vẫn giữ bản cũ. Cách xử lý: L1 có TTL ngắn, và **broadcast invalidation** qua Redis pub/sub hoặc Kafka để mọi instance xóa key khỏi L1.\n\n**Caffeine cấu hình mẫu:**\n\n```java\nLoadingCache<Long, Product> cache = Caffeine.newBuilder()\n    .maximumSize(10_000)                       // giới hạn số phần tử (thuật toán W-TinyLFU)\n    .expireAfterWrite(Duration.ofSeconds(30))\n    .refreshAfterWrite(Duration.ofSeconds(20)) // làm mới nền, request vẫn nhận giá trị cũ\n    .recordStats()                             // đo hit rate\n    .build(id -> repository.findById(id).orElseThrow());\n```\n\n**Đo hiệu quả:** theo dõi **hit rate**, độ trễ, lượng bộ nhớ, số key bị loại. Hit rate thấp nghĩa là cache không có tác dụng: hoặc sai key, hoặc TTL quá ngắn, hoặc dữ liệu vốn không được đọc lặp lại.\n\n### English\n\n| | Local cache (Caffeine, Guava, `ConcurrentHashMap`) | Distributed cache (Redis, Memcached) |\n|---|---|---|\n| Location | In the heap of **each instance** | A separate server, **shared** by all instances |\n| Speed | **Fastest** (nano- to microseconds), no network, no serialization | About 0.1–1 ms, over the network with serialization |\n| Consistency across instances | **Each instance has its own copy**, copies can diverge | One shared copy |\n| Capacity | Limited by the heap; large caches add GC pressure | Large, scaled independently |\n| Survives app restarts | No | Yes |\n| Fits | Small, **very hot, rarely changing** data: configuration, catalogs, permissions | Data that must be shared: sessions, carts, rate limits, locks, large object caches |\n\n**Two-level cache (L1 Caffeine + L2 Redis):**\n\n```\nRequest → L1 (Caffeine, TTL 30 s) → miss → L2 (Redis, TTL 10 min) → miss → DB\n```\n\n- Greatly reduces Redis calls for extremely hot keys, and **protects against avalanches** when Redis has problems.\n- **The issue:** when data changes, L1 on other instances still holds the old copy. The fix: a short L1 TTL plus **broadcast invalidation** via Redis pub/sub or Kafka so every instance evicts the key from L1.\n\n**Sample Caffeine configuration:**\n\n```java\nLoadingCache<Long, Product> cache = Caffeine.newBuilder()\n    .maximumSize(10_000)                       // bounded size (W-TinyLFU algorithm)\n    .expireAfterWrite(Duration.ofSeconds(30))\n    .refreshAfterWrite(Duration.ofSeconds(20)) // background refresh, requests still get the old value\n    .recordStats()                             // measure hit rate\n    .build(id -> repository.findById(id).orElseThrow());\n```\n\n**Measure effectiveness:** track **hit rate**, latency, memory use and evictions. A low hit rate means the cache isn't helping: the key is wrong, the TTL is too short, or the data simply isn't read repeatedly.", "excerpt": "Cache hai tầng (L1 Caffeine + L2 Redis): Giảm mạnh số lần gọi Redis cho key cực nóng, và chống avalanche khi Redis gặp sự cố. Vấn đề: dữ liệu đổi thì L1 ở các instance khác vẫn giữ bản cũ. Cách xử lý: L1 có TTL ngắn, và ", "catLabel": "SQL, NoSQL & Cache", "tip": "", "num": null}, {"id": "pg-acid-wal", "title": "How does PostgreSQL guarantee atomicity and durability after a crash?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "acid", "transaction"], "body": "\"Through the **write-ahead log**. Every change is written to the WAL and flushed to disk at commit before the data pages themselves are written. After a crash, Postgres replays the WAL from the last checkpoint: committed transactions are redone, and changes from uncommitted ones are simply never visible, because MVCC marks them by transaction ID as aborted.\n\nSo durability means 'the WAL record is on disk', and atomicity comes from all-or-nothing visibility by transaction ID. Trading durability for speed is possible with `synchronous_commit = off`, which risks losing the last few hundred milliseconds of commits but not corruption.\n\nMany NoSQL systems relax ACID across documents or partitions to gain horizontal scale and availability; that's the BASE trade-off. For money, both atomicity and durability are non-negotiable.\"\n\nTham khảo thêm: [Database: ACID Properties](https://minhnhat97kg.github.io/docsify/content/database-acid-properties/vi.md)", "excerpt": "\"Through the write-ahead log. Every change is written to the WAL and flushed to disk at commit before the data pages themselves are written. After a crash, Postgres replays the WAL from the last checkpoint: committed tra", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-mvcc", "title": "What is MVCC, and why does PostgreSQL need VACUUM?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "mvcc", "vacuum"], "body": "\"With MVCC, readers don't block writers and writers don't block readers. Each row version stores `xmin`, the transaction that created it, and `xmax`, the one that deleted it. An `UPDATE` doesn't overwrite; it writes a new version and marks the old one dead. Each transaction sees the versions valid for its snapshot.\n\nDead versions take space and slow scans: that's **bloat**. **VACUUM** marks their space reusable; `VACUUM FULL` rewrites the table and returns space to the OS but takes an exclusive lock, so I prefer `pg_repack` in production. **Autovacuum** runs this automatically; on large, busy tables I lower its scale factors so it runs more often.\n\nIt also prevents **transaction ID wraparound**: IDs are 32-bit, so old rows must be frozen, or Postgres eventually stops accepting writes. Long-running transactions block cleanup, so I monitor them. Related trivia: `COUNT(*)` is slower than you'd expect because visibility must be checked per row, and frequently updating one small column still creates whole new row versions.\"\n\nTham khảo thêm: [MVCC & Dead Tuples](https://minhnhat97kg.github.io/docsify/content/database-mvcc-dead-tuples/vi.md), [Vacuum & Autovacuum](https://minhnhat97kg.github.io/docsify/content/database-vacuum-autovacuum-garbage-collection/vi.md)", "excerpt": "\"With MVCC, readers don't block writers and writers don't block readers. Each row version stores xmin, the transaction that created it, and xmax, the one that deleted it. An UPDATE doesn't overwrite; it writes a new vers", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-isolation", "title": "Read committed vs repeatable read vs serializable in PostgreSQL?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "isolation", "transaction"], "body": "\"PostgreSQL's default is **read committed**: each statement sees data committed before it started, so two reads in one transaction can differ, and phantoms can appear.\n\n**Repeatable read** in Postgres is snapshot isolation: the whole transaction sees one snapshot, which also prevents phantoms for reads. But it allows **write skew**: two transactions each read a condition, such as 'at least one doctor on call', and update different rows, breaking the invariant together.\n\n**Serializable** adds conflict detection (SSI) and aborts one transaction with a serialization error, so the application must retry.\n\nTo avoid anomalies without serializable: lock the rows that guard the invariant with `SELECT ... FOR UPDATE`, use a conditional update, add a unique or exclusion constraint, or use advisory locks. MySQL InnoDB's repeatable read behaves differently, using gap locks, so I name the database when answering.\"\n\nTham khảo thêm: [Database - Isolation Levels](https://minhnhat97kg.github.io/docsify/content/database-isolation-level-read-committed-vs-serializable/vi.md)", "excerpt": "\"PostgreSQL's default is read committed: each statement sees data committed before it started, so two reads in one transaction can differ, and phantoms can appear. Repeatable read in Postgres is snapshot isolation: the w", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-indexes", "title": "Beyond B-tree: when do you use Hash, GIN, GiST or partial indexes?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "indexing"], "body": "\"**B-tree** is the default: equality, ranges, sorting, prefix `LIKE 'abc%'`. With `INCLUDE` columns it enables index-only scans.\n\n**Hash**: equality only, rarely worth it over B-tree.\n\n**GIN**, an inverted index: for values that contain many keys, such as JSONB containment (`@>`), arrays, and full-text search. Reads are fast; inserts are slower because one row updates many entries, which `fastupdate` mitigates.\n\n**GiST**: for geometric and range data, such as PostGIS 'nearest ATM', range overlap, and exclusion constraints.\n\n**pg_trgm** with GIN or GiST makes `LIKE '%abc%'` and fuzzy search usable.\n\n**Partial indexes** index only the rows you query, such as `WHERE status = 'PENDING'`: smaller and faster. And an index on a column with a function needs a matching expression index.\"\n\nTham khảo thêm: [Indexing: B-Tree](https://minhnhat97kg.github.io/docsify/content/database-indexing-b-tree-the-default-workhorse/vi.md), [Indexing: GIN & GiST](https://minhnhat97kg.github.io/docsify/content/database-indexing-gin-gist-advanced-indexing/vi.md)", "excerpt": "\"B-tree is the default: equality, ranges, sorting, prefix LIKE 'abc%'. With INCLUDE columns it enables index-only scans. Hash: equality only, rarely worth it over B-tree. GIN, an inverted index: for values that contain m", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-partitioning", "title": "When and how do you partition a large table?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "partitioning", "performance"], "body": "\"When a table grows to hundreds of millions of rows and most queries hit a recent slice, or old data must be dropped regularly.\n\n- **Range** partitioning by time, such as monthly for transactions or logs, is the most common.\n- **Hash** partitioning by ID spreads load evenly when there's no natural range.\n- **List** partitioning by tenant or region.\n\nBenefits: **partition pruning**, where queries with the partition key touch only relevant partitions; dropping an old partition instead of a huge `DELETE` that bloats the table; and smaller indexes per partition.\n\nPitfalls: a primary key or unique constraint must include the partition key, since Postgres has no global indexes; queries without the partition key scan every partition; and too many partitions slow planning. I automate creating future partitions with `pg_partman` or a scheduled job.\"\n\nTham khảo thêm: [Table Partitioning](https://minhnhat97kg.github.io/docsify/content/database-table-partitioning-range-hash/vi.md)", "excerpt": "\"When a table grows to hundreds of millions of rows and most queries hit a recent slice, or old data must be dropped regularly. Range partitioning by time, such as monthly for transactions or logs, is the most common. Ha", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "pg-pooling", "title": "Why use PgBouncer if the app already has a connection pool?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "connection-pool", "performance"], "body": "\"Each Postgres connection is a separate OS process using several MB of memory, so a few hundred connections already hurt. With 50 application pods each running a HikariCP pool of 20, you'd have 1,000 connections. PgBouncer sits in between and multiplexes many client connections onto a small number of server connections.\n\nModes:\n\n- **Session pooling:** a server connection per client session; safe but saves little.\n- **Transaction pooling:** a server connection only for the duration of a transaction; the usual choice for high concurrency.\n- **Statement pooling:** rarely used.\n\nIn transaction mode, session state doesn't survive between transactions: `SET` commands, advisory locks and, historically, server-side prepared statements, causing 'prepared statement does not exist' errors. PgBouncer 1.21+ can track protocol-level prepared statements; otherwise disable them in the driver. On AWS, RDS Proxy plays the same role.\"\n\nTham khảo thêm: [Database - Connection Pool](https://minhnhat97kg.github.io/docsify/content/database-connection-pool/vi.md)", "excerpt": "\"Each Postgres connection is a separate OS process using several MB of memory, so a few hundred connections already hurt. With 50 application pods each running a HikariCP pool of 20, you'd have 1,000 connections. PgBounc", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "sql-tricky", "title": "Tricky SQL questions: EXISTS vs IN, NULL, deleting 10 million rows.", "cat": "data", "section": "SQL nâng cao", "kind": "qa", "tags": ["sql", "database", "performance"], "body": "\"- **EXISTS vs IN:** modern planners often turn both into the same semi-join. The real trap is `NOT IN` with a subquery that can return NULL: it returns no rows at all. I use `NOT EXISTS`.\n- **NULL = NULL** is unknown, not true; use `IS NULL` or `IS DISTINCT FROM`. `COUNT(col)` skips NULLs; `COUNT(*)` doesn't.\n- **Alias in WHERE:** not allowed, because `WHERE` is evaluated before `SELECT`; the logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY.\n- **SARGable predicates:** `WHERE created_at >= '2026-01-01'` can use an index; `WHERE YEAR(created_at) = 2026` can't.\n- **Deleting 10 million rows:** delete in batches of a few thousand by primary key with short pauses, so locks, WAL volume and replication lag stay small; or, if most of the table goes, copy the rows to keep into a new table and swap; or drop a partition.\n- **Fast locally, slow in production:** different data volume and distribution, stale statistics, different plans, or parameter-sensitive plans. Check with `EXPLAIN (ANALYZE, BUFFERS)` on production-like data.\"\n\nTham khảo thêm: [Database - Advanced SQL Concepts](https://minhnhat97kg.github.io/docsify/content/database-advance-2/vi.md), [Database - Query Optimization](https://minhnhat97kg.github.io/docsify/content/database-optimization/vi.md)", "excerpt": "\"- EXISTS vs IN: modern planners often turn both into the same semi-join. The real trap is NOT IN with a subquery that can return NULL: it returns no rows at all. I use NOT EXISTS. NULL = NULL is unknown, not true; use I", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "db-replication-sharding", "title": "Replication and sharding: how do you choose a shard key?", "cat": "data", "section": "System design", "kind": "qa", "tags": ["database", "replication", "sharding", "system-design"], "body": "\"**Replication** copies data for availability and read scale. Leader-follower is the norm. Synchronous replication means no data loss on failover but higher write latency; asynchronous is faster but can lose the last writes and creates replica lag. Many setups use one synchronous standby plus asynchronous replicas.\n\n**Sharding** splits data horizontally across databases for write scale. The shard key decides everything:\n\n- High cardinality and even distribution, to avoid hot shards.\n- Matches the main access pattern, so most queries hit one shard: user ID or tenant ID for user-centric apps.\n- Avoid monotonically increasing keys with range sharding, since all new writes land on one shard.\n\nCosts: cross-shard queries and transactions, rebalancing, and global unique IDs (Snowflake-style IDs or UUIDv7). I shard only after indexing, caching, replicas and partitioning are exhausted.\"\n\nTham khảo thêm: [Database System Design: Scalability & Reliability](https://minhnhat97kg.github.io/docsify/content/database-system-design/vi.md)", "excerpt": "\"Replication copies data for availability and read scale. Leader-follower is the norm. Synchronous replication means no data loss on failover but higher write latency; asynchronous is faster but can lose the last writes ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "pgvector", "title": "How would you add vector search with PostgreSQL?", "cat": "data", "section": "PostgreSQL internals", "kind": "qa", "tags": ["database", "postgresql", "ai", "vector-search"], "body": "\"The `pgvector` extension stores embeddings as a `vector(n)` column and supports distance operators: cosine `<=>`, which suits text embeddings, L2 `<->`, and inner product.\n\nTwo approximate indexes:\n\n- **HNSW:** a layered graph; better recall and speed, but slower to build and more memory. Tunable with `m` and `ef_construction` at build time and `ef_search` at query time.\n- **IVFFlat:** clusters vectors into lists; faster to build, but needs data before building and lower recall.\n\nWhy pgvector instead of a dedicated vector database: one system to run, vectors filtered and joined with relational data in one query, and transactions. A dedicated store becomes worth it at very large scale or for advanced features. Use cases: semantic search, recommendations, and anomaly detection by finding transactions similar to known fraud.\"\n\nTham khảo thêm: [Vector Search & HNSW Index](https://minhnhat97kg.github.io/docsify/content/database-vector-search-hnsw-index/vi.md)", "excerpt": "\"The pgvector extension stores embeddings as a vector(n) column and supports distance operators: cosine <=, which suits text embeddings, L2 <-, and inner product. Two approximate indexes: HNSW: a layered graph; better re", "catLabel": "Spring & JPA", "tip": "", "num": null}, {"id": "technical-microservices-kafka-system-design", "title": "Tổng quan: Technical: microservices, Kafka, system design", "cat": "arch", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "kind": "guide", "excerpt": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "microservices-1", "title": "Monolith vs microservices: when would you choose each?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, and split out services when there is a clear bounded context with different scaling or release needs. A distributed monolith, where services must be deployed together, is the worst of both.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, ", "catLabel": "Microservices & System Design"}, {"id": "microservices-2", "title": "How do services communicate, and how do you choose sync vs async?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Synchronous REST or gRPC when the caller needs the answer now. Asynchronous messaging when the work can complete later, when I want to decouple availability, or when several consumers react to one event. Sync chains multiply latency and failure probability, so I keep them short and use events for everything else.\"", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"Synchronous REST or gRPC when the caller needs the answer now. Asynchronous messaging when the work can complete later, when I want to decouple availability, or when several consumers react to one event. Sync chains mul", "catLabel": "Microservices & System Design"}, {"id": "microservices-5", "title": "How do you make an operation idempotent?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For updates I prefer absolute values or version checks over increments.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For up", "catLabel": "Microservices & System Design"}, {"id": "microservices-6", "title": "How do you make calls between services resilient?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one makes sense. In Java I use Resilience4j. Retries without timeouts or limits cause retry storms.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one mak", "catLabel": "Microservices & System Design"}, {"id": "microservices-7", "title": "What does an API gateway do? How is authentication handled across services?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "opswat"], "body": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as headers. The alternative is each service validating a JWT itself, which removes the trust assumption but duplicates logic. Between services I'd use mTLS or short-lived service tokens.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as head", "catLabel": "Microservices & System Design"}, {"id": "microservices-8", "title": "How do you observe and debug a distributed system?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99 latency, and use traces to find which hop is slow.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99", "catLabel": "Microservices & System Design"}, {"id": "microservices-9", "title": "Explain the CAP theorem in practical terms.", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product catalogue chooses availability.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product c", "catLabel": "Microservices & System Design"}, {"id": "system-design-16", "title": "Describe the architecture of your last project.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"It was an endpoint management platform. \\[Số lượng\\] services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported \\[dữ liệu gì\\] through \\[giao thức\\]; services communicated by \\[REST/gRPC/message broker\\]; data was stored in \\[database\\]. I owned \\[service/module\\]. The main challenges were \\[quy mô, độ trễ, multi-tenant...\\], which we handled by \\[giải pháp\\].\"\n\n*Ghi chú: câu này gần như chắc chắn được hỏi. Vẽ sẵn sơ đồ và tập nói trong 3 phút, kèm 2–3 quyết định thiết kế bạn bảo vệ được.*", "kind": "qa", "num": 16, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"It was an endpoint management platform. Số lượng services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported dữ liệu gì through giao thức; services communicated by REST/gRPC/message bro", "catLabel": "Microservices & System Design"}, {"id": "system-design-17", "title": "Design a URL shortener.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Requirements: create a short link, redirect fast, read-heavy. API: `POST /links` and `GET /{code}`. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a key-value lookup from code to URL. Redirects are served from a cache such as Redis in front of the database, with a CDN for popular links. I'd add rate limiting on creation, expiry, and async click analytics through a queue.\"", "kind": "qa", "num": 17, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Requirements: create a short link, redirect fast, read-heavy. API: POST /links and GET /{code}. I generate the code by base62-encoding a unique ID from a sequence or ID generator, which avoids collisions. Storage is a k", "catLabel": "Microservices & System Design"}, {"id": "system-design-18", "title": "Design a rate limiter.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with `Retry-After`, and fails open if Redis is unavailable unless the endpoint is security-sensitive. A sliding window counter is the alternative when I need smoother limits.\"", "kind": "qa", "num": 18, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"I'd use a token bucket per client key: it allows short bursts and is cheap. State lives in Redis so all instances share it, updated atomically with a Lua script. It sits in the gateway, returns 429 with Retry-After, and", "catLabel": "Microservices & System Design"}, {"id": "system-design-19", "title": "How do you use caching, and what can go wrong?", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock or jittered TTLs, and cache penetration for missing keys, handled by caching negative results. A CDN applies the same idea at the edge for static and cacheable responses.\"\n\n*Ghi chú: bạn chưa làm thực tế với CDN, nên nếu bị hỏi sâu hãy nói thẳng là bạn hiểu nguyên lý (edge cache, TTL, cache key, invalidation) nhưng chưa vận hành.*", "kind": "qa", "num": 19, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"Cache-aside: read from cache, on miss read the database and populate with a TTL; on write, update the database and invalidate the key. Risks are stale data, a stampede when a hot key expires, which I handle with a lock ", "catLabel": "Microservices & System Design"}, {"id": "system-design-20", "title": "How do you scale a database?", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, because sharding complicates joins, transactions and rebalancing.\"", "kind": "qa", "num": 20, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"In order: optimize queries and indexes, add caching, scale vertically, add read replicas for read-heavy load while accepting replication lag, then partition tables, and only last shard by a key such as tenant ID, becaus", "catLabel": "Microservices & System Design"}, {"id": "sd-ride-matching", "title": "Design a ride-hailing service that matches riders with nearby drivers.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "geo", "kafka"], "body": "*Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải.*\n\n\"**Requirements.** Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds, a driver is never assigned twice, highly available.\n\n**Estimates.** Say 1 million online drivers sending a location every 4 seconds: about 250,000 location writes per second. That's the hot path, so locations don't go to a relational database.\n\n**Components.**\n\n- A *location service* receives driver updates over a persistent connection, gRPC or WebSocket. It keeps the latest position in memory or Redis, indexed by geospatial cell (geohash or H3), and partitioned by city or cell so each node handles one region.\n- A *matching service* takes a ride request, looks up drivers in the rider's cell and neighbouring cells, ranks them by ETA rather than straight-line distance, and offers the trip to the best one with a short timeout, moving to the next on decline or timeout.\n- A *trip service* owns the trip state machine (requested, matched, arriving, in progress, completed) in a durable database, and publishes events to Kafka for pricing, notifications and analytics.\n\n**Consistency.** To avoid assigning one driver to two trips, I take a short lock or do an atomic compare-and-set on the driver's status (available to reserved), for example Redis `SET NX` with a TTL, and only then send the offer.\n\n**Failure handling.** Location data is ephemeral, so losing a node only costs a few seconds until drivers report again. Trip state is durable and every state transition is idempotent, so retries from mobile clients are safe.\n\n**Scaling.** Partition by geography, because almost all queries are local. Hot cells in city centres can be split into smaller cells.\"", "excerpt": "Bài kiểu Grab: luôn bắt đầu bằng làm rõ yêu cầu và ước lượng tải. \"Requirements. Riders request a ride; we find nearby available drivers and offer the trip; one driver accepts. Non-functional: match within a few seconds,", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-wallet", "title": "Design a wallet / payment ledger that never loses or double-counts money.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "grab", "payments", "kafka"], "body": "\"**Requirements.** Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail.\n\n**Data model.** A double-entry ledger: each transaction writes at least two immutable entries, a debit and a credit, that sum to zero. The balance is derived from entries, and I keep a cached balance column updated in the same database transaction for fast reads. Amounts are stored as integers in the smallest currency unit, never floating point.\n\n**Correctness.**\n\n- *Idempotency:* every request carries an idempotency key stored with a unique constraint in the same transaction, so a retry returns the original result instead of charging twice.\n- *Concurrency:* update the balance with a conditional statement, such as `UPDATE wallet SET balance = balance - :amt WHERE id = :id AND balance >= :amt`, or with optimistic locking on a version column. This prevents overdrafts under concurrent payments.\n- *Transfers across shards:* if both wallets are in one database, use one local transaction. Across services or shards, use a saga with a pending state and compensation, never a distributed transaction.\n\n**External payment providers.** Calls are asynchronous: create a pending record, call the provider with our idempotency key, and confirm through the callback or by polling. A daily reconciliation job compares our ledger with provider reports and flags mismatches.\n\n**Events.** Use the outbox pattern to publish 'payment completed' events to Kafka, so downstream services see every committed transaction exactly once in effect.\n\n**Scale.** Shard by wallet ID. Hot merchant wallets can be split into sub-accounts that are summed for reads.\"", "excerpt": "\"Requirements. Top up, pay and transfer between users; balances must always be correct; every request may be retried; full audit trail. Data model. A double-entry ledger: each transaction writes at least two immutable en", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-rest", "title": "What are REST principles? Is REST always stateless?", "cat": "arch", "section": "Microservices (EPAM rapid-fire)", "kind": "qa", "tags": ["rest", "api-design", "epam"], "body": "\"REST constraints: client-server separation; **statelessness**, where every request carries everything needed to process it; cacheable responses; a uniform interface built on resources, URIs, standard HTTP methods and representations; and a layered system, so clients don't know if they talk to a proxy, gateway or the real server. Code on demand is optional.\n\nStatelessness is about **the server not keeping client session state between requests**. A REST API can still identify a user on every request with a token such as a JWT; that's stateless because the token travels with each request. Storing a server-side session tied to a cookie technically breaks the constraint and makes horizontal scaling harder, since requests then need sticky sessions or a shared session store like Redis. The business data itself, in the database, is of course state; the constraint is only about conversational state.\"", "excerpt": "\"REST constraints: client-server separation; statelessness, where every request carries everything needed to process it; cacheable responses; a uniform interface built on resources, URIs, standard HTTP methods and repres", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-cb-open", "title": "What happens if a circuit breaker stays open too long?", "cat": "arch", "section": "Microservices (EPAM rapid-fire)", "kind": "qa", "tags": ["microservices", "resilience", "circuit-breaker", "epam"], "body": "\"A circuit breaker has three states. **Closed:** calls pass and failures are counted. **Open:** calls fail fast without reaching the dependency. **Half-open:** after a wait duration, a few trial calls are allowed; success closes it, failure opens it again.\n\nIf it stays open too long, the dependency may have recovered while we keep rejecting requests, which turns a short outage into a long one for users. Causes: a wait duration that's too long, or a half-open trial that's too strict or keeps hitting a cold dependency.\n\nTuning in Resilience4j: a reasonable `waitDurationInOpenState`, a small `permittedNumberOfCallsInHalfOpenState`, a sliding window and threshold based on real traffic, and slow-call thresholds. While open, return a **fallback**, such as cached data or a degraded response, and **alert** on state changes so humans know the dependency is down.\"", "excerpt": "\"A circuit breaker has three states. Closed: calls pass and failures are counted. Open: calls fail fast without reaching the dependency. Half-open: after a wait duration, a few trial calls are allowed; success closes it,", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-checklist", "title": "What is your framework for a 45-minute system design interview?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "framework"], "body": "*Đây là khung dùng cho mọi bài system design; tập nói theo đúng thứ tự này.*\n\n\"1. **Clarify requirements, 5–10 minutes:** core features, what's out of scope, and non-functional needs: scale (daily active users, read/write ratio), latency, availability target, consistency needs.\n2. **Estimate, about 5 minutes:** QPS at average and peak, storage per year, bandwidth. Rough orders of magnitude are enough; they drive later choices.\n3. **High-level design, 10–15 minutes:** API, data model, main components and the request flow. Get something end to end on the board before optimizing.\n4. **Deep dive, 15–20 minutes:** the bottleneck the interviewer cares about: database choice and schema, scaling and partitioning, caching, concurrency, failure handling and single points of failure.\n5. **Wrap up, 2–3 minutes:** trade-offs I made, what I'd monitor, and what I'd improve with more time.\n\nThroughout I say the trade-offs out loud and check in with the interviewer before going deep.\"\n\nTham khảo thêm: [System Design Interview - The Ultimate Checklist](https://minhnhat97kg.github.io/docsify/content/system-design-interview-the-ultimate-checklist/vi.md)", "excerpt": "Đây là khung dùng cho mọi bài system design; tập nói theo đúng thứ tự này. \"1. Clarify requirements, 5–10 minutes: core features, what's out of scope, and non-functional needs: scale (daily active users, read/write ratio", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-cdn", "title": "How does a CDN work, and what can it do for an API?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "cdn", "caching", "performance"], "body": "*Đây là chủ đề bạn chưa làm thực tế; trả lời ở mức nguyên lý và nói rõ điều đó nếu bị hỏi sâu.*\n\n\"A CDN caches content at edge locations close to users, so requests don't travel to the origin, which cuts latency and offloads the origin.\n\n- **Static assets** such as images, JS and video are cached for a long time, with versioned file names (`app.3f9a.js`) so a deploy never needs invalidation.\n- **Dynamic API responses** can be cached briefly when they're public, such as a product catalogue for 30 seconds, controlled by `Cache-Control: public, max-age=30, stale-while-revalidate=60`. Personalized responses get `private` or `no-store`. The cache key must include anything that changes the response, but not unnecessary cookies or query parameters, or the hit rate collapses.\n- **Invalidation** is the hard part: prefer short TTLs or versioned URLs over purges.\n- **Protection:** the edge absorbs DDoS traffic, and request collapsing stops a thundering herd when a popular object expires, by sending one request to the origin.\n- **Edge computing** runs small functions at the edge for redirects, auth checks or A/B routing.\n\nEven without a CDN in my past projects, the same reasoning applies to the API gateway and Redis caching I did use.\"\n\nTham khảo thêm: [System Design - CDN & Edge Computing](https://minhnhat97kg.github.io/docsify/content/system-design-cdn-edge-computing/vi.md)", "excerpt": "Đây là chủ đề bạn chưa làm thực tế; trả lời ở mức nguyên lý và nói rõ điều đó nếu bị hỏi sâu. \"A CDN caches content at edge locations close to users, so requests don't travel to the origin, which cuts latency and offload", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-consistent-hashing", "title": "What is consistent hashing and why use it?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "distributed-systems", "hashing"], "body": "\"With `hash(key) % N`, changing N from 4 to 5 moves almost every key, which empties a cache cluster. Consistent hashing places both nodes and keys on a ring; a key belongs to the first node clockwise. Adding or removing a node moves only about 1/N of the keys, those between it and its neighbour.\n\nPlain rings distribute unevenly, so each physical node gets many **virtual nodes**, typically 100–200, which smooths the load and lets stronger machines take more. Lookup is a binary search over sorted ring positions: O(log V).\n\nReplication: store each key on the next R distinct physical nodes clockwise. Used by Cassandra and DynamoDB-style stores, client-side memcached sharding, and load balancers that need session affinity. Redis Cluster instead uses 16,384 fixed hash slots, which is a related idea.\"\n\nTham khảo thêm: [System Design - Consistent Hashing](https://minhnhat97kg.github.io/docsify/content/system-design-consistent-hashing/vi.md)", "excerpt": "\"With hash(key) % N, changing N from 4 to 5 moves almost every key, which empties a cache cluster. Consistent hashing places both nodes and keys on a ring; a key belongs to the first node clockwise. Adding or removing a ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-distributed-lock", "title": "How do you implement a distributed lock, and what can go wrong?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "distributed-systems", "redis", "lock"], "body": "\"Single Redis: `SET lock:key <random-token> NX PX 30000`. The random token lets me release safely with a Lua script that deletes only if the value is still mine, so I never delete a lock another client acquired after mine expired. The TTL prevents a crashed holder from blocking forever.\n\n**Redlock** acquires the lock on a majority of independent Redis nodes within a time budget, to survive a node failure. It's debated because it depends on bounded clock drift and process pauses.\n\nThe fundamental problem: a holder can pause, for example in a long GC, past its TTL, and then write after someone else took the lock. The fix is a **fencing token**: an increasing number issued with each lock, which the storage layer checks and rejects if it's older than one it has seen.\n\nSo: Redis locks for efficiency, such as avoiding duplicate work. For correctness, I use ZooKeeper or etcd with fencing, or better, a database constraint or conditional update that makes the lock unnecessary.\"\n\nTham khảo thêm: [System Design - Distributed Locking (Redlock)](https://minhnhat97kg.github.io/docsify/content/system-design-distributed-locking-redlock/vi.md)", "excerpt": "\"Single Redis: SET lock:key <random-token NX PX 30000. The random token lets me release safely with a Lua script that deletes only if the value is still mine, so I never delete a lock another client acquired after mine e", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-eventual", "title": "What is eventual consistency, and when is it acceptable?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "consistency", "distributed-systems"], "body": "\"If no new writes happen, all replicas eventually converge to the same value. It's the BASE side of the trade-off with ACID: basically available, soft state, eventually consistent.\n\nAcceptable when a short delay doesn't break business rules: transaction history views, loyalty points, search indexes, like counters, notifications. Not acceptable for the balance check that decides whether a payment goes through; that stays strongly consistent in one database.\n\n'How long is eventually' should be measured, through replication or consumer lag metrics, and bounded with alerts. Conflicts on concurrent writes are resolved by last-write-wins with timestamps (simple but lossy), version vectors, or CRDTs. Replicas repair through read repair and background anti-entropy. On the UX side: read-your-own-writes from the primary, or show a 'processing' state.\"\n\nTham khảo thêm: [System Design - Eventual Consistency](https://minhnhat97kg.github.io/docsify/content/system-design-eventual-consistency/vi.md)", "excerpt": "\"If no new writes happen, all replicas eventually converge to the same value. It's the BASE side of the trade-off with ACID: basically available, soft state, eventually consistent. Acceptable when a short delay doesn't b", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-flash-sale", "title": "Design a flash sale: 1,000 items, one million users clicking at once.", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "concurrency", "redis", "kafka"], "body": "\"**The two problems:** a thundering herd of traffic, and overselling.\n\n**Absorb traffic:** static pages on a CDN, a countdown handled client-side, rate limiting and a virtual waiting room at the gateway, so only a manageable flow reaches the backend.\n\n**No overselling:** keep the stock counter in Redis and decrement atomically, with a Lua script that checks `stock > 0` and decrements in one step, or `DECR` and roll back if the result is negative. Only requests that win a unit continue.\n\n**Protect the database:** winners go onto a queue such as Kafka; consumers create orders at a pace the database handles, with a unique constraint on (user, sale) so each user buys once, and idempotent processing.\n\n**Reservations:** a won unit is held for, say, 10 minutes awaiting payment; on timeout, a delayed job returns it to stock.\n\n**Consistency:** Redis is the gatekeeper, the database is the source of truth; a reconciliation job compares them after the sale.\"\n\nTham khảo thêm: [Behavioral Interview (có phần thiết kế flash sale)](https://minhnhat97kg.github.io/docsify/content/behavioral-interview/vi.md)", "excerpt": "\"The two problems: a thundering herd of traffic, and overselling. Absorb traffic: static pages on a CDN, a countdown handled client-side, rate limiting and a virtual waiting room at the gateway, so only a manageable flow", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-double-entry", "title": "How does double-entry bookkeeping work in a ledger?", "cat": "arch", "section": "System design", "kind": "qa", "tags": ["system-design", "fintech", "payments", "ledger"], "body": "\"Money is never created or destroyed: every transaction has entries that sum to zero, for example debit Alice 100 and credit Bob 100.\n\nSchema: `accounts`, `transactions` (one business event, with an idempotency key) and `entries` (transaction ID, account ID, signed amount). Entries are a separate table, not JSON, so they can be indexed, summed and constrained, and the database can enforce that each transaction balances.\n\nThe ledger is **immutable**: no updates or deletes. A mistake is fixed by a new reversing transaction, which keeps the audit trail.\n\nFees and external money flow through **system accounts**: a fee revenue account, a settlement account for each bank partner, a suspense account for unmatched items. So a 100 transfer with a 1 fee is three entries: Alice −101, Bob +100, fees +1.\n\nDaily **reconciliation** checks that the entries sum to zero, that cached balances match the sum of entries, and that settlement accounts match bank statements.\"\n\nTham khảo thêm: [Double Entry Bookkeeping](https://minhnhat97kg.github.io/docsify/content/system-design-double-entry-bookkeeping/vi.md), [E-Wallet (High Consistency)](https://minhnhat97kg.github.io/docsify/content/system-design-e-wallet-high-consistency-reliability/vi.md)", "excerpt": "\"Money is never created or destroyed: every transaction has entries that sum to zero, for example debit Alice 100 and credit Bob 100. Schema: accounts, transactions (one business event, with an idempotency key) and entri", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "sd-strangler", "title": "How do you migrate a monolith to microservices safely?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["system-design", "migration", "microservices"], "body": "\"Not with a big-bang rewrite: it freezes features for months and fails at cutover. I use the **Strangler Fig** pattern:\n\n1. Put a facade, such as an API gateway or NGINX, in front of the monolith.\n2. Pick one bounded context with clear edges and value, build it as a service, and route its endpoints there, gradually, by percentage or by user.\n3. Repeat until the monolith is empty or small enough to keep.\n\nRollback is just switching the route back, which is why routing must be configurable without a deploy.\n\nThe database is the hardest part: start with the new service reading the shared database if needed, then give it its own store, synchronized by backfill plus change data capture (Debezium) or dual writes, verified by comparing results, before cutting over.\n\nWhen not to use it: small systems where a rewrite is cheap, or when you can't intercept calls to the old system.\"\n\nTham khảo thêm: [Strangler Fig Pattern](https://minhnhat97kg.github.io/docsify/content/system-design-strangler-fig-pattern/vi.md)", "excerpt": "\"Not with a big-bang rewrite: it freezes features for months and fails at cutover. I use the Strangler Fig pattern: Put a facade, such as an API gateway or NGINX, in front of the monolith. Pick one bounded context with c", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-hexagonal", "title": "What is hexagonal (ports and adapters) architecture?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["architecture", "clean-architecture", "design", "kafka"], "body": "\"The domain and use cases sit in the core with no dependencies on frameworks or databases. The core defines **ports**, interfaces such as `PaymentRepository` or `NotificationSender`. **Adapters** implement them on the outside: a Postgres repository, a Kafka publisher, an HTTP controller. Dependencies point inward only.\n\nBenefits: business logic is testable with fakes in milliseconds, and infrastructure can change, such as swapping a database or adding a gRPC API, without touching the core.\n\nA practical rule: don't use ORM entities as domain models, for example a GORM model or a JPA entity full of annotations and lazy-loading proxies leaking into business logic; map at the adapter boundary.\n\nCosts: more files and mapping code. The performance overhead is negligible. I'd skip it for simple CRUD services or short-lived prototypes, and use it where business rules are rich and long-lived.\"\n\nTham khảo thêm: [Clean Architecture - Hexagonal, Ports & Adapters](https://minhnhat97kg.github.io/docsify/content/clean-architecture-hexagonal-ports-adapters/vi.md)", "excerpt": "\"The domain and use cases sit in the core with no dependencies on frameworks or databases. The core defines ports, interfaces such as PaymentRepository or NotificationSender. Adapters implement them on the outside: a Pos", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "arch-principles", "title": "DRY, KISS, YAGNI: duplication or coupling?", "cat": "arch", "section": "Architecture", "kind": "qa", "tags": ["clean-code", "principles", "design"], "body": "\"- **DRY** is about knowledge, not identical-looking code. Two pieces of code that look the same but change for different reasons should stay separate; merging them couples unrelated features.\n- **KISS:** the simplest design that works, readable by the next engineer.\n- **YAGNI:** don't build for requirements that don't exist yet.\n- **Rule of three:** abstract on the third occurrence, when the pattern is actually clear.\n- **Law of Demeter:** talk to direct collaborators, not `a.getB().getC().doX()`.\n- **Fail fast:** validate early and surface errors immediately.\n\nDuplication or coupling? I usually prefer a little duplication over the wrong abstraction. Across microservices especially, sharing a domain library couples deployments; duplicating a small DTO is cheaper than a shared library every service must upgrade together.\"\n\nTham khảo thêm: [Software Principles](https://minhnhat97kg.github.io/docsify/content/software-principles/vi.md)", "excerpt": "\"- DRY is about knowledge, not identical-looking code. Two pieces of code that look the same but change for different reasons should stay separate; merging them couples unrelated features. KISS: the simplest design that ", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "microservices-3", "title": "Làm sao giữ dữ liệu nhất quán giữa các service? Saga pattern là gì? / How do you keep data consistent across services? What is the saga pattern?", "cat": "messaging", "section": "Microservices", "tags": ["microservices"], "body": "### Tiếng Việt\n\nMỗi service sở hữu database riêng, nên **không có transaction chung** giữa các service. Distributed transaction kiểu 2PC chặn tài nguyên và không hợp microservices. Cách phổ biến là **Saga**.\n\n**Saga** là chuỗi **transaction cục bộ**: mỗi bước commit trong database của service đó rồi phát sự kiện hoặc lệnh cho bước tiếp theo. Nếu một bước thất bại, các bước **đã commit** được hoàn tác bằng **transaction bù (compensating transaction)**.\n\n**Ví dụ đặt hàng:**\n\n```\n1. Order Service:     tạo đơn PENDING\n2. Payment Service:   trừ tiền            (bù: hoàn tiền)\n3. Inventory Service: giữ hàng            (bù: trả hàng về kho)\n4. Order Service:     chuyển đơn CONFIRMED\nNếu bước 3 hết hàng → chạy bù bước 2 (hoàn tiền) → đơn CANCELLED\n```\n\n**Hai cách triển khai:**\n\n| | Choreography | Orchestration |\n|---|---|---|\n| Cách làm | Mỗi service nghe sự kiện và tự quyết bước tiếp | Một **orchestrator** ra lệnh cho từng service theo kịch bản |\n| Ưu | Đơn giản, ít phụ thuộc trung tâm | **Dễ nhìn toàn bộ luồng**, dễ debug, timeout, retry |\n| Nhược | Luồng dài thì khó theo dõi, dễ phụ thuộc vòng | Thêm một thành phần phải vận hành |\n| Hợp với | 2–4 bước đơn giản | Luồng dài, nghiệp vụ phức tạp (thanh toán, đặt vé) |\n\nOrchestrator có thể tự viết (state machine lưu trong DB) hoặc dùng **Temporal**, Camunda, AWS Step Functions.\n\n**Những điểm bắt buộc:**\n- Mỗi bước phát sự kiện bằng **outbox pattern**, để commit DB và gửi message không bị lệch nhau.\n- Mọi bước và mọi bước bù phải **idempotent**, vì message có thể giao lại.\n- Bước bù phải **luôn thành công được**: retry tới khi xong; nếu nghiệp vụ không hoàn tác được (email đã gửi) thì bù bằng hành động khác (gửi email đính chính).\n- **Thiếu isolation:** trong lúc saga chạy, service khác có thể thấy trạng thái trung gian. Giảm thiểu bằng trạng thái `PENDING` (semantic lock), hoặc sắp xếp bước có rủi ro thất bại cao lên trước bước khó bù.\n\n**Kết quả:** **eventual consistency**: hệ thống nhất quán sau khi saga hoàn tất hoặc đã bù xong. UI và API phải hiển thị được trạng thái trung gian (\"Đang xử lý\").\n\n### English\n\nEach service owns its database, so there's **no shared transaction** across services. Distributed transactions like 2PC lock resources and don't fit microservices. The common approach is a **saga**.\n\nA **saga** is a sequence of **local transactions**: each step commits in its own service's database and then publishes an event or command for the next step. If a step fails, the steps **already committed** are undone with **compensating transactions**.\n\n**Order example:**\n\n```\n1. Order Service:     create order as PENDING\n2. Payment Service:   charge the customer     (compensation: refund)\n3. Inventory Service: reserve the items       (compensation: release stock)\n4. Order Service:     mark order CONFIRMED\nIf step 3 is out of stock → run step 2's compensation (refund) → order CANCELLED\n```\n\n**Two implementation styles:**\n\n| | Choreography | Orchestration |\n|---|---|---|\n| How | Each service listens to events and decides the next step itself | An **orchestrator** commands each service according to a workflow |\n| Pros | Simple, no central component | **Whole flow visible in one place**, easier debugging, timeouts and retries |\n| Cons | Long flows are hard to follow, risk of cyclic dependencies | One more component to operate |\n| Fits | 2–4 simple steps | Long flows, complex business logic (payments, bookings) |\n\nThe orchestrator can be hand-written (a state machine persisted in the database) or a tool such as **Temporal**, Camunda or AWS Step Functions.\n\n**Non-negotiables:**\n- Each step publishes its events with the **outbox pattern**, so the database commit and the message can't diverge.\n- Every step and every compensation must be **idempotent**, because messages can be redelivered.\n- Compensations must **always be able to succeed**: retry until they do; if an action can't be undone (an email was sent), compensate with another action (a correction email).\n- **No isolation:** while a saga runs, other services can see intermediate state. Mitigate with a `PENDING` state (a semantic lock), or order the steps so those most likely to fail run before those that are hard to compensate.\n\n**The result is eventual consistency:** the system is consistent once the saga completes or finishes compensating. UIs and APIs must be able to show intermediate states (\"Processing\").", "kind": "qa", "num": 3, "tip": "", "excerpt": "Mỗi service sở hữu database riêng, nên không có transaction chung giữa các service. Distributed transaction kiểu 2PC chặn tài nguyên và không hợp microservices. Cách phổ biến là Saga. Saga là chuỗi transaction cục bộ: mỗ", "catLabel": "Microservices & System Design", "bilingual": true}, {"id": "microservices-4", "title": "Outbox pattern là gì? Hoạt động cụ thể thế nào? / What is the outbox pattern, and how exactly does it work?", "cat": "messaging", "section": "Microservices", "tags": ["microservices"], "body": "### Tiếng Việt\n\n**1. Vấn đề cần giải quyết: dual write (ghi hai nơi)**\n\nOrder service cần làm hai việc: lưu đơn vào PostgreSQL **và** gửi sự kiện `OrderCreated` lên Kafka để Payment và Inventory xử lý tiếp. Hai hệ thống này **không có transaction chung**, nên dù viết theo thứ tự nào cũng có lỗi:\n\n| Cách viết | Lỗi xảy ra khi | Hậu quả |\n|---|---|---|\n| Lưu DB, rồi gửi Kafka | App chết hoặc Kafka lỗi **sau khi commit** | Có đơn nhưng **không ai nhận sự kiện**: không thanh toán, không trừ kho |\n| Gửi Kafka, rồi lưu DB | DB rollback (vi phạm ràng buộc, timeout) | Hệ thống khác xử lý một **đơn không tồn tại** |\n| Gửi Kafka **bên trong** `@Transactional` | Gửi xong thì transaction rollback | Giống trường hợp trên |\n| `@TransactionalEventListener(AFTER_COMMIT)` | App chết ngay sau commit | Sự kiện chỉ nằm trong RAM nên **mất** |\n\n**2. Ý tưởng:** không gửi trực tiếp lên broker. Ghi sự kiện vào một **bảng `outbox` trong cùng database, cùng transaction** với dữ liệu nghiệp vụ. Một transaction local là atomic: hoặc có cả đơn lẫn sự kiện, hoặc không có gì. Sau đó một tiến trình riêng (**relay**) đọc bảng outbox và đẩy lên Kafka.\n\n```\n[Order service]                                   \n  BEGIN\n    INSERT INTO orders ...                        \n    INSERT INTO outbox ...      ← cùng transaction\n  COMMIT\n            │\n            ▼\n[Relay: polling hoặc CDC] ──► Kafka topic \"order.events\" ──► Payment, Inventory\n```\n\n**3. Bảng outbox:**\n\n```sql\nCREATE TABLE outbox (\n    id             uuid PRIMARY KEY,          -- cũng dùng làm eventId để consumer chống trùng\n    aggregate_type varchar(50)  NOT NULL,     -- 'Order' → chọn topic\n    aggregate_id   varchar(50)  NOT NULL,     -- orderId → làm Kafka key để giữ thứ tự theo đơn\n    event_type     varchar(100) NOT NULL,     -- 'OrderCreated'\n    payload        jsonb        NOT NULL,\n    created_at     timestamptz  NOT NULL DEFAULT now(),\n    published_at   timestamptz                -- NULL = chưa gửi (chỉ cần cho cách polling)\n);\nCREATE INDEX idx_outbox_unpublished ON outbox (created_at) WHERE published_at IS NULL;\n```\n\n**4. Code ghi (Spring):**\n\n```java\n@Transactional\npublic Order createOrder(CreateOrderCommand cmd) {\n    Order order = orderRepository.save(Order.from(cmd));\n    outboxRepository.save(new OutboxEvent(\n        UUID.randomUUID(), \"Order\", order.getId().toString(),\n        \"OrderCreated\", toJson(new OrderCreated(order.getId(), order.getTotal()))));\n    return order;   // KHÔNG gọi kafkaTemplate ở đây\n}\n```\n\n**5. Relay, hai cách:**\n\n**a) Polling publisher:** một job chạy mỗi 0,5–1 giây.\n\n```java\n@Scheduled(fixedDelay = 500)\n@Transactional\npublic void publish() {\n    // SKIP LOCKED: nhiều instance cùng chạy mà không lấy trùng dòng\n    List<OutboxEvent> batch = em.createNativeQuery(\"\"\"\n        SELECT * FROM outbox WHERE published_at IS NULL\n        ORDER BY created_at LIMIT 100 FOR UPDATE SKIP LOCKED\"\"\", OutboxEvent.class).getResultList();\n    for (OutboxEvent e : batch) {\n        kafkaTemplate.send(\"order.events\", e.getAggregateId(), e.getPayload()).get(); // chờ broker ack\n        e.setPublishedAt(Instant.now());\n    }\n}\n```\n\n- Ưu: đơn giản, không cần thêm hạ tầng.\n- Nhược: độ trễ bằng chu kỳ poll, query liên tục vào DB, và bảng phải dọn định kỳ.\n\n**b) CDC (Change Data Capture) với Debezium:** Debezium đọc **WAL của PostgreSQL** (hoặc binlog của MySQL), thấy dòng mới trong `outbox` thì đẩy lên Kafka. Debezium có sẵn **Outbox Event Router** để chọn topic theo `aggregate_type` và dùng `aggregate_id` làm key.\n\n- Ưu: độ trễ thấp (mili giây), không poll DB, thứ tự đúng theo thứ tự commit.\n- Nhược: phải vận hành Kafka Connect và Debezium, cấu hình replication slot. Slot bị bỏ quên thì WAL phình to và có thể làm đầy đĩa.\n- Với CDC có thể xóa dòng outbox ngay trong cùng transaction (INSERT rồi DELETE), vì Debezium vẫn đọc được từ WAL, nên bảng luôn nhỏ.\n\n**6. Đảm bảo giao hàng: at-least-once, không phải exactly-once.** Relay có thể gửi xong lên Kafka nhưng chết trước khi đánh dấu `published_at`, nên lần sau sẽ **gửi lại**. Vì vậy **consumer bắt buộc phải idempotent**. Cách phổ biến là bảng ghi nhận sự kiện đã xử lý (còn gọi là **inbox pattern**):\n\n```java\n@KafkaListener(topics = \"order.events\")\n@Transactional\npublic void on(ConsumerRecord<String, String> rec) {\n    UUID eventId = UUID.fromString(new String(rec.headers().lastHeader(\"id\").value()));\n    // INSERT ... ON CONFLICT DO NOTHING trả về 0 nếu đã xử lý rồi\n    if (processedRepo.insertIfAbsent(eventId) == 0) return;   // trùng → bỏ qua\n    paymentService.charge(parse(rec.value()));                 // cùng transaction với dòng processed\n}\n```\n\n**7. Thứ tự:** dùng `aggregate_id` làm Kafka key, nên mọi sự kiện của cùng một đơn vào **cùng partition**, tức đúng thứ tự. Với polling, thứ tự theo `created_at` có thể lệch nhẹ khi nhiều transaction commit đồng thời; nếu cần chặt chẽ thì dùng CDC, hoặc thêm cột version để consumer bỏ qua sự kiện cũ hơn.\n\n**8. Vận hành:**\n- **Dọn bảng:** xóa dòng đã gửi quá N ngày, hoặc partition bảng theo ngày rồi drop partition cũ.\n- **Giám sát:** số dòng chưa gửi và tuổi của dòng cũ nhất. Tăng dần nghĩa là relay đang kẹt.\n- **Schema sự kiện:** coi payload là hợp đồng công khai, có version, dùng Avro hoặc JSON Schema với Schema Registry.\n\n**9. Khi nào không cần outbox:** khi mất sự kiện cũng chấp nhận được (log, analytics), hoặc khi sự kiện **chính là** nguồn sự thật (event sourcing, ghi thẳng vào Kafka rồi các service tự xây trạng thái từ đó).\n\n
