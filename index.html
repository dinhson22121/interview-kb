<style>
:root{
  --bg:#ffffff; --bg2:#f4f4f2; --fg:#1b1b1b; --muted:#6b6b6b; --line:#d6d6d2;
  --accent:#1b1b1b; --hl:#fff3b0; --hlfg:#5a4a00; --tip:#eef4ff; --tipline:#9db4e0;
  --ok:#1f7a3a; --code:#f2f2ef;
}
html.dark{
  --bg:#141414; --bg2:#1c1c1c; --fg:#e4e4e0; --muted:#8e8e88; --line:#333330;
  --accent:#e4e4e0; --hl:#3b3416; --hlfg:#f0dc8a; --tip:#18202e; --tipline:#3c5582;
  --ok:#5cc47a; --code:#1f1f1d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.6 "JetBrains Mono","Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);padding:2px 9px;cursor:pointer}
button:hover{border-color:var(--fg)}
button.on{border-color:var(--fg);font-weight:700}
a{color:inherit}
header{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.logo{font-weight:700;white-space:nowrap;cursor:pointer}
.search{flex:1;max-width:420px;display:flex;border:1px solid var(--line)}
.search span{padding:3px 8px;color:var(--muted);border-right:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;padding:3px 8px;min-width:0}
.search:focus-within{border-color:var(--fg)}
.hdr-right{margin-left:auto;display:flex;gap:6px}
#menu{display:none}
main{flex:1;display:flex;min-height:0}
aside{width:210px;flex:none;border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:10px 0 20px}
aside h4{margin:10px 8px 4px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.05em}
aside .row{display:flex;justify-content:space-between;gap:8px;padding:2px 10px;cursor:pointer;color:var(--fg)}
aside .row:hover{background:var(--bg)}
aside .row.on{background:var(--fg);color:var(--bg)}
aside .row .n{color:var(--muted)}
aside .row.on .n{color:var(--bg)}
.prog{margin:4px 10px 0;height:6px;border:1px solid var(--line)}
.prog div{height:100%;background:var(--ok)}
#content{flex:1;overflow-y:auto;min-width:0}
.listhead{padding:8px 12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.listhead .chip{border:1px solid var(--line);padding:0 6px;color:var(--fg);cursor:pointer}
.card{padding:12px 12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover{background:var(--bg2)}
.card h3{margin:0 0 2px;font-size:14px}
.card h3 .q{color:var(--muted);font-weight:400}
.meta{color:var(--muted);font-size:12px}
.meta .done{color:var(--ok)}
.ex{margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.practice .ex{display:none}
.tags{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:0 10px}
.tags span{cursor:pointer}
.tags span:hover{color:var(--fg);text-decoration:underline}
.empty{padding:30px 12px;color:var(--muted)}
.detail{max-width:860px;padding:12px 16px 60px}
.detail .nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.detail h1{font-size:19px;margin:0 0 4px;line-height:1.4}
.detail .tags{margin:4px 0 14px}
.tip{background:var(--tip);border-left:3px solid var(--tipline);padding:8px 12px;margin:0 0 14px}
.tip p{margin:0}
.reveal{margin:6px 0 16px;width:100%;padding:18px;border-style:dashed;color:var(--muted)}
.body{font-size:13.5px}
.body p{margin:0 0 12px}
.body h3{font-size:14px;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:3px}
.body ul,.body ol{padding-left:22px;margin:0 0 12px}
.body li{margin:2px 0}
.body code{background:var(--code);padding:0 4px}
.body pre{background:var(--code);border:1px solid var(--line);padding:10px 12px;overflow-x:auto;position:relative;font-size:12.5px;line-height:1.5}
.body pre code{background:none;padding:0}
.body pre button{position:absolute;top:6px;right:6px;font-size:11px;background:var(--bg)}
.body table{border-collapse:collapse;margin:0 0 14px;width:100%;font-size:12.5px}
.body th,.body td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.body th{background:var(--bg2)}
.body blockquote{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.body em{color:var(--muted)}
mark.fill{background:var(--hl);color:var(--hlfg);padding:0 2px}
.body input[type=checkbox]{margin-right:6px}
.foot-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px;padding-top:12px;border-top:1px solid var(--line)}
footer{display:flex;justify-content:space-between;padding:5px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
.kbd{color:var(--muted)}
@media (max-width:760px){
  #menu{display:inline-block}
  aside{position:fixed;top:43px;bottom:28px;left:0;z-index:5;display:none;box-shadow:2px 0 8px rgba(0,0,0,.15)}
  aside.open{display:block}
  header{flex-wrap:wrap;gap:8px}
  .search{order:5;flex:1 1 100%;max-width:none}
  aside{top:84px}
  .logo .full{display:none}
  footer span:last-child{display:none}
}
</style>
</head>
<body>
<header>
  <button id="menu" title="Menu">[=]</button>
  <div class="logo" id="home">[ interview<span class="full">.kb</span> ]</div>
  <label class="search"><span>/</span><input id="q" placeholder="search..." autocomplete="off"></label>
  <div class="hdr-right">
    <button id="practice" title="Ẩn câu trả lời để tự luyện">[luyện<span class="lbl"> tập</span>]</button>
    <button id="dark">[dark]</button>
  </div>
</header>
<main>
  <aside id="side"></aside>
  <section id="content"></section>
</main>

<script id="data" type="application/json">{"cats": [["guide", "Hướng dẫn"], ["company", "Công ty"], ["hr", "HR & giới thiệu"], ["java", "Java & JVM"], ["spring", "Spring & Database"], ["arch", "Microservices & System Design"], ["devops", "CI/CD & Cloud"], ["coding", "Coding, DSA & SQL"], ["behavioral", "Behavioral & AI"]], "articles": [{"id": "plan", "title": "Kế hoạch ôn 2 tuần", "cat": "guide", "section": "", "kind": "guide", "tags": ["huong-dan", "ke-hoach"], "body": "Kế hoạch 14 ngày, khoảng 3–4 giờ mỗi ngày, dùng chung cho mọi vị trí Senior Backend. Trước mỗi cuộc phỏng vấn cụ thể, mở trang của công ty đó trong mục Công ty để dồn thời gian vào vòng nặng nhất.\n\n### Tuần 1: Phủ kín kiến thức nền\n\n| Ngày | Chủ đề | Đầu ra |\n|---|---|---|\n| 1 | Java core: collections (HashMap internals, ConcurrentHashMap), equals/hashCode, immutability, generics | 30 câu trả lời miệng, mỗi câu dưới 60 giây |\n| 2 | JVM và concurrency: memory model, GC (G1, ZGC), ClassLoader, ExecutorService, CompletableFuture, virtual threads, locks | Giải thích được 1 memory leak và 1 deadlock bạn từng gặp |\n| 3 | Java 8–21: Stream API, Optional, records, sealed classes, pattern matching | 10 bài stream code tay không IDE |\n| 4 | Spring: IoC/DI, bean lifecycle, AOP proxy, `@Transactional`, auto-configuration, Security filter chain | Vẽ được luồng một request qua Spring Boot |\n| 5 | Database: index, EXPLAIN, isolation levels, locking, JPA/Hibernate (N+1, lazy/eager, cache) | 10 câu SQL trung bình (JOIN, window function, GROUP BY/HAVING) |\n| 6 | Microservices và messaging: saga, outbox, idempotency, circuit breaker, Kafka | 1 trang ghi chú trade-off cho từng pattern |\n| 7 | Mock lần 1: 90 phút hỏi nhanh bằng tiếng Anh, có ghi âm | Danh sách lỗ hổng để vá ở tuần 2 |\n\nSong song mỗi ngày: 2 bài coding (xem tag `#dsa` và `#coding`), nói to độ phức tạp Big-O. Nếu đang nhắm Grab hoặc Axon, tăng lên 3–4 bài mức medium mỗi ngày.\n\n### Tuần 2: Nâng tầm senior và luyện thể hiện\n\n| Ngày | Chủ đề | Đầu ra |\n|---|---|---|\n| 8 | System design 1: khung trả lời, caching, load balancing, CDN ở mức khái niệm | URL shortener và rate limiter, 35 phút mỗi bài |\n| 9 | System design 2: hệ thống Opswat làm case, cộng một bài quy mô lớn (ride matching hoặc ví điện tử) | Sơ đồ kiến trúc và 5 quyết định thiết kế bảo vệ được |\n| 10 | Cloud và DevOps: Docker, Kubernetes cơ bản, CI/CD, AWS cơ bản, observability | Mô tả pipeline từ commit đến production |\n| 11 | Design patterns, SOLID, testing (JUnit 5, Mockito, Testcontainers), REST API design | 1 bài refactor nhỏ, giải thích bằng tiếng Anh |\n| 12 | Behavioral: 8 câu chuyện STAR; AI-assisted development | Bản nháp 8 câu chuyện, mỗi câu 2 phút |\n| 13 | Mock lần 2 full theo đúng quy trình của công ty sắp phỏng vấn | Sửa 3 điểm yếu nhất |\n| 14 | Ôn nhẹ: self-introduction, lý do rời Opswat, câu hỏi ngược | Nghỉ sớm, không học mới |\n\n### Điểm cần ưu tiên theo hồ sơ của bạn\n\n- **Lỗ hổng CDN, cloud và CI/CD:** vòng senior hay hỏi, nên ngày 8 và 10 không được cắt; xem bài \"Vá điểm yếu CI/CD\".\n- **Go và Java:** công ty Java (EPAM, mgm) sẽ hỏi sâu Java gần đây bạn dùng thế nào; công ty dùng Go (Grab) sẽ quan tâm kinh nghiệm Go ở Opswat.\n- **Hai kiểu công ty:** công ty dịch vụ hỏi lý thuyết và kinh nghiệm làm với khách hàng; công ty product hỏi DSA và system design sâu hơn.", "excerpt": "Kế hoạch 14 ngày, khoảng 3–4 giờ mỗi ngày, dùng chung cho mọi vị trí Senior Backend. Trước mỗi cuộc phỏng vấn cụ thể, mở trang của công ty đó trong mục Công ty để dồn thời gian vào vòng nặng nhất. Song song mỗi ngày: 2 b", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cach-dung-tai-lieu", "title": "Cách dùng tài liệu", "cat": "guide", "section": "", "tags": ["huong-dan"], "body": "Kho kiến thức gom câu hỏi và câu trả lời mẫu cho phỏng vấn Senior Backend (Java/Go), dùng chung cho nhiều công ty: HR screening, technical (Java, Spring, database, microservices, system design, CI/CD, coding) và behavioral. Quy trình và trọng tâm riêng của từng công ty nằm ở mục Công ty. Câu hỏi và câu trả lời viết bằng tiếng Anh vì bạn sẽ phải nói bằng tiếng Anh; ghi chú viết bằng tiếng Việt.\n\n- **Trước mỗi cuộc phỏng vấn:** đọc trang của công ty đó để biết vòng nào nặng (coding, system design hay kiến thức Java) rồi ôn theo tag tương ứng.\n- **Chỗ trong ngoặc vuông `[...]`** là thông tin chỉ bạn biết (số liệu, tên công cụ, sự cố thật). Hãy điền bằng sự thật, đừng dùng nguyên câu mẫu.\n- **Cách luyện:** che câu trả lời, nói to trong 60–90 giây, ghi âm, rồi so lại. Câu mẫu là khung ý, không phải để học thuộc.\n- **Khi bị hỏi vặn:** nêu trade-off và ví dụ từ dự án thật (Opswat, DXC) thay vì lặp lại định nghĩa.", "kind": "guide", "excerpt": "Kho kiến thức gom câu hỏi và câu trả lời mẫu cho phỏng vấn Senior Backend (Java/Go), dùng chung cho nhiều công ty: HR screening, technical (Java, Spring, database, microservices, system design, CI/CD, coding) và behavior", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cicd-fix", "title": "Vá điểm yếu CI/CD trong 2–3 ngày", "cat": "guide", "section": "", "kind": "guide", "tags": ["huong-dan", "cicd", "ke-hoach"], "body": "CI/CD là điểm yếu dễ vá nhất: phỏng vấn senior developer chỉ hỏi ở mức \"hiểu và đã từng làm\". Cách nhanh nhất là tự dựng một pipeline thật, sau đó trả lời bằng kinh nghiệm thay vì lý thuyết.\n\n### Dựng một pipeline hoàn chỉnh (8–10 giờ)\n\n1. **CI cơ bản:** mỗi push/PR chạy build, unit test; fail thì chặn merge (branch protection).\n2. **Quality gate:** lint/static analysis (Checkstyle hoặc SonarCloud), coverage JaCoCo, dependency scan.\n3. **Đóng gói:** multi-stage Dockerfile, tag theo commit SHA, push lên GHCR.\n4. **CD:** deploy tự động lên `kind` local hoặc cloud free tier, manual approval trước production.\n5. **Vận hành:** health check sau deploy, rollback về image trước, secrets từ GitHub Secrets.\n\n### Khái niệm cần nói trôi chảy\n\n- CI, continuous delivery và continuous deployment khác nhau ở đâu.\n- Chiến lược deploy: rolling, blue-green, canary.\n- Branching: trunk-based so với GitFlow, feature flag.\n- Build once, promote cùng một image qua dev → staging → prod.\n- Database migration: Flyway/Liquibase, expand → migrate → contract.\n- Tối ưu pipeline: cache, chạy song song, test pyramid.\n- Zero-downtime: readiness/liveness probe, graceful shutdown.\n\n### Tận dụng kinh nghiệm sẵn có\n\nGhi lại pipeline ở Opswat và DXC: công cụ gì, các stage từ commit đến production, ai approve release, một lần pipeline hỏng và cách xử lý. Câu trả lời tốt nhất: \"ở công ty quy trình như thế này, và tôi đã tự dựng lại một pipeline tương tự để hiểu từng bước.\"", "excerpt": "CI/CD là điểm yếu dễ vá nhất: phỏng vấn senior developer chỉ hỏi ở mức \"hiểu và đã từng làm\". Cách nhanh nhất là tự dựng một pipeline thật, sau đó trả lời bằng kinh nghiệm thay vì lý thuyết. CI cơ bản: mỗi push/PR chạy b", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "cau-hoi-nen-hoi", "title": "Câu hỏi nên hỏi ngược interviewer", "cat": "guide", "section": "Câu hỏi nên hỏi", "kind": "guide", "body": "Luôn hỏi lại 2–3 câu ở cuối mỗi vòng; không hỏi gì bị xem là thiếu quan tâm.\n\n**Vòng HR**\n\n- \"What does the rest of the interview process look like, and what is the timeline?\"\n- \"Is this position for a specific project, or will I be assigned after joining?\"\n- \"What does the career path from Senior to Lead look like here?\"\n\n**Vòng technical**\n\n- \"What does the tech stack and architecture of the project look like?\"\n- \"How does the team handle code review, testing and releases? How often do you deploy?\"\n- \"What is the biggest technical challenge the team is facing now?\"\n\n**Vòng manager/client**\n\n- \"What would you expect me to achieve in the first three months?\"\n- \"How is the team structured, and how much overlap with the client's time zone is expected?\"\n- \"How do you measure success for this role?\"", "tags": ["huong-dan"], "excerpt": "Vòng HR \"What does the rest of the interview process look like, and what is the timeline?\" \"Is this position for a specific project, or will I be assigned after joining?\" \"What does the career path from Senior to Lead lo", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "checklist-truoc-ngay-phong-van", "title": "Checklist trước ngày phỏng vấn", "cat": "guide", "section": "Checklist trước ngày phỏng vấn", "kind": "guide", "body": "- [ ] Self-introduction 90 giây, đã ghi âm và nghe lại\n- [ ] Câu trả lời về lý do rời Opswat và khoảng trống từ tháng 8\n- [ ] Sơ đồ kiến trúc dự án Opswat và một dự án DXC, nói được trong 3 phút mỗi cái\n- [ ] 6–8 câu chuyện STAR đã điền đủ phần trong ngoặc vuông\n- [ ] Pipeline CI/CD tự dựng đã chạy được, repo sẵn sàng để chia sẻ\n- [ ] Mọi công nghệ ghi trong CV đều trả lời được câu \"bạn đã dùng nó như thế nào\"\n- [ ] Hai buổi mock bằng tiếng Anh đã xong, ba điểm yếu nhất đã vá\n- [ ] Mức lương kỳ vọng và ngày có thể bắt đầu\n- [ ] Kiểm tra camera, micro, mạng và IDE cho phần live coding", "tags": ["huong-dan"], "excerpt": "Self-introduction 90 giây, đã ghi âm và nghe lại Câu trả lời về lý do rời Opswat và khoảng trống từ tháng 8 Sơ đồ kiến trúc dự án Opswat và một dự án DXC, nói được trong 3 phút mỗi cái 6–8 câu chuyện STAR đã điền đủ phần", "catLabel": "Hướng dẫn", "tip": "", "num": null}, {"id": "co-epam", "title": "EPAM Systems", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "epam", "outsourcing"], "body": "Công ty dịch vụ phần mềm toàn cầu; vòng technical nặng lý thuyết Java hỏi nhanh, ít LeetCode.\n\n### Quy trình (theo báo cáo ứng viên)\n\n1. **HR screening ~25 phút:** câu hỏi HR, kiểm tra tiếng Anh ([Glassdoor](https://static.glassdoor.nl/Interview/EPAM-Systems-Senior-Software-Engineer-Interview-Questions-EI_IE15544.0,12_KO13,37_IP45.htm)).\n2. **Technical ~90 phút:** từ cơ bản đến nâng cao; senior bị hỏi thêm cloud, CI/CD và vận hành backend ([Glassdoor](https://static.glassdoor.nl/Interview/EPAM-Systems-Senior-Software-Engineer-Interview-Questions-EI_IE15544.0,12_KO13,37_IP45.htm)). Chủ đề hay gặp: Java cơ bản, Spring Boot, microservices, thường kèm một bài code ([Glassdoor](https://static.glassdoor.com.br/Interview/EPAM-Systems-Senior-Java-Developer-Interview-Questions-EI_IE15544.0,12_KO13,34_IP3.htm)).\n3. **Manager hoặc client interview:** kinh nghiệm bản thân và tình huống nơi làm việc ([Glassdoor, TP.HCM](https://www.glassdoor.com.br/Entrevista/EPAM-Systems-Entrevista-E15544-RVW81756317.htm)).\n\n### Trọng tâm\n\n- Trả lời ngắn và chính xác, chịu được câu hỏi vặn liên tục về Java, Spring, database.\n- Kafka được hỏi sâu: DLQ, message key ([Glassdoor](https://www.glassdoor.com/Interview/EPAM-Systems-Interview-E15544-RVW100340369.htm)).\n- Câu hỏi về công cụ AI, prompt và token ([Glassdoor](https://www.glassdoor.com.hk/Interview/EPAM-Systems-Interview-E15544-RVW85790472.htm)).\n- Kinh nghiệm outsourcing ở DXC là lợi thế; chuẩn bị chuyện làm việc với khách hàng nước ngoài.\n\n### Ưu tiên ôn\n\n- [HashMap internals](#java-core-1), [ConcurrentHashMap](#java-core-2), [JVM memory](#jvm-10), [GC](#jvm-11)\n- [@Transactional](#spring-3), [Propagation và isolation](#spring-4), [N+1](#jpa-16)\n- [Kafka message key](#kafka-11), [DLQ](#kafka-13), [Outbox](#microservices-4)\n- [CI/CD: pipeline dự án cũ](#cicd-2), [Rollout strategies](#cicd-5)\n- [Longest substring](#coding-1), [Group by range bằng stream](#coding-2)\n- [Làm việc với yêu cầu không rõ của khách hàng](#behavioral-4), [Dùng AI tools](#ai-tools-13)", "excerpt": "Công ty dịch vụ phần mềm toàn cầu; vòng technical nặng lý thuyết Java hỏi nhanh, ít LeetCode. HR screening ~25 phút: câu hỏi HR, kiểm tra tiếng Anh (Glassdoor). Technical ~90 phút: từ cơ bản đến nâng cao; senior bị hỏi t", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-mgm", "title": "mgm technology partners", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "mgm", "outsourcing"], "body": "Công ty phần mềm gốc Đức, có văn phòng TP.HCM và Đà Nẵng; tiếng Anh và live coding Java là hai cửa chính.\n\n### Quy trình (theo tin tuyển dụng và báo cáo ứng viên)\n\n1. **Vòng 1:** lọc CV và gọi phỏng vấn với HR ([TopDev](https://topdev.vn/amp/viec-lam/java-developer-mgm-technology-partners-vietnam-2032497)). Một ứng viên ở TP.HCM tháng 12/2025 mô tả: lọc CV, cuộc gọi kiểm tra tiếng Anh, rồi vòng technical 1 ([Glassdoor](https://www.glassdoor.ca/Interview/mgm-technology-partners-Interview-Questions-E1170616.htm)).\n2. **Vòng 2:** technical live coding bằng tiếng Anh ([TopDev](https://topdev.vn/amp/viec-lam/java-developer-mgm-technology-partners-vietnam-2032497)).\n3. **Có thể có:** bài test online trước phỏng vấn, khoảng 20 câu trắc nghiệm Java và SQL cộng một câu tự luận; báo cáo này từ văn phòng Porto nên ở Việt Nam có thể khác ([Glassdoor](https://fr.glassdoor.be/Entretien/mgm-technology-partners-Entretien-E1170616-RVW101345990.htm)).\n\n### Trọng tâm\n\n- Tin tuyển dụng yêu cầu giao tiếp tiếng Anh tốt cả nói và viết ([ITviec](https://itviec.com/viec-lam-it/java-developer-da-nang-hcmc-mgm-technology-partners-vietnam-0014)), nên vòng tiếng Anh là vòng loại thật sự.\n- Live coding Java: viết code sạch, có test, nói to khi làm.\n- Một số buổi phỏng vấn xoay quanh Linux, Docker và Kubernetes ([Glassdoor](https://www.glassdoor.ca/Interview/mgm-technology-partners-Interview-Questions-E1170616.htm)).\n- SQL và Java cơ bản cho phần trắc nghiệm.\n\n### Ưu tiên ôn\n\n- [Tell me about yourself](#hr-screening-1), [Làm việc với khách hàng quốc tế](#hr-screening-5)\n- [Stream API](#java-modern-7), [Equals/hashCode](#java-core-3), [Exceptions](#java-core-6)\n- Toàn bộ tag `#coding`, `#dsa` và `#sql`\n- [Dockerfile cho Java](#docker-k8s-12), [K8s objects](#docker-k8s-13), [Probes](#docker-k8s-14)\n- [Testing Spring Boot](#spring-10), [Design patterns và SOLID](#spring-9)", "excerpt": "Công ty phần mềm gốc Đức, có văn phòng TP.HCM và Đà Nẵng; tiếng Anh và live coding Java là hai cửa chính. Vòng 1: lọc CV và gọi phỏng vấn với HR (TopDev). Một ứng viên ở TP.HCM tháng 12/2025 mô tả: lọc CV, cuộc gọi kiểm ", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-grab", "title": "Grab", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "grab", "product"], "body": "Công ty product quy mô Đông Nam Á; vòng coding và system design khó hơn hẳn các công ty dịch vụ.\n\n### Quy trình (theo báo cáo ứng viên)\n\n1. **HR screening:** giới thiệu ngắn, có ứng viên ở TP.HCM mô tả chỉ khoảng 15 phút ([Taro](https://www.jointaro.com/interviews/companies/grab/work-experiences/software-engineer-ho-chi-minh-city-september-10-2019-4-fddfc697)).\n2. **Live coding:** ứng viên khuyên luyện LeetCode nhiều ([Taro](https://www.jointaro.com/interviews/companies/grab/work-experiences/software-engineer-ho-chi-minh-city-september-10-2019-4-fddfc697)); một ứng viên Senior ở TP.HCM gặp hai bài live coding trong một buổi ([Taro](https://www.jointaro.com/interviews/companies/grab/experiences/senior-software-engineer-ho-chi-minh-city-april-6-2024-no-offer-negative-418070e2/)).\n3. **System design:** ở mức senior xoay quanh bài toán quy mô lớn đặc thù khu vực như ghép chuyến, bản đồ, thanh toán ([techinterview.org](https://www.techinterview.org/companies/grab-interview-guide/?format=md)).\n4. **Hiring manager / behavioral:** khoảng 45 phút về leadership và teamwork ([hw.glich.co](https://hw.glich.co/resources/companies/grab/interview-process/g4-software-engineer)).\n\nToàn bộ quá trình thường mất 4–6 tuần ([techinterview.org](https://www.techinterview.org/companies/grab-interview-guide/)).\n\n### Trọng tâm\n\n- DSA mức easy–medium, làm nhanh và đúng: array, string, hash map, cây, đồ thị.\n- System design có số liệu: ước lượng QPS, lưu trữ, phân vùng dữ liệu, xử lý lỗi.\n- Một ứng viên backend từng bị hỏi Golang, system và database ([Taro](https://www.jointaro.com/interviews/companies/grab/experiences/backend-developer-vietnam-november-25-2018-no-offer-positive-bac77e7d/)); kinh nghiệm Go ở Opswat là điểm cộng, nên chuẩn bị nói về goroutine, channel, context.\n- Nhiều vị trí backend ở TP.HCM thuộc domain thanh toán ([Grab Careers](https://www.grab.careers/en/jobs/744000144226510/senior-software-engineer-backend/)), nên idempotency và tính nhất quán dữ liệu rất đáng ôn.\n\n### Ưu tiên ôn\n\n- Toàn bộ tag `#dsa` và `#coding`\n- [Design ride matching](#sd-ride-matching), [Design wallet/ledger](#sd-wallet), [Rate limiter](#system-design-18), [Scale database](#system-design-20)\n- [Idempotency](#microservices-5), [Saga](#microservices-3), [Outbox](#microservices-4), [Kafka delivery](#kafka-12)\n- [Production incident](#behavioral-2), [Bất đồng với đồng nghiệp](#behavioral-3), [Mentoring](#behavioral-7)", "excerpt": "Công ty product quy mô Đông Nam Á; vòng coding và system design khó hơn hẳn các công ty dịch vụ. HR screening: giới thiệu ngắn, có ứng viên ở TP.HCM mô tả chỉ khoảng 15 phút (Taro). Live coding: ứng viên khuyên luyện Lee", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "co-axon", "title": "Axon", "cat": "company", "section": "", "kind": "guide", "tags": ["cong-ty", "axon", "product"], "body": "Công ty product (body camera, phần mềm cho lực lượng an toàn công cộng) có văn phòng kỹ thuật ở TP.HCM; phỏng vấn nặng DSA và yêu cầu giải thích trade-off.\n\n*Lưu ý: trang này là Axon (Axon Enterprise). Nếu bạn nhắm Axon Active (công ty gia công gốc Thụy Sĩ), quy trình khác: ứng viên mô tả 2 vòng, vòng 1 với Technical Lead và Head of Department ([Glassdoor](https://www.glassdoor.co.in/Interview/AXON-ACTIVE-Java-Software-Developer-Interview-Questions-EI_IE1063309.0,11_KO12,35.htm)).*\n\n### Quy trình (theo báo cáo ứng viên)\n\n1. Một ứng viên ở TP.HCM mô tả 4 vòng trong 2 tuần: lọc CV, test online, nói chuyện với senior engineer, rồi onsite 4 giờ với 4 interviewer, vòng khó nhất ([Glassdoor](https://www.glassdoor.com.br/Entrevista/Axon-Entrevista-E1597674-RVW41496445.htm)).\n2. Câu hỏi được nhắc: sinh chuỗi theo bàn phím điện thoại, binary tree, hash table, thiết kế kiến trúc, dynamic programming ([Glassdoor](https://www.glassdoor.com.au/Interview/Axon-Interview-E1597674-RVW17537841.htm)); ứng viên khác gặp câu hỏi CS và system design ([Glassdoor](https://www.glassdoor.com.hk/Interview/Axon-Interview-E1597674-RVW90693581.htm)).\n3. Email trước buổi phỏng vấn có thể báo nội dung từ DSA, OOP đến API design ([Glassdoor](https://www.glassdoor.sg/Interview/Axon-Interview-E1597674-RVW95653280.htm)).\n\nVị trí ở TP.HCM làm hybrid, onsite từ thứ Ba đến thứ Sáu ([Axon Careers](https://job-boards.greenhouse.io/axon/jobs/7694598003)).\n\n### Trọng tâm\n\n- Làm đúng chưa đủ: một ứng viên TP.HCM tháng 9/2026 giải được bài nhưng bị loại vì không giải thích được trade-off và độ phức tạp ([Glassdoor](https://clear.glassdoor.nl/Interview/Axon-Interview-E1597674-RVW86305866.htm)). Luôn nói time/space complexity và phương án thay thế.\n- OOP và API design: thiết kế class, interface, REST endpoint sạch.\n- Domain bảo mật: kinh nghiệm cybersecurity ở Opswat liên quan trực tiếp.\n\n### Ưu tiên ôn\n\n- [Letter combinations (bàn phím điện thoại)](#dsa-phone-letters), [Cây nhị phân](#dsa-tree-level), [LRU cache](#dsa-lru), [Coin change (DP)](#dsa-coin-change)\n- Toàn bộ tag `#dsa` và `#coding`\n- [REST API design](#spring-8), [Design patterns và SOLID](#spring-9), [Spring Security và auth](#spring-7)\n- [Kiến trúc dự án gần nhất](#system-design-16), [Caching](#system-design-19)", "excerpt": "Công ty product (body camera, phần mềm cho lực lượng an toàn công cộng) có văn phòng kỹ thuật ở TP.HCM; phỏng vấn nặng DSA và yêu cầu giải thích trade-off. Lưu ý: trang này là Axon (Axon Enterprise). Nếu bạn nhắm Axon Ac", "catLabel": "Công ty", "tip": "", "num": null}, {"id": "hr-screening", "title": "Tổng quan: HR screening", "cat": "hr", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Vòng này kiểm tra tiếng Anh, độ khớp với vị trí và kỳ vọng lương; trả lời ngắn, rõ, không đi sâu kỹ thuật.", "kind": "guide", "excerpt": "Vòng này kiểm tra tiếng Anh, độ khớp với vị trí và kỳ vọng lương; trả lời ngắn, rõ, không đi sâu kỹ thuật.", "catLabel": "HR & giới thiệu", "tip": "", "num": null}, {"id": "hr-screening-1", "title": "Tell me about yourself.", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"I'm a backend engineer with about five years of experience, mainly in Java and Spring Boot, plus two years of Go. I spent three years at DXC Technology building life insurance platforms for clients such as Shinhan Life, MapLife and MetLife. Then I moved to Opswat, where I worked on an endpoint management platform in the cybersecurity domain. My strengths are API design, microservices and working directly with international stakeholders. I'm now looking for a senior role where I can own larger parts of a system and mentor others.\"\n\n*Ghi chú: giữ dưới 90 giây, kết thúc bằng lý do hợp với công ty đang phỏng vấn. Với công ty product (Grab, Axon) nhấn vào ownership và quy mô; với công ty dịch vụ (EPAM, mgm) nhấn vào kinh nghiệm làm với khách hàng nước ngoài.*", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"I'm a backend engineer with about five years of experience, mainly in Java and Spring Boot, plus two years of Go. I spent three years at DXC Technology building life insurance platforms for clients such as Shinhan Life,", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-2", "title": "Why did you leave your last company?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat"], "body": "\"I left Opswat in August 2026 because \\[lý do thật, nói trung tính: muốn phạm vi lớn hơn / thay đổi tổ chức / ...\\]. I used the time since then to \\[việc đã làm: ôn system design, luyện tiếng Anh, làm side project\\]. I'm now ready to commit to a long-term role.\"\n\n*Ghi chú: không chê công ty cũ. Chuẩn bị sẵn câu giải thích khoảng trống từ tháng 8 đến nay, vì gần như chắc chắn sẽ bị hỏi.*", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"I left Opswat in August 2026 because lý do thật, nói trung tính: muốn phạm vi lớn hơn / thay đổi tổ chức / .... I used the time since then to việc đã làm: ôn system design, luyện tiếng Anh, làm side project. I'm now rea", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-3", "title": "Why do you want to join our company?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"Three reasons. First, \\[điều cụ thể về sản phẩm hoặc khách hàng của công ty\\], which matches what I want to work on. Second, my background fits: \\[kinh nghiệm liên quan nhất\\]. Third, \\[văn hóa kỹ thuật / lộ trình phát triển / quy mô hệ thống\\], which matters to me at the senior level.\"\n\n*Ghi chú theo công ty:*\n\n- *EPAM, mgm: dự án cho khách hàng toàn cầu, đa domain; bạn có 3 năm làm outsourcing cho khách hàng nước ngoài ở DXC.*\n- *Grab: hệ thống quy mô Đông Nam Á, ownership end-to-end; bạn đã dùng Go và Java ở môi trường production.*\n- *Axon: sản phẩm có sứ mệnh rõ (an toàn công cộng), domain bảo mật; bạn có kinh nghiệm nền tảng cybersecurity ở Opswat.*", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Three reasons. First, điều cụ thể về sản phẩm hoặc khách hàng của công ty, which matches what I want to work on. Second, my background fits: kinh nghiệm liên quan nhất. Third, văn hóa kỹ thuật / lộ trình phát triển / qu", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-4", "title": "What are you looking for in your next role?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"A senior backend role where I own features end to end, take part in design decisions, and help less experienced engineers. I'd like to stay hands-on with Java and cloud-native systems.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"A senior backend role where I own features end to end, take part in design decisions, and help less experienced engineers. I'd like to stay hands-on with Java and cloud-native systems.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-5", "title": "What is your experience working with international clients or teams?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "opswat", "dxc"], "body": "\"At DXC I worked on projects for Korean and international insurers. I joined requirement clarification calls, wrote technical documentation in English and handled production support with client teams. At Opswat the engineering organization was international, so English was the working language for \\[design reviews / tickets / stand-ups\\].\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"At DXC I worked on projects for Korean and international insurers. I joined requirement clarification calls, wrote technical documentation in English and handled production support with client teams. At Opswat the engin", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-6", "title": "What is your salary expectation?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"Based on my experience and the senior level of this role, I'm expecting around \\[con số hoặc khoảng của bạn\\] gross per month. I'm open to discussing the whole package.\"\n\n*Ghi chú: tra mức lương thị trường trước và nêu một khoảng, cận dưới là mức bạn chấp nhận được.*", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Based on my experience and the senior level of this role, I'm expecting around con số hoặc khoảng của bạn gross per month. I'm open to discussing the whole package.\" Ghi chú: tra mức lương thị trường trước và nêu một kh", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-7", "title": "When can you start? Are you interviewing elsewhere?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"I can start \\[ngay / trong vòng X tuần\\]. I'm in discussions with a few other companies, but this role is one of my top choices because of \\[lý do cụ thể\\].\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"I can start ngay / trong vòng X tuần. I'm in discussions with a few other companies, but this role is one of my top choices because of lý do cụ thể.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-8", "title": "Are you open to working on a project chosen after you join, or in a different time zone?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening"], "body": "\"Yes. I'm flexible about the domain. For time zones, I can overlap with \\[EU/US\\] hours for meetings as long as it's planned. I'd like to know the expected overlap for the project.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Yes. I'm flexible about the domain. For time zones, I can overlap with EU/US hours for meetings as long as it's planned. I'd like to know the expected overlap for the project.\"", "catLabel": "HR & giới thiệu"}, {"id": "hr-screening-9", "title": "What is your strongest technology, and your weakest?", "cat": "hr", "section": "HR screening", "tags": ["hr-screening", "kubernetes", "docker"], "body": "\"My strongest area is Java with Spring Boot and relational databases. An area I'm actively improving is CI/CD: I've used pipelines daily, and recently I built a full pipeline myself with GitHub Actions, Docker and Kubernetes to understand each stage.\"\n\n*Ghi chú: chỉ nói câu cuối sau khi bạn đã thực sự dựng pipeline đó.*", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"My strongest area is Java with Spring Boot and relational databases. An area I'm actively improving is CI/CD: I've used pipelines daily, and recently I built a full pipeline myself with GitHub Actions, Docker and Kubern", "catLabel": "HR & giới thiệu"}, {"id": "technical-java-core-jvm-concurrency", "title": "Tổng quan: Technical: Java core, JVM, concurrency", "cat": "java", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Đây là nhóm câu hỏi xuất hiện nhiều nhất; người hỏi thường đi từ định nghĩa sang \"bên trong hoạt động thế nào\" và \"bạn đã gặp ở đâu\".", "kind": "guide", "excerpt": "Đây là nhóm câu hỏi xuất hiện nhiều nhất; người hỏi thường đi từ định nghĩa sang \"bên trong hoạt động thế nào\" và \"bạn đã gặp ở đâu\".", "catLabel": "Java & JVM", "tip": "", "num": null}, {"id": "java-core-1", "title": "How does HashMap work internally?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"It's an array of buckets. The key's `hashCode()` is spread by XOR-ing the high 16 bits into the low ones, and the index is `(n - 1) & hash`. Collisions are stored as a linked list, which turns into a red-black tree when a bucket reaches 8 entries and the table has at least 64 buckets, so worst-case lookup is O(log n). The default load factor is 0.75; when exceeded, the table doubles and entries are redistributed. It allows one null key and is not thread-safe.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"It's an array of buckets. The key's hashCode() is spread by XOR-ing the high 16 bits into the low ones, and the index is (n - 1) & hash. Collisions are stored as a linked list, which turns into a red-black tree when a b", "catLabel": "Java & JVM"}, {"id": "java-core-2", "title": "HashMap vs ConcurrentHashMap vs Collections.synchronizedMap?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"`synchronizedMap` locks the whole map for every operation. `ConcurrentHashMap` since Java 8 uses CAS to insert into an empty bucket and `synchronized` on the bucket's first node otherwise, so writers on different buckets don't block each other and reads are lock-free. It doesn't allow null keys or values. Its iterators are weakly consistent, and compound actions should use `compute`, `merge` or `putIfAbsent` to stay atomic.\"", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"synchronizedMap locks the whole map for every operation. ConcurrentHashMap since Java 8 uses CAS to insert into an empty bucket and synchronized on the bucket's first node otherwise, so writers on different buckets don'", "catLabel": "Java & JVM"}, {"id": "java-core-3", "title": "What is the contract between equals() and hashCode()?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"Equal objects must have equal hash codes; the reverse isn't required. If I override `equals` without `hashCode`, two equal keys can land in different buckets, so a `HashMap` lookup or `HashSet` de-duplication fails. Keys should also be immutable, because changing a field used in the hash after insertion makes the entry unreachable.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Equal objects must have equal hash codes; the reverse isn't required. If I override equals without hashCode, two equal keys can land in different buckets, so a HashMap lookup or HashSet de-duplication fails. Keys should", "catLabel": "Java & JVM"}, {"id": "java-core-4", "title": "Why is String immutable?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"Four reasons: the string pool can share instances safely, strings are thread-safe without locking, the hash code can be cached which makes them good map keys, and security, since class names, file paths and connection strings can't be changed after validation.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"Four reasons: the string pool can share instances safely, strings are thread-safe without locking, the hash code can be cached which makes them good map keys, and security, since class names, file paths and connection s", "catLabel": "Java & JVM"}, {"id": "java-core-5", "title": "ArrayList vs LinkedList? StringBuilder vs StringBuffer?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"`ArrayList` is backed by an array: O(1) random access, amortized O(1) append, O(n) insert in the middle. `LinkedList` has O(1) insert at a known node but O(n) access and poor cache locality, so in practice `ArrayList` or `ArrayDeque` is almost always faster. `StringBuffer` is synchronized; `StringBuilder` is not and is the default choice.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"ArrayList is backed by an array: O(1) random access, amortized O(1) append, O(n) insert in the middle. LinkedList has O(1) insert at a known node but O(n) access and poor cache locality, so in practice ArrayList or Arra", "catLabel": "Java & JVM"}, {"id": "java-core-6", "title": "Checked vs unchecked exceptions, and how do you design error handling in a service?", "cat": "java", "section": "Collections và ngôn ngữ", "tags": ["java-core"], "body": "\"Checked exceptions must be declared or handled; unchecked ones extend `RuntimeException`. In services I use unchecked domain exceptions, translate them in one place with `@RestControllerAdvice` into a consistent error body with an error code, log once at the boundary, and never swallow exceptions or use them for normal control flow.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Checked exceptions must be declared or handled; unchecked ones extend RuntimeException. In services I use unchecked domain exceptions, translate them in one place with @RestControllerAdvice into a consistent error body ", "catLabel": "Java & JVM"}, {"id": "java-modern-7", "title": "Explain the Stream API. What is the difference between map and flatMap?", "cat": "java", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"A stream is a lazy pipeline: intermediate operations such as `filter` and `map` only run when a terminal operation such as `collect` is called. `map` transforms each element one to one; `flatMap` maps each element to a stream and flattens the results. I avoid parallel streams for I/O or small collections, because they share the common ForkJoinPool and the overhead often outweighs the gain.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"A stream is a lazy pipeline: intermediate operations such as filter and map only run when a terminal operation such as collect is called. map transforms each element one to one; flatMap maps each element to a stream and", "catLabel": "Java & JVM"}, {"id": "java-modern-8", "title": "What newer Java features have you used?", "cat": "java", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"Records for immutable DTOs, sealed interfaces to model a closed set of types, pattern matching for `instanceof` and `switch`, text blocks, and `var` for local variables. In Java 21, virtual threads and sequenced collections. Records with sealed types and `switch` let the compiler check that every case is handled.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Records for immutable DTOs, sealed interfaces to model a closed set of types, pattern matching for instanceof and switch, text blocks, and var for local variables. In Java 21, virtual threads and sequenced collections. ", "catLabel": "Java & JVM"}, {"id": "java-modern-9", "title": "What is Optional for, and how is it misused?", "cat": "java", "section": "Java 8 đến 21", "tags": ["java-modern"], "body": "\"It's a return type that makes 'no result' explicit. Misuses are calling `get()` without checking, using it for fields or method parameters, and wrapping collections, where an empty collection is better. I prefer `map`, `orElseGet` and `orElseThrow`.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"It's a return type that makes 'no result' explicit. Misuses are calling get() without checking, using it for fields or method parameters, and wrapping collections, where an empty collection is better. I prefer map, orEl", "catLabel": "Java & JVM"}, {"id": "jvm-10", "title": "Describe the JVM memory areas.", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"The heap holds objects and is split into a young generation, with Eden and survivor spaces, and an old generation. Metaspace holds class metadata in native memory. Each thread has its own stack for frames and local variables. There is also the code cache for JIT-compiled code. `StackOverflowError` comes from deep recursion; `OutOfMemoryError` can come from heap, metaspace or direct memory.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"The heap holds objects and is split into a young generation, with Eden and survivor spaces, and an old generation. Metaspace holds class metadata in native memory. Each thread has its own stack for frames and local vari", "catLabel": "Java & JVM"}, {"id": "jvm-11", "title": "Which garbage collectors do you know, and how do you choose?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"G1 is the default: region-based, aims for a pause-time target, good for most services. ZGC does almost all work concurrently, with pauses typically under a millisecond even on large heaps, and has been generational since Java 21; I'd pick it for latency-sensitive services. Parallel GC maximizes throughput for batch jobs. I start with the default, set heap size, enable GC logs, and tune only after measuring.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"G1 is the default: region-based, aims for a pause-time target, good for most services. ZGC does almost all work concurrently, with pauses typically under a millisecond even on large heaps, and has been generational sinc", "catLabel": "Java & JVM"}, {"id": "jvm-12", "title": "How do you find a memory leak?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm", "opswat", "dxc"], "body": "\"I confirm it first: old generation usage keeps growing after full GCs. Then I take a heap dump, with `jcmd` or `-XX:+HeapDumpOnOutOfMemoryError`, and open it in Eclipse MAT to look at the dominator tree and the path to GC roots. Typical causes are static or unbounded caches, `ThreadLocal` values in pooled threads, listeners never removed, and unclosed resources. At \\[Opswat/DXC\\] I found \\[sự cố thật nếu có\\].\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"I confirm it first: old generation usage keeps growing after full GCs. Then I take a heap dump, with jcmd or -XX:+HeapDumpOnOutOfMemoryError, and open it in Eclipse MAT to look at the dominator tree and the path to GC r", "catLabel": "Java & JVM"}, {"id": "jvm-13", "title": "How do class loaders work?", "cat": "java", "section": "JVM và bộ nhớ", "tags": ["jvm"], "body": "\"There are three built-in loaders: bootstrap, platform and application. They follow parent delegation: a loader asks its parent first and loads the class itself only if the parent can't, which prevents core classes from being replaced. A class is identified by its name plus its loader, which is why the same class loaded twice causes `ClassCastException` in app servers.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"There are three built-in loaders: bootstrap, platform and application. They follow parent delegation: a loader asks its parent first and loads the class itself only if the parent can't, which prevents core classes from ", "catLabel": "Java & JVM"}, {"id": "concurrency-14", "title": "volatile vs synchronized vs Atomic classes?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"`volatile` guarantees visibility and ordering for a single variable but not atomicity of compound actions such as `count++`. `synchronized` gives mutual exclusion and visibility. Atomic classes use CAS for lock-free atomic updates of one variable; `LongAdder` is better under high contention. For anything involving several variables I use a lock or an immutable snapshot.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"volatile guarantees visibility and ordering for a single variable but not atomicity of compound actions such as count++. synchronized gives mutual exclusion and visibility. Atomic classes use CAS for lock-free atomic up", "catLabel": "Java & JVM"}, {"id": "concurrency-15", "title": "How does ThreadPoolExecutor decide when to create threads?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"It creates threads up to the core size, then puts tasks in the queue, and only when the queue is full creates threads up to the maximum. After that the rejection policy applies. So with an unbounded queue the maximum size is never used and memory can grow without limit. I size bounded queues deliberately, use `CallerRunsPolicy` for back-pressure, and keep separate pools for CPU-bound and blocking work.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"It creates threads up to the core size, then puts tasks in the queue, and only when the queue is full creates threads up to the maximum. After that the rejection policy applies. So with an unbounded queue the maximum si", "catLabel": "Java & JVM"}, {"id": "concurrency-16", "title": "What are virtual threads and when would you use them?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"They're lightweight threads scheduled by the JVM onto a small set of carrier threads. When a virtual thread blocks on I/O it unmounts, so the carrier is free. That makes thread-per-request code scale to many thousands of concurrent blocking calls. They don't help CPU-bound work, they shouldn't be pooled, and concurrency to a limited resource should be capped with a semaphore. Before JDK 24, blocking inside `synchronized` pinned the carrier thread.\"", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"They're lightweight threads scheduled by the JVM onto a small set of carrier threads. When a virtual thread blocks on I/O it unmounts, so the carrier is free. That makes thread-per-request code scale to many thousands o", "catLabel": "Java & JVM"}, {"id": "concurrency-17", "title": "What is a deadlock and how do you prevent and diagnose it?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"Two or more threads each hold a lock the other needs. I prevent it by acquiring locks in a fixed global order, keeping critical sections small, using `tryLock` with a timeout, and preferring concurrent collections or message passing. To diagnose I take a thread dump with `jstack` or `jcmd Thread.print`, which reports the deadlock cycle.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Two or more threads each hold a lock the other needs. I prevent it by acquiring locks in a fixed global order, keeping critical sections small, using tryLock with a timeout, and preferring concurrent collections or mess", "catLabel": "Java & JVM"}, {"id": "concurrency-18", "title": "How do you run several remote calls in parallel and combine the results?", "cat": "java", "section": "Concurrency", "tags": ["concurrency"], "body": "\"With `CompletableFuture.supplyAsync` on a dedicated executor, then `thenCombine` or `allOf`, with `orTimeout` and `exceptionally` for failures. I never use the common pool for blocking calls. On Java 21, starting one virtual thread per call is simpler and reads like sequential code.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"With CompletableFuture.supplyAsync on a dedicated executor, then thenCombine or allOf, with orTimeout and exceptionally for failures. I never use the common pool for blocking calls. On Java 21, starting one virtual thre", "catLabel": "Java & JVM"}, {"id": "technical-spring-database-jpa", "title": "Tổng quan: Technical: Spring, database, JPA", "cat": "spring", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Người hỏi muốn thấy bạn hiểu Spring hoạt động bên trong, không chỉ dùng annotation; phần database xoay quanh index, transaction và các bẫy của Hibernate.", "kind": "guide", "excerpt": "Người hỏi muốn thấy bạn hiểu Spring hoạt động bên trong, không chỉ dùng annotation; phần database xoay quanh index, transaction và các bẫy của Hibernate.", "catLabel": "Spring & Database", "tip": "", "num": null}, {"id": "spring-1", "title": "What are IoC and dependency injection? Which injection type do you prefer?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Inversion of control means the container creates objects and wires their dependencies instead of the objects doing it themselves. I prefer constructor injection: dependencies are explicit and can be `final`, the object is never half-initialized, circular dependencies fail at startup, and unit tests need no Spring context.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Inversion of control means the container creates objects and wires their dependencies instead of the objects doing it themselves. I prefer constructor injection: dependencies are explicit and can be final, the object is", "catLabel": "Spring & Database"}, {"id": "spring-2", "title": "Describe the bean lifecycle and scopes.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Spring reads bean definitions, instantiates the bean, injects dependencies, calls aware callbacks, runs `BeanPostProcessor`s before initialization, then `@PostConstruct` or `afterPropertiesSet`, then post-processors after initialization, which is where AOP proxies are created. On shutdown it calls `@PreDestroy`. Scopes are singleton by default, prototype, and the web scopes request and session. Injecting a prototype into a singleton gives one instance unless I use `ObjectProvider` or a scoped proxy.\"", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"Spring reads bean definitions, instantiates the bean, injects dependencies, calls aware callbacks, runs BeanPostProcessors before initialization, then @PostConstruct or afterPropertiesSet, then post-processors after ini", "catLabel": "Spring & Database"}, {"id": "spring-3", "title": "How does @Transactional work, and when does it silently not work?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "transaction"], "body": "\"Spring wraps the bean in a proxy that opens a transaction before the method and commits or rolls back after it. It fails in three common cases: self-invocation, because a call from another method of the same class bypasses the proxy; non-public methods with the default proxy mode; and checked exceptions, which don't trigger rollback unless I set `rollbackFor`. Catching the exception inside the method also prevents rollback.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Spring wraps the bean in a proxy that opens a transaction before the method and commits or rolls back after it. It fails in three common cases: self-invocation, because a call from another method of the same class bypas", "catLabel": "Spring & Database"}, {"id": "spring-4", "title": "Explain propagation and isolation.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "transaction"], "body": "\"Propagation defines how a method joins transactions: `REQUIRED` joins or creates one, `REQUIRES_NEW` suspends the current one and starts an independent one, for example for audit logs, and `NESTED` uses a savepoint. Isolation controls what concurrent transactions see: read committed prevents dirty reads, repeatable read also prevents non-repeatable reads, serializable prevents phantoms. MySQL InnoDB defaults to repeatable read; PostgreSQL defaults to read committed.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"Propagation defines how a method joins transactions: REQUIRED joins or creates one, REQUIRESNEW suspends the current one and starts an independent one, for example for audit logs, and NESTED uses a savepoint. Isolation ", "catLabel": "Spring & Database"}, {"id": "spring-5", "title": "How does Spring Boot auto-configuration work?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"`@SpringBootApplication` enables auto-configuration. Boot loads the configuration classes listed in `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports` and applies each only if its conditions match, such as `@ConditionalOnClass`, `@ConditionalOnMissingBean` and `@ConditionalOnProperty`. So if I define my own `DataSource` bean, the default one backs off. I use the `--debug` conditions report to see why something was or wasn't configured.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"@SpringBootApplication enables auto-configuration. Boot loads the configuration classes listed in META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports and applies each only if its conditions ", "catLabel": "Spring & Database"}, {"id": "spring-6", "title": "How does Spring AOP work, and what are its limits?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"It's proxy-based: a JDK dynamic proxy for interfaces, or a CGLIB subclass otherwise. Advice runs around calls that go through the proxy. So it only intercepts external calls to public methods of Spring beans, not internal calls, private methods or final classes.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"It's proxy-based: a JDK dynamic proxy for interfaces, or a CGLIB subclass otherwise. Advice runs around calls that go through the proxy. So it only intercepts external calls to public methods of Spring beans, not intern", "catLabel": "Spring & Database"}, {"id": "spring-7", "title": "How does Spring Security process a request? How did authentication work in your last system?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "opswat"], "body": "\"A request passes through a filter chain. An authentication filter extracts credentials, such as a JWT from the `Authorization` header, validates them and stores an `Authentication` in the `SecurityContext`. Authorization is then checked by URL rules or method security such as `@PreAuthorize`. At Opswat we used forward auth: the gateway called an auth service that validated the token and added identity headers, so downstream services trusted those headers and didn't re-authenticate. The trade-off is that services must only be reachable through the gateway.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"A request passes through a filter chain. An authentication filter extracts credentials, such as a JWT from the Authorization header, validates them and stores an Authentication in the SecurityContext. Authorization is t", "catLabel": "Spring & Database"}, {"id": "spring-8", "title": "How do you design and version a REST API?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Resource-oriented URLs with plural nouns, correct HTTP methods and status codes, pagination and filtering on collections, a consistent error format, and idempotency: `PUT` and `DELETE` are idempotent by definition, and for `POST` I accept an idempotency key. I version in the path, such as `/v1`, make only backward-compatible changes within a version, and document with OpenAPI.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Resource-oriented URLs with plural nouns, correct HTTP methods and status codes, pagination and filtering on collections, a consistent error format, and idempotency: PUT and DELETE are idempotent by definition, and for ", "catLabel": "Spring & Database"}, {"id": "spring-9", "title": "Which design patterns have you actually used? Explain SOLID briefly.", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring", "dxc"], "body": "\"Strategy for interchangeable business rules, for example \\[tính phí bảo hiểm theo sản phẩm ở DXC\\]; Factory to choose an implementation; Builder for complex objects; Template Method and Proxy inside Spring itself; Observer through application events. SOLID: single responsibility, open for extension but closed for modification, subtypes must be substitutable, small specific interfaces, and depend on abstractions rather than concrete classes.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"Strategy for interchangeable business rules, for example tính phí bảo hiểm theo sản phẩm ở DXC; Factory to choose an implementation; Builder for complex objects; Template Method and Proxy inside Spring itself; Observer ", "catLabel": "Spring & Database"}, {"id": "spring-10", "title": "How do you test a Spring Boot service?", "cat": "spring", "section": "Spring và Spring Boot", "tags": ["spring"], "body": "\"Mostly unit tests with JUnit 5 and Mockito, without a Spring context. Slice tests such as `@WebMvcTest` and `@DataJpaTest` for the web and persistence layers. A smaller number of integration tests with `@SpringBootTest` and Testcontainers, so they run against a real database and broker. I test behaviour, not implementation, and I don't chase a coverage number.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"Mostly unit tests with JUnit 5 and Mockito, without a Spring context. Slice tests such as @WebMvcTest and @DataJpaTest for the web and persistence layers. A smaller number of integration tests with @SpringBootTest and T", "catLabel": "Spring & Database"}, {"id": "database-11", "title": "How do indexes work, and when does an index not get used?", "cat": "spring", "section": "Database", "tags": ["database"], "body": "\"Most are B+ trees, which keep keys sorted, so they serve equality, range and prefix lookups in O(log n). A composite index follows the leftmost-prefix rule. An index is skipped when I apply a function or implicit type conversion to the column, use a leading wildcard in `LIKE`, when selectivity is low, or when the leading column isn't in the predicate. Indexes cost write time and storage, so I add them based on real queries.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"Most are B+ trees, which keep keys sorted, so they serve equality, range and prefix lookups in O(log n). A composite index follows the leftmost-prefix rule. An index is skipped when I apply a function or implicit type c", "catLabel": "Spring & Database"}, {"id": "database-12", "title": "What is a covering index? Clustered vs non-clustered?", "cat": "spring", "section": "Database", "tags": ["database"], "body": "\"A covering index contains every column the query needs, so the engine doesn't read the table row. In InnoDB the primary key is the clustered index and the rows live in it; secondary indexes store the primary key and need a second lookup unless they cover the query.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"A covering index contains every column the query needs, so the engine doesn't read the table row. In InnoDB the primary key is the clustered index and the rows live in it; secondary indexes store the primary key and nee", "catLabel": "Spring & Database"}, {"id": "database-13", "title": "A query is slow in production. What do you do?", "cat": "spring", "section": "Database", "tags": ["database"], "body": "\"I find it in the slow query log or APM, run `EXPLAIN ANALYZE`, and look for full scans, wrong join order, filesort or temporary tables. Then I fix the cause: add or adjust an index, rewrite the query, fetch fewer columns, or paginate with keyset pagination instead of a large `OFFSET`. I verify with the plan and with production-like data volume. At \\[công ty\\] I reduced \\[query\\] from \\[X\\] to \\[Y\\].\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"I find it in the slow query log or APM, run EXPLAIN ANALYZE, and look for full scans, wrong join order, filesort or temporary tables. Then I fix the cause: add or adjust an index, rewrite the query, fetch fewer columns,", "catLabel": "Spring & Database"}, {"id": "database-14", "title": "Optimistic vs pessimistic locking?", "cat": "spring", "section": "Database", "tags": ["database", "transaction"], "body": "\"Optimistic locking uses a version column: the update succeeds only if the version is unchanged, otherwise I retry or report a conflict. It suits low contention. Pessimistic locking uses `SELECT ... FOR UPDATE` to block others; it suits high contention on the same rows, such as balance updates, but needs short transactions and consistent lock order to avoid deadlocks.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"Optimistic locking uses a version column: the update succeeds only if the version is unchanged, otherwise I retry or report a conflict. It suits low contention. Pessimistic locking uses SELECT ... FOR UPDATE to block ot", "catLabel": "Spring & Database"}, {"id": "database-15", "title": "What is ACID? When would you choose NoSQL?", "cat": "spring", "section": "Database", "tags": ["database", "transaction"], "body": "\"Atomicity, consistency, isolation, durability. I default to a relational database for transactional data with relationships. I'd choose a document or key-value store for flexible schemas, very high write volume or simple access by key, and Redis for caching, rate limiting and short-lived data.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"Atomicity, consistency, isolation, durability. I default to a relational database for transactional data with relationships. I'd choose a document or key-value store for flexible schemas, very high write volume or simpl", "catLabel": "Spring & Database"}, {"id": "jpa-16", "title": "What is the N+1 problem and how do you fix it?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Loading N parent entities and then touching a lazy association triggers one extra query per parent. I fix it with `JOIN FETCH` or an `@EntityGraph`, with batch fetching through `@BatchSize`, or with a DTO projection when I only need a few fields. I detect it by logging SQL or asserting query counts in tests.\"", "kind": "qa", "num": 16, "tip": "", "excerpt": "\"Loading N parent entities and then touching a lazy association triggers one extra query per parent. I fix it with JOIN FETCH or an @EntityGraph, with batch fetching through @BatchSize, or with a DTO projection when I on", "catLabel": "Spring & Database"}, {"id": "jpa-17", "title": "Lazy vs eager loading? What is LazyInitializationException?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa", "transaction"], "body": "\"Lazy loads the association on first access; eager loads it with the parent. I keep everything lazy and fetch explicitly per use case, because eager loading can't be turned off per query. The exception happens when a lazy association is accessed after the session is closed. The fix is to fetch what I need inside the transaction and return DTOs, not to enable open-session-in-view.\"", "kind": "qa", "num": 17, "tip": "", "excerpt": "\"Lazy loads the association on first access; eager loads it with the parent. I keep everything lazy and fetch explicitly per use case, because eager loading can't be turned off per query. The exception happens when a laz", "catLabel": "Spring & Database"}, {"id": "jpa-18", "title": "Explain entity states and the first- and second-level cache.", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Entities are transient, managed, detached or removed. Managed entities are tracked by the persistence context, which is the first-level cache: it's per session, guarantees one instance per row, and flushes changes automatically through dirty checking. The second-level cache is shared across sessions, optional, and useful for read-mostly reference data; it needs an invalidation strategy.\"", "kind": "qa", "num": 18, "tip": "", "excerpt": "\"Entities are transient, managed, detached or removed. Managed entities are tracked by the persistence context, which is the first-level cache: it's per session, guarantees one instance per row, and flushes changes autom", "catLabel": "Spring & Database"}, {"id": "jpa-19", "title": "How do you handle large batch inserts or updates with JPA?", "cat": "spring", "section": "JPA và Hibernate", "tags": ["jpa"], "body": "\"Enable JDBC batching with `hibernate.jdbc.batch_size`, order inserts and updates, flush and clear the persistence context every batch to keep memory flat, and avoid `IDENTITY` generation because it disables insert batching. For very large volumes I use plain JDBC or a bulk statement.\"", "kind": "qa", "num": 19, "tip": "", "excerpt": "\"Enable JDBC batching with hibernate.jdbc.batchsize, order inserts and updates, flush and clear the persistence context every batch to keep memory flat, and avoid IDENTITY generation because it disables insert batching. ", "catLabel": "Spring & Database"}, {"id": "technical-microservices-kafka-system-design", "title": "Tổng quan: Technical: microservices, Kafka, system design", "cat": "arch", "section": "Tổng quan", "tags": ["tong-quan"], "body": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "kind": "guide", "excerpt": "Ở mức senior, điểm được chấm là trade-off: mỗi câu trả lời nên có \"khi nào dùng, khi nào không, và cái giá phải trả\".", "catLabel": "Microservices & System Design", "tip": "", "num": null}, {"id": "microservices-1", "title": "Monolith vs microservices: when would you choose each?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, and split out services when there is a clear bounded context with different scaling or release needs. A distributed monolith, where services must be deployed together, is the worst of both.\"", "kind": "qa", "num": 1, "tip": "", "excerpt": "\"Microservices give independent deployment, scaling and team ownership, but add network failures, distributed data, and operational cost. I'd start with a well-modularized monolith for a small team or an unclear domain, ", "catLabel": "Microservices & System Design"}, {"id": "microservices-2", "title": "How do services communicate, and how do you choose sync vs async?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Synchronous REST or gRPC when the caller needs the answer now. Asynchronous messaging when the work can complete later, when I want to decouple availability, or when several consumers react to one event. Sync chains multiply latency and failure probability, so I keep them short and use events for everything else.\"", "kind": "qa", "num": 2, "tip": "", "excerpt": "\"Synchronous REST or gRPC when the caller needs the answer now. Asynchronous messaging when the work can complete later, when I want to decouple availability, or when several consumers react to one event. Sync chains mul", "catLabel": "Microservices & System Design"}, {"id": "microservices-3", "title": "How do you keep data consistent across services?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "transaction"], "body": "\"Each service owns its database, so I don't use distributed transactions. I use the saga pattern: a sequence of local transactions, each publishing an event, with compensating actions on failure. Choreography suits simple flows; an orchestrator suits long flows that need visibility. The result is eventual consistency, so the UI and APIs must tolerate intermediate states.\"", "kind": "qa", "num": 3, "tip": "", "excerpt": "\"Each service owns its database, so I don't use distributed transactions. I use the saga pattern: a sequence of local transactions, each publishing an event, with compensating actions on failure. Choreography suits simpl", "catLabel": "Microservices & System Design"}, {"id": "microservices-4", "title": "What is the outbox pattern?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "transaction"], "body": "\"It solves the dual-write problem: updating the database and publishing a message can't be atomic. I write the business change and an outbox row in the same local transaction; a relay, by polling or change data capture such as Debezium, publishes the row to the broker. Delivery is at least once, so consumers must be idempotent.\"", "kind": "qa", "num": 4, "tip": "", "excerpt": "\"It solves the dual-write problem: updating the database and publishing a message can't be atomic. I write the business change and an outbox row in the same local transaction; a relay, by polling or change data capture s", "catLabel": "Microservices & System Design"}, {"id": "microservices-5", "title": "How do you make an operation idempotent?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "transaction"], "body": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For updates I prefer absolute values or version checks over increments.\"", "kind": "qa", "num": 5, "tip": "", "excerpt": "\"The client sends an idempotency key, or I derive one from the message ID. I store processed keys with a unique constraint, in the same transaction as the business change, and return the stored result on a repeat. For up", "catLabel": "Microservices & System Design"}, {"id": "microservices-6", "title": "How do you make calls between services resilient?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one makes sense. In Java I use Resilience4j. Retries without timeouts or limits cause retry storms.\"", "kind": "qa", "num": 6, "tip": "", "excerpt": "\"Timeouts on every call, retries with exponential backoff and jitter only for idempotent operations, a circuit breaker to stop calling a failing dependency, bulkheads to isolate thread pools, and a fallback where one mak", "catLabel": "Microservices & System Design"}, {"id": "microservices-7", "title": "What does an API gateway do? How is authentication handled across services?", "cat": "arch", "section": "Microservices", "tags": ["microservices", "opswat"], "body": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as headers. The alternative is each service validating a JWT itself, which removes the trust assumption but duplicates logic. Between services I'd use mTLS or short-lived service tokens.\"", "kind": "qa", "num": 7, "tip": "", "excerpt": "\"It's the single entry point: routing, TLS termination, authentication, rate limiting and request logging. At Opswat the gateway used forward auth to an auth service, which validated the token and passed identity as head", "catLabel": "Microservices & System Design"}, {"id": "microservices-8", "title": "How do you observe and debug a distributed system?", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99 latency, and use traces to find which hop is slow.\"", "kind": "qa", "num": 8, "tip": "", "excerpt": "\"Three signals: structured logs with a correlation or trace ID, metrics such as rate, errors and latency percentiles, and distributed tracing with OpenTelemetry. I alert on symptoms users feel, such as error rate and p99", "catLabel": "Microservices & System Design"}, {"id": "microservices-9", "title": "Explain the CAP theorem in practical terms.", "cat": "arch", "section": "Microservices", "tags": ["microservices"], "body": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product catalogue chooses availability.\"", "kind": "qa", "num": 9, "tip": "", "excerpt": "\"During a network partition a system must choose between consistency and availability. So the real question per feature is: should it reject requests or serve possibly stale data? Payments choose consistency; a product c", "catLabel": "Microservices & System Design"}, {"id": "kafka-10", "title": "Explain topics, partitions, offsets and consumer groups.", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"A topic is split into partitions, each an ordered, append-only log. Each record has an offset. Within a consumer group each partition is read by exactly one consumer, so partitions are the unit of parallelism; adding consumers beyond the partition count gives no benefit. Different groups each receive all records.\"", "kind": "qa", "num": 10, "tip": "", "excerpt": "\"A topic is split into partitions, each an ordered, append-only log. Each record has an offset. Within a consumer group each partition is read by exactly one consumer, so partitions are the unit of parallelism; adding co", "catLabel": "Microservices & System Design"}, {"id": "kafka-11", "title": "What is a message key and why use it?", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"The key determines the partition, by hash. Records with the same key go to the same partition and keep their order. So I key by the entity ID, such as order ID, when order per entity matters. A poorly distributed key creates hot partitions.\"", "kind": "qa", "num": 11, "tip": "", "excerpt": "\"The key determines the partition, by hash. Records with the same key go to the same partition and keep their order. So I key by the entity ID, such as order ID, when order per entity matters. A poorly distributed key cr", "catLabel": "Microservices & System Design"}, {"id": "kafka-12", "title": "What delivery guarantees does Kafka offer?", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka", "transaction"], "body": "\"At most once if I commit offsets before processing; at least once if I commit after, which is the usual choice and requires idempotent consumers. Exactly once is available within Kafka through idempotent producers and transactions, but as soon as a database or external call is involved I still need idempotency on my side.\"", "kind": "qa", "num": 12, "tip": "", "excerpt": "\"At most once if I commit offsets before processing; at least once if I commit after, which is the usual choice and requires idempotent consumers. Exactly once is available within Kafka through idempotent producers and t", "catLabel": "Microservices & System Design"}, {"id": "kafka-13", "title": "What is a dead letter queue? What happens after a message lands there?", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"It's a separate topic for messages that fail after the configured retries, so one poison message doesn't block the partition. I include the error and original metadata in headers, alert on DLQ volume, and have a process: inspect, fix the cause, then replay to the main topic or discard. A DLQ nobody monitors is just data loss with extra steps.\"", "kind": "qa", "num": 13, "tip": "", "excerpt": "\"It's a separate topic for messages that fail after the configured retries, so one poison message doesn't block the partition. I include the error and original metadata in headers, alert on DLQ volume, and have a process", "catLabel": "Microservices & System Design"}, {"id": "kafka-14", "title": "What is a rebalance, and what is consumer lag?", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"A rebalance reassigns partitions when consumers join, leave or exceed `max.poll.interval.ms`. During it consumption pauses and uncommitted work can be reprocessed. Lag is the gap between the latest offset and the group's committed offset; growing lag means consumers are too slow, so I scale consumers up to the partition count or speed up processing.\"", "kind": "qa", "num": 14, "tip": "", "excerpt": "\"A rebalance reassigns partitions when consumers join, leave or exceed max.poll.interval.ms. During it consumption pauses and uncommitted work can be reprocessed. Lag is the gap between the latest offset and the group's ", "catLabel": "Microservices & System Design"}, {"id": "kafka-15", "title": "Kafka vs RabbitMQ?", "cat": "arch", "section": "Kafka và messaging", "tags": ["kafka"], "body": "\"Kafka is a durable distributed log: high throughput, replay, ordering per partition, many independent consumers. RabbitMQ is a broker with flexible routing, per-message acknowledgement and priorities, good for task queues. I pick Kafka for event streams and RabbitMQ for work distribution with complex routing.\"", "kind": "qa", "num": 15, "tip": "", "excerpt": "\"Kafka is a durable distributed log: high throughput, replay, ordering per partition, many independent consumers. RabbitMQ is a broker with flexible routing, per-message acknowledgement and priorities, good for task queu", "catLabel": "Microservices & System Design"}, {"id": "system-design-16", "title": "Describe the architecture of your last project.", "cat": "arch", "section": "System design", "tags": ["system-design"], "body": "\"It was an endpoint management platform. \\[Số lượng\\] services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported \\[dữ liệu gì\\] through \\[giao thức\\]; services communicated by \\[REST/gRPC/message broker\\]; data was stored in \\[database\\]. I owned \\[service/module\\]. The main challenges were \\[quy mô, độ trễ, multi-tenant...\\], which we handled by \\[giải pháp\\].\"\n\n*Ghi chú: câu này gần như chắc chắn được hỏi. Vẽ sẵn sơ đồ và tập nói trong 3 phút, kèm 2–3 quyết định thiết kế bạn bảo vệ được.*", "kind": "qa", "num": 16, "tip": "*Khung trả lời cho mọi bài: làm rõ yêu cầu chức năng và phi chức năng → ước lượng tải → API → data model → kiến trúc tổng thể → đi sâu điểm nghẽn → lỗi và vận hành. Luôn hỏi lại trước khi vẽ.*", "excerpt": "\"It was an endpoint management platform. Số lượng services in Go and Java behind an API gateway with forward auth. Agents on endpoints reported dữ liệu gì through giao thức; services communicated by RE
